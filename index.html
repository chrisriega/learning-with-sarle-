tivo. El género es el formato concreto que usamos socialmente: afiche, infografía, ensayo, noticia. Ejemplo: una infografía (género) suele ser expositiva (tipo)."},{"q":"¿Qué es la adecuación de un texto?","a":"Es que el texto encaje con su situación: propósito, lector y lugar de publicación. Un texto para el panel escolar debe ser breve, claro y fácil de leer de pie; no puede parecer una monografía."}],"duda":true},"2025-F1-34":{"n":34,"year":2025,"ctx":"2025-F1-c10","stem":"Un equipo de estudiantes ha escrito la primera versión de su ensayo con el cual busca explicar las acciones que las escuelas pueden poner en práctica para combatir los estereotipos. Los estudiantes le piden al docente que lea dicha versión para que les brinde comentarios de mejora. A continuación, se presenta una descripción de las anotaciones realizadas por el docente en su revisión:\n\nEl docente ha subrayado las siguientes oraciones: “Nuestros familiares y los miembros de la comunidad educativa pueden llegar a dar por sentado los estereotipos. Debido a la interacción que tenemos con estos en nuestra convivencia, debemos trabajar en que se den cuenta y puedan cambiar […] Los estereotipos hacen que una persona tenga prácticas discriminatorias con otro individuo. Por eso, es necesario que participe en charlas de concientización para que cambie su comportamiento”. Además, ha escrito las siguientes preguntas: “¿Interactuamos con los estereotipos en nuestra convivencia? ¿Quién debe participar en la charla de concientización? ¿Qué quieren comunicar con esas ideas?”.\n\nPor otro lado, el docente encerró en círculos los conectores empleados por los estudiantes y ha sugerido reemplazar el conector “es decir” por el conector “por ejemplo”, cuando propongan casos que ilustren sus ideas. A su vez, ha sugerido reemplazar el conector “asimismo” por “en resumen”, cuando añadan información específica sobre una idea central dentro de un párrafo.\n\nPor último, hacia el final del texto, ha dejado anotado el siguiente mensaje: “¡Muy buen trabajo! Han cumplido con explicar varias acciones para combatir los estereotipos. Ya pueden empezar a escribir la segunda versión”.\n\n¿Cuál de las anotaciones del docente es más adecuada para retroalimentar una primera versión del ensayo de los estudiantes? ¿Por qué?","options":{"A":"Las anotaciones descritas en el primer párrafo, porque buscan que los estudiantes identifiquen que la referencia de algunas oraciones dificulta saber de qué o quién se habla en su ensayo.","B":"Las anotaciones descritas en el segundo párrafo, porque propician que los estudiantes tengan claridad sobre los conectores que podrían utilizar para enlazar correctamente las ideas de su ensayo.","C":"Las anotaciones descritas en el tercer párrafo, porque priorizan mantener la motivación de los estudiantes resaltando aquellos aspectos logrados en la escritura de la primera versión de su ensayo."},"answer":"A","tema":"Evaluación y retroalimentación","explicacion":["Las anotaciones del primer párrafo son adecuadas porque, con preguntas como ‘¿Quién debe participar en la charla?’, llevan a notar que ‘estos’ o ‘participe’ no dejan claro de quién se habla. No corrigen por los estudiantes: los hacen reflexionar.","La B parece útil porque trata conectores, pero las sugerencias son erradas: ‘en resumen’ sirve para sintetizar, no para añadir información específica. Además, entrega la respuesta hecha en lugar de promover la reflexión.","En una primera versión, la buena retroalimentación apunta a problemas que afectan el sentido y hace pensar al estudiante. Desconfía del elogio general (C) y de las correcciones que reemplazan al estudiante."],"aprende_mas":[{"q":"¿Qué es la retroalimentación descriptiva o reflexiva?","a":"Es la que describe lo que el estudiante hizo y le plantea preguntas para que él mismo descubra cómo mejorar. No se queda en ‘bien’ o ‘mal’. Ejemplo: ‘Aquí dices ‘estos’: ¿te refieres a los estereotipos o a los familiares?’."},{"q":"¿Qué es la referencia en un texto?","a":"Es el mecanismo para retomar algo ya mencionado sin repetirlo: pronombres (él, estos), sinónimos o elipsis. Si el lector no sabe a qué se refiere ‘estos’, hay un problema de cohesión referencial y el mensaje se vuelve confuso."},{"q":"¿Por qué un elogio general no basta?","a":"Porque motiva, pero no dice qué mejorar ni cómo. Aquí, además, el docente da el texto por bueno cuando todavía tenía problemas. Un buen comentario combina lo logrado con una pista concreta de mejora."}],"duda":false},"2025-F1-35":{"n":35,"year":2025,"ctx":"2025-F1-c10","stem":"Los integrantes de un equipo han elaborado la primera versión de un afiche para argumentar en contra de la idea de que ser hombre o mujer determina ciertas actitudes o comportamientos. Ellos le entregan el afiche al docente para recibir su retroalimentación. A continuación, se presenta una descripción del texto de los estudiantes:\n\nEl afiche presenta imágenes de dos estudiantes que están mirándose entre sí con rostros de alegría. Alrededor de estas imágenes, se muestran recuadros con estos mensajes: “Mujer que va al volante son un peligro constante”, “El cabello largo lo usa solo las mujeres”, “Los hombres no saben limpiar”, “¿Quieres ser jugador de vóley? Son deportes para chicas”.\n\nLuego, en la parte baja del afiche, se presenta el siguiente mensaje final: “Reconozcamos el valor inherente de cada persona. Los estereotipos están arraigados. Lamentablemente, son imposibles de combatir”.\n\nEl docente termina de leer el afiche de los estudiantes y se da cuenta de que el texto tiene, entre otros problemas, oraciones con errores de concordancia. Considerando que es la primera versión del afiche, ¿es adecuado priorizar la retroalimentación de los errores de concordancia oracional? ¿Por qué?","options":{"A":"Sí es adecuado, porque las oraciones que presentan errores de concordancia entre sujeto y verbo se encuentran en casi todo el texto de los estudiantes.","B":"No es adecuado, porque la falta de concordancia, a diferencia de otros errores, no es lo que interfiere en la comprensión del mensaje del afiche de los estudiantes.","C":"Depende, porque, previamente, el docente debe asegurarse de que el concepto de concordancia oracional, que ofrece la gramática oficial, esté claro para los estudiantes."},"answer":"B","tema":"Evaluación y retroalimentación","explicacion":["La B es correcta: en una primera versión se prioriza lo que afecta el mensaje. El problema grave es que el afiche repite estereotipos sin cuestionarlos y cierra diciendo que son ‘imposibles de combatir’, lo que contradice su propósito.","La A parece lógica porque los errores de concordancia se repiten, pero la frecuencia no define la prioridad: manda cuánto afecta la comunicación. La concordancia se trabaja en versiones posteriores.","Regla: primeras versiones = propósito, ideas y coherencia; versión final = gramática, ortografía y formato. Si una opción prioriza lo formal en un borrador, desconfía."],"aprende_mas":[{"q":"¿Qué es la concordancia gramatical?","a":"Es que las palabras relacionadas coincidan en número y género. Ejemplo: ‘Mujer que va al volante son…’ debería decir ‘es’, porque el sujeto es singular. Es un error de forma: conviene corregirlo, pero casi siempre la idea se entiende."},{"q":"¿Qué se revisa en cada versión de un texto?","a":"- **Primera versión**: si cumple el propósito y si las ideas son coherentes y adecuadas al lector.\n- **Versiones intermedias**: organización, cohesión, conectores y referencias.\n- **Versión final**: ortografía, concordancia, puntuación, formato y fuentes."},{"q":"¿Qué es la coherencia de un texto?","a":"Es que todas las ideas apunten al mismo propósito sin contradecirse. Un afiche contra los estereotipos que termina diciendo que no se pueden combatir es incoherente: el lector se lleva el mensaje contrario."}],"duda":false},"2025-F1-36":{"n":36,"year":2025,"ctx":"2025-F1-c10","stem":"Un equipo de estudiantes ha elaborado una infografía en la que propone medidas que las familias pueden implementar para combatir los estereotipos. Durante el proceso de escritura de la infografía, el docente ha realizado varias revisiones al texto y, para la presentación de la versión final, ha planteado preguntas a los estudiantes del equipo. ¿Qué grupo de preguntas es adecuado para que ellos realicen una revisión final de la infografía?","options":{"A":"¿Por qué utilizan expresiones como “porque tú y yo somos iguales” o “súmate ya: luchemos todos contra los estereotipos”? ¿Por qué se dirigen a una segunda persona?","B":"¿En qué parte de su infografía pueden registrar las fuentes que han empleado? ¿Consideran que es necesario usar un formato específico para ese registro?","C":"¿Cuáles son las razones por las que decidieron elaborar una infografía? ¿Creen que las ideas que acompañan las imágenes son claras para los lectores?"},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["Las preguntas de la B son propias de una revisión final: verificar dónde y cómo registrar las fuentes consultadas (por ejemplo, con un formato como APA). Es un aspecto de presentación y de ética que se cierra antes de publicar.","La C parece buena porque pregunta por la claridad, pero ‘¿por qué decidieron elaborar una infografía?’ es una pregunta de planificación, ya resuelta a esas alturas. La A, sobre la segunda persona, revisa el registro, propio de etapas anteriores.","Ubica la etapa del proceso: si dice ‘revisión final’, busca preguntas sobre detalles de cierre (fuentes, formato, ortografía). Revisar propósito o género corresponde al inicio."],"aprende_mas":[{"q":"¿Cuáles son las etapas del proceso de escritura?","a":"- **Planificación**: decido propósito, lector, género e ideas.\n- **Textualización**: escribo el borrador.\n- **Revisión**: mejoro el texto en varias versiones, de lo general (ideas) a lo específico (forma).\n- **Publicación**: comparto la versión final con los lectores."},{"q":"¿Por qué es importante registrar las fuentes?","a":"Porque reconoce el trabajo de otros, da credibilidad al texto y permite al lector verificar la información. También forma una conducta ética: no apropiarse de ideas ajenas."},{"q":"¿Qué es un formato de citación?","a":"Es un conjunto de reglas para escribir las referencias de forma ordenada, por ejemplo APA. Indica qué datos poner (autor, año, título, enlace) y en qué orden. En una infografía, suele ir en una franja pequeña al final."}],"duda":false},"2025-F1-37":{"n":37,"year":2025,"ctx":"2025-F1-c11","stem":"Como parte de la actividad, el docente pide a los estudiantes que comenten los aspectos del texto que llamaron su atención. ¿Cuál de los siguientes comentarios evidencia una deducción de información del texto?","options":{"A":"“En las investigaciones sobre el ADN de los perros, los expertos con participación más relevante fueron los biólogos”.","B":"“Ciertos animales, como sucede con los lobos, pueden aprovechar en menor medida los nutrientes que tienen los carbohidratos”.","C":"“Los cambios en la alimentación de los ancestros de los perros nos ayudan a conocer el momento en que los seres humanos lograron domesticarlos”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es una deducción: el texto dice que, ‘en contraste con el lobo’, el perro tiene más genes para digerir el almidón y aprovecha mejor ciertos carbohidratos. De ahí se concluye que el lobo los aprovecha menos, aunque no lo diga literalmente.","La C parece correcta porque habla de alimentación y domesticación, pero el texto dice que se desconoce cuándo empezó esa relación; el estudio explica cómo se originó, no fija el momento. La C va más allá de lo que el texto permite.","Una deducción válida sale de unir datos explícitos del texto. Descarta opciones que agregan algo no dicho (como ‘los biólogos fueron los más relevantes’) o que exageran lo que el texto afirma."],"aprende_mas":[{"q":"¿Qué es una inferencia o deducción?","a":"Es obtener información que el texto no dice literalmente, pero que se desprende de lo que sí dice. Ejemplo: si el texto dice ‘Juan llegó empapado’, deduzco que se mojó, quizá por la lluvia. Es leer ‘entre líneas’, pero con pruebas."},{"q":"¿Qué diferencia hay entre información explícita e implícita?","a":"- **Explícita**: está escrita tal cual en el texto; se localiza.\n- **Implícita**: no está escrita, pero se deduce uniendo pistas.\n- **Inventada**: no está ni se puede deducir; es la trampa típica."},{"q":"¿Cómo detecto una sobreinterpretación?","a":"Pregúntate: ¿puedo señalar la frase del texto que lo respalda? Si la opción usa palabras absolutas (‘el más relevante’, ‘siempre’) o afirma algo que el texto dice que se desconoce, es una sobreinterpretación."}],"duda":false},"2025-F1-38":{"n":38,"year":2025,"ctx":"2025-F1-c11","stem":"En otro momento, el docente formula a los estudiantes la siguiente pregunta: “¿A qué creen que se deba que, en investigaciones como la que presenta el texto, se involucren científicos de varias ramas de la ciencia?”.\n\n¿Por qué la pregunta planteada por el docente promueve que los estudiantes reflexionen sobre el contenido del texto?","options":{"A":"Porque busca que los estudiantes expresen sus ideas sobre qué aporta la participación de diversas disciplinas en una investigación.","B":"Porque busca que los estudiantes se den cuenta de que el propósito del texto es brindar información científica sobre la domesticación de los perros.","C":"Porque busca que los estudiantes indaguen sobre los fenómenos abordados por las ciencias dedicadas al estudio de la evolución de los animales."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque la pregunta del docente pide pensar qué aporta que genetistas, biólogos o bioquímicos trabajen juntos. El estudiante debe opinar y dar razones sobre un dato del contenido: eso es reflexionar sobre el texto.","La B parece correcta, pero se refiere al propósito del texto, que es un aspecto de su forma y contexto, no de su contenido. Además, reconocer que el texto informa sobre perros no exige reflexión. La C manda a investigar fuera del texto.","Distingue: reflexionar sobre el contenido es opinar sobre las ideas o datos del texto; reflexionar sobre la forma es opinar sobre cómo está escrito o para qué."],"aprende_mas":[{"q":"¿Qué significa reflexionar y evaluar un texto?","a":"Es la capacidad más exigente de la competencia lectora en el CNEB. El lector toma distancia y opina sobre el texto: si sus ideas son válidas, si el autor logra su propósito, qué aporta. Siempre sustenta con el texto y con lo que sabe."},{"q":"¿Cuáles son las capacidades de ‘Lee diversos tipos de textos’?","a":"- **Obtiene información**: ubica lo que está escrito.\n- **Infiere e interpreta**: deduce y construye el sentido.\n- **Reflexiona y evalúa**: opina sobre la forma, el contenido y el contexto del texto."},{"q":"¿Cómo formular buenas preguntas de reflexión?","a":"Usa preguntas abiertas que pidan postura y razones: ‘¿Qué opinas de…?’, ‘¿Por qué crees que…?’, ‘¿Qué aporta…?’. Evita las que se responden copiando una frase del texto."}],"duda":false},"2025-F1-39":{"n":39,"year":2025,"ctx":"2025-F1-c12","stem":"Los integrantes del equipo de básquet están planificando un texto oral cuyo propósito es explicar las reglas de este deporte a niños de segundo de primaria. Sin embargo, tienen problemas para organizar la información con la que cuentan. Por ello, le solicitan a la docente que los oriente en la elaboración de un esquema de ideas. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que, con base en la información que tienen, mencionen cada una de las reglas del básquet. Luego, solicitar que conversen sobre cuáles son más relevantes. Después, proponer que determinen si dichas reglas pueden agruparse en un esquema considerando aspectos del juego similares y diferentes.","B":"Mostrar un video a los estudiantes en el que se expliquen las reglas del básquet, e indicar que tomen nota de la información nueva para ellos. Luego, pedir que dialoguen sobre esta información y sobre la que ya tienen. Después, solicitar que lleguen a acuerdos para realizar un esquema, basándose en la presentación ofrecida en el video.","C":"Solicitar a los estudiantes que comenten si aprendieron a jugar básquet de manera libre o un experto les enseñó. Luego, pedir que mencionen qué reglas, durante ese periodo de aprendizaje, les parecieron más fáciles. Después, indicar que, en un esquema, organicen las reglas del básquet en función del nivel de dificultad para cumplirlas."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es adecuada porque parte de la información que ya tienen los estudiantes, les pide seleccionar las reglas relevantes y luego agruparlas por aspectos del juego. Eso es justamente organizar ideas en un esquema jerárquico.","La B parece útil porque el video aporta información, pero el problema del equipo no es la falta de datos, sino organizarlos. Además, copiar la estructura del video les quita la oportunidad de decidir su propia organización.","Antes de elegir, identifica la necesidad real del estudiante (aquí, organizar). La mejor acción responde a esa necesidad y hace que ellos piensen, no que copien un modelo."],"aprende_mas":[{"q":"¿Qué es un esquema de ideas?","a":"Es un organizador que muestra las ideas principales, las secundarias y cómo se relacionan. Ayuda a decidir qué se dirá primero y qué después. Ejemplo: ‘Reglas del básquet’ dividido en ‘cómo se anota’, ‘faltas’ y ‘tiempo de juego’."},{"q":"¿Cómo se planifica un texto oral?","a":"- **Propósito**: explicar, convencer, narrar.\n- **Público**: edad y conocimientos previos.\n- **Contenido**: seleccionar solo lo relevante.\n- **Organización**: inicio, desarrollo y cierre, con un orden claro."},{"q":"¿Por qué agrupar por aspectos y no por dificultad?","a":"Agrupar por temas (anotación, faltas, cambios) da una estructura lógica que el público entiende. Ordenar por dificultad depende de la experiencia de cada expositor y no ayuda a niños que no conocen el juego."}],"duda":false},"2025-F1-40":{"n":40,"year":2025,"ctx":"2025-F1-c12","stem":"Los integrantes del equipo de vóleibol han preparado una presentación oral dirigida a los estudiantes de primero de primaria. Ellos le han pedido a la docente que escuche su texto oral, cuyo propósito es dar a conocer las reglas de ese deporte. Esta es la transcripción de un fragmento de dicho texto:\n\n“El vóleibol es un deporte de cooperación-oposición entre dos equipos. Compiten dos equipos, uno contra el otro. Los equipos están conformados por 6 jugadores. Compiten en un campo de juego uniforme dividido simétricamente por una red central. Eh… cada equipo consigue una anotación si el esférico pasa por encima de la red e impacta en el campo del equipo adversario. Por cierto, en Perú, tenemos buenas exponentes de este deporte, quienes nos han dado muchas alegrías... Bien, toca hablar ahora de las sanciones o faltas para los equipos que las cometen…”.\n\nLa docente pide a los estudiantes hacer una pausa en su texto oral, pues busca ofrecerles una retroalimentación que los ayude a mejorar su presentación. ¿Cuál de los siguientes problemas de comunicación oral debe priorizar la docente en su retroalimentación?","options":{"A":"La palabra “equipo” se repite innecesariamente en la presentación.","B":"El léxico usado en la presentación es inadecuado para el público al que se dirige.","C":"Al final de la presentación, algunas ideas dejan de lado el desarrollo del tema central."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la prioridad: palabras como ‘cooperación-oposición’, ‘simétricamente’, ‘uniforme’ o ‘esférico’ no las entiende un niño de primer grado. Si el público no comprende, la exposición no cumple su propósito de enseñar las reglas.","La C parece correcta porque hay una digresión sobre las voleibolistas peruanas, pero es breve y luego retoman el tema. Afecta mucho menos que un vocabulario que los niños no entienden de principio a fin.","En comunicación oral, prioriza la adecuación al público y al propósito. Repeticiones (A) o digresiones breves son problemas menores frente a un registro que impide comprender."],"aprende_mas":[{"q":"¿Qué es adecuar un texto oral al público?","a":"Es ajustar el vocabulario, los ejemplos y el ritmo a quien escucha. Para niños de 6 años sería: ‘Si la pelota cae en la cancha del otro equipo, ganas un punto’, en lugar de ‘el esférico impacta en el campo adversario’."},{"q":"¿Qué es una digresión?","a":"Es salirse por un momento del tema central para comentar algo relacionado. No siempre es un error: puede acercar al público. Se vuelve un problema cuando es larga o frecuente y hace perder el hilo."},{"q":"¿Qué recursos ayudan a explicar a niños pequeños?","a":"- **Palabras sencillas**: ‘pelota’ en vez de ‘esférico’.\n- **Ejemplos y demostraciones**: mostrar la jugada.\n- **Apoyos visuales**: imágenes de la cancha.\n- **Preguntas**: ‘¿Qué pasa si la pelota toca la red?’."}],"duda":false},"2025-F1-41":{"n":41,"year":2025,"ctx":"2025-F1-c13","stem":"El docente les pide a los estudiantes que compartan sus interpretaciones sobre el texto. Tres estudiantes deciden intervenir. ¿Cuál de los estudiantes ofrece una interpretación sobre el sentido global del texto?","options":{"A":"Abel dice: “Creo que el texto alude al error de un inocente venadito para motivar que las personas dejemos de comer carne”.","B":"Blanca dice: “Me parece que, con el texto, se pretende explicar por qué en algunos lugares las personas cazan venados”.","C":"Claudio dice: “Es muy probable que el texto quiera mostrar a qué se debe el carácter temeroso que tienen los ciervos”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque capta la intención de todo el mito: explicar un origen. El texto cierra con “a partir de entonces, los venados habían de ser alimento para los hombres”, y Blanca lo relaciona con por qué se cazan venados.","La C parece correcta porque también “explica a qué se debe” algo, pero se apoya en un detalle (los venados “se dispersaron”). El mito no trata del miedo de los venados, sino de cómo pasaron de cazadores a presa.","Para sentido global, pregúntate: ¿esta idea explica el texto completo, de inicio a final? Si solo se sostiene en una frase suelta o agrega un mensaje moral que el texto no da (como la A), descártala."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea que da unidad a todo el texto: de qué trata y para qué fue escrito. No sale de una oración, sino de relacionar el inicio, el desarrollo y el final. En “Los venados”, el sentido global es explicar por qué los humanos comen venados."},{"q":"¿Qué es un mito etiológico?","a":"Es un relato que explica el origen de algo: un animal, una costumbre, un lugar. Suele tener un “antes” (los venados comían hombres) y un “después” (los hombres comen venados). Reconocer ese antes y después ayuda a encontrar el sentido global."},{"q":"¿Cómo distingo sentido global de un detalle del texto?","a":"- **Sentido global**: explica todo el texto; si lo quitas, el texto pierde su razón de ser.\n- **Detalle**: es verdadero pero parcial, como “los venados se dispersaron”.\n- **Prueba rápida**: si la interpretación no se conecta con el final del texto, probablemente es un detalle."}],"duda":false},"2025-F1-42":{"n":42,"year":2025,"ctx":"2025-F1-c13","stem":"En otro momento de la sesión, el docente tiene como propósito que los estudiantes reconozcan los recursos literarios que contribuyen a la construcción de interpretaciones sobre el sentido global del texto. ¿Cuál de las siguientes preguntas es menos adecuada para el logro de dicho propósito?","options":{"A":"El narrador personifica a los venados presentados en el texto. ¿Con qué finalidad emplea esa figura?","B":"El narrador emplea “antiguamente” para iniciar el texto. ¿Qué efecto busca generar con ese término?","C":"El narrador indica que un venadito cometió un error al cantar. ¿Qué uso le da a esa equivocación?"},"answer":"B","tema":"Literatura","explicacion":["La B es la menos adecuada porque “antiguamente” es una fórmula de inicio, como “había una vez”: solo ubica el relato en un tiempo lejano. Por sí sola no construye la interpretación de por qué los venados son alimento de los hombres.","La C parece un detalle, pero la equivocación del venadito es el punto de giro del mito: su frase invierte los papeles y provoca el cambio final. Por eso sí ayuda a interpretar el sentido global, igual que la personificación (A).","En preguntas de “menos adecuada”, busca la opción cuyo recurso no carga el significado central del texto. La personificación y el giro de la historia sostienen la explicación del mito; la fórmula de inicio, no."],"aprende_mas":[{"q":"¿Qué es un recurso literario?","a":"Es una forma especial de usar el lenguaje o de organizar la historia para producir un efecto en el lector. Por ejemplo, hacer hablar a animales (personificación) o poner un giro inesperado. En clase, se analizan preguntando “¿para qué lo usa el autor?”."},{"q":"¿Qué es la personificación y para qué sirve en los mitos?","a":"Es darle cualidades humanas a animales u objetos: los venados bailan, cantan y planifican. En los mitos permite contar cómo era el mundo “antes” como si fuera una sociedad humana, y así explicar por qué las cosas son como son hoy."},{"q":"¿Qué es un punto de giro en un relato?","a":"Es el momento en que la historia cambia de rumbo. En “Los venados”, es cuando el venadito se equivoca al cantar: desde ahí los cazadores se vuelven presa. Preguntar por el punto de giro suele llevar directo al sentido global."}],"duda":false},"2025-F1-43":{"n":43,"year":2025,"ctx":"2025-F1-c14","stem":"Luego de concluida la charla, la docente propone a los estudiantes dialogar acerca de la información que han escuchado. Ellos le solicitan a la docente reproducir la grabación. A continuación, se presenta la transcripción de un fragmento de la charla:\n\n“Sé que hasta hace unos años parecía extraño… este… ver que, en ciertos puestos de trabajo, como en la construcción de una carretera o un puente, trabajaran mujeres como ingenieras liderando el proyecto. Pero, bueno, ya estamos viendo que no debería parecer extraño, pues las mujeres podemos estar a cargo de proyectos de infraestructura en cualquier rubro. No existen razones por las que las mujeres no podamos estudiar carreras de ingeniería, que requieren, entre otras cosas, un manejo solvente de matemáticas y física, así como conocimiento estadístico y capacidad de liderazgo […] Yo las animo… eh… a ustedes, chicas. Si sienten que quieren estudiar ingeniería, ¡háganlo, anímense!”.\n\nTres estudiantes realizan comentarios a partir de dicho fragmento. ¿Cuál de los siguientes comentarios de los estudiantes se centra en una deducción de información del texto oral?","options":{"A":"“Considero que las carreras de ingeniería deben tener muchos cursos relacionados con matemática o química. Esto se debe a los tipos de trabajos en los que se involucra una ingeniera”.","B":"“Pienso que aun hoy es común que la gente crea que las mujeres no podemos estudiar ni trabajar como ingenieras. Está en todos, adolescentes o adultos, ayudar a que cambie esa forma de pensar”.","C":"“Quizás el motivo para afirmar que las mujeres no podían estudiar carreras de ingeniería era que no había interés en reconocer su capacidad. Peor aún, no había oportunidades para que puedan mostrarla”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta porque parte de lo que dijo la ingeniera (las carreras de ingeniería requieren “un manejo solvente de matemáticas y física”) y deduce algo no dicho: que esas carreras tienen muchos cursos de ese tipo.","La C parece una deducción porque empieza con “Quizás el motivo…”, pero la ingeniera nunca habla de las causas de la exclusión. Es una conjetura propia, sin pistas en el texto oral que la respalden.","Una deducción válida siempre tiene un “ancla” en el texto: algo dicho que permite concluir otra cosa. Si el comentario es opinión (B) o hipótesis sin base en lo escuchado (C), no es deducción del texto."],"aprende_mas":[{"q":"¿Qué es una inferencia o deducción en comprensión?","a":"Es sacar una información que no está dicha, a partir de pistas que sí están. Ejemplo: si el texto dice “llegó empapado y cerró el paraguas”, deduzco que llovía. La clave es que la conclusión se apoye en algo del texto, no solo en lo que yo pienso."},{"q":"¿Cuál es la diferencia entre deducir y opinar?","a":"- **Deducir**: concluir algo a partir de datos del texto (“si requiere matemáticas, tendrá cursos de matemáticas”).\n- **Opinar**: dar mi postura o valoración (“todos debemos cambiar esa forma de pensar”).\n- **Conjeturar**: suponer algo sin pistas en el texto (“quizás no había interés…”)."},{"q":"¿Qué capacidades tiene la competencia oral en el CNEB?","a":"La competencia “Se comunica oralmente en su lengua materna” incluye: obtener información del texto oral, inferir e interpretar, adecuar y organizar ideas, usar recursos no verbales y paraverbales, interactuar con otros y reflexionar sobre lo escuchado. Esta pregunta evalúa “infiere e interpreta”."}],"duda":false},"2025-F1-44":{"n":44,"year":2025,"ctx":"2025-F1-c14","stem":"En otro momento de la sesión de aprendizaje, la docente cita un dato compartido por la ingeniera: “Según un informe de la Unesco, de todas las personas que se gradúan en alguna carrera de ingeniería en el Perú, el 47,5 % son mujeres”. Luego, solicita a los estudiantes que ofrezcan comentarios sobre ello. Una estudiante menciona:\n\n“No estoy de acuerdo con esa información sobre la cantidad de mujeres ingenieras en el Perú, ya que yo no conozco a tantas mujeres que sean de esas carreras”.\n\nAlgunas compañeras están en desacuerdo con la afirmación y deciden intervenir. ¿Qué estudiante ofrece un argumento adecuado para refutar dicha afirmación?","options":{"A":"Antonia dice: “La ingeniera es una experta. Y, como cualquier profesional, debe habernos ofrecido datos verdaderos”.","B":"Beatriz dice: “Creo que el dato tiene mucho sentido. En mi entorno, sí hay varias mujeres que han estudiado ingeniería”.","C":"Clara dice: “El dato es de una institución de prestigio. Si alguien desea, puede ir a la fuente para comprobar de dónde se obtuvo”."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque refuta con un criterio válido: el dato viene de una institución confiable (la Unesco) y se puede verificar en la fuente. Así muestra que la experiencia personal no basta para negar un dato estadístico.","La A parece correcta porque también defiende el dato, pero se apoya solo en que la ingeniera “es experta” y “debe” decir la verdad. Es un argumento de autoridad sin verificación; no enseña a contrastar la información.","Si un argumento se basa en “yo conozco / yo no conozco” (como la estudiante o la B), es una generalización desde la experiencia personal. Para refutarlo, gana la opción que remite a fuentes confiables y verificables."],"aprende_mas":[{"q":"¿Qué es refutar un argumento?","a":"Es mostrar por qué un argumento es débil o falso, dando razones mejores. No basta con decir “no estoy de acuerdo”. En el aula, se refuta señalando el error del razonamiento y ofreciendo una prueba más sólida, como una fuente confiable."},{"q":"¿Qué es una generalización apresurada?","a":"Es sacar una conclusión general a partir de pocos casos personales. Ejemplo: “No conozco ingenieras, entonces casi no hay”. El problema es que mi entorno no representa a todo el país. Decir lo contrario (“yo sí conozco varias”, como la B) comete el mismo error."},{"q":"¿Por qué el argumento de autoridad puede ser débil?","a":"Porque acepta algo solo por quién lo dice, sin revisar de dónde sale el dato. Un experto también puede equivocarse o citar mal. Es más sólido decir “la fuente es confiable y se puede comprobar”, porque invita a verificar en lugar de solo confiar."}],"duda":false},"2025-F1-45":{"n":45,"year":2025,"ctx":"2025-F1-c14","stem":"La docente busca dialogar con los estudiantes sobre algunos aspectos de la charla de la ingeniera. Con este fin, reproduce un fragmento de la grabación, que se transcribe a continuación:\n\n“En el colegio, me gustaba resolver problemas de física y matemática. Y, cuando terminé el colegio, mi primera opción fue estudiar una carrera de ingeniería. Fue así como quise estudiar la carrera de Ingeniería Civil. Pero, en esa época, mis padres me dijeron que no me apoyarían en mi decisión. Ellos decían que esa carrera no era para mujeres. Eh… por eso, tuve que estudiar una carrera que se pensaba que era más ‘adecuada’ (la ingeniera hace un gesto de comillas con sus manos) para una mujer. Pero… eh… yo siempre sentía que quería ser ingeniera. Entonces, apenas egresé de mi primera carrera, y luego de contarle esto a mis padres, postulé a una universidad para empezar a estudiar Ingeniería Civil. Esta vez, apoyaron mi decisión. Ahora están orgullosos de mis logros como ingeniera”.\n\nUno de los estudiantes comenta que, en este fragmento de la charla, la ingeniera realizó un gesto con sus manos, como poniendo comillas a la palabra “adecuada”. La docente les pregunta con qué intención creen que ella realizó ese gesto. Tres estudiantes deciden intervenir. ¿Qué estudiante identifica adecuadamente dicha intención?","options":{"A":"Anastasia dice: “Yo creo que la intención al emplear el gesto en la palabra ‘adecuada’ es dejar claro que, para la experta, era inadecuado estudiar una carrera diferente a ingeniería”.","B":"Bernardo dice: “Parece que la intención de la ingeniera al usar el gesto en ‘adecuada’ es citar, con humor, el término que utilizaban su mamá y su papá para evitar que estudie lo que quería”.","C":"Camila dice: “Pienso que la intención al utilizar el gesto en ‘adecuada’ es dar a entender que, antes, la sociedad sancionaba a las mujeres que querían estudiar ciertas carreras”."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque las comillas con las manos marcan distancia crítica: la ingeniera dice que la carrera “se pensaba” adecuada para una mujer. Cuestiona una creencia social de la época que limitaba a las mujeres.","La B parece correcta porque los padres sí se opusieron, pero la ingeniera usa una forma impersonal (“se pensaba”), no cita sus palabras. Además, el gesto no busca humor, sino cuestionar esa idea.","Cuando un gesto o entonación acompaña una palabra, pregúntate si el hablante la asume o se distancia de ella. Las “comillas” con las manos casi siempre indican ironía o crítica a lo que otros piensan."],"aprende_mas":[{"q":"¿Qué son los recursos no verbales y paraverbales?","a":"- **No verbales**: gestos, miradas, postura, movimientos (como las comillas con los dedos).\n- **Paraverbales**: tono, volumen, ritmo, pausas de la voz.\n- **Para qué sirven**: refuerzan, matizan o incluso contradicen lo que se dice con palabras."},{"q":"¿Qué intención suelen tener las comillas hechas con las manos?","a":"Indican que la palabra no es del todo del hablante: la usa con ironía, la cuestiona o muestra que es lo que “otros” dicen. Ejemplo en aula: “Mi hermano está ‘estudiando’” con comillas significa que en realidad no estudia."},{"q":"¿Cómo se interpreta la intención de un hablante?","a":"Se relaciona lo que dice con cómo lo dice y con el contexto. Aquí: la ingeniera habla de una época en que se creía que la ingeniería “no era para mujeres”, y hoy es ingeniera exitosa. El gesto muestra que ella rechaza esa creencia."}],"duda":false},"2025-F1-46":{"n":46,"year":2025,"ctx":"2025-F1-c14","stem":"Para profundizar en la comprensión de la charla de la ingeniera, la docente reproduce el siguiente fragmento:\n\n“Cualquier carrera de ingeniería se relaciona mucho… este… con las ciencias aplicadas y con la investigación. Pues, bueno… eh… pese a que las mujeres hemos avanzado en empoderarnos en esos campos, en el Directorio Nacional de Investigadores e Innovadores del Consejo Nacional de Ciencia, Tecnología e Innovación Tecnológica, solo el 34 % de profesionales inscritos en el Perú son mujeres. Además, según un informe de la Unesco del 2022, solo el 33 % de los investigadores científicos en el mundo son mujeres”.\n\nLos estudiantes comparten diversos comentarios sobre los datos presentados. Luego, la docente les plantea realizar diversas actividades. ¿Cuál de las siguientes acciones propuestas por la docente supone una mayor demanda cognitiva?","options":{"A":"La docente orienta a los estudiantes para que indaguen sobre los motivos por los que las mujeres no tienen suficiente representación en entidades de investigación científica. Además, con base en ello, les pide que elaboren una infografía.","B":"La docente solicita a los estudiantes que averigüen cuántas de sus compañeras de otros grados tienen como opción estudiar una carrera en ingeniería o una carrera en ciencias. Además, para recoger dicha información, les pide que elaboren un cuestionario.","C":"La docente les comparte a los estudiantes varias fuentes que contienen porcentajes de mujeres investigadoras en diversos países. Además, les pide que elaboren un cuadro en el que contrasten estos porcentajes con los datos ofrecidos por la ingeniera."},"answer":"A","tema":"Planificación y procesos pedagógicos","explicacion":["La A tiene mayor demanda cognitiva porque pide indagar los motivos de la baja representación de mujeres, es decir, explicar causas. Luego exige sintetizar y organizar esa explicación en una infografía.","La C parece exigente porque pide contrastar, pero los datos ya están dados y la tarea es comparar porcentajes en un cuadro. Ordenar y comparar cifras requiere menos razonamiento que buscar y explicar causas.","Para medir demanda cognitiva, mira el verbo principal: explicar causas, argumentar o evaluar exige más que recoger, contar o comparar datos. Gana la tarea que obliga a pensar el “por qué”, no solo el “cuánto”."],"aprende_mas":[{"q":"¿Qué es la demanda cognitiva de una tarea?","a":"Es el nivel de esfuerzo de pensamiento que pide una actividad. Copiar o recordar datos es demanda baja; comparar es intermedia; explicar causas, argumentar o crear algo nuevo es demanda alta. Las rúbricas de desempeño docente valoran que el docente promueva razonamiento y pensamiento crítico."},{"q":"¿Cómo reconozco una tarea de alta demanda cognitiva?","a":"- **Pide explicar o justificar**: “¿por qué ocurre esto?”.\n- **Pide integrar fuentes**: buscar, seleccionar y relacionar información.\n- **Pide producir algo nuevo**: una infografía, un ensayo, una propuesta.\n- **No tiene una única respuesta** que se copie del texto."},{"q":"¿Qué relación tiene esto con los procesos pedagógicos?","a":"En el desarrollo de la sesión, el docente debe plantear retos que movilicen el pensamiento, no solo actividades para “hacer algo”. Una buena tarea genera conflicto cognitivo: el estudiante no sabe la respuesta de inmediato y tiene que construirla."}],"duda":false},"2025-F1-47":{"n":47,"year":2025,"ctx":"2025-F1-c15","stem":"La docente conversa con los estudiantes sobre los diversos temas tratados en el poema, entre los cuales se encuentra el amor romántico. En este contexto, ella les propone que realicen comentarios sobre dicho tema. ¿Qué estudiante identifica lo que la voz poética, principalmente, quiere expresar sobre el amor romántico?","options":{"A":"Arón dice: “La voz poética quiere expresar que se siente un poco melancólica cuando imagina el amor que puede existir entre dos personas”.","B":"Belén dice: “La voz poética quiere expresar que prefiere recordar a la persona que amó, en lugar de regresar a los lugares que compartió con ella”.","C":"Celeste dice: “La voz poética quiere expresar que la naturaleza la ayuda a dar una explicación a sus sentimientos de amor hacia una persona que quiso mucho”."},"answer":"B","tema":"Literatura","explicacion":["La B es correcta porque el poema cierra así: “Una cosa no acepto. Volver a ese lugar… Te he sobrevivido suficiente como para recordar desde lejos”. La voz elige recordar al ser amado, que ya murió, sin regresar al lugar compartido.","La A parece correcta porque la voz imagina a una pareja enamorada, pero dice “De veras les deseo que lo oigan”: acepta esa escena sin melancolía. Además, es un momento del poema, no lo que principalmente expresa sobre el amor.","Para hallar lo principal que dice un poema, mira el cierre y los contrastes: aquí, “acepto todo” frente a “una cosa no acepto”. Lo que la voz rechaza suele revelar el núcleo del sentido."],"aprende_mas":[{"q":"¿Qué es la voz poética?","a":"Es quien habla dentro del poema; no es necesariamente la autora. Tiene emociones, actitudes y a veces se dirige a alguien. En este poema, la voz poética es alguien que perdió a un ser amado y se despide del paisaje que compartieron."},{"q":"¿Cómo se sabe que el ser amado murió?","a":"Por pistas, no porque se diga directamente: “como si vivieras” y “Te he sobrevivido”. Unir esas dos frases es una inferencia. Enseñar a los estudiantes a buscar estas pistas es clave para interpretar poemas."},{"q":"¿Qué papel cumple la naturaleza en este poema?","a":"La naturaleza sigue su ciclo sin importarle el dolor de la voz: la primavera llega, la hierba crece. La voz lo acepta (“no le reprocho”, “no exijo ningún cambio”). Por eso la C falla: la naturaleza no explica sus sentimientos, solo contrasta con ellos."}],"duda":false},"2025-F1-48":{"n":48,"year":2025,"ctx":"2025-F1-c15","stem":"La docente tiene como propósito que los estudiantes construyan interpretaciones sobre el sentido global del poema. ¿Cuál de las siguientes acciones pedagógicas es menos adecuada para lograr dicho propósito?","options":{"A":"Pedir que expresen a qué creen que alude la voz poética en la novena estrofa del poema con la frase “algo nuevo”, y que expliquen por qué usa dicha expresión.","B":"Pedir que indiquen la actitud de la voz poética en la décima y undécima estrofa del poema, y que expliquen si esa actitud se mantiene en la penúltima estrofa.","C":"Pedir que identifiquen qué atributo de cierto lago es aludido en la cuarta estrofa del poema, y que expliquen por qué la voz poética hace referencia a dicho atributo."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es la menos adecuada porque “algo nuevo, como un trino” es un detalle del paisaje: un sonido que empieza entre los juncos. Explicar esa expresión no conecta con la pérdida ni con la despedida, que son el centro del poema.","La C parece un detalle (el atributo de un lago), pero esa estrofa dice “como si vivieras” y “es tan bella como era”: revela que el ser amado murió. Por eso sí lleva al sentido global, igual que analizar el cambio de actitud (B).","En “menos adecuada para el sentido global”, descarta las acciones que trabajan zonas clave del texto. La respuesta es la que se queda en un elemento aislado que no ayuda a entender el poema completo."],"aprende_mas":[{"q":"¿Qué preguntas ayudan a construir el sentido global de un poema?","a":"- **Sobre la actitud**: ¿cómo se siente la voz y cambia en algún momento?\n- **Sobre el interlocutor**: ¿a quién le habla y por qué?\n- **Sobre el cierre**: ¿qué decide o revela al final?\n- **Sobre el título**: ¿cómo se relaciona con todo el poema?"},{"q":"¿Por qué importa un cambio de actitud en el poema?","a":"Porque suele marcar el mensaje central. En este poema, la voz acepta todo (la primavera, el lago, la pareja) y luego dice “Una cosa no acepto”. Ese giro muestra lo que realmente le importa: no volver al lugar donde vivió su amor."},{"q":"¿Cómo planifico preguntas de lectura de menos a más complejas?","a":"Empieza por preguntas literales (¿qué dice?), luego inferenciales (¿qué quiere decir?, ¿qué se deduce?) y al final críticas (¿qué opinas?, ¿por qué el autor eligió esto?). Para el sentido global, prioriza las inferenciales que relacionan varias partes del texto."}],"duda":false},"2025-F1-49":{"n":49,"year":2025,"ctx":"2025-F1-c15","stem":"Luego, la docente busca orientar a los estudiantes en la identificación de los recursos literarios que aportan a la construcción del sentido global del poema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir que identifiquen las emociones que la voz poética expresa en la segunda y en la tercera estrofa del poema. Luego, indicar que expliquen si el título hace referencia a dichas emociones.","B":"Pedir que identifiquen las características de la primavera que se desprenden de las tres primeras estrofas del poema. Luego, preguntar cuál de esas características quiere destacar la voz poética.","C":"Pedir que identifiquen a qué persona se dirige la voz poética en la cuarta y en la última estrofa del poema. Luego, solicitar que comenten por qué la voz poética elige como interlocutor a dicha persona."},"answer":"C","tema":"Literatura","explicacion":["La C es la más adecuada porque trabaja un recurso literario clave: la voz se dirige a un “tú” ausente (“como si vivieras”, “Te he sobrevivido”). Preguntar por qué le habla a esa persona lleva directo al sentido de despedida y duelo.","La A parece adecuada porque menciona el título, pero pide identificar emociones, que es contenido, no un recurso literario. La B sí roza la personificación, pero se queda en describir la primavera, sin llegar al núcleo del poema.","Si la pregunta pide “recursos literarios para el sentido global”, elige la opción que nombra un recurso (apóstrofe, personificación, contraste) y además lo conecta con el mensaje central, no solo con un elemento parcial."],"aprende_mas":[{"q":"¿Qué es el apóstrofe en un poema?","a":"Es cuando la voz poética le habla directamente a alguien o algo, aunque no esté presente: un ser querido, un muerto, la luna. Aquí la voz le habla a su amor fallecido (“Te he sobrevivido”). Ese recurso convierte el poema en una despedida íntima."},{"q":"¿Cuál es la diferencia entre contenido y recurso literario?","a":"- **Contenido**: qué dice el poema (emociones, temas, hechos).\n- **Recurso literario**: cómo lo dice (figuras, estructura, a quién se dirige).\n- **Ejemplo**: “la voz está triste” es contenido; “la voz le habla a un tú ausente” es un recurso."},{"q":"¿Cómo enseño a analizar recursos sin quedarme en nombrarlos?","a":"No basta con que el estudiante diga “es una personificación”. La pregunta clave es: ¿para qué la usa el autor y qué aporta al sentido? Primero se identifica el recurso, luego se explica su efecto y se conecta con el mensaje del texto."}],"duda":false},"2025-F1-50":{"n":50,"year":2025,"ctx":"2025-F1-c15","stem":"En otro momento de la sesión, la docente propone a los estudiantes que ofrezcan comentarios sobre la voz poética. Tres estudiantes comparten sus comentarios con el resto de la clase. ¿Cuál de los siguientes estudiantes evidencia, en su comentario, una reflexión sobre el contenido del texto?","options":{"A":"Alejandro dice: “La voz poética muestra mucha fortaleza al poder dirigirse a un ser querido que ya no está con ella. Si estuviera en su lugar, yo no podría escribirle a alguien que está ausente”.","B":"Benjamín dice: “La voz poética expresa que nuestro estado de ánimo cambia en función de las estaciones. Esto quiere decir que nuestro humor puede estar influenciado por el invierno o el verano”.","C":"Carmela dice: “La voz poética, en la décima estrofa del poema, menciona que las olas son ligeras, perezosas y desobedientes. Entonces, es consciente de la libertad que tienen las aguas del mar”."},"answer":"A","tema":"Literatura","explicacion":["La A es correcta porque Alejandro valora el contenido del poema (la voz le escribe a un ser querido ausente) y lo contrasta con su propia experiencia: “Si estuviera en su lugar, yo no podría”. Eso es reflexionar sobre el contenido.","La C parece correcta porque cita una estrofa y saca una conclusión, pero eso es interpretar un fragmento, no reflexionar. Además, se queda en un detalle (las olas) que no toca lo central del poema.","Reflexionar es tomar distancia del texto y opinar, valorar o relacionarlo con la propia vida o el mundo. Si el comentario solo explica qué significa una parte del texto, es interpretación, no reflexión."],"aprende_mas":[{"q":"¿Qué significa reflexionar sobre el contenido de un texto?","a":"Es dar una postura o valoración sobre lo que dice el texto, relacionándolo con la propia experiencia, valores o conocimientos. Ejemplo en aula: “Yo también he sentido eso cuando…” o “No estoy de acuerdo con el personaje porque…”."},{"q":"¿Cuáles son las capacidades de la competencia lectora en el CNEB?","a":"- **Obtiene información**: ubica lo que el texto dice explícitamente.\n- **Infiere e interpreta**: deduce lo no dicho y construye el sentido.\n- **Reflexiona y evalúa**: opina y valora la forma, el contenido y el contexto del texto."},{"q":"¿Por qué el comentario de Benjamín (B) no sirve?","a":"Porque malinterpreta el poema: este no trata de cómo las estaciones cambian el ánimo. Al contrario, la primavera llega igual y la tristeza de la voz no la detiene. Una reflexión válida debe partir de una comprensión correcta del texto."}],"duda":false},"2025-F1-51":{"n":51,"year":2025,"ctx":"2025-F1-c15","stem":"Como parte de la profundización sobre el contenido del texto poético, la docente propone a los estudiantes identificar las figuras retóricas que aportan a la interpretación del sentido global del poema. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"¿Qué recurso literario se evidencia en “comprendo que mi tristeza / no frenará la hierba”? ¿A qué quiere referirse la voz poética con aquel recurso?","B":"¿Qué quiere decir la expresión “recuperen su murmullo” utilizada en la tercera estrofa del poema? ¿Cuál es la finalidad de la voz poética al emplear esta expresión?","C":"¿Qué tienen en común los versos “no me causa dolor”, “no le guardo rencor” y “no exijo ningún cambio”? ¿Qué sensaciones busca generar la voz poética con estos versos?"},"answer":"C","tema":"Literatura","explicacion":["La C es correcta porque une tres versos que repiten la misma estructura negativa (“no me causa dolor”, “no le guardo rencor”, “no exijo ningún cambio”): una anáfora o paralelismo que recorre todo el poema y construye su sentido global de aceptación dolorosa.","La A parece correcta porque pregunta directamente por un “recurso literario”, pero se queda en un solo verso aislado. Interpretar una figura local no lleva a comprender el sentido global del poema.","Regla: si piden figuras que aporten al sentido global, elige la opción que relaciona varios versos o un recurso que se repite en todo el texto, no la que analiza un fragmento suelto."],"aprende_mas":[{"q":"¿Qué es el sentido global de un poema?","a":"Es la idea o emoción central que une todo el texto, más allá de cada verso. En este poema, la voz poética dice que acepta que la vida siga sin la persona amada, pero esa insistencia en negar el dolor deja ver justamente su tristeza."},{"q":"¿Qué son la anáfora y el paralelismo?","a":"- **Anáfora**: repetir la misma palabra al inicio de varios versos (“No me…”, “No le…”, “No exijo…”).\n- **Paralelismo**: repetir la misma estructura sintáctica en versos distintos.\nAmbas crean ritmo y refuerzan una idea; por eso suelen ser clave para el sentido global."},{"q":"¿Cómo distinguir una pregunta local de una global?","a":"- **Local**: se centra en una palabra, un verso o una expresión (“¿qué significa ‘recuperen su murmullo’?”).\n- **Global**: pide relacionar partes del texto y ver qué tienen en común o qué sentido construyen juntas.\nEn el examen, “sentido global” casi siempre exige relacionar varias partes."}],"duda":false},"2025-F1-52":{"n":52,"year":2025,"ctx":"2025-F1-c16","stem":"Durante la planificación de los textos orales, la docente comparte el audio de una entrevista a una especialista en conservación del patrimonio del Ministerio de Cultura peruano. En la entrevista, la especialista explica las medidas implementadas por dicho ministerio para reducir el huaqueo en los lugares arqueológicos del país.\n\nLuego de escuchar el audio, la docente nota que los estudiantes tienen dudas sobre lo que quieren decir algunos términos relevantes, entre ellos, “pagano”, “yacimiento”, “forado”. Por ello, busca ayudarlos a deducir, por sí mismos, el sentido de dichos términos a partir del contexto. ¿Cuál de las siguientes acciones pedagógicas es menos adecuada para ello?","options":{"A":"La docente transcribe la siguiente idea tomada de la entrevista: “Presentaba un forado de gran profundidad y diámetro”. Luego, les pregunta a los estudiantes qué objetos tienen profundidad y diámetro, y qué significaría “forado” en la idea transcrita.","B":"La docente pregunta a los estudiantes cuáles son los términos de la entrevista que les han generado dudas. Luego, les solicita que, en la pizarra, escriban oraciones usando dichos términos y que determinen el sentido que tienen en las oraciones elaboradas.","C":"La docente reproduce el audio de la entrevista nuevamente y les pide a los estudiantes que indiquen en qué pasajes poner pausa para analizarlos juntos. Luego, les propone que compartan hipótesis sobre el sentido que dichos términos tienen en esos pasajes."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la menos adecuada: pide escribir oraciones con términos que los estudiantes aún no entienden. Al sacarlos de la entrevista, se pierde el contexto, que es justamente lo que permite deducir su sentido.","La A puede parecer poco adecuada porque la docente guía mucho, pero sí trabaja con el contexto: la frase de la entrevista y las pistas “profundidad y diámetro” ayudan a inferir qué es un forado.","Regla: deducir el sentido de una palabra exige volver al texto donde aparece y usar pistas cercanas. Toda opción que descontextualiza el término no sirve para inferir."],"aprende_mas":[{"q":"¿Qué es deducir el significado de una palabra por contexto?","a":"Es descubrir qué quiere decir una palabra usando las ideas que la rodean, sin ir al diccionario. Ejemplo: en “presentaba un forado de gran profundidad y diámetro”, las palabras “profundidad” y “diámetro” indican que forado es un hueco o agujero."},{"q":"¿Qué pistas del contexto puede usar un estudiante?","a":"- **Palabras cercanas**: sinónimos, ejemplos o descripciones en la misma frase.\n- **Tema del texto**: si se habla de huaqueo, “yacimiento” se relaciona con lugares donde hay restos arqueológicos.\n- **Situación comunicativa**: quién habla y con qué propósito.\n- **En textos orales**: entonación, pausas y lo que se dice antes y después."},{"q":"¿Por qué volver a escuchar el audio ayuda a comprender?","a":"Porque el texto oral es efímero: si no se repite, se pierden detalles. Pausar en los pasajes clave permite analizar juntos y plantear hipótesis sobre el sentido, como hace la alternativa C."}],"duda":false},"2025-F1-53":{"n":53,"year":2025,"ctx":"2025-F1-c16","stem":"Los integrantes de un equipo están practicando su exposición para el video frente a la docente. Ellos tienen como propósito sensibilizar a la audiencia sobre los retos para la conservación del parque natural de la localidad. Durante la práctica, la docente se da cuenta de que los estudiantes han utilizado secuencias argumentativas para el logro de su propósito. ¿Cuál de las siguientes ideas tomadas de las intervenciones de los estudiantes presenta este tipo de secuencia?","options":{"A":"“En el parque natural, viven muchos animales. Puede que llamen nuestra atención para alimentarlos, pero esto perjudicaría su salud y les generaríamos dependencia”.","B":"“Todos los 26 de enero se celebra el Día Mundial de la Educación Ambiental. Y ese día, es una buena ocasión para pensar en cómo ayudar a cuidar los parques naturales”.","C":"“Casi toda el área del parque natural está señalizada con letreros y avisos. Además, existen guías preparados que pueden ayudar a los visitantes a disfrutar del parque”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es argumentativa porque tiene una postura implícita (no alimentar a los animales) sostenida con razones: “perjudicaría su salud” y “les generaríamos dependencia”. Hay opinión más justificación.","La B parece argumentativa porque dice que es “una buena ocasión para pensar”, pero solo informa una fecha y hace una invitación general, sin defender una postura con razones.","Regla: una secuencia argumentativa tiene tesis + argumentos (razones que la sostienen). Si solo hay datos o descripciones, es expositiva o descriptiva, aunque suene a consejo."],"aprende_mas":[{"q":"¿Qué partes tiene una secuencia argumentativa?","a":"- **Tesis o postura**: lo que se defiende (“no hay que alimentar a los animales”).\n- **Argumentos**: razones que la apoyan (“perjudica su salud”).\n- **Conclusión**: a veces se repite o refuerza la postura.\nLa tesis puede estar implícita, como en la alternativa A."},{"q":"¿En qué se diferencia una secuencia expositiva de una argumentativa?","a":"La expositiva informa o explica hechos sin tomar partido (“el parque está señalizado”). La argumentativa busca convencer y por eso da razones a favor de una postura. Una pista: pregúntate “¿qué quiere que yo piense o haga, y por qué?”."},{"q":"¿Qué es una secuencia textual?","a":"Es un modo de organizar las ideas dentro de un texto: narrativa, descriptiva, expositiva, argumentativa o dialogal. Un mismo texto puede combinar varias; por ejemplo, un video de sensibilización puede describir el parque y luego argumentar por qué cuidarlo."}],"duda":false},"2025-F1-54":{"n":54,"year":2025,"ctx":"2025-F1-c16","stem":"Un equipo de estudiantes está practicando su texto oral frente a la docente. El equipo tiene como propósito ofrecer información sobre el estado de conservación del centro histórico de la ciudad en que se ubica la IE. Al escuchar a los estudiantes, la docente nota que evitan hacer contacto visual con la audiencia, no emplean gestos ni varían la entonación de su voz. Por esta razón, la docente busca orientarlos en el uso de estos recursos expresivos. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Comentar a los estudiantes que hacer contacto visual, cambiar la entonación de su voz o emplear gestos en la presentación del texto oral pueden ayudar a llamar la atención del público que los está escuchando. Luego, pedir que vuelvan a practicar su presentación y señalar qué pasajes del texto oral necesitan el uso de esos recursos.","B":"Mostrar a los estudiantes un video de un expositor que cambia la entonación de su voz, hace contacto visual y usa gestos para presentar las ideas de su texto oral, y preguntar si el uso de esos recursos ayuda a enfatizar las ideas claves de ese texto. Luego, pedir que indiquen qué información que van a exponer requeriría usar esos recursos.","C":"Entregar a los estudiantes una lista de cotejo con diversas preguntas orientadas a evaluar el uso de recursos no verbales y paraverbales en textos orales. Luego, pedir que utilicen dicha lista en la presentación de cada una de sus intervenciones, de manera que determinen qué compañeros del equipo han empleado o no esos recursos."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque muestra un modelo real (un expositor que usa gestos, mirada y entonación), hace reflexionar sobre para qué sirven esos recursos y pide aplicarlos a su propia información.","La A parece correcta porque explica los recursos y hace practicar, pero la docente solo “comenta” y luego ella misma señala los pasajes. Los estudiantes no reflexionan ni deciden por su cuenta.","Regla: la mejor acción para enseñar un recurso combina modelo, reflexión sobre su función y transferencia al propio texto. Desconfía de opciones donde el docente solo dice o solo evalúa."],"aprende_mas":[{"q":"¿Qué son los recursos no verbales y paraverbales?","a":"- **No verbales**: gestos, mirada, postura, movimiento del cuerpo.\n- **Paraverbales**: volumen, entonación, ritmo, pausas de la voz.\nAcompañan las palabras y ayudan a enfatizar ideas y mantener la atención del público."},{"q":"¿Qué es el modelado en una sesión de clase?","a":"Es mostrar a los estudiantes cómo se hace algo, con un ejemplo concreto, antes de que lo hagan ellos. Puede ser el docente o un video. Lo importante es que después analicen qué hizo el modelo y por qué funcionó."},{"q":"¿Por qué la lista de cotejo de la C no responde a la pregunta?","a":"Porque la lista de cotejo sirve para evaluar si un recurso se usó o no, pero no enseña cómo ni para qué usarlo. Aquí la docente quiere orientar, es decir, ayudar a aprender antes de evaluar."}],"duda":false},"2025-F1-55":{"n":55,"year":2025,"ctx":"2025-F1-c17","stem":"Los estudiantes están compartiendo sus comentarios sobre el cuento. ¿Cuál de las siguientes intervenciones de los estudiantes se centra en la obtención de información explícita de dicho cuento?","options":{"A":"“Por lo que dice en el cuento, a la abeja le gustaba más la apariencia de los otros animales que la suya”.","B":"“Por lo que dice en el cuento, un alebrije es como un animal fantástico: con alas de mariposa y la belleza de un gato”.","C":"“Por lo que dice en el cuento, el hada encontró al dragón, al gato y a la mariposa al recorrer el mismo camino que la abeja”."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque repite lo que el cuento dice literalmente: el hada “tomó el camino recorrido por la abeja” y “al poco tiempo, se encontró al dragón… al gato… y a la mariposa”. Es información explícita.","La A parece explícita porque empieza con “por lo que dice el cuento”, pero el texto nunca afirma que a la abeja le gustara más la apariencia ajena; eso se deduce de sus deseos. Es una inferencia.","Regla: para reconocer información explícita, busca si la idea está escrita casi igual en el texto. Si el estudiante tuvo que juntar pistas o sacar una conclusión, es inferencia."],"aprende_mas":[{"q":"¿Qué diferencia hay entre información explícita e implícita?","a":"- **Explícita**: está escrita en el texto; se puede señalar con el dedo.\n- **Implícita**: no está escrita, pero se deduce de pistas.\nEjemplo: “la abeja continuó su camino, triste” es explícito; “la abeja no se valoraba” es implícito."},{"q":"¿Qué es una inferencia?","a":"Es una conclusión que el lector saca uniendo lo que dice el texto con lo que ya sabe. Por ejemplo, si la abeja desea ser dragón, gato y mariposa, inferimos que no estaba conforme consigo misma. El texto no lo dice, pero lo sugiere."},{"q":"¿Por qué la B tampoco es explícita?","a":"Porque el cuento no define qué es un alebrije; solo dice que la abeja se transformó y que el hada la llamó así. El estudiante arma su propia definición a partir de la transformación, y además mezcla rasgos (el cuento menciona el tamaño del dragón, no del gato)."}],"duda":false},"2025-F1-56":{"n":56,"year":2025,"ctx":"2025-F1-c17","stem":"La docente realiza diversas preguntas a los estudiantes para favorecer su comprensión del texto. ¿Cuál de las siguientes preguntas es adecuada para promover que los estudiantes reflexionen sobre los aspectos formales del cuento?","options":{"A":"Al final de la historia, ¿qué sensaciones habrá experimentado la abeja cuando se pregunta en qué animal la habrá convertido el hada?","B":"En el momento en que el hada se encuentra con la abeja por primera vez, ¿por qué creen que, al ver su rostro, el hada le pregunta qué le pasa?","C":"Considerando las intervenciones de la abeja y del hada, ¿qué diferencias puede haber en la historia si se presentaran los diálogos con guiones?"},"answer":"C","tema":"Literatura","explicacion":["La C es correcta porque pregunta por cómo está escrito el cuento: qué cambiaría si los diálogos se presentaran con guiones. Eso es reflexionar sobre la forma (estilo directo o indirecto), no sobre lo que pasa.","La B parece adecuada porque invita a pensar, pero pregunta por qué el hada actúa así; es una inferencia sobre el contenido de la historia, no sobre su forma.","Regla: “aspectos formales” se refiere a la estructura, los recursos y la manera de presentar el texto (narrador, diálogos, puntuación, orden). Si la pregunta trata de personajes o emociones, es contenido."],"aprende_mas":[{"q":"¿Qué significa reflexionar sobre la forma y el contenido de un texto?","a":"- **Contenido**: qué se cuenta (hechos, personajes, emociones, mensajes).\n- **Forma**: cómo se cuenta (tipo de narrador, diálogos, estructura, recursos, puntuación).\nEl CNEB pide que el estudiante reflexione y evalúe ambos."},{"q":"¿Qué es el estilo directo e indirecto en un cuento?","a":"- **Directo**: el personaje habla con sus propias palabras, con guiones o comillas (—¿Qué te pasa? —preguntó el hada).\n- **Indirecto**: el narrador cuenta lo que dijo (el hada le preguntó qué le pasaba).\nEl directo da más vida y cercanía a los personajes."},{"q":"¿Qué otras preguntas sobre la forma podría hacer la docente?","a":"- ¿Quién cuenta la historia y cómo cambiaría si la contara la abeja?\n- ¿Por qué la autora repite “continuó su camino”?\n- ¿Qué efecto tiene que el final revele la palabra “alebrije”?"}],"duda":false},"2025-F1-57":{"n":57,"year":2025,"stem":"Los estudiantes de primer grado, organizados en equipos y orientados por la docente, van a participar en una asamblea en la IE para ofrecer medidas de prevención ante los sismos. Para participar en dicha asamblea, elaborarán textos orales dirigidos a la comunidad educativa. Con el fin de contribuir al proceso de planificación de los textos, la docente busca recoger los saberes previos de los estudiantes acerca del aporte de que se escuchen activamente para trabajar en equipo. En este contexto, ella les pide que realicen comentarios sobre ello. ¿Qué estudiante da evidencias de una idea inadecuada sobre la escucha activa para el trabajo en equipo?","options":{"A":"Anaí dice: “En el diálogo que tengamos los equipos, quienes escuchan pueden hacer preguntas sobre lo que se está tratando para que comprueben si están entendiendo el tema o no”.","B":"Bartolomé dice: “En la conversación de los equipos, los que escuchan deben evitar realizar cualquier tipo de comentario para mostrar respeto a quien está hablando sobre el tema”.","C":"Casimiro dice: “En las discusiones de los equipos, las personas que escuchan podrían expresar mediante ciertos gestos que siguen el hilo del tema del cual se está conversando”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la idea inadecuada: Bartolomé dice que quien escucha debe “evitar realizar cualquier tipo de comentario”. La escucha activa no es silencio pasivo; implica responder, preguntar y mostrar comprensión.","La C puede parecer inadecuada porque hablar de gestos suena a distracción, pero asentir o mostrar atención con el cuerpo es parte de la escucha activa: indica que se sigue el hilo de la conversación.","Regla: la escucha activa siempre incluye participación (preguntas, gestos, comentarios pertinentes). Si una opción reduce la escucha a callar por respeto, es la concepción equivocada."],"aprende_mas":[{"q":"¿Qué es la escucha activa?","a":"Es escuchar con atención y demostrarlo: mirar a quien habla, asentir, hacer preguntas para comprobar que se entendió y comentar a partir de lo dicho. No es solo quedarse callado, sino participar para construir juntos el diálogo."},{"q":"¿Qué acciones muestran escucha activa en un trabajo en equipo?","a":"- **Preguntar**: “¿Te refieres a la salida por la escalera?”\n- **Parafrasear**: “O sea, propones reunirnos en el patio”.\n- **Gestos**: asentir, mirar a quien habla.\n- **Esperar el turno**: no interrumpir, pero sí intervenir después."},{"q":"¿Por qué la docente recoge saberes previos antes de planificar?","a":"Para saber qué ideas traen los estudiantes, aun las equivocadas, y partir de ellas. Si detecta que alguien cree que escuchar es solo callar, puede trabajar ese error antes de que los equipos dialoguen."}],"duda":false},"2025-F1-58":{"n":58,"year":2025,"ctx":"2025-F1-c18","stem":"Un equipo de estudiantes elaboró un tríptico cuyo propósito es presentar los pasos para encontrar comunidades de hobbies (pasatiempos) a través de las redes sociales. Los integrantes del equipo solicitan al docente que revise la primera versión de su escrito para saber qué aspectos deben mejorar. A continuación, se presenta un fragmento de dicho texto:\n\n¡Sé parte de comunidades de hobbies!\n\nAprovechar las redes sociales para hacer conección y conversar con gente de todo el mundo, sobre todo, compartiendo nuestros hobbies. Para eso, las comunidades o grupos en las redes. Hablar de nuestros hobbies en internet es peligroso y no se debe hacer. ¿Qué pasos seguir para hayar comunidades?\n\n• En TikTok, entrar a “bandeja de entrada”. Luego, clic en “crear un DM” y en “crear un\n\ngrupo de chat” con la gente que tenga nuestros mismos hobbies.\n\n• En Facebook, solo escribir la actividad de interés donde dice “buscar”. Luego, clic en\n\n“grupos” y en “ser miembro”.\n\n¿Qué se puede hacer en las comunidades de hobbies?\n\n• Hacer preguntas y responder a otros miembros.\n\n• Compartir información que interece al grupo.\n\nMucha gente pierde horas revisando sus redes sociales. Por eso, mejor intentar conocer gente en persona que mediante internet.\n\nEl docente nota que hay varios aspectos del texto que los estudiantes pueden mejorar. ¿Qué problema de escritura debe priorizar en su retroalimentación?","options":{"A":"La escritura incorrecta de algunas palabras.","B":"La inclusión de ideas que se contradicen entre sí.","C":"La ausencia de verbos principales en varias oraciones."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es la prioridad: el tríptico invita a aprovechar las redes, pero luego dice que hablar de hobbies en internet “es peligroso y no se debe hacer” y que es “mejor conocer gente en persona”. Esto rompe la coherencia y el propósito.","La C parece importante porque hay oraciones sin verbo principal (“Para eso, las comunidades o grupos en las redes”), pero es un problema local de sintaxis; no impide entender el mensaje como sí lo hacen las contradicciones.","Regla: al retroalimentar, prioriza primero lo global (propósito, coherencia, ideas contradictorias) y luego lo local (ortografía, gramática). La ortografía casi nunca es la prioridad en estas preguntas."],"aprende_mas":[{"q":"¿Qué es la coherencia de un texto?","a":"Es que todas las ideas giren en torno a un mismo tema y propósito, sin contradecirse ni salirse del tema. En este tríptico, si el propósito es enseñar a encontrar comunidades en redes, no puede decir que eso es peligroso y que no se debe hacer."},{"q":"¿Qué son los problemas globales y locales de escritura?","a":"- **Globales**: afectan todo el texto (propósito, destinatario, coherencia, organización).\n- **Locales**: afectan palabras u oraciones (ortografía como “conección” o “hayar”, concordancia, puntuación).\nLos globales se atienden primero porque cambian el sentido del texto."},{"q":"¿Cómo podría retroalimentar el docente esta contradicción?","a":"Con preguntas que hagan pensar, sin dar la respuesta: “¿Qué quieren lograr con su tríptico?”, “¿Esta última idea ayuda a ese propósito o lo contradice?”. Así los estudiantes descubren el problema y deciden cómo corregirlo."}],"duda":false},"2025-F1-59":{"n":59,"year":2025,"ctx":"2025-F1-c18","stem":"Los integrantes de un equipo le muestran al docente la primera versión de su tríptico para que les brinde retroalimentación. A continuación, se muestra la introducción del texto:\n\nLas redes sociales y cómo aprovechar todas sus ventajas\n\nLas redes sociales se usan con diferentes objetivos. Tienen un gran alcance. Las redes sociales pueden servir para informarse. Los programas de noticias en televisión y los periódicos impresos solo llegan a cierto público. Mucha gente adulta las usa mayormente para leer noticias. Los adolescentes usan las redes sociales con varios propósitos. Hay adolescentes que se dedican a publicar sus videos de baile, canto, etc. Se hacen famosos en todo el mundo. Los adolescentes muestran sus talentos. Ganan muchos seguidores. Explicaremos cómo podemos aprovechar las redes sociales.\n\nLuego de revisar el texto, el docente busca orientar a los estudiantes en el uso de conectores lógicos para mejorar la cohesión de las ideas del tríptico. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Indicar a los estudiantes que expliquen qué relación lógica existe entre “los adolescentes muestran sus talentos” y “ganan muchos seguidores”. Luego, preguntar qué conectores pueden utilizar para evidenciar esa relación. Sobre esta base, pedir que relean las ideas de su tríptico y determinen las relaciones lógicas entre ellas con conectores diversos.","B":"Volver a leer el tríptico con los estudiantes, y proponer que unan la segunda y la tercera oración con el conector “por eso”. Luego, preguntar si la relación lógica entre dichas oraciones les parece más clara. Por último, entregar una lista con conectores con la finalidad de que evalúen en qué ideas creen que se requiere utilizarlos.","C":"Preguntar a los estudiantes cuál es la utilidad de emplear conectores lógicos en sus producciones escritas. Luego, conversar con ellos sobre qué ideas de su tríptico necesitan conectores para explicitar las relaciones lógicas entre ellas. A partir de esto, sugerir qué tipo de conectores podrían emplear en su escrito."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque parte de un caso concreto del propio texto (“muestran sus talentos” y “ganan muchos seguidores”), hace que los estudiantes descubran la relación lógica (causa-efecto) y luego transfieran ese análisis al resto del tríptico.","La C parece adecuada porque conversa sobre el texto, pero empieza con una pregunta general sobre la utilidad de los conectores y termina con la docente sugiriendo cuáles usar. Los estudiantes no analizan relaciones lógicas concretas.","Regla: para enseñar conectores, primero se identifica la relación lógica entre dos ideas reales del texto y después se elige el conector. Desconfía de opciones donde el docente da el conector o entrega listas sueltas."],"aprende_mas":[{"q":"¿Qué es la cohesión de un texto?","a":"Es la conexión entre las oraciones y párrafos para que el texto se lea de corrido y no como ideas sueltas. Se logra con conectores, pronombres y sinónimos. El tríptico de esta pregunta tiene muchas oraciones cortas sin unir."},{"q":"¿Qué relaciones lógicas expresan los conectores?","a":"- **Causa-efecto**: por eso, por lo tanto, en consecuencia.\n- **Adición**: además, también.\n- **Contraste**: sin embargo, pero, en cambio.\n- **Ejemplificación**: por ejemplo, como.\nEjemplo: “Los adolescentes muestran sus talentos y, por eso, ganan muchos seguidores”."},{"q":"¿Por qué la B no es la mejor opción?","a":"Porque el docente decide el conector (“por eso”) en lugar de que los estudiantes razonen la relación. Además, la lista de conectores es un recurso descontextualizado: elegir de una lista no garantiza entender qué relación hay entre las ideas."}],"duda":false},"2025-F1-60":{"n":60,"year":2025,"ctx":"2025-F1-c18","stem":"Al iniciar la escritura de las segundas versiones de los trípticos, el docente plantea a los estudiantes las siguientes preguntas:\n\n1. ¿Han reconocido problemas de escritura difíciles de superar al escribir la primera\n\nversión de sus textos?\n\n2. ¿Cuáles fueron las acciones que tuvieron que realizar para superar dichos problemas? 3. ¿Qué acciones han realizado para ayudar a los compañeros que tenían mayores\n\nproblemas al escribir?\n\n¿Por qué las preguntas promueven que los estudiantes desarrollen procesos metacognitivos?","options":{"A":"Porque las preguntas son planteadas después de que los estudiantes han terminado de escribir las primeras versiones de sus textos.","B":"Porque las preguntas buscan que los estudiantes mencionen las estrategias empleadas en la escritura de las primeras versiones de sus textos.","C":"Porque las preguntas propician que los estudiantes conozcan los problemas de escritura que suelen surgir cuando escriben las primeras versiones de sus textos."},"answer":"B","tema":"Planificación y procesos pedagógicos","explicacion":["La B es correcta porque las preguntas piden recordar qué problemas tuvieron y qué acciones realizaron para superarlos. Reflexionar sobre las propias estrategias es la esencia de la metacognición.","La C parece correcta porque menciona los problemas de escritura, pero habla de conocer los problemas que “suelen surgir” en general. La metacognición no es saber de problemas comunes, sino reflexionar sobre el propio proceso.","Regla: una pregunta es metacognitiva si hace que el estudiante piense en cómo aprendió o cómo resolvió algo (sus estrategias). El momento en que se pregunta, como dice la A, no la vuelve metacognitiva."],"aprende_mas":[{"q":"¿Qué es la metacognición?","a":"Es “pensar sobre cómo pienso y aprendo”. El estudiante se da cuenta de qué le costó, qué hizo para resolverlo y qué haría diferente. Ejemplo: “Me costó ordenar las ideas, así que primero hice un esquema y eso me ayudó”."},{"q":"¿Qué preguntas metacognitivas puede usar en clase?","a":"- ¿Qué fue lo más difícil y por qué?\n- ¿Qué hiciste para superarlo?\n- ¿Qué estrategia te funcionó mejor?\n- ¿Qué harías diferente la próxima vez?"},{"q":"¿En qué momento de la sesión conviene promover la metacognición?","a":"Puede hacerse en cualquier momento, aunque suele darse al cierre o entre versiones de un texto, como aquí. Lo importante no es el momento sino que la pregunta lleve al estudiante a revisar su propio proceso y regularlo."}],"duda":false},"2024-F1-01":{"n":1,"year":2024,"ctx":"2024-F1-c1","stem":"Durante el proceso de planificación, el docente nota que los estudiantes tienen dudas sobre la finalidad de utilizar fuentes en la producción de sus textos. Ante esto, el docente busca recoger sus comentarios acerca de este aspecto. ¿Cuál de los siguientes estudiantes ofrece una idea adecuada sobre el uso de las fuentes de información en la producción de textos?","options":{"A":"Anselmo dice: “Cuando planificamos un texto escrito, tenemos que seleccionar solo las fuentes más recientes sobre el tema. Esto garantizará que nuestro texto ofrezca información confiable”.","B":"Berenice dice: “Para saber más acerca de un tema, es necesario que usemos fuentes. Para darle sustento a lo que vamos a escribir, debemos basarnos siempre en la información que estas ofrecen”.","C":"Claudia dice: “Consultamos fuentes para enterarnos de lo que se ha escrito sobre un tema. Así, nuestro texto estará constituido únicamente por las citas elaboradas a partir de la información de las fuentes”."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque presenta las fuentes con su doble finalidad: ampliar lo que sabemos del tema (“saber más”) y “darle sustento” a lo que escribimos, de modo que nuestras ideas se apoyen en información verificable.","La C parece correcta porque también habla de consultar fuentes, pero falla al decir que el texto estará hecho “únicamente por citas”: así el estudiante no elabora ideas propias, solo copia y pega lo que otros dijeron.","Pista: desconfía de las alternativas con palabras absolutas como “solo”, “únicamente” o “las más recientes”. Las fuentes sirven para informarse y fundamentar, no para reemplazar la voz del autor."],"aprende_mas":[{"q":"¿Una fuente reciente es siempre una fuente confiable?","a":"No. Lo que hace confiable a una fuente es quién la escribe, dónde se publica y si presenta evidencias. Un post de ayer en una red social puede ser menos confiable que un libro de hace diez años escrito por un especialista. La fecha importa, pero no decide sola."},{"q":"¿Qué criterios puede usar un es
