tro tipo de texto (como la A)."],"aprende_mas":[{"q":"¿Qué es una semblanza?","a":"Es un texto breve que presenta a una persona destacando su vida, su formación y sus logros, con un tono de reconocimiento. No es una biografía completa: selecciona lo más relevante según el propósito. Por ejemplo, la semblanza de una científica resalta sus estudios y aportes."},{"q":"¿Qué es un texto modelo y para qué sirve?","a":"Es un ejemplo real del género que los estudiantes van a producir. Al leerlo y analizarlo, descubren su estructura, el tipo de información y el lenguaje que usa. Así escriben con una referencia concreta, no a ciegas."},{"q":"¿Cuáles son los momentos de la escritura según el enfoque comunicativo?","a":"- **Planificación**: definir propósito, destinatario, género y qué información incluir.\n- **Textualización**: escribir la primera versión.\n- **Revisión**: leer, evaluar y mejorar el texto antes de publicarlo.\nEsta pregunta corresponde a la planificación."}],"duda":false},"2025-F1-07":{"n":7,"year":2025,"ctx":"2025-F1-c2","stem":"Un equipo de estudiantes ha escrito la primera versión de su semblanza sobre la ingeniera pesquera Sara Purca Cuicapusa, cuyas investigaciones se centran en la contaminación por microplásticos del ecosistema marino. El equipo le entrega dicha versión a la docente para recibir su retroalimentación. A continuación, se presenta un fragmento del texto:\n\nLa contaminación es un problema que nos afecta hoy y también afectará a las generaciones futuras. Sin embargo, son pocas las personas que enfrentan ese problema. Este es el caso de la científica peruana Sara Purca Cuicapusa.\n\nSu trayectoria es relevante para la ciencia en nuestro país. Al inicio, tenía intereses científicos diferentes. Hoy estudia el mar peruano y los residuos que hay en él. Sara Purca inició sus estudios en 1992. En 2018, obtuvo un premio por una investigación que fue esencial. Varios de sus estudios muestran resultados alarmantes sobre el mar. El compromiso con el ambiente que muestra Sara Purca y su dedicación a la investigación tienen varios ejemplos.\n\nSin duda, su trabajo impulsa a que más mujeres peruanas se dediquen a la ciencia.\n\nLa docente nota que varias ideas del texto carecen de desarrollo. Por ello, busca que los estudiantes mejoren este aspecto de su semblanza. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"La docente solicita a los estudiantes que, sobre la base de fuentes diversas, mencionen cuál es el aporte de la labor científica de Sara Purca. Después, pregunta qué información creen que podrían añadir a su texto para visibilizar la relevancia de dicha labor.","B":"La docente pregunta a los estudiantes qué carrera profesional estudió Sara Purca y qué institución le otorgó el premio por su investigación. Después, propone que busquen y seleccionen fuentes confiables que les permitan profundizar en esa información.","C":"La docente ofrece a los estudiantes varias fuentes con información relevante sobre Sara Purca, las cuales contribuirían a que el lector se interese por la semblanza. Luego, solicita que lleguen a un consenso para determinar en qué párrafo deberían incluir dicha información."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque lleva a los estudiantes a identificar, con base en fuentes, el aporte científico de Sara Purca y a decidir qué añadir para visibilizar su relevancia. Así desarrollan las ideas vagas en función del propósito de la semblanza.","La B parece correcta porque también lleva a buscar fuentes, pero se limita a dos datos puntuales (carrera e institución del premio) elegidos por la docente. No ayuda a desarrollar las ideas generales ni a conectarlas con el propósito.","Si el problema es «falta de desarrollo de ideas», busca la opción que haga ampliar con información relevante y ligada al propósito. La C, en cambio, se centra en dónde ubicar la información, no en desarrollarla."],"aprende_mas":[{"q":"¿Qué significa que una idea carece de desarrollo?","a":"Que se menciona pero no se explica ni se sustenta. En el texto: «obtuvo un premio por una investigación que fue esencial». No dice qué premio, qué investigó ni por qué fue esencial. Desarrollar es responder esas preguntas con datos, ejemplos o explicaciones."},{"q":"¿Qué es la progresión temática?","a":"Es cómo avanza un texto agregando información nueva sobre el tema, sin repetirse ni dar saltos. Cada oración debe aportar algo y conectarse con lo anterior. Si un texto enumera ideas sueltas sin ampliarlas, su progresión es pobre."},{"q":"¿Cómo retroalimentar la escritura sin dar la respuesta?","a":"Con preguntas que hagan pensar al estudiante sobre su propio texto: «¿Qué investigó exactamente Sara Purca?», «¿Qué necesita saber el lector para entender por qué es importante?». Así el estudiante descubre qué le falta y lo mejora él mismo."}],"duda":false},"2025-F1-08":{"n":8,"year":2025,"ctx":"2025-F1-c2","stem":"Un equipo ha escrito la primera versión de una semblanza sobre la ingeniera astronáutica Aracely Quispe Neira. Los miembros del equipo le han pedido a la docente que revise el párrafo introductorio de su texto, el cual se presenta a continuación:\n\nAracely Quispe Neira es de Marripón, una pequeña localidad del norte del país, es decir, de Lambayeque, que tiene una gran tradición histórica. Su madre, Irma Neira, es profesora. Aracely cuenta que, desde que vio la misión Apolo 11 en la televisión, cuando era una niña de 6 años, soñó con trabajar en la NASA. Luego, durante su etapa escolar, practicó karate gracias a una beca. En poco tiempo, obtuvo el cinturón negro. Antes de dedicarse a la ciencia, representó a Perú en competencias de karate en Estados Unidos y Sudamérica. Es decir, es una persona perseverante. El karate es una de las artes marciales que se enfoca más en la técnica y en realizar movimientos con precisión que en la fuerza. Por ello, en esta semblanza, conoceremos más sobre la ingeniera astronáutica Aracely Quispe.\n\nLa docente revisa el texto y nota diversos aspectos que se pueden mejorar. Por ello, busca ofrecer a los estudiantes una orientación que los ayude a identificar el problema principal del párrafo. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"¿Qué aspectos de la vida de la ingeniera Aracely los llevaron a elegirla para su semblanza? ¿Qué información del párrafo da cuenta de dichos aspectos? ¿Creen que al leer la introducción se deja claro que, en los párrafos siguientes, se desarrollarán aspectos específicos de las cualidades científicas de Aracely?","B":"¿Cuál es el propósito de escribir una introducción en un texto? ¿Podrían leer en voz alta el párrafo presentado, haciendo pausas en cada una de las ideas para que reconozcan si aportan o no al propósito de su introducción sobre la vida de Aracely como científica? ¿No sería mejor cambiar, en el texto, las ideas sobre el karate?","C":"¿Podrían ofrecer ejemplos en los que se use el conector “es decir”? ¿Recuerdan que dicho conector se utiliza entre dos ideas, en donde la segunda esclarece o explica con detalles la primera? ¿Consideran que “es decir” y otros conectores de su párrafo de introducción sobre la ingeniera Aracely fueron usados correctamente?"},"answer":"A","tema":"Evaluación y retroalimentación","explicacion":["La A es correcta: sus preguntas llevan a recordar por qué eligieron a Aracely, revisar qué información del párrafo lo muestra y notar si la introducción anuncia su faceta científica. Así descubren el problema principal: el párrafo se desvía del propósito.","La B parece correcta porque también apunta a la relevancia de las ideas, pero cierra con «¿No sería mejor cambiar, en el texto, las ideas sobre el karate?». Esa pregunta entrega la solución en vez de ayudar a identificar el problema.","Regla: la retroalimentación reflexiva usa preguntas abiertas que hacen pensar y no da la respuesta. Además, apunta al problema principal (coherencia con el propósito), no a uno secundario como los conectores de la C."],"aprende_mas":[{"q":"¿Qué tipos de retroalimentación reconoce el Minedu?","a":"- **Elemental**: solo dice si está bien o mal.\n- **Descriptiva**: describe qué logró y qué le falta, con criterios concretos.\n- **Por descubrimiento o reflexiva**: con preguntas, guía al estudiante para que encuentre el problema y cómo mejorarlo.\nEn el examen, la reflexiva suele ser la más valorada."},{"q":"¿Cuál era el problema principal del párrafo sobre Aracely?","a":"Que tiene mucha información que no se relaciona con el propósito: presentarla como científica. Datos como la técnica del karate o la profesión de su madre desvían al lector. Un problema de coherencia pesa más que un conector mal usado."},{"q":"¿Cómo reconozco una pregunta que induce la respuesta?","a":"Suele empezar con «¿No sería mejor…?» o «¿No crees que…?» y ya trae la solución dentro. El estudiante solo tiene que decir sí. Una pregunta abierta, como «¿Qué información ayuda a tu propósito?», lo obliga a pensar."}],"duda":false},"2025-F1-09":{"n":9,"year":2025,"ctx":"2025-F1-c3","stem":"El psicólogo de la IE ofreció una charla sobre el proyecto de vida. Esta es la transcripción de un fragmento de su exposición:\n\n“Estamos acostumbrados a pensar que responder a nuestra vocación es solamente buscar aquello que nos gustaría y que podríamos hacer durante toda nuestra vida. Sin embargo, atender ese llamado implica idear un proyecto de vida. Plantear este proyecto requiere tomar en cuenta diversos aspectos. Estos pueden ser internos, o sea, que se relacionan con ustedes mismos, como su personalidad, sus aptitudes y valores. Eh… y también intervienen aspectos externos, que son cosas que deben considerar, pero que no dependen de ustedes, por ejemplo, el mercado laboral y los factores socioculturales relacionados con las carreras. Eh… hasta aquí, ¿algún comentario o pregunta?”.\n\nTres estudiantes realizan comentarios. ¿Cuál de los comentarios se centra en la obtención de información explícita del texto oral?","options":{"A":"“La expresión ‘atender ese llamado’ se está usando para decir ‘responder a nuestra vocación’. Ambas expresiones se han utilizado con el fin de brindarnos una misma idea”.","B":"“Solemos considerar solo lo que nos gusta para planear nuestro futuro después del colegio. Por lo que escuché, entiendo que tenemos que pensarlo como un proyecto de vida”.","C":"“No se pueden controlar todos los aspectos relacionados con nuestra vocación. Pero saber cuáles son es muy necesario; por ejemplo, uno de esos aspectos es la demanda que tiene cada profesión”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque reformula lo que el psicólogo dijo literalmente: que solemos ver la vocación solo como lo que nos gusta y que hay que idear un proyecto de vida. Parafrasear lo dicho es obtener información explícita.","La A parece correcta porque ambas expresiones aparecen en la charla, pero explicar que «atender ese llamado» equivale a «responder a nuestra vocación» es deducir el significado de una expresión por el contexto. Eso es inferencia.","Regla: si el comentario repite o parafrasea lo dicho, es explícito. Si relaciona expresiones, interpreta significados o añade algo no dicho (como «demanda» en la C, a partir de «mercado laboral»), es inferencia."],"aprende_mas":[{"q":"¿Qué es información explícita?","a":"Es la que aparece dicha o escrita directamente en el texto. El estudiante la localiza o la repite con sus propias palabras (parafrasea). Ejemplo: si el texto dice «el perro era negro», decir «el perro tenía el pelaje oscuro» sigue siendo información explícita."},{"q":"¿Qué es una inferencia?","a":"Es una conclusión que el lector u oyente saca uniendo lo que dice el texto con lo que ya sabe. La información no está dicha, pero se puede deducir. Ejemplo: «Llegó empapado y cerró el paraguas» permite inferir que estaba lloviendo."},{"q":"¿Qué capacidades tiene la competencia oral del CNEB?","a":"La competencia «Se comunica oralmente en su lengua materna» tiene seis capacidades. Las que más se evalúan en comprensión son:\n- **Obtiene información** del texto oral: lo explícito.\n- **Infiere e interpreta** información: lo que se deduce.\n- **Reflexiona y evalúa** la forma, el contenido y el contexto del texto oral."}],"duda":false},"2025-F1-10":{"n":10,"year":2025,"ctx":"2025-F1-c3","stem":"En otro momento, una lingüista invitada por la IE ofrece una charla sobre las carreras de humanidades. Esta es una transcripción de un fragmento de la charla:\n\n“Las carreras de humanidades son varias. Tenemos Literatura, Lingüística, Filosofía, Historia, entre otras. Varias universidades tienen una facultad con esas carreras. Si quieren saber sobre las oportunidades laborales luego de estudiar alguna de esas carreras, les puedo comentar mi experiencia. Como lingüista, me dedico a la investigación de lenguas originarias, con lo cual promuevo su conservación. Eh… también, soy docente de educación superior y he trabajado como profesora de escuelas públicas. Considero, con base en mi experiencia, que… este… por el tipo de trabajo que desempeñamos luego de terminar la carrera, hace falta tener ciertas características; por ejemplo, ayuda que nos interese mucho saber qué es el lenguaje y cómo es la comunicación humana. Además, creo que se puede contribuir a fortalecer la identidad peruana por medio de nuestro trabajo. Me refiero a valorar no solo las lenguas en sí, sino todas sus variedades: la del hogar, la de la escuela, la variedad usada con amigos. Por eso, estudiar la carrera de Lingüística puede ser satisfactorio. No sé si tienen algún comentario sobre lo que acabo de decir”.\n\nTres estudiantes realizan comentarios sobre la información recibida. ¿Cuál de los comentarios se centra en una deducción de información del texto oral?","options":{"A":"“Por lo que usted dice, estoy casi seguro de que estudiaré una carrera de humanidades, quizás Literatura o Historia. Pero no sé en qué universidad, porque varias tienen esas carreras”.","B":"“Me sorprende que usted haya trabajado como profesora en una escuela pública como la nuestra. Me interesa conocer su experiencia siendo docente, porque enseñar me gusta bastante”.","C":"“Usted realiza investigaciones sobre las lenguas originarias, o sea, los idiomas que son propios del país. Ese tipo de trabajo nos puede ayudar a reconocer la diversidad cultural que hay en el Perú”."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque relaciona dos ideas de la charla, investigar lenguas originarias y fortalecer la identidad peruana, y concluye algo no dicho: que ese trabajo ayuda a reconocer la diversidad cultural del Perú. Eso es deducir.","La A parece correcta porque empieza con «Por lo que usted dice», pero luego expresa una decisión personal (estudiar Literatura o Historia) y repite un dato explícito: varias universidades tienen esas carreras. No deduce nada del texto.","Regla: una deducción conecta información del texto para llegar a una idea nueva sobre lo dicho. Una opinión, una reacción emocional (como la B) o un plan personal no son deducciones, aunque partan de la charla."],"aprende_mas":[{"q":"¿Qué diferencia hay entre deducir y opinar?","a":"- **Deducir**: sacar una conclusión apoyada en el texto; otro oyente podría llegar a lo mismo.\n- **Opinar**: dar una postura o un gusto personal; depende de quién habla.\nEjemplo: «La expositora valora las lenguas del Perú» es deducción; «Me encantaría ser lingüista» es opinión."},{"q":"¿Qué tipos de inferencias se trabajan en comprensión?","a":"- **Características**: deducir cómo son personas, objetos o lugares.\n- **Relaciones**: causa-efecto, semejanza o problema-solución.\n- **Significados**: de palabras o expresiones según el contexto.\n- **Sentido global**: deducir el tema, la idea principal o el propósito del texto."},{"q":"¿Cómo practicar inferencias orales con los estudiantes?","a":"Después de escuchar un audio o una exposición, pregunta cosas que no se dijeron pero se pueden deducir: «¿Qué valora la expositora?», «¿Por qué crees que lo menciona?». Pide siempre que justifiquen con lo que escucharon. Así se distingue la inferencia de la simple opinión."}],"duda":false},"2025-F1-11":{"n":11,"year":2025,"stem":"Los estudiantes de segundo grado han notado que la plaza de la localidad tiene la basura acumulada fuera de los tachos. Ellos le comentan al docente que desean ayudar a combatir dicho problema. En este contexto, le solicitan que los oriente en la elaboración de afiches o carteles que busquen concientizar a los vecinos sobre el cuidado de dicho espacio público. Una estudiante ha escrito la primera versión de su afiche que busca concientizar a la comunidad sobre el uso de los tachos de basura para mantener la plaza limpia. Ella comparte su texto con el docente para recibir su retroalimentación. A continuación, se presentan las ideas que la estudiante va a incluir en el afiche:\n\nSean conscientes: ¡usen el tacho!\n\n• ¡Dense cuenta de que la plaza está cada vez más sucia! Muestren que les interesan\n\ny ayuden. ¡Usen los tachos que hay!\n\n• No creo que les guste una plaza sucia, ¿no? ¿Por qué tiran la basura en el piso si no\n\nles gustan?\n\n• Si botan basura en la vía pública, demuestran un mal hábito. Los malos hábitos vienen\n\ndesde casa. El colegio también influye en esos hábitos. ¡Usen siempre los tachos!\n\n¡El cuidado de la plaza está en sus manos!\n\nLuego de revisarlas, el docente nota varios problemas en las ideas presentadas. ¿Cuál es el problema principal que se evidencia en dichas ideas?","options":{"A":"La falta de concordancia entre el sujeto y el verbo en algunas oraciones.","B":"El uso de verbos en imperativo y de los signos de exclamación.","C":"La inclusión de información alejada del tema central del afiche."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es la clave: todas las ideas abusan del imperativo y la exclamación (“¡Dense cuenta!”, “¡Usen los tachos!”) y crean un tono de reproche. Para concientizar a los vecinos, el afiche debe invitar y persuadir, no regañar.","La C parece correcta porque la frase sobre la casa y el colegio se desvía un poco, pero es una sola idea y sigue tratando hábitos de basura. El problema de tono, en cambio, atraviesa todo el texto.","Cuando pregunten por el “problema principal”, elige el que afecta a todo el texto y a su propósito, no un error puntual. La A (concordancia en “les interesan”) es real, pero es local y de forma."],"aprende_mas":[{"q":"¿Qué es la adecuación de un texto?","a":"Es ajustar el texto al propósito, al destinatario y a la situación. Un afiche para vecinos que busca concientizar necesita un registro respetuoso y cercano. Si el texto regaña o acusa, no está adecuado, aunque no tenga faltas."},{"q":"¿Usar imperativos en un afiche siempre está mal?","a":"No. El imperativo es típico del afiche (“Cuida tu plaza”). El problema aparece cuando se acumula con exclamaciones y reproches, y el mensaje se vuelve una orden molesta. La clave es dosificarlo y acompañarlo de razones o beneficios."},{"q":"¿Cómo retroalimentar a la estudiante en este caso?","a":"- **Pregunta por el destinatario**: “¿Cómo se sentirá un vecino al leer ‘Dense cuenta’?”.\n- **Muestra un modelo**: un afiche que invita en lugar de regañar.\n- **Pide una nueva versión**: que reescriba una idea con tono amable y compare ambas."}],"duda":true},"2025-F1-12":{"n":12,"year":2025,"stem":"En una IE, se está realizando un proyecto cuyo propósito es dar a conocer diversos casos representativos de liderazgo femenino. En este contexto, los estudiantes de cuarto grado, en equipos y orientados por la docente, presentarán algunos de estos casos en una mesa redonda que se llevará a cabo en el aula. Como parte de la preparación para la mesa redonda, los equipos están practicando sus textos orales en plenaria.\n\nUn equipo de estudiantes está practicando su texto oral que tiene como propósito revalorar el papel activo de María Parado de Bellido en la independencia peruana. Un integrante del equipo ha presentado su intervención y el resto de sus compañeros de clase le ofrecen diversos comentarios. ¿Cuál de los siguientes comentarios evidencia una reflexión sobre los aspectos formales del texto oral?","options":{"A":"“Creo que las dudas que te formulaste a ti mismo acerca de la vida de María Parado de Bellido, en varios momentos de la exposición, despertaron mi interés por querer saber sobre ella”.","B":"“Considero que las cualidades sobre el carácter de María Parado de Bellido que elegiste describir se quedan cortas para expresar el valor que le podemos atribuir a sus acciones”.","C":"“Pienso que las acciones de María Parado de Bellido representan ejemplos que se pueden seguir en cualquier época, debido a que ella es un símbolo de valentía y libertad”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es la clave: el compañero comenta un recurso del discurso, las preguntas que el expositor se hace a sí mismo (preguntas retóricas), y su efecto en el público. Eso es reflexionar sobre la forma del texto oral.","La B parece formal porque habla de lo que el expositor “eligió describir”, pero en realidad juzga si esas cualidades bastan para valorar a María Parado: es una evaluación del contenido, no de cómo se dijo.","Regla: forma = cómo se dice (recursos, organización, voz, gestos, conectores); contenido = qué se dice (ideas, datos, valoración del personaje). La C es solo una opinión sobre el personaje."],"aprende_mas":[{"q":"¿Qué aspectos formales se evalúan en un texto oral?","a":"- **Recursos verbales**: vocabulario, conectores, preguntas retóricas, ejemplos.\n- **Recursos paraverbales**: volumen, entonación, pausas, ritmo.\n- **Recursos no verbales**: gestos, mirada, postura.\n- **Organización**: inicio, desarrollo y cierre claros."},{"q":"¿Qué es una pregunta retórica?","a":"Es una pregunta que el hablante plantea sin esperar respuesta, para despertar interés o guiar la reflexión del público. Por ejemplo: “¿Qué habrían hecho ustedes en el lugar de María Parado?”. Es una estrategia discursiva, por eso cuenta como aspecto formal."},{"q":"¿Qué capacidad del CNEB se trabaja con estos comentarios?","a":"La capacidad “Reflexiona y evalúa la forma, el contenido y contexto del texto oral”, de la competencia Se comunica oralmente. Cuando los compañeros comentan la exposición, ejercitan esta capacidad y a la vez hacen coevaluación."}],"duda":false},"2025-F1-13":{"n":13,"year":2025,"stem":"Un grupo de docentes dialoga sobre las posibilidades que ofrece la literatura como práctica social. De dicho diálogo, se han extraído las intervenciones de tres docentes. ¿Cuál de los siguientes comentarios de los docentes evidencia características de la literatura entendida como práctica social?","options":{"A":"“Creo que leer textos literarios puede permitir que los estudiantes entiendan a otras personas o se pongan en su lugar. La literatura los ayuda a reconocer vivencias similares a las de ellos o vivencias desconocidas”.","B":"“Pienso que leer textos literarios puede enriquecer las experiencias de los estudiantes. La literatura es una expresión artística que tiene un valor cultural superior, como lo tienen también la música, el cine o la danza”.","C":"“A mi entender, leer textos literarios puede ampliar los conocimientos de los estudiantes sobre el lenguaje. La literatura favorece desarrollar un léxico amplio, con el cual podrían comunicarse de manera eficiente en situaciones diversas”."},"answer":"A","tema":"Literatura","explicacion":["La A es la clave: plantea que la literatura permite ponerse en el lugar de otros y reconocer vivencias propias o ajenas. Así la vincula con la vida, la identidad y la relación con los demás, que es su dimensión social.","La B atrae porque valora la literatura, pero la presenta como arte de “valor cultural superior”, una mirada elitista que la aleja de las prácticas de los estudiantes. La C la reduce a una herramienta para ampliar vocabulario.","Pista: “práctica social” = literatura que se vive, se comparte y conecta con experiencias, identidades y comunidades. Descarta las opciones que la ven como objeto superior o solo como instrumento lingüístico."],"aprende_mas":[{"q":"¿Qué significa ver la literatura como práctica social?","a":"Es entender que leer y escribir literatura son actividades que hacemos con otros y que se conectan con nuestra vida y cultura. Por ejemplo: un club de lectura, comentar un cuento en familia o escribir un relato sobre la propia comunidad."},{"q":"¿Cómo se lleva este enfoque al aula?","a":"- **Conectar con la vida**: preguntar qué personaje se parece a alguien que conocen.\n- **Leer diversidad**: incluir tradición oral, autores regionales y de otras culturas.\n- **Compartir**: tertulias literarias, recitales o reseñas grabadas por los estudiantes."},{"q":"¿Por qué es problemático hablar de “literatura superior”?","a":"Porque jerarquiza las obras y deja fuera relatos orales, canciones o textos populares que también tienen valor. Desde el enfoque intercultural, el CNEB promueve valorar diversas tradiciones literarias, no solo el canon."}],"duda":false},"2025-F1-14":{"n":14,"year":2025,"ctx":"2025-F1-c4","stem":"Antes de proyectar el video, la docente conversa con los estudiantes sobre las acciones que realizarán para favorecer su comprensión de la charla. Tres estudiantes intervienen. ¿Cuál de los estudiantes NO evidencia, en su comentario, una acción efectiva para promover su comprensión oral?","options":{"A":"Ademir dice: “Voy a grabar en audio la presentación de la neuróloga. Luego, en mi casa, voy a volver a escuchar la charla y escribiré en mi cuaderno lo que pude entender”.","B":"Basilio dice: “Yo tomaré apuntes en mi cuaderno de cada una de las palabras que la experta exponga. De otra manera, se me puede escapar alguna idea relevante”.","C":"Carla dice: “En mi cuaderno, voy a registrar, usando mis propios términos, las ideas que da la especialista. Me centraré en aquellas en donde usa su voz para hacer énfasis”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la clave porque NO es efectiva: anotar “cada una de las palabras” lleva a copiar sin procesar. Basilio se pierde transcribiendo y no selecciona ni jerarquiza ideas, que es lo que permite comprender.","La A puede parecer poco útil porque deja la comprensión para después, pero grabar y volver a escuchar sí ayuda: permite revisar la charla a su ritmo y anotar lo entendido. Es una acción válida.","En preguntas con NO, busca la acción que impide comprender. Escuchar bien es seleccionar ideas relevantes, parafrasear y atender pistas como el énfasis de la voz, como hace Carla en la C."],"aprende_mas":[{"q":"¿Qué estrategias ayudan a comprender un texto oral?","a":"- **Antes**: activar saberes previos y anticipar el tema.\n- **Durante**: tomar notas breves con palabras propias y atender énfasis y pausas.\n- **Después**: reconstruir las ideas principales y dialogar sobre ellas."},{"q":"¿Qué es parafrasear?","a":"Es decir con tus propias palabras lo que dijo otra persona, sin cambiar el sentido. Demuestra comprensión porque obliga a procesar la idea. Ejemplo: la neuróloga dice “se favorece la memoria”; el estudiante anota “dormir bien ayuda a recordar”."},{"q":"¿Por qué importan los recursos paraverbales al escuchar?","a":"El volumen, la entonación y las pausas del hablante señalan qué considera importante. Si la neuróloga sube la voz o hace una pausa antes de una idea, esa idea probablemente es clave. Enseñar a notarlo mejora la comprensión."}],"duda":false},"2025-F1-15":{"n":15,"year":2025,"ctx":"2025-F1-c4","stem":"La docente proyecta el video de la charla a los estudiantes. A continuación, se presenta la transcripción de un fragmento de la información que ofreció la neuróloga:\n\n“Es imprescindible que niños y adolescentes duerman las horas que necesitan según su edad. Mientras menos edad tienen los estudiantes, más horas de sueño necesitan para estar saludables. Eh… durante el sueño, se llevan a cabo una serie de procesos cerebrales que favorecen la memoria y el aprendizaje, así como la creatividad. En la fase profunda del sueño… este… se produce la combinación de pensamientos, que es cuando nuestra imaginación, recuerdos y experiencias se entrelazan de manera no lineal o lógica. Esto favorece… eh… la creación y generación de ideas nuevas durante la vigilia.\n\nLos efectos positivos del sueño en los estudiantes se ven claramente en la escuela. Por ejemplo… eh… pueden aprender más rápido, retener y usar lo aprendido. Además, dormir lo suficiente también beneficia la salud, en particular… este… el sistema inmunológico, que es el sistema que nos protege contra las enfermedades. Un buen sistema inmunológico nos hace estar más sanos.\n\nLo contrario, no tener suficientes horas de sueño puede producir problemas actitudinales y de salud. Por ejemplo, puede causar irritabilidad, dificultad para concentrarse… eh… hipertensión, dolor de cabeza y hasta depresión. Por eso, hay que generar condiciones para que los niños duerman bien: un ambiente ventilado, silencioso, cómodo, sin luces fuertes y, sobre todo, un espacio sin dispositivos electrónicos, como el televisor, celulares o tabletas…”.\n\nLa docente y los estudiantes dialogan acerca de la información escuchada. De dicho diálogo, se han extraído tres intervenciones. ¿Cuál de los siguientes comentarios de los estudiantes da evidencias de una posición crítica sobre la charla?","options":{"A":"“Es verdad que, cuando no duermes suficiente, es muy difícil aprender. Pero no sabía que dormir poco también puede afectar nuestra salud y enfermarnos”.","B":"“Le daré esta información a mi hermana que está en segundo de primaria. Pero espero que la tome en cuenta porque hace todo lo posible para dormir tarde”.","C":"“Quizá las horas suficientes de sueño sean de ayuda para aprender. Pero sería necesario que se hable de que, sumado a eso, también es vital nuestra motivación”."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es la clave: el estudiante relativiza lo dicho (“quizá”) y propone un factor que la charla omite, la motivación. Evaluar el contenido y señalar lo que falta es asumir una posición crítica.","La A atrae porque emite un juicio (“Es verdad que…”), pero solo confirma lo escuchado y añade lo que aprendió. Estar de acuerdo o descubrir un dato nuevo es comprensión, no evaluación crítica.","Regla: hay posición crítica cuando el estudiante cuestiona, matiza, contrasta o completa el texto con argumentos. La B solo aplica la información a su hermana, sin evaluarla."],"aprende_mas":[{"q":"¿Qué es una posición crítica frente a un texto?","a":"Es opinar sobre lo dicho evaluándolo: si es suficiente, si está bien sustentado, qué falta o con qué no estoy de acuerdo, y por qué. No significa hablar mal del texto, sino pensar sobre él con argumentos."},{"q":"¿Qué preguntas promueven la escucha crítica?","a":"- **Acuerdo**: ¿Estás de acuerdo con la experta? ¿Por qué?\n- **Vacíos**: ¿Qué faltó decir sobre este tema?\n- **Sustento**: ¿Dio pruebas suficientes de lo que afirma?\n- **Otras miradas**: ¿Qué diría alguien con otro punto de vista?"},{"q":"¿En qué se diferencia de la comprensión literal e inferencial?","a":"- **Literal**: recupero lo dicho (“dormir bien protege el sistema inmunológico”).\n- **Inferencial**: deduzco lo no dicho (“si duermo poco antes del examen, rendiré menos”).\n- **Crítico**: evalúo lo dicho (“faltó hablar de la motivación”)."}],"duda":false},"2025-F1-16":{"n":16,"year":2025,"ctx":"2025-F1-c5","stem":"El docente busca que los estudiantes deduzcan información implícita del texto. ¿Cuál de las siguientes preguntas es adecuada para ello?","options":{"A":"¿Qué obstáculo fue el menos grave de enfrentar para las mujeres que se movilizaban en bicicleta?","B":"¿Qué razones explican que la sociedad haya cambiado su perspectiva sobre las mujeres que usaban bicicleta?","C":"¿Qué opinión tienen sobre la afirmación de la feminista Susan Brownell acerca de las mujeres que montaban bicicleta?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es la clave: el texto no enumera “las razones del cambio”. El estudiante debe relacionar datos dispersos (clubes, publicidad, médicos, periodismo, avance de la emancipación) y deducir por qué cambió la mirada social.","La A parece inferencial, pero la respuesta está escrita en el texto: montar con vestidos pesados y corsés “se constituía como el menor de sus obstáculos”. Es una pregunta literal: solo exige ubicar.","Para reconocer una pregunta inferencial, pregúntate: ¿la respuesta está tal cual en el texto? Si sí, es literal. Si hay que relacionar ideas o completar lo no dicho, es inferencial. Pedir opinión, como la C, es reflexión."],"aprende_mas":[{"q":"¿Qué es una inferencia?","a":"Es deducir información que el texto no dice directamente, uniendo pistas del texto con lo que ya sabemos. Ejemplo: si el texto dice “llegó empapado y cerró el paraguas”, inferimos que llovía, aunque nunca se diga."},{"q":"¿Qué tipos de inferencia suelen aparecer en el examen?","a":"- **Causa-efecto**: por qué ocurrió algo.\n- **Significado por contexto**: qué quiere decir una palabra o expresión.\n- **Tema o idea principal**: cuando no está escrito en una frase.\n- **Propósito del autor**: para qué escribió o incluyó algo."},{"q":"¿Cómo distinguir los tres niveles de lectura?","a":"- **Literal**: ubicar lo dicho (“¿Qué recomendaron después los médicos?”).\n- **Inferencial**: deducir lo no dicho (“¿Por qué cambió la opinión de los médicos?”).\n- **Crítico**: opinar y evaluar (“¿Estás de acuerdo con Susan Brownell?”)."}],"duda":false},"2025-F1-17":{"n":17,"year":2025,"ctx":"2025-F1-c5","stem":"El docente busca que los estudiantes reflexionen sobre el contenido del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Solicitar que, a partir de la información ubicada en el penúltimo párrafo del texto, realicen un mapa mental que describa a la “nueva mujer”.","B":"Indicar que expliquen la intención de la autora al incluir las citas textuales que se encuentran en el primer y segundo párrafo del texto.","C":"Pedir que identifiquen las repercusiones sociales que, según el texto, comenzaron a surgir cuando las mujeres empezaban a movilizarse en bicicleta."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es la clave: explicar para qué la autora incluye las citas de Brownell y de la corresponsal obliga a analizar cómo el texto presenta dos posturas opuestas. Es tomar distancia y valorar las decisiones del texto, propio de la reflexión.","La C parece de reflexión porque habla de “repercusiones sociales”, pero pide identificarlas “según el texto”: es ubicar y recuperar información. La A también se queda en organizar lo leído en un mapa mental.","Reflexionar sobre un texto es valorarlo desde fuera: su intención, sus recursos, su validez. Si la acción solo pide encontrar, resumir u organizar información, no llega al nivel reflexivo."],"aprende_mas":[{"q":"¿Qué capacidades tiene la competencia lectora del CNEB?","a":"- **Obtiene información**: ubica datos explícitos.\n- **Infiere e interpreta**: deduce y construye el sentido del texto.\n- **Reflexiona y evalúa**: opina sobre la forma, el contenido y el contexto del texto."},{"q":"¿Qué significa reflexionar sobre el contenido de un texto?","a":"Es preguntarse si lo que dice el texto es válido, completo o intencionado, y explicar por qué. Por ejemplo: “¿Por qué la autora puso una cita a favor y otra en contra?”. Así el lector analiza cómo el texto construye su mensaje."},{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea que resume todo el texto, más allá de los detalles. Aquí sería: la bicicleta contribuyó a la emancipación de la mujer pese a los prejuicios de la época. Para hallarlo, pregúntate de qué trata todo el texto y qué quiere mostrar la autora."}],"duda":false},"2025-F1-18":{"n":18,"year":2025,"ctx":"2025-F1-c5","stem":"En otro momento, el docente busca que los estudiantes deduzcan información implícita del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que expliquen si, hoy en día, se puede afirmar que las mujeres que montan bicicleta causan una impresión abrumadora, como señala el texto.","B":"Pedir a los estudiantes que comenten por qué, de acuerdo con el texto, se menciona que las personas más entusiastas para montar bicicleta eran las mujeres.","C":"Pedir a los estudiantes que, a partir de la información del texto, identifiquen cuáles son los beneficios para la salud de las personas que montan bicicleta."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es la clave: el texto afirma que las mujeres eran las usuarias más entusiastas, pero no explica por qué. El estudiante debe deducirlo uniendo pistas: la bicicleta daba “independencia” y era “un trampolín” hacia otro mundo.","La C parece adecuada porque usa información del texto, pero los beneficios para la salud (articulaciones, sistema cardiovascular) están dichos literalmente: solo hay que ubicarlos. La A pide comparar con la actualidad: es reflexión.","Señal útil: “por qué, de acuerdo con el texto” suele llevar a inferir causas no explícitas; “identifiquen” suele indicar nivel literal. Confirma siempre si la respuesta está escrita tal cual."],"aprende_mas":[{"q":"¿Qué pistas del texto sirven para inferir?","a":"- **Conectores**: “sin embargo”, “por eso”, “así pues” muestran relaciones entre ideas.\n- **Metáforas**: “trampolín” sugiere un impulso hacia una vida nueva.\n- **Citas**: revelan las posturas y emociones de la época."},{"q":"¿Cómo formular una buena pregunta inferencial?","a":"Elige algo que el texto sugiere pero no dice, y pregunta por su causa, consecuencia o significado. Comprueba que la respuesta no se pueda copiar del texto. Ejemplo: “¿Qué quiso decir la autora con que la bicicleta era un ‘trampolín’?”."},{"q":"¿Por qué no bastan las preguntas literales?","a":"Las literales verifican que el estudiante ubicó datos, pero no que comprendió. Las inferenciales y críticas exigen relacionar, interpretar y valorar, que es lo que el CNEB espera en secundaria. Lo ideal es combinar los tres niveles."}],"duda":false},"2025-F1-19":{"n":19,"year":2025,"ctx":"2025-F1-c6","stem":"Un equipo de estudiantes ha elegido el delfín del Amazonas, que tiene un color rosa característico, para describirlo en un texto oral. Como parte de la planificación, los estudiantes están dialogando sobre los criterios utilizados para determinar la confiabilidad de las fuentes que han seleccionado. ¿Qué estudiante ha seleccionado una fuente basándose en un criterio adecuado de confiabilidad?","options":{"A":"Adela dice: “Elegí esta fuente porque la información sobre los delfines es bastante reciente. Según la fecha de publicación, la fuente es del año pasado”.","B":"Bea dice: “Elegí esta fuente porque fue la primera que salió en varios buscadores. Puse ‘color rosa de los delfines’ y, en muchos casos, salía esa misma fuente”.","C":"Carlos dice: “Elegí esta fuente porque la autora ha publicado estudios académicos sobre los delfines. Además, algunos de sus estudios están colgados en la web de una universidad\"."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es la clave: Carlos se fija en la autora, que tiene estudios académicos sobre delfines y respaldo de una universidad. La autoridad y especialización de quien escribe es un criterio central de confiabilidad.","La A atrae porque la fecha sí sirve para evaluar fuentes, pero mide actualidad, no confiabilidad: una fuente reciente puede ser un blog sin respaldo. La B confunde popularidad en buscadores con veracidad.","Para confiabilidad, pregunta: ¿quién lo escribe y qué respaldo tiene? Autor experto, institución seria, referencias y datos verificables pesan más que la fecha o el orden en Google."],"aprende_mas":[{"q":"¿Qué criterios sirven para saber si una fuente es confiable?","a":"- **Autoría**: quién escribe y si es especialista.\n- **Institución**: universidad, organismo oficial, revista científica.\n- **Respaldo**: cita fuentes y presenta datos verificables.\n- **Propósito**: busca informar, no vender ni manipular."},{"q":"¿En qué se diferencia confiabilidad de actualidad?","a":"La confiabilidad indica si la información es creíble por su origen. La actualidad indica si está vigente. Lo ideal es que una fuente cumpla ambas, pero una fecha reciente no garantiza que lo dicho sea cierto."},{"q":"¿Por qué enseñar a evaluar fuentes al preparar un texto oral?","a":"Porque en la planificación el estudiante selecciona la información que va a compartir. Si usa fuentes poco serias, transmitirá datos falsos a su público. Evaluar fuentes también desarrolla la competencia digital y una ciudadanía responsable."}],"duda":false},"2025-F1-20":{"n":20,"year":2025,"ctx":"2025-F1-c6","stem":"Un equipo de estudiantes está practicando su texto oral que tiene como propósito describir las características, alimentación, hábitat y comportamiento de los osos de anteojos. Dichos estudiantes le piden al docente que escuche su presentación. A continuación, se transcribe un fragmento con el que un integrante del equipo inició la descripción del oso:\n\n“Voy a hablar sobre el oso de anteojos y describir sus características. Es un animal ni muy grande ni muy pequeño. Alrededor de sus ojos, tiene manchas de color marrón o blanco. Por ello, se le llama ‘oso de anteojos’. Está en varias regiones… Y, en esos lugares, el oso tiene problemas y, por eso, la gente se encarga de estar con él y verlo. Su alimentación es variada. Su peso y tamaño son proporcionales. Eh… tiene una cara curiosa y su cuerpo tiene mucho pelo. Por cierto, este tipo de oso aparece en una película muy triste. Eh… el oso de anteojos tiene unas garras que le sirven para casi todo. El oso es un animal solitario…”.\n\nLuego de escuchar el texto oral, el docente identifica algunos problemas en la descripción realizada por el estudiante. ¿Cuál es el problema que debe atender el docente en la revisión de dicho texto?","options":{"A":"El texto oral carece de una descripción que ayude a comprender por qué al oso se le llama “oso de anteojos”.","B":"La descripción presentada en el texto oral tiene ideas que ofrecen información imprecisa sobre el oso.","C":"El objetivo de hacer una descripción del oso, con el que inicia la exposición, se deja de lado en el texto oral."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la clave: abundan expresiones vagas como “ni muy grande ni muy pequeño”, “está en varias regiones”, “tiene problemas”, “su alimentación es variada” o “garras que le sirven para casi todo”. Una descripción exige datos precisos.","La C atrae por la mención a la película triste, que sí es una digresión, pero el estudiante retoma la descripción (garras, comportamiento solitario): no abandona su objetivo. La A es falsa: sí explica el nombre por las manchas.","Al revisar una descripción, verifica que cada rasgo sea concreto: medidas, lugares, alimentos, colores. Elige el problema que se repite en casi todo el fragmento, no un detalle aislado."],"aprende_mas":[{"q":"¿Qué caracteriza a un buen texto descriptivo?","a":"- **Precisión**: datos concretos (“puede pesar hasta 175 kilos”).\n- **Orden**: de lo general a lo particular, o por aspectos.\n- **Vocabulario específico**: adjetivos y términos exactos.\n- **Pertinencia**: solo lo que aporta al propósito."},{"q":"¿Cómo retroalimentar la imprecisión en un texto oral?","a":"Con preguntas que pidan concretar: “¿Qué tan grande es? ¿En qué regiones vive? ¿Qué come exactamente?”. Así el estudiante descubre qué le falta y vuelve a sus fuentes. Funciona mejor que corregirle directamente."},{"q":"¿Qué es la retroalimentación descriptiva?","a":"Es la que describe lo que el estudiante logró y lo que debe mejorar según criterios claros, en lugar de dar solo una nota o un “bien”. Ejemplo: “Explicaste bien por qué se llama oso de anteojos; ahora precisa dónde vive y qué come”."}],"duda":false},"2025-F1-21":{"n":21,"year":2025,"ctx":"2025-F1-c7","stem":"La docente nota que varios estudiantes tienen problemas para interpretar el poema. Por esta razón, ella busca modelar el proceso de lectura para favorecer que los estudiantes realicen una primera exploración sobre el sentido global del texto poético. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que recaben información biográfica sobre la autora. Luego, solicitar que expliquen si esa información los puede ayudar o no a interpretar el sentido del poema.","B":"Solicitar a los estudiantes que, en pares, lean todo el poema y anoten las interrogantes que les surgen. Luego, proponer que compartan esas interrogantes para responderlas en plenaria.","C":"Leer con los estudiantes los ocho primeros versos del poema en voz alta. Luego, expresar las dudas que podrían ir apareciendo e indicar qué pasajes del poema servirían para contestarlas."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque la docente modela: lee en voz alta un fragmento corto (ocho versos), expresa las dudas que le surgen y muestra qué pasajes sirven para responderlas. Así los estudiantes ven cómo piensa un lector experto.","La B parece correcta porque promueve preguntas y trabajo en pares, pero no hay modelado: los estudiantes leen solos todo el poema, justo lo que aún no logran hacer bien. La docente solo recoge dudas al final.","Si el enunciado dice “modelar”, busca la alternativa en la que el docente hace la tarea delante de los estudiantes y verbaliza su pensamiento. Si ellos trabajan solos desde el inicio, no es modelado."],"aprende_mas":[{"q":"¿Qué significa “modelar” la lectura?","a":"Es leer frente a los estudiantes diciendo en voz alta lo que piensas mientras lees: “Aquí no entiendo esta palabra, voy a releer”, “Creo que este verso habla de…”. También se llama pensamiento en voz alta. Sirve para mostrar estrategias que los estudiantes todavía no usan por su cuenta."},{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea de conjunto que transmite el texto completo: de qué trata y qué busca comunicar. No es un dato suelto ni un verso aislado. En este poema, el sentido global sería la memoria de un pueblo amazónico que recuerda el sufrimiento de la época del caucho y afirma que ha sobrevivido."},{"q":"¿Qué viene después del modelado?","a":"- **Modelado**: el docente lo hace y explica cómo lo hace.\n- **Práctica guiada**: lo hacen juntos y el docente acompaña.\n- **Práctica autónoma**: los estudiantes lo hacen solos.\nLa alternativa B corresponde a una etapa posterior, no al primer acercamiento."}],"duda":false},"2025-F1-22":{"n":22,"year":2025,"ctx":"2025-F1-c7","stem":"La docente propone varias preguntas a los estudiantes. ¿Cuál de las siguientes preguntas es menos adecuada para que construyan interpretaciones sobre el sentido global del poema?","options":{"A":"¿Qué pasajes del poema dan cuenta de las sensaciones que experimenta la voz poética?","B":"¿Qué figura retórica utiliza la voz poética en la expresión “historias de látigos”?","C":"¿Qué paisaje busca representar la voz poética en los versos del poema?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es la menos adecuada porque solo pide nombrar la figura retórica de “historias de látigos”. Es una identificación aislada: el estudiante puede responder “metáfora” sin comprender qué dice el poema en conjunto.","La C puede parecer la menos adecuada porque habla de “paisaje”, pero preguntar qué espacio representa el poema (la quebrada, los shiringales, la Amazonía) sí ayuda a construir el sentido global, igual que la A al conectar sensaciones con pasajes.","En preguntas de “sentido global”, la alternativa débil es la que se queda en una parte o en un dato técnico (nombre de una figura, significado de una palabra). Lo que vale es lo que relaciona el todo."],"aprende_mas":[{"q":"¿Entonces está mal enseñar figuras retóricas?","a":"No. Lo que no basta es solo nombrarlas. Sirven cuando el estudiante explica qué efecto producen en el sentido del texto. Por ejemplo, en vez de “¿Qué figura es?”, pregunta: “¿Qué nos dice ‘historias de látigos’ sobre lo que vivió este pueblo?”."},{"q":"¿Qué es la voz poética?","a":"Es quien habla dentro del poema. No es lo mismo que la autora, aunque puedan parecerse. En este poema la voz poética habla como parte de un pueblo (“nosotros”, “nuestros abuelos”) que recuerda su historia."},{"q":"¿Qué contexto ayuda a entender este poema?","a":"- **Shiringales**: zonas de extracción del caucho en la Amazonía.\n- **Látigos y libras inglesas**: violencia y explotación de pueblos indígenas durante la fiebre del caucho (fines del siglo XIX e inicios del XX).\n- **Cierre**: “hemos regresado intactos” afirma la resistencia del pueblo.\nEl contexto ayuda, pero el sentido se construye desde el propio texto."}],"duda":false},"2025-F1-23":{"n":23,"year":2025,"ctx":"2025-F1-c7","stem":"En otro momento de la actividad de lectura, la docente busca que los estudiantes identifiquen los recursos literarios que contribuyen a la construcción de interpretaciones del sentido global del poema. ¿Cuál de las siguientes preguntas es más adecuada para ello?","options":{"A":"¿Con qué intención se usan palabras en primera persona, como “nos” o “nuestros”?","B":"¿Qué quiere decir la voz poética con “[...] rayar el sol / sobre el planeta”?","C":"¿A qué se refiere la expresión “espalda devorada”?"},"answer":"A","tema":"Literatura","explicacion":["La A es correcta porque pregunta por un recurso que recorre todo el poema: la primera persona plural (“nos”, “nuestros”). Ese recurso muestra que la voz poética habla por un pueblo y su memoria colectiva, clave del sentido global.","La C parece correcta porque “espalda devorada” es una imagen poderosa, pero solo pide el significado de una expresión. Es interpretación local; lo mismo pasa con la B y “rayar el sol sobre el planeta”.","Si piden un recurso que contribuye al sentido global, elige la pregunta sobre un recurso que atraviesa el texto y que indaga por su intención o efecto, no por el significado de una frase suelta."],"aprende_mas":[{"q":"¿Qué diferencia hay entre interpretación local y global?","a":"- **Local**: entender una parte (una palabra, un verso, una imagen). Ej.: “¿A qué se refiere ‘espalda devorada’?”.\n- **Global**: entender el texto completo y su propósito. Ej.: “¿Qué busca transmitir el poema sobre la historia de este pueblo?”.\nLas locales ayudan, pero no bastan para llegar al sentido global."},{"q":"¿Qué son los recursos literarios?","a":"Son formas especiales de usar el lenguaje para crear efectos: imágenes, metáforas, repeticiones, preguntas retóricas, la persona gramatical elegida. En el examen importa qué efecto producen en el sentido, no solo saber cómo se llaman."},{"q":"¿Qué efecto tiene usar “nosotros” en un poema?","a":"Convierte una voz individual en voz colectiva. El lector entiende que no es la historia de una persona, sino la de una comunidad. En este poema, eso hace del texto un acto de memoria del pueblo (“recito para no olvidar”)."}],"duda":false},"2025-F1-24":{"n":24,"year":2025,"ctx":"2025-F1-c8","stem":"Los integrantes de un equipo quieren elaborar una infografía con el propósito de dar a conocer el rol de las familias para prevenir casos de acoso escolar. Sin embargo, están teniendo problemas en la planificación de su escrito. Para ayudar a los estudiantes en este proceso, el docente lleva a cabo diversas acciones. ¿Cuál de las siguientes acciones está enmarcada, necesariamente, en un enfoque comunicativo?","options":{"A":"El docente pide a los estudiantes que comenten las características del género infografía. Luego, les propone elaborar una definición en la que se exprese que dicho género tiene imágenes e información verbal.","B":"El docente pide a los estudiantes que indiquen a quiénes estará dirigida su infografía. Sobre esta base, les propone que conversen y determinen qué ideas claves deben quedar claras a esos destinatarios.","C":"El docente pide a los estudiantes que analicen la estructura de diversas infografías entregadas por él. Después, les propone que escriban su propio texto tomando como base las infografías analizadas."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque parte de la situación comunicativa: a quiénes va dirigida la infografía y qué ideas deben quedarles claras. Planificar desde el destinatario y el propósito es el núcleo del enfoque comunicativo.","La C parece correcta porque usa textos reales como modelo, pero se centra en imitar la estructura, no en para quién y para qué se escribe. Puede hacerse sin pensar en la situación comunicativa; por eso no es “necesariamente” comunicativa.","La palabra “necesariamente” es la pista: elige la acción que no puede realizarse sin considerar propósito, destinatario y contexto. Definir un género o copiar su estructura puede quedarse en lo formal."],"aprende_mas":[{"q":"¿Qué es el enfoque comunicativo?","a":"Es el enfoque del área de Comunicación en el CNEB. Plantea que se aprende a leer, escribir y hablar usando el lenguaje en situaciones reales, con un propósito y un destinatario concretos. Además, toma en cuenta los contextos socioculturales en los que se usa el lenguaje."},{"q":"¿Qué elementos tiene una situación comunicativa?","a":"- **Propósito**: para qué escribo (informar, persuadir, explicar).\n- **Destinatario**: para quién (familias, compañeros).\n- **Tema**: de qué hablo.\n- **Género o formato**: infografía, afiche, carta.\n- **Registro**: formal o informal, según el destinatario."},{"q":"¿Qué momentos tiene la escritura de un texto?","a":"Planificar (propósito, destinatario, ideas), textualizar (escribir el borrador) y revisar (mejorar el texto). No son pasos rígidos: se avanza y se vuelve entre ellos. En esta pregunta el equipo estaba en la planificación."}],"duda":false},"2025-F1-25":{"n":25,"year":2025,"ctx":"2025-F1-c8","stem":"Un equipo de estudiantes está buscando fuentes de información para escribir un texto cuyo propósito será explicar las diversas causas del acoso en la escuela y proponer medidas para enfrentarlo. Los estudiantes están dialogando sobre la pertinencia de utilizar algunas de las fuentes que han seleccionado para generar ideas.\n\nA continuación, se van a presentar fragmentos de tres de las fuentes seleccionadas. Considerando la situación comunicativa, ¿cuál de las siguientes fuentes es menos adecuada para que los estudiantes generen ideas que los ayuden a lograr el propósito de su texto?","options":{"A":"La fuente 1 es “Paco Yunque” de César Vallejo, publicada en 1951.\n\n“Humberto, el hijo del señor Dorian Grieve, un inglés, patrón de los Yunque […], desde su banco del otro lado del salón, miraba con cólera a Paco Yunque y le enseñaba los puños […] Paco Yunque no sabía qué hacer. Le pegaría otra vez el niño Humberto, […] Cuando saldrían del colegio, el niño Humberto le daría un empujón en el pecho y una patada en la pierna. El niño Humberto era malo y le pegaba […] a cada rato. En la calle. En el corredor también. Y en la escalera […] Humberto Grieve, aprovechando de que no le veía el profesor, dio un salto y le jaló de los pelos a Yunque, volviéndose a las carreras a su carpeta […]”.","B":"La fuente 2 es un documento titulado Prevención y atención frente al acoso de estudiantes, publicada en 2017 por el Minedu.\n\n“Ante situaciones de acoso entre pares, los directivos […], docentes y auxiliares deben: - Tomar medidas educativas de protección inmediata para asegurar que no continúe el maltrato. - Garantizar la confidencialidad de la información recibida, así como de los documentos y registros. - Involucrar a los padres de los estudiantes en el planteamiento de posibles soluciones al\n\nproblema.\n\n- Registrar el caso y las acciones adoptadas en el Libro de registro de incidencias en el Síseve”.","C":"La fuente 3 es una nota titulada “95 frases contra el bullying. Una selección de reflexiones para frenar el acoso en los colegios e institutos”, publicada en 2019 por la página web Psicología y Mente.\n\n«El bullying es el término anglosajón para referirse al conocido maltrato escolar, ya sea cuando este se realice en el entorno de la escuela o, como últimamente sucede, a través de las redes sociales […].\n\nFrases para frenar el bullying - “¿Tienes enemigos? Bien. Eso significa que luchas por algo en algún momento de tu vida”\n\n(Winston Churchill).\n\n- “No estás bajo el control de nadie. No eres de nadie” (Salla Simukka).\n\n- “El acoso no está bien. Punto” (Jim C. Hines)»."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es la menos adecuada porque es una lista de frases célebres sueltas; algunas, como la de Churchill, ni siquiera tratan del acoso. No aporta información sobre causas ni medidas, que es lo que el texto debe explicar y proponer.","La A parece la menos adecuada por ser un cuento literario, pero “Paco Yunque” muestra cómo la desigualdad de poder (el hijo del patrón frente al hijo del empleado) alimenta el maltrato. Eso ayuda a generar ideas sobre las causas.","Evalúa una fuente según el propósito del texto que se va a escribir, no por su género ni por lo popular que sea. Pregúntate: ¿me da ideas para lo que quiero explicar o proponer?"],"aprende_mas":[{"q":"¿Cómo saber si una fuente es pertinente?","a":"- **Propósito**: ¿responde a lo que quiero escribir?\n- **Contenido**: ¿trae información o ideas desarrolladas, o solo frases sueltas?\n- **Autoría y fiabilidad**: ¿quién la publica y con qué respaldo?\n- **Vigencia**: ¿sigue siendo válida hoy?"},{"q":"¿Un cuento puede servir para escribir un texto expositivo?","a":"Sí, para generar ideas. Un cuento puede mostrar una situación que luego se analiza. Por ejemplo, de “Paco Yunque” se deduce que el acoso se apoya en diferencias de poder. Luego esas ideas se contrastan con fuentes informativas, como el documento del Minedu."},{"q":"¿Qué es “generar ideas” en la planificación?","a":"Es reunir lo que se podría decir antes de escribir: lluvia de ideas, lecturas, entrevistas, experiencias propias. Después se seleccionan las que sirven al propósito. En esta etapa se pueden explorar fuentes variadas, siempre que aporten al tema."}],"duda":false},"2025-F1-26":{"n":26,"year":2025,"ctx":"2025-F1-c8","stem":"Un equipo de estudiantes ha elaborado un ensayo que busca proponer la práctica del teatro como medida de prevención frente al acoso escolar. Las estudiantes le han entregado su texto al docente para recibir su retroalimentación. Este es un avance de uno de los párrafos de desarrollo de dicho ensayo:\n\nLos talleres de teatro pueden ayudar a prevenir el acoso escolar. Con los juegos teatrales que se dan en los talleres, se mejora la convivencia entre los participantes. Además, los juegos teatrales son una oportunidad para hacer que haya empatía, para promover el diálogo, para favorecer la toma de conciencia, etc. Asimismo, sirven para fomentar la creatividad y el aprendizaje colaborativo. El año pasado, nosotras asistimos al teatro a ver una obra, en la que uno de los temas era el bullying. Antes del tercer acto, nos pasó algo gracioso. Fuimos al baño y pensamos que nos habíamos quedado encerradas ahí. Nos preocupamos y gritamos pidiendo ayuda. Pero una compañera vio que había que empujar la puerta, no tirar de ella para poder salir. Todas nos reímos de la situación y regresamos a nuestros asientos.\n\nLuego de leerlo, el docente nota que el texto de las estudiantes inicia desarrollando ideas sobre la práctica del teatro como medida frente al acoso, pero termina presentando un hecho anecdótico de cuando ellas asistieron a una obra de teatro en la que se trataba el tema del bullying. ¿Cuál es la razón por la que este problema debe ser atendido por el docente?","options":{"A":"Porque el problema genera que el texto se desvíe del propósito de plantear la práctica del teatro como una herramienta para enfrentar el acoso escolar.","B":"Porque el problema genera que el texto carezca de un desarrollo profundo sobre el teatro como medida de prevención frente al acoso escolar.","C":"Porque el problema genera que el texto presente ideas contradictorias respecto de las consecuencias que ocasiona el acoso escolar."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque el párrafo empieza defendiendo el teatro como medida contra el acoso y termina con la anécdota del baño, que no aporta nada a esa idea. El texto se aleja de su propósito de plantear el teatro como herramienta.","La B parece correcta porque el párrafo es algo superficial, pero el problema que nota el docente no es falta de profundidad, sino información ajena. Aunque las ideas se desarrollaran más, la anécdota seguiría desviando el texto.","Cuando el problema es una digresión (contar algo que no viene al caso), la respuesta apunta al propósito o a la unidad temática. “Falta de profundidad” describe ideas pobres, no ideas fuera de lugar."],"aprende_mas":[{"q":"¿Qué es una digresión?","a":"Es cuando el texto se sale de su tema o propósito para contar algo que no aporta. Por ejemplo, en un ensayo sobre el teatro contra el bullying, contar que se quedaron encerradas en el baño. Es muy común en estudiantes que recién aprenden a argumentar."},{"q":"¿Cómo retroalimentar esto sin corregirlo por el estudiante?","a":"Con preguntas que los lleven a darse cuenta: “¿Qué idea defiende tu párrafo?”, “¿Esta anécdota ayuda a demostrar que el teatro previene el acoso?”, “¿Qué ejemplo podrías poner en su lugar?”. Así son ellas quienes revisan y deciden."},{"q":"¿Una anécdota puede servir en un ensayo?","a":"Sí, si funciona como ejemplo o evidencia de la idea que se defiende. Por ejemplo, contar cómo un taller de teatro ayudó a un salón a convivir mejor. El problema no es la anécdota, sino que no se relacione con la tesis."}],"duda":false},"2025-F1-27":{"n":27,"year":2025,"ctx":"2025-F1-c8","stem":"Un equipo de estudiantes ha elaborado un folleto que busca combatir los mitos sobre el acoso escolar. A continuación, se presenta la primera versión de uno de los párrafos incluido en el folleto:\n\nBien, vamos a enumerar algunos mitos sobre el acoso escolar. Un primer mito se refiere a creer que el acoso son solo bromas inofensivas entre adolescentes. Eso no es verdad. Existen mitos sobre diversos problemas, como creer que el calentamiento global es un proceso natural de la Tierra o que el planeta es plano (“terraplanismo”). He escuchado el mito de que es mejor para la salud de los bebés no vacunarlos. Otro mito es que los adultos creen que el acoso escolar es parte del crecimiento. Capaz que piensan: “Eso les forja el carácter”. Cuando un estudiante la pasa mal por el acoso, le va mal en cualquier sitio, ¿no? Esto genera que disminuya su autoestima.\n\nEl docente se da cuenta de que el texto tiene aspectos positivos y negativos. En un primer momento, busca destacar un aspecto positivo. ¿Cuál es ese aspecto?","options":{"A":"Los mecanismos de cohesión favorecen la identificación de la idea principal y las ideas secundarias del párrafo.","B":"El registro usado en las ideas del párrafo toma en cuenta los elementos de la situación comunicativa.","C":"Cada una de las ideas incluidas desarrolla el tema central del párrafo de manera específica y detallada."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque el párrafo usa marcadores que ordenan las ideas: “Un primer mito…”, “Otro mito…”, “Esto genera…”. Gracias a ellos se reconoce que el tema central son los mitos sobre el acoso y qué ideas los acompañan.","La C parece positiva porque el párrafo sí habla de mitos, pero mete ideas que no desarrollan el tema (calentamiento global, terraplanismo, vacunas). Esa digresión es un aspecto negativo, no positivo.","Para hallar el aspecto positivo, descarta lo que el texto hace mal. Aquí el registro es coloquial (“Bien”, “Capaz que”, “¿no?”), por eso la B falla, y hay digresiones. Lo que queda en pie es la cohesión."],"aprende_mas":[{"q":"¿Qué diferencia hay entre coherencia y cohesión?","a":"- **Coherencia**: que las ideas tengan sentido juntas y se mantengan en el tema (lo de fondo).\n- **Cohesión**: las “costuras” que unen las ideas: conectores, marcadores, pronombres, sinónimos (lo de forma).\nUn texto puede tener buenos conectores y aun así salirse del tema, como este párrafo."},{"q":"¿Qué es el registro?","a":"Es el nivel de formalidad del lenguaje según la situación. Un folleto para la comunidad educativa pide un registro formal o neutro. Expresiones como “Capaz que piensan” o “¿no?” son propias de una conversación oral, no de este tipo de texto."},{"q":"¿Por qué empezar la retroalimentación con lo positivo?","a":"Porque reconoce lo que el estudiante ya logra y le da confianza para mejorar lo demás. Debe ser concreto, no un “muy bien” general. Ej.: “Usaste ‘Un primer mito’ y ‘Otro mito’; eso ayuda al lector a seguirte. Ahora revisemos si todas las ideas hablan del acoso”."}],"duda":false},"2025-F1-28":{"n":28,"year":2025,"ctx":"2025-F1-c8","stem":"Un equipo de estudiantes ha elaborado un díptico cuyo propósito es ofrecer ejemplos de deportes colectivos que pueden ayudar a combatir los casos de acoso escolar. A continuación, se presenta uno de los párrafos de contenido que los estudiantes incluyeron en su díptico:\n\nEn esta sección, daremos ejemplos de deportes que pueden ayudar a prevenir el bullying. Por un lado, un deporte colectivo que ayuda es el balonmano. En el balonmano, uno debe jugar en equipo para poder anotar con facilidad. Este deporte fomenta el respeto, la colaboración, la autoestima, entre otros. Hace poco, mi salón participó en el campeonato de fulbito del colegio. Tuvimos un inicio difícil, perdimos los primeros dos partidos. Pero nuestra tutora, que era nuestra entrenadora, nos dio una larga charla que nos hizo sentir confianza en nosotros mismos. El tercer encuentro fue muy peleado. Pudimos ganar. Y logramos llegar a las finales. Esto fue un objetivo cumplido para nosotros.\n\nLuego de leerlo, el docente nota un problema de coherencia en el párrafo, que requiere ser atendido por los estudiantes. ¿Cuál es ese problema?","options":{"A":"Los vacíos de información.","B":"La falta de progresión de ideas.","C":"La ausencia de unidad temática."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque el párrafo debía dar ejemplos de deportes colectivos contra el acoso, pero pasa a relatar el campeonato de fulbito del salón, que no menciona el acoso. Se rompe la unidad temática.","La B parece correcta porque el párrafo no avanza hacia su propósito, pero sí hay progresión: el relato va sumando información nueva (perdieron, la charla, ganaron, finales). El problema es que esa información pertenece a otro tema.","Si una parte del texto “se va a otro tema”, es unidad temática. Si el texto repite lo mismo sin agregar nada, es falta de progresión. Si falta información necesaria para entender, es vacío de información."],"aprende_mas":[{"q":"¿Qué es la unidad temática?","a":"Es que todas las ideas de un texto o párrafo giren en torno a un mismo tema. Si aparece algo que no se relaciona, se pierde la unidad. Prueba rápida: lee cada oración y pregúntate “¿esto habla del tema del párrafo?”."},{"q":"¿Qué es la progresión temática?","a":"Es que el texto avance: cada oración agrega información nueva conectada con lo anterior. Si el texto da vueltas repitiendo la misma idea con otras palabras, le falta progresión."},{"q":"¿Qué es un vacío de información?","a":"Es cuando falta un dato que el lector necesita para entender. Por ejemplo, mencionar “el método que propusimos” sin haberlo explicado antes. El lector se queda preguntando “¿cuál?” o “¿y qué más?”."}],"duda":false},"2025-F1-29":{"n":29,"year":2025,"ctx":"2025-F1-c9","stem":"Al terminar de leer el texto, en plenaria, los estudiantes comparten sus comentarios sobre algunos aspectos que llamaron su atención. ¿Cuál de los comentarios corresponde a una deducción de información del texto?","options":{"A":"“Pienso que el gran jurisconsulto quedó convencido de que su colega era famoso porque este no vaciló en responderle”.","B":"“Yo necesitaría más pruebas para estar seguro de que el famoso colega tenía tanta sabiduría como decía la gente”.","C":"“Me parece que el famoso colega tenía la misma respuesta preparada para cada discusión y, por eso, tenía éxito”."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque va más allá de lo escrito: el texto dice que el colega respondió “sin vacilar un instante” y que tenía gran fama; de ahí el estudiante deduce que tenía una respuesta preparada que le daba éxito. Es información implícita construida desde pistas del texto.","La A parece una deducción, pero distorsiona el texto: el jurisconsulto ya sabía que su colega era famoso; lo que comprobó es que esa fama de sabio era merecida, y lo convenció el contenido de la respuesta, no solo su rapidez.","Una deducción une pistas del texto para llegar a una conclusión que no está escrita. Si el comentario expresa una opinión personal, como la B (“yo necesitaría más pruebas”), es reflexión o valoración, no deducción."],"aprende_mas":[{"q":"¿Qué es una inferencia o deducción?","a":"Es sacar una conclusión que el texto no dice directamente, uniendo pistas del texto con lo que ya sabemos. Ejemplo: si el texto dice “entró empapado y cerró el paraguas”, deducimos que llovía, aunque no lo diga."},{"q":"¿Qué capacidades de lectura plantea el CNEB?","a":"- **Obtiene información**: lo que está escrito literalmente.\n- **Infiere e interpreta**: deduce lo implícito y construye el sentido.\n- **Reflexiona y evalúa**: opina sobre el contenido, la forma o el contexto del texto.\nEn esta pregunta, la B es reflexión y la C es inferencia."},{"q":"¿Cómo saber si una deducción tiene sustento?","a":"Pregunta: “¿Qué parte del texto te hace pensar eso?”. Si el estudiante señala pistas concretas (“respondió sin vacilar”, “tenía gran fama”), la deducción tiene base. Si no puede señalar nada o contradice el texto, es una suposición sin sustento."}],"duda":true},"2025-F1-30":{"n":30,"year":2025,"ctx":"2025-F1-c9","stem":"Como parte del diálogo sobre el texto, los estudiantes comentan a la docente que el narrador deja entrever cierta postura sobre el quehacer de los abogados. En este contexto, ella les pide que expresen a qué postura se refieren. Considerando una interpretación adecuada del relato, ¿cuál de las estudiantes identifica dicha postura?","options":{"A":"Ana dice: “Creo que la postura que el narrador quiere dar a entender es que algunos abogados toleran la mentira, con tal de lograr lo que se proponen”.","B":"Brunela dice: “Pienso que la postura que el narrador quiere dar a entender es que algunos abogados se enfrentan a cualquier litigio porque saben que lo ganarán”.","C":"Claudia dice: “Parece que la postura que el narrador quiere dar a entender es que algunos abogados pueden dudar ante situaciones que ponen en riesgo su reputación”."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque el colega sabe que los muebles son suyos (“su buen dinero le había costado”), pero igual ofrece un arreglo ante un reclamo falso. Acepta negociar sobre una mentira para evitar el pleito, y el forastero lo llama sabio: es una crítica irónica al oficio.","La C parece correcta porque menciona la reputación, pero el colega no duda: responde “sin vacilar un instante”. La B dice lo contrario del relato, pues el colega evita el litigio en lugar de enfrentarlo.","Para hallar la postura del narrador, mira qué conducta se presenta como “sabia” y pregúntate si el texto la elogia en serio o con ironía. Luego descarta las alternativas que contradicen datos explícitos."],"aprende_mas":[{"q":"¿Qué es la ironía en un relato?","a":"Es decir algo pero dar a entender otra cosa, muchas veces lo contrario. Aquí el forastero llama “sabio” al colega por aceptar negociar un reclamo absurdo. El lector entiende que se critica a los abogados que prefieren un arreglo conveniente aunque haya una mentira de por medio."},{"q":"¿Qué es la postura del narrador?","a":"Es la visión u opinión que el texto deja ver sobre un tema, aunque no la diga directamente. Se descubre por cómo se presentan los hechos y los personajes. Ej.: un relato que siempre muestra a un comerciante engañando deja ver una postura crítica hacia ese comerciante."},{"q":"¿Cómo trabajar este tipo de pregunta en el aula?","a":"- **Pide evidencias**: “¿Qué frase del texto lo muestra?”.\n- **Contrasta interpretaciones**: compara la de Ana con la de Claudia y busca cuál se sostiene.\n- **Vuelve al texto**: descartar lo que contradice datos explícitos es una estrategia válida."}],"duda":false},"2025-F1-31":{"n":31,"year":2025,"ctx":"2025-F1-c9","stem":"Los estudiantes están dialogando sobre las interpretaciones que pueden elaborarse a partir del relato. De este diálogo, se han extraído los comentarios de tres estudiantes. ¿Cuál de los siguientes comentarios corresponde a una interpretación sobre el sentido global del texto?","options":{"A":"“Es una mala idea responder como lo hizo el famoso colega. En otra situación, alguien puede quitarnos nuestras cosas, sin considerar que nos pertenecen”.","B":"\"El famoso colega le dijo al gran jurista que quedaría contento con un tipo de arreglo. Él asumió que, de ese modo, el conflicto entre ellos desaparecería”.","C":"“Yo pienso que el famoso colega era un poco despistado. Tal como sucede en la historia, ni se percató de que el gran jurista quería engañarlo”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B recoge el núcleo del relato: el famoso colega, aunque sabía que los muebles eran suyos, propone un arreglo para evitar el litigio. Justo esa decisión es la que el forastero reconoce como sabiduría al final.","La C parece una interpretación, pero contradice el texto: el colega ‘recordaba perfectamente’ que los muebles eran suyos, así que no era despistado; actuó a propósito. La A saca una moraleja contraria a la del relato.","Para el sentido global, pregúntate: ¿qué idea explica el desenlace? Descarta las opciones que contradicen datos del texto o que dan consejos sin respaldo en la historia."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea de conjunto que da unidad a todo el texto: de qué trata y qué quiere decir en su totalidad. No es un detalle ni una frase suelta. En un relato breve, suele estar en lo que revela el desenlace."},{"q":"¿Cómo sé si una interpretación es válida?","a":"- **Se apoya en el texto**: puedes señalar la frase o el hecho que la respalda.\n- **No contradice datos**: si el texto dice ‘recordaba perfectamente’, no puedes decir que olvidó.\n- **Abarca el todo**: explica inicio, nudo y desenlace, no solo una parte."},{"q":"¿Qué diferencia hay entre interpretar y opinar?","a":"Interpretar es construir el sentido con pistas del texto. Opinar es valorar desde mi postura (‘me parece mal lo que hizo’). Si te piden interpretación, descarta las opciones que juzgan o aconsejan sin anclarse en la historia."}],"duda":false},"2025-F1-32":{"n":32,"year":2025,"ctx":"2025-F1-c9","stem":"Durante el diálogo sobre el texto, la docente tiene como propósito que los estudiantes identifiquen los recursos literarios que aportan a la construcción de interpretaciones sobre el sentido global del relato. ¿Cuál de las siguientes acciones pedagógicas NO es adecuada para ayudar a los estudiantes a lograr dicho propósito?","options":{"A":"Preguntar qué efecto genera en el lector que el famoso colega busque intencionalmente evitar un litigio.","B":"Solicitar que, a partir del diálogo de los dos juristas, expliquen cuál es el carácter de cada uno de ellos.","C":"Pedir que comenten por qué creen que el relato comienza con la expresión “érase una vez”."},"answer":"C","tema":"Literatura","explicacion":["Preguntar por qué empieza con ‘érase una vez’ solo apunta a una fórmula de inicio típica de los cuentos; no ayuda a entender la ironía ni la prudencia del colega. Por eso la C es la acción NO adecuada.","La A puede parecer ajena a los recursos literarios, pero pregunta por el efecto en el lector de una reacción inesperada (el giro sorpresivo), que sí sostiene la interpretación. La B trabaja la caracterización a partir del diálogo, también clave.","En preguntas con ‘NO’, busca la opción que trabaja un elemento real del texto pero superficial o desconectado del propósito; aquí, del sentido global."],"aprende_mas":[{"q":"¿Qué es un recurso literario en un relato?","a":"Es una decisión del autor para producir un efecto: sorpresa, humor, tensión. En narrativa incluye la construcción de personajes, el giro final, la ironía y el uso del diálogo. Ejemplo: un final que contradice lo esperado invita al lector a reflexionar."},{"q":"¿Qué es la caracterización de personajes?","a":"Es la manera en que conocemos a un personaje. Puede ser directa (el narrador dice ‘era sabio’) o indirecta (lo deducimos por lo que dice y hace). En ‘Los dos juristas’, sabemos que el colega es prudente por su respuesta, no porque el narrador lo diga."},{"q":"¿Por qué ‘érase una vez’ aporta poco aquí?","a":"Es una fórmula fija de apertura que ubica la historia en un tiempo indefinido. Sirve para reconocer el tipo de relato, pero no cambia lo que la historia significa. El sentido se construye en el diálogo y en el desenlace."}],"duda":false},"2025-F1-33":{"n":33,"year":2025,"ctx":"2025-F1-c10","stem":"Como parte de la planificación, el docente tiene planeado realizar diversas actividades con los estudiantes para orientarlos en este proceso. Considerando la situación de aprendizaje, ¿cuál de las siguientes acciones es adecuada para ayudar a los estudiantes en la planificación de sus textos?","options":{"A":"Solicitar a los estudiantes que recojan información sobre el tema de los estereotipos en fuentes confiables y usen esa información para elaborar un esquema de ideas de su texto.","B":"Realizar preguntas a los estudiantes, en plenaria, para recoger y registrar en la pizarra sus saberes previos sobre el tema de los estereotipos, el cual abordarán en sus escritos.","C":"Discutir con los estudiantes acerca del tipo y el género textual que pueden usar en función del tema de los estereotipos, de la intención y la adecuación de su texto al contexto."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C ayuda a planificar porque lleva a los estudiantes a decidir el tipo y el género textual según el tema, la intención (explicar) y el contexto de publicación (paneles de la IE). Esas decisiones de adecuación orientan todo lo demás.","La A parece correcta, porque buscar fuentes también se hace al planificar, pero propone armar el esquema sin haber decidido antes qué texto escribirán ni para quién. La B solo recoge saberes previos: activa, pero no planifica el texto.","Planificar un texto es decidir propósito, destinatario, registro y género. Si una opción reúne esas decisiones y las vincula con la situación comunicativa, suele ser la clave."],"aprende_mas":[{"q":"¿Qué incluye la planificación de un texto escrito?","a":"- **Propósito**: ¿para qué escribo? (explicar, convencer, narrar).\n- **Destinatario**: ¿quién lo leerá? (la comunidad de la IE).\n- **Género y registro**: ¿afiche, ensayo, infografía? ¿formal o informal?\n- **Ideas y fuentes**: ¿qué diré y de dónde saco la información?"},{"q":"¿Qué diferencia hay entre tipo textual y género textual?","a":"El tipo textual es la forma de organizar las ideas: narrativo, expositivo, argumentativo, descrip
