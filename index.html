rrecta porque el título es parte de la estructura, pero proponer uno nuevo «tomando en cuenta la información» obliga a captar el tema: es una tarea de comprensión del contenido, no de reflexión sobre la forma.","Pista: reflexionar sobre la forma es preguntarse por qué el autor usó cierto recurso, estructura o lenguaje. Si la tarea pide identificar ideas (C) o sintetizar el tema (B), es contenido."],"aprende_mas":[{"q":"¿Qué aspectos formales se pueden analizar en un texto escrito?","a":"- **Estructura**: cómo inicia, se desarrolla y cierra.\n- **Recursos textuales**: preguntas, citas, ejemplos, comillas.\n- **Lenguaje**: registro, vocabulario técnico, conectores.\n- **Paratextos**: título, imágenes, referencia de la fuente."},{"q":"¿Por qué un texto de divulgación científica empieza con una pregunta?","a":"Para enganchar al lector y anunciar el problema que el texto va a responder. Aquí, «¿En qué momento se domesticaron los perros?» despierta curiosidad y presenta el tema de la investigación. Es una estrategia típica de la divulgación."},{"q":"¿Cómo formular preguntas que lleven a reflexionar sobre la forma?","a":"Usa preguntas que empiecen con «¿Por qué el autor…?» o «¿Para qué…?». Ejemplo: «¿Para qué pone entre comillas la palabra “secreto”?», «¿Por qué menciona tantas universidades?». Así el estudiante analiza decisiones del autor, no solo datos."}],"duda":false},"2024-F1-30":{"n":30,"year":2024,"ctx":"2024-F1-c9","stem":"En otro momento, el docente formula a los estudiantes la siguiente pregunta: “¿A qué creen que se deba que, en investigaciones como la que presenta el texto, se involucren científicos de varias ramas de la ciencia?”.\n\n¿Por qué la pregunta planteada por el docente promueve que los estudiantes reflexionen sobre el contenido del texto?","options":{"A":"Porque busca que los estudiantes expresen sus ideas sobre qué aporta la participación de diversas disciplinas en una investigación.","B":"Porque busca que los estudiantes se den cuenta de que el propósito del texto es brindar información científica sobre la domesticación de los perros.","C":"Porque busca que los estudiantes indaguen sobre los fenómenos abordados por las ciencias dedicadas al estudio de la evolución de los animales."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque la pregunta «¿A qué creen que se deba…?» invita a opinar con sustento sobre un dato del texto (el equipo de varias especialidades) y a pensar qué aporta que varias ciencias investiguen juntas.","La C parece correcta porque también habla de las ciencias, pero la pregunta del docente no pide indagar ni buscar información nueva; pide explicar con sus propias ideas a partir de lo leído.","Pista: compara el verbo de la pregunta docente con el de la alternativa. «¿Qué creen?» pide reflexión u opinión; no pide identificar el propósito del texto (B) ni investigar (C)."],"aprende_mas":[{"q":"¿Qué significa reflexionar sobre el contenido de un texto?","a":"Es evaluar lo que dice el texto y relacionarlo con tus saberes y experiencias, dando una opinión sustentada. No es repetir información: es preguntarse por qué, para qué, si es válido o qué implica. Ejemplo: «¿Es suficiente comparar solo 12 lobos para sacar conclusiones?»."},{"q":"¿Qué es una pregunta de nivel crítico?","a":"Es la que pide juzgar, valorar o tomar postura con argumentos. Suele empezar con «¿Qué opinas…?», «¿Estás de acuerdo…?», «¿A qué crees que se deba…?» o «¿Qué aporta…?». No tiene una sola respuesta correcta, pero exige sustentarla con el texto."},{"q":"¿Por qué la B no es reflexión sobre el contenido?","a":"Identificar el propósito del texto (informar, explicar) es una tarea de comprensión inferencial global, no de reflexión crítica. Además, la pregunta del docente no habla del propósito, sino de la participación de varias ciencias. La alternativa no corresponde con lo que se pregunta."}],"duda":false},"2024-F1-31":{"n":31,"year":2024,"ctx":"2024-F1-c10","stem":"Un equipo de estudiantes ha escrito una noticia cuyo propósito es informar sobre una alternativa eficaz para el recojo de residuos sólidos. El equipo le ha entregado a la docente el texto en una primera versión para que lo revise. Luego de leer el escrito, ella nota que en el texto de los estudiantes se evidencian varios logros. ¿Cuál de las siguientes alternativas NO se refiere a un logro sobre la adecuación del texto a la situación comunicativa?","options":{"A":"La organización de ideas en párrafos contribuye a identificar la secuencia de hechos de la noticia.","B":"La adaptación de términos especializados en función del público contribuye a comprender la noticia.","C":"La elección y distribución de los gráficos utilizados contribuye a dejar clara la información ofrecida en la noticia."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La clave es A porque organizar ideas en párrafos para mostrar la secuencia de hechos es un logro de coherencia y organización, no de adecuación al público, propósito o medio.","La C parece no ser de adecuación porque habla de gráficos, pero elegir y distribuir gráficos pensando en dejar clara la información para lectores de redes sociales sí es ajustar el texto a la situación comunicativa.","Pista: adecuación responde a ¿para quién, para qué y en qué medio escribo? (registro, vocabulario, formato, recursos). Si la alternativa habla de orden de ideas o párrafos, es coherencia."],"aprende_mas":[{"q":"¿Qué aspectos revisa el docente cuando evalúa la adecuación de un texto?","a":"- **Destinatario**: el vocabulario y el registro se ajustan a quien leerá (por ejemplo, explicar \"lixiviado\" para vecinos).\n- **Propósito**: el texto cumple lo que quiere lograr (informar, convencer, solicitar).\n- **Medio o soporte**: el formato se adapta a donde se publicará (redes, mural, carta).\n- **Género**: respeta las características de la noticia, el afiche, etc."},{"q":"¿Cuál es la diferencia entre adecuación, coherencia y cohesión?","a":"- **Adecuación**: el texto encaja con la situación (quién, para qué, dónde).\n- **Coherencia**: las ideas giran en torno a un tema y siguen un orden lógico, sin contradicciones ni vacíos.\n- **Cohesión**: las ideas están enlazadas con conectores, referentes y puntuación.\nEjemplo: una noticia en párrafos ordenados cronológicamente muestra coherencia."},{"q":"¿Por qué los gráficos pueden ser parte de la adecuación?","a":"Porque son recursos que el escritor elige pensando en su lector y en el medio. En redes sociales, un gráfico claro facilita entender rápido los datos. Si el estudiante decide qué gráfico usar y dónde ponerlo según su público, está adecuando su texto."}],"duda":false},"2024-F1-32":{"n":32,"year":2024,"ctx":"2024-F1-c10","stem":"Un equipo de estudiantes ha escrito un ensayo expositivo cuyo propósito es plantear acciones para ayudar a reducir los efectos en el ambiente de los basurales a cielo abierto. Los estudiantes le presentan a la docente la primera versión de la introducción de su ensayo, que se muestra a continuación:\n\nAlerta ambiental: basurales a cielo abierto en nuestra comunidad\n\nTodos los días se producen 21 mil toneladas de basura en el Perú. El 45 % termina en riberas de ríos y playas, y en las calles. Se crean basurales a cielo abierto. La gente arroja y quema sus desechos en los basurales. No hay control sobre los basurales a cielo abierto. Se generan graves consecuencias. La quema de la basura contamina el aire. Las personas tienen problemas respiratorios. La calidad de vida de las personas se deteriora. Es una emergencia ambiental. Se explicarán alternativas que pueden realizar los ciudadanos para ayudar a reducir los efectos generados por los basurales a cielo abierto en nuestro barrio.\n\nLa docente nota que los estudiantes pueden explicitar mejor la relación lógica entre las ideas del texto empleando conectores. Por ello, busca orientarlos para que trabajen en este aspecto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Escribir en la pizarra “la quema de la basura contamina el aire. Por ello, las personas tienen problemas respiratorios”. Luego, preguntar si creen que el conector usado hace explícito que el aire contaminado provoca problemas respiratorios en las personas. Por último, pedir que, como en el caso anterior, usen conectores en otras ideas del texto.","B":"Preguntar qué relación lógica existe entre la idea de que la gente arroje sus desechos en los basurales y la idea de la falta de control sobre esos basurales. Luego, solicitar que mencionen qué conector explicitaría la relación entre esas ideas. Después, pedir que indiquen qué otras relaciones en el texto podrían evidenciarse con conectores.","C":"Solicitar que elaboren una lista de los conectores que conocen. Luego, proponer que organicen esos conectores tomando en cuenta el tipo de relación lógica que estos contribuyen a evidenciar. Finalmente, pedir que utilicen la lista de conectores elaborada para explicitar la relación lógica entre las ideas de su propio escrito."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La clave es B porque la docente pregunta por la relación lógica entre dos ideas del propio texto, luego pide el conector que la explicite y después que busquen otras relaciones: los estudiantes razonan y aplican.","La A parece correcta porque también usa el texto, pero la docente ya escribe la relación y el conector, y solo pregunta si funciona (sí/no). Los estudiantes no descubren la relación lógica por sí mismos.","Pista: en preguntas de conectores, gana la opción donde primero se identifica la relación lógica entre ideas reales del texto y recién después se elige el conector. Listas sueltas de conectores no bastan."],"aprende_mas":[{"q":"¿Por qué no basta con dar una lista de conectores a los estudiantes?","a":"Porque el conector depende de la relación entre las ideas, no al revés. Si el estudiante no entiende que una idea es causa de otra, elegirá un conector al azar. Primero se piensa la relación (causa, contraste, adición) y luego se busca la palabra que la expresa."},{"q":"¿Qué relaciones lógicas suelen expresar los conectores?","a":"- **Causa**: porque, ya que, debido a.\n- **Consecuencia**: por ello, por lo tanto, así que.\n- **Contraste**: pero, sin embargo, en cambio.\n- **Adición**: además, también, asimismo.\nEjemplo: \"No hay control sobre los basurales; por ello, la gente arroja sus desechos\"."},{"q":"¿Cómo reconocer una buena mediación docente en la revisión de textos?","a":"El docente hace preguntas que llevan al estudiante a descubrir el problema y la solución en su propio escrito. No corrige por él ni le da la respuesta hecha. Luego le pide aplicar lo aprendido en otras partes del texto para que gane autonomía."}],"duda":false},"2024-F1-33":{"n":33,"year":2024,"ctx":"2024-F1-c11","stem":"Al terminar de leer, los estudiantes comparten diversos comentarios sobre los aspectos del texto que llamaron su atención. ¿Cuál de los siguientes comentarios corresponde a una lectura crítica de dicho texto?","options":{"A":"“Me pregunto si Jane fue consciente del gran impacto que generaría con sus investigaciones. Si yo estuviera en su lugar, creo que me sentiría orgullosa y satisfecha de lo que he logrado”.","B":"“Era usual que las mujeres no tengan espacios en el ámbito científico en el siglo veinte. Esto no tuvo que ver con su capacidad, sino con la sociedad que imponía muchos límites, como le pudo haber ocurrido a Jane”.","C":"“Yo opino que Jane se mantiene vigente porque es claro que fue pionera en varios campos de la ciencia. Además, ella ha demostrado ser muy productiva: publicó investigaciones y su trabajo ha sido llevado a la televisión”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La clave es B porque el estudiante relaciona el texto con su contexto sociocultural: las limitaciones que la sociedad imponía a las mujeres científicas en el siglo XX. Eso es reflexionar críticamente más allá de lo que el texto dice.","La C parece crítica porque empieza con \"Yo opino\", pero sus argumentos (pionera, productiva, publicó, salió en TV) solo repiten datos del texto. No cuestiona ni sitúa la información en un contexto mayor.","Pista: lectura crítica es vincular el texto con su contexto social, histórico o ideológico y evaluarlo. Una opinión que solo resume el texto o una reacción emocional (como la A) no es lectura crítica."],"aprende_mas":[{"q":"¿Cuáles son los niveles de comprensión lectora y cómo se diferencian?","a":"- **Literal**: recupero lo que el texto dice explícitamente (\"nació en 1934\").\n- **Inferencial**: deduzco lo que no está dicho pero se desprende del texto.\n- **Crítico**: evalúo el texto relacionándolo con mi contexto, otros saberes o el contexto sociocultural."},{"q":"¿Por qué una reacción emocional no es lectura crítica?","a":"Decir \"me sentiría orgullosa\" muestra empatía o conexión personal, que es valiosa, pero no evalúa el texto ni su contexto. La lectura crítica exige razonar: ¿qué no dice el texto?, ¿qué contexto explica esto?, ¿qué postura tiene el autor?"},{"q":"¿Qué preguntas puede hacer el docente para promover lectura crítica?","a":"- ¿Por qué crees que hay pocas mujeres reconocidas en la ciencia?\n- ¿Qué intención tiene la institución que publica esta biografía?\n- ¿Qué información falta en el texto y por qué?\nEstas preguntas obligan a mirar el texto desde fuera y conectarlo con la sociedad."}],"duda":false},"2024-F1-34":{"n":34,"year":2024,"ctx":"2024-F1-c11","stem":"El docente busca que los estudiantes deduzcan información del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir que señalen los pasajes del texto que aludan a las investigaciones de Jane Goodall sobre los primates. Luego, solicitar que indiquen a qué se debe que sus hallazgos sean conocidos en el mundo.","B":"Pedir que identifiquen información del texto que se refiera a los primeros años de vida de Jane Goodall. Luego, solicitar que indiquen cuál fue la razón por la que vivía soñando con viajar a África.","C":"Pedir que subrayen las ideas del texto referidas a las cualidades que tiene Jane Goodall. Luego, solicitar que indiquen qué rol cumplieron esas cualidades en su trayectoria académica."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La clave es C porque el texto enumera cualidades (perseverancia, intuición, empatía, observación), pero no dice explícitamente qué rol cumplieron en su trayectoria académica: el estudiante debe deducir esa relación.","La B parece correcta porque pide una \"razón\", pero el texto la dice literalmente: soñaba con África \"debido a su inagotable curiosidad\". Lo mismo pasa con la A: los hallazgos son conocidos \"debido a los documentales\".","Pista: si la respuesta está escrita en el texto con un \"debido a\" o \"por esta razón\", es lectura literal. Deducir exige unir datos dispersos y construir una relación que el texto no explicita."],"aprende_mas":[{"q":"¿Cómo distingo una pregunta literal de una inferencial?","a":"Pregúntate: ¿puedo subrayar la respuesta tal cual en el texto? Si sí, es literal. Si tengo que unir varias partes o usar lo que ya sé para llegar a una conclusión, es inferencial. Ojo: la palabra \"por qué\" no garantiza inferencia."},{"q":"¿Qué tipos de inferencias pueden promoverse en el aula?","a":"- **Causa-efecto no explícita**: ¿qué permitió que Jane lograra tanto?\n- **Rasgos de personajes**: ¿cómo era Jane según sus acciones?\n- **Significado por contexto**: ¿qué significa \"etología\" aquí?\n- **Tema o idea principal**: ¿de qué trata globalmente el texto?"},{"q":"¿Por qué subrayar primero ayuda a inferir?","a":"Porque el estudiante reúne las pistas dispersas (cualidades en un párrafo, logros académicos en otro) antes de relacionarlas. Subrayar solo no es inferir; la inferencia ocurre cuando luego se pregunta cómo se conectan esas ideas."}],"duda":false},"2024-F1-35":{"n":35,"year":2024,"ctx":"2024-F1-c11","stem":"El docente busca que los estudiantes reflexionen sobre el contenido del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Solicitar que identifiquen los aportes de Jane Goodall a la primatología. Luego, mencionar que dichos aportes tienen vigencia porque cambiaron la perspectiva acerca de los métodos usados para realizar investigaciones sobre los primates.","B":"Preguntar si, actualmente, para sensibilizar a las personas acerca de la protección de los ecosistemas de los chimpancés, sería efectivo transmitir documentales sobre el trabajo de Jane Goodall. Luego, solicitar que ofrezcan razones que sostengan sus ideas.","C":"Compartir una semblanza acerca de la vida académica de Birutė Galdikas, científica dedicada a investigar orangutanes, y contemporánea de Jane Goodall. Luego, pedir que elaboren un cuadro de doble entrada que muestre las trayectorias de ambas científicas."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La clave es B porque pide a los estudiantes evaluar si transmitir hoy los documentales de Jane sensibilizaría sobre los ecosistemas, y fundamentar con razones. Relacionan el contenido con un contexto actual y toman posición.","La C parece adecuada porque amplía con otra científica, pero el cuadro de doble entrada solo organiza y compara datos de trayectorias. Es una tarea de procesamiento de información, no de reflexión ni opinión fundamentada.","Pista: reflexionar sobre el contenido implica opinar con argumentos sobre lo que dice el texto, vinculándolo a otras situaciones. Si el docente da la conclusión (como en la A), el estudiante no reflexiona."],"aprende_mas":[{"q":"¿Qué diferencia hay entre reflexionar sobre el contenido y sobre la forma?","a":"- **Contenido**: opino sobre las ideas, hechos o valores del texto (¿es efectivo?, ¿estoy de acuerdo?).\n- **Forma**: opino sobre cómo está escrito (estructura, recursos, lenguaje, eficacia del formato).\nAmbas pertenecen a la capacidad \"reflexiona y evalúa\" del CNEB."},{"q":"¿Por qué pedir razones es clave en una actividad de reflexión?","a":"Porque sin razones solo hay una opinión suelta (\"sí, sería efectivo\"). Al justificar, el estudiante vuelve al texto, lo conecta con su experiencia y construye un argumento. Eso es lo que la prueba considera reflexión auténtica."},{"q":"¿Cuándo la intertextualidad sí promueve reflexión?","a":"Cuando la comparación lleva a evaluar o tomar postura, por ejemplo: \"¿Cuál aporte crees que fue más relevante y por qué?\". Si solo se llena un cuadro con datos, se queda en organizar información."}],"duda":false},"2024-F1-36":{"n":36,"year":2024,"ctx":"2024-F1-c11","stem":"Los estudiantes han terminado de leer diversos textos sobre mujeres que actualmente destacan por su labor científica, como Jane Goodall en su momento. Dichos estudiantes dialogan con el docente acerca de que, en comparación con los hombres, son pocas las mujeres que tienen algún tipo de reconocimiento por su trabajo en la ciencia. En este contexto, el docente plantea las siguientes preguntas:\n\n“¿Creen que las estudiantes que lean estos textos podrían sentirse motivadas a estudiar una carrera científica? ¿Qué ideas de los textos podrían tener mayor influencia en su decisión?”.\n\n¿Por qué las preguntas realizadas por el docente son adecuadas para promover la reflexión sobre el contenido de textos escritos?","options":{"A":"Porque promueven que los estudiantes conozcan, sobre la base de información actualizada que ofrecen diversos textos, las posturas de varios autores acerca del rol de las mujeres en la ciencia.","B":"Porque promueven que los estudiantes fundamenten una posición, a partir de la vinculación de sus propias experiencias con información diversa sobre la contribución científica de las mujeres.","C":"Porque promueven que los estudiantes contrasten información de diversos textos e identifiquen la relevancia de los aportes que las mujeres han realizado a varias disciplinas científicas."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La clave es B porque las preguntas piden a los estudiantes opinar si las lectoras se motivarían y qué ideas influirían: deben tomar una posición y sustentarla vinculando su experiencia con lo leído sobre mujeres científicas.","La C parece correcta porque menciona varios textos y aportes, pero las preguntas no piden contrastar información ni evaluar la relevancia de los aportes; piden pensar en el efecto de los textos en las lectoras.","Pista: lee bien qué piden las preguntas del docente. \"¿Creen que…?\" y \"¿qué ideas influirían…?\" piden posición y argumentos, no identificar ni comparar datos."],"aprende_mas":[{"q":"¿Qué es fundamentar una posición en lectura?","a":"Es decir qué pienso sobre el texto y por qué, apoyándome en ideas del texto y en mi experiencia o conocimientos. Ejemplo: \"Sí, se motivarían, porque Jane empezó solo con curiosidad y llegó lejos; yo también siento eso\"."},{"q":"¿Por qué conectar el texto con la experiencia del estudiante?","a":"Porque así la lectura cobra sentido personal y social. El estudiante no solo recibe información, sino que se pregunta qué significa para su vida o su comunidad. Esto desarrolla la capacidad de reflexionar y evaluar del CNEB."},{"q":"¿Cómo se relaciona esta pregunta con el enfoque de igualdad de género?","a":"El diálogo sobre la poca visibilidad de las mujeres en la ciencia ayuda a cuestionar estereotipos. Cuando el docente pide reflexionar si las estudiantes se motivarían, promueve que ellas se vean capaces de elegir carreras científicas."}],"duda":false},"2024-F1-37":{"n":37,"year":2024,"ctx":"2024-F1-c12","stem":"El docente acompaña a los estudiantes en la planificación de sus cartas. En este contexto, uno de los estudiantes le comenta lo siguiente:\n\n“Profe, para conocer mejor el tema, tuve que revisar varias fuentes y algunas fueron difíciles de entender. Eh… en las fuentes, subrayé las ideas que me parecieron importantes e hice algunas anotaciones para elaborar un diagrama de llaves, que me ayudó a organizar mis ideas. Eh… yo quiero dar a conocer la utilidad de los espacios públicos para los niños. Eh… ahora sé que estos espacios son bien importantes para hacer deporte, por ejemplo. Lo que no sé aún es con qué ideas cerrar la carta”.\n\n¿Qué proceso de aprendizaje se evidencia en el comentario del estudiante?","options":{"A":"La metacognición para la planificación de textos.","B":"La transferencia de aprendizaje sobre la planificación de textos.","C":"La generación de conflicto cognitivo acerca de la planificación de textos."},"answer":"A","tema":"Planificación y procesos pedagógicos","explicacion":["La clave es A porque el estudiante describe cómo planificó (revisó fuentes, subrayó, hizo un diagrama de llaves), qué le ayudó y qué le falta (\"no sé con qué ideas cerrar\"): reflexiona sobre su propio proceso de aprendizaje.","La C parece correcta porque menciona dificultades, pero el conflicto cognitivo es un desequilibrio entre lo que el estudiante creía y una nueva información que lo contradice. Aquí no hay contradicción, hay conciencia de su proceso.","Pista: si el estudiante cuenta qué hizo, qué estrategia le sirvió y qué aún no logra, es metacognición. Busca frases como \"me ayudó\", \"me costó\", \"aún no sé\"."],"aprende_mas":[{"q":"¿Qué es la metacognición, en palabras simples?","a":"Es pensar sobre cómo uno aprende. El estudiante se da cuenta de qué estrategias usó, cuáles le funcionaron, qué le costó y qué hará para mejorar. Ejemplo: \"El diagrama de llaves me ayudó a ordenar; ahora necesito pensar el cierre\"."},{"q":"¿Cómo diferencio metacognición, transferencia y conflicto cognitivo?","a":"- **Metacognición**: reflexiono sobre mi propio proceso (\"hice esto, me ayudó, me falta esto\").\n- **Transferencia**: uso lo aprendido en una situación nueva y distinta.\n- **Conflicto cognitivo**: algo nuevo choca con lo que yo creía y me obliga a reajustar mis ideas."},{"q":"¿Cómo puede el docente promover la metacognición al escribir?","a":"Con preguntas como: ¿qué hiciste para organizar tus ideas?, ¿qué te resultó difícil?, ¿cómo lo resolviste?, ¿qué te falta? Puede usarlas durante la planificación y al final de la sesión, no solo al cierre."}],"duda":false},"2024-F1-38":{"n":38,"year":2024,"ctx":"2024-F1-c12","stem":"El docente les solicita a los estudiantes que lean un fragmento extraído de una de sus cartas y mencionen qué función cumplen los dos puntos. A continuación, se presenta dicho fragmento:\n\nLos espacios públicos son importantes porque contribuyen a la convivencia entre los ciudadanos de diversas maneras: estimulan que las personas pasemos tiempo juntas, favorecen que compartamos espontáneamente nuestras experiencias o motivan que realicemos actividades recreativas.\n\nTres estudiantes deciden intervenir. ¿Qué estudiante identifica la función de los dos puntos en la oración presentada?","options":{"A":"Andrea dice: “Me parece que los dos puntos se han utilizado para dar ejemplos que ilustren la idea anterior”.","B":"Brunela dice: “Pienso que los dos puntos sirven para anunciar que lo que sigue es una consecuencia de la oración anterior”.","C":"Carmen dice: “Creo que los dos puntos indican que la información que viene es la misma que la anterior, pero dicha en otras palabras”."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La clave es A porque después de los dos puntos se presentan maneras concretas (pasar tiempo juntos, compartir experiencias, actividades recreativas) que ilustran cómo los espacios públicos contribuyen a la convivencia \"de diversas maneras\".","La C parece correcta porque lo que sigue se relaciona con la idea anterior, pero no la repite con otras palabras: agrega casos específicos que antes no estaban. Reformular sería decir lo mismo de otro modo.","Pista: si la oración anterior anuncia algo general (\"de diversas maneras\") y luego vienen casos separados por comas o \"o\", los dos puntos introducen ejemplos o una enumeración que ilustra."],"aprende_mas":[{"q":"¿Cuáles son los usos más comunes de los dos puntos?","a":"- **Enumerar o ejemplificar**: \"Hay varias frutas: mango, piña y papaya\".\n- **Explicar o aclarar**: \"Tomó una decisión: renunciar\".\n- **Causa o consecuencia**: \"No estudió: desaprobó\".\n- **Cita textual**: Dijo: \"Vuelvo pronto\".\n- **Saludo en cartas**: \"Estimado alcalde:\"."},{"q":"¿Cómo enseñar puntuación sin caer en reglas memorizadas?","a":"Trabajando con los textos de los propios estudiantes: se lee el fragmento, se pregunta qué relación hay entre lo que va antes y después del signo, y se discute si cambia el sentido. Así entienden la función del signo en contexto."},{"q":"¿Qué diferencia hay entre ejemplificar y reformular?","a":"Ejemplificar es dar casos concretos de una idea general (\"diversas maneras: A, B o C\"). Reformular es repetir la misma idea con otras palabras, a menudo con \"es decir\" o \"o sea\". Si aparece información nueva y específica, no es reformulación."}],"duda":false},"2024-F1-39":{"n":39,"year":2024,"ctx":"2024-F1-c12","stem":"En plenaria, el docente les propone a los estudiantes revisar juntos las cartas que han escrito. En este contexto, una estudiante lee el siguiente fragmento de su carta:\n\nLos espacios públicos sirven para que todos los adolescentes se recreen y se distraigan. Por ejemplo, en estos espacios, pueden organizarse actividades deportivas y artísticas para ellos. De nada serviría una cancha y un parque grande si los adolescentes no los usan. En realidad, quizá no solo ellos, los adultos también deben aprovechar los espacios públicos.\n\nEl docente pregunta por la función que cumple el conector “en realidad” en el fragmento. Tres estudiantes ofrecen sus respuestas. ¿Qué estudiante identifica la función de dicho conector?","options":{"A":"Anel dice: “Yo pienso que ese conector se ha utilizado para expresar de manera más simple la información ofrecida en la idea anterior”.","B":"Brenda dice: “Creo que ese conector se ha usado para presentar una idea que le da más peso a lo que se dice en las oraciones anteriores”.","C":"Carolina dice: “A mí me parece que ese conector ha sido empleado para indicar que lo que sigue es una conclusión de la información anterior”."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La clave es B porque \"en realidad\" introduce una idea que refuerza y amplía lo anterior: no solo los adolescentes, también los adultos deben aprovechar los espacios. Da más fuerza al argumento de que los espacios públicos son valiosos.","La C parece correcta porque la idea aparece al final del fragmento, pero no es una conclusión que se derive de lo anterior: añade algo nuevo. La A falla porque no simplifica la idea previa, la amplía.","Pista: no te guíes por la posición del conector (al final no significa conclusión). Pregunta qué hace la idea que introduce: ¿resume, repite, deduce o refuerza y amplía?"],"aprende_mas":[{"q":"¿Qué funciones puede cumplir \"en realidad\" según el contexto?","a":"- **Reforzar o enfatizar**: presenta una idea que da más peso a lo anterior.\n- **Rectificar o matizar**: corrige o precisa lo dicho (\"Parecía fácil; en realidad, no lo era\").\nPor eso siempre hay que leer qué relación se establece con la idea anterior."},{"q":"¿Cómo distinguir un conector de conclusión de uno de reformulación?","a":"- **Conclusión**: la nueva idea se deduce de las anteriores (en conclusión, por lo tanto, en suma).\n- **Reformulación**: dice lo mismo de otra forma (es decir, o sea, en otras palabras).\nSi la idea nueva agrega información que no estaba, no es ninguna de las dos."},{"q":"¿Cómo trabajar la función de conectores en plenaria?","a":"Se lee el fragmento, se pide quitar el conector y ver si cambia el sentido, y se pregunta qué relación hay entre las ideas. Luego se prueba cambiarlo por otro (\"además\", \"incluso\") para que los estudiantes comparen y justifiquen."}],"duda":false},"2024-F1-40":{"n":40,"year":2024,"ctx":"2024-F1-c13","stem":"Un grupo de estudiantes comenta a la docente que ellos consideran que, para lograr el propósito del proyecto, sería mejor realizar un debate. Ante este comentario, la docente busca orientarlos para que identifiquen por qué la mesa redonda, y no el debate, es un género que se ajusta mejor al propósito de difundir información sobre los derechos de los niños, niñas y adolescentes. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Reproducir videos de debates y mesas redondas, y pedir que presten atención a las diferencias en la forma en que los temas son abordados en cada género. Luego, proponer que compartan las diferencias identificadas. Después, pedir que indiquen cuál es el género que pueden utilizar para lograr el propósito del proyecto.","B":"Mencionar que, en una mesa redonda, se busca abordar un tema específico fomentando el diálogo entre los participantes. Luego, comentar que, en un debate, en cambio, se argumenta a favor o en contra de un tema controversial. A partir de esto, preguntar si para lograr el propósito del proyecto deben confrontar posturas.","C":"Preguntar por qué afirman que un debate ayudaría a lograr el propósito del proyecto. Luego, pedir que expliquen si creen que escuchar un intercambio libre entre expertos acerca de este tema contribuiría o no al logro de dicho propósito. Sobre esta base, señalar que el género que se debería emplear es una mesa redonda."},"answer":"A","tema":"Comunicación oral","explicacion":["La clave es A porque los estudiantes observan debates y mesas redondas reales, identifican por sí mismos las diferencias en cómo se aborda el tema y luego deciden qué género sirve al propósito. Construyen el criterio.","La B parece correcta porque define bien ambos géneros, pero es la docente quien da la información; los estudiantes solo responden una pregunta cerrada. La C, además, impone la respuesta final (\"señalar que el género que se debería emplear…\").","Pista: cuando la pregunta busca que los estudiantes \"identifiquen\" algo, elige la opción donde ellos analizan ejemplos y llegan a la conclusión. Descarta las que el docente explica o decide por ellos."],"aprende_mas":[{"q":"¿Qué diferencia hay entre una mesa redonda y un debate?","a":"- **Mesa redonda**: varios expositores presentan información o enfoques sobre un tema para informar al público; hay diálogo, no confrontación.\n- **Debate**: dos posturas opuestas argumentan a favor o en contra de un tema controversial, con réplicas.\nPara difundir derechos del niño conviene la mesa redonda: el objetivo es informar, no ganar una discusión."},{"q":"¿Por qué usar modelos (videos, textos) para enseñar géneros orales?","a":"Porque el estudiante ve cómo funciona el género en la práctica: turnos, rol del moderador, tono, propósito. A partir de lo observado, reconoce sus rasgos y elige con criterio. Es más significativo que memorizar una definición."},{"q":"¿Cómo reconozco una acción pedagógica que favorece la autonomía?","a":"El docente propone una tarea (observar, comparar, analizar) y hace preguntas, pero deja que los estudiantes saquen la conclusión. Si la opción dice \"mencionar\", \"explicar\" o \"señalar que\" para dar la respuesta, normalmente es la trampa."}],"duda":false},"2024-F1-41":{"n":41,"year":2024,"ctx":"2024-F1-c13","stem":"La docente busca que los estudiantes desarrollen procesos metacognitivos vinculados con la producción de sus propios textos orales. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que compartan con sus compañeros los esquemas que usarán en la elaboración de los textos para la mesa redonda. Luego, solicitar que los lean y formulen comentarios al equipo correspondiente sobre las ideas que más llamaron su atención.","B":"Dialogar con los estudiantes en plenaria, y preguntar qué conocimientos y recursos creen que necesitarán para la mesa redonda. Luego, solicitar que elaboren una lista de estos conocimientos y recursos, y que propongan alternativas para contar con ellos.","C":"Entregar a los estudiantes una rúbrica en la que se describan los niveles de desempeño esperados de las intervenciones orales de la mesa redonda. Luego, solicitar que identifiquen en qué cambian los niveles propuestos en dicha rúbrica."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque pide a los estudiantes pensar qué conocimientos y recursos necesitarán para la mesa redonda y cómo conseguirlos: reflexionan sobre su propio proceso de producción, y eso es metacognición.","La C parece correcta porque usa una rúbrica, pero solo pide identificar en qué cambian los niveles: es analizar el instrumento, no reflexionar sobre lo que cada uno sabe, necesita o hace.","Pista: metacognición es que el estudiante piense sobre su propio proceso (qué sé, qué me falta, cómo lo resuelvo). Si la actividad mira hacia afuera (ideas de otros, un instrumento), no es metacognitiva."],"aprende_mas":[{"q":"¿Qué es la metacognición en palabras sencillas?","a":"Es pensar sobre cómo uno mismo aprende o produce algo. El estudiante se pregunta: ¿qué sé?, ¿qué me falta?, ¿cómo lo voy a conseguir?, ¿me está funcionando? Por ejemplo, antes de exponer anota que le falta conocer el artículo sobre el derecho a la identidad y decide buscarlo."},{"q":"¿En qué momentos de la producción oral cabe la metacognición?","a":"- **Antes**: identificar qué necesito saber y qué recursos usaré.\n- **Durante**: notar si el público me entiende y ajustar.\n- **Después**: evaluar qué salió bien y qué mejorar la próxima vez."},{"q":"¿Entregar una rúbrica ya promueve la metacognición?","a":"No por sí sola. La rúbrica ayuda si el estudiante la usa para mirarse a sí mismo: por ejemplo, escucharse grabado y ubicar en qué nivel está y por qué. Si solo la lee o compara niveles, se queda en conocer el instrumento."}],"duda":false},"2024-F1-42":{"n":42,"year":2024,"ctx":"2024-F1-c13","stem":"Un estudiante ha grabado en un audio la práctica de su texto oral sobre los derechos civiles de niños, niñas y adolescentes, y se lo presenta a la docente. Luego de escuchar el audio, ella nota que el estudiante utiliza únicamente el conector “además” para explicitar las relaciones de adición entre sus ideas. Por eso, busca orientarlo para que trabaje en el uso variado de conectores y expresiones entre las ideas de su texto oral. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Escuchar con el estudiante el audio de su texto oral y conversar con él acerca de la función que cumplen los conectores de adición. Después, solicitar que evalúe entre qué ideas de su texto oral puede emplear expresiones como “se podría añadir que”, o conectores como “asimismo”.","B":"Solicitar al estudiante que reproduzca el audio nuevamente y determinar qué ideas de su texto oral vinculó con el conector “además”. Después, pedir que, en una nueva práctica, incorpore diversos conectores de adición u otras expresiones para hacer explícita la relación que existe entre sus ideas.","C":"Reproducir el audio del texto oral para escucharlo con el estudiante y pedir que identifique qué conector usó para evidenciar la relación de adición entre sus ideas. Después, preguntar si considera necesario emplear otros conectores o expresiones para conectarlas, y en qué casos los utilizaría."},"answer":"C","tema":"Evaluación y retroalimentación","explicacion":["La C es correcta porque la docente escucha el audio con el estudiante y le pregunta qué conector usó, si necesita otros y en qué casos: él mismo descubre la repetición y decide cómo mejorar.","La A parece correcta porque también escuchan el audio y conversan, pero la docente entrega las soluciones (“asimismo”, “se podría añadir que”): el estudiante solo aplica lo que le dicen, no reflexiona por su cuenta.","Pista: en retroalimentación gana la alternativa que, con preguntas, hace que el estudiante identifique el problema y piense la mejora; pierde la que le da la respuesta (A) o le ordena el cambio (B)."],"aprende_mas":[{"q":"¿Qué tipos de retroalimentación distingue el Minedu?","a":"- **Elemental**: solo dice correcto o incorrecto.\n- **Descriptiva**: explica qué está bien o mal y da sugerencias concretas.\n- **Reflexiva o por descubrimiento**: con preguntas, guía al estudiante para que él encuentre el error y cómo mejorarlo. En el examen, casi siempre gana la reflexiva."},{"q":"¿Cómo distinguir una pregunta reflexiva de una que da la respuesta?","a":"La reflexiva deja la decisión al estudiante: “¿Crees que necesitas otro conector? ¿Dónde?”. La que da la respuesta ya trae la solución dentro: “¿No sería mejor usar ‘asimismo’?”. Si la pregunta se responde solo con “sí”, sospecha."},{"q":"¿Por qué conviene variar los conectores en un texto oral?","a":"Porque repetir siempre el mismo conector vuelve monótono el discurso. Variarlos (“también”, “asimismo”, “a esto se suma”) da fluidez y precisión. Es parte de organizar y desarrollar las ideas de forma coherente y cohesionada."}],"duda":false},"2024-F1-43":{"n":43,"year":2024,"ctx":"2024-F1-c14","stem":"Un equipo de estudiantes ha decidido elaborar un folleto que describa los pasos para reciclar los residuos sólidos producidos en la escuela. Durante la búsqueda de información, la docente nota que algunos estudiantes no están usando criterios apropiados para seleccionar fuentes confiables. Por esta razón, ella busca orientarlos en la identificación de algunos de estos criterios. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Entregar a los estudiantes una fuente confiable y otra que no lo sea, para que identifiquen, por ejemplo, si la información que ofrecen está respaldada por organizaciones dedicadas al cuidado del ambiente. Luego, pedir que expliquen por qué motivo creen que este respaldo serviría para reconocer fuentes confiables.","B":"Mencionar que las fuentes, además de ofrecer información actualizada y vigente, deben ser publicadas por un autor o autores expertos en el tema sobre el cuidado del ambiente. Luego, facilitar algunas fuentes confiables que sirvan de base para que empiecen la escritura de la primera versión de sus folletos.","C":"Compartir con los estudiantes un listado con los criterios que deben cumplir las fuentes confiables. Luego, solicitar que inicien la búsqueda de fuentes de información sobre el cuidado del ambiente, haciendo énfasis en que deben seleccionar, únicamente, las que cumplen los criterios incluidos en la lista."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque los estudiantes comparan una fuente confiable con otra que no lo es y, a partir de un criterio concreto (el respaldo de organizaciones ambientales), explican por qué sirve: construyen el criterio ellos mismos.","La C parece correcta porque ofrece criterios claros, pero entrega la lista hecha y pide obedecerla: los estudiantes aplican sin entender por qué una fuente es confiable. La B, además, se los dice el docente.","Pista: si el propósito es “orientarlos en la identificación” de algo, busca la alternativa donde el estudiante descubre comparando y justificando, no donde el docente dicta o reparte una lista."],"aprende_mas":[{"q":"¿Qué criterios hacen confiable una fuente?","a":"- **Autoría**: se sabe quién escribe y tiene respaldo (experto o institución).\n- **Actualidad**: la información está vigente.\n- **Propósito**: busca informar, no solo vender u opinar.\n- **Contraste**: coincide con otras fuentes serias."},{"q":"¿Por qué funciona contrastar una buena fuente con una mala?","a":"Porque el contraste hace visible la diferencia. Si el estudiante ve lado a lado la web de un ministerio y un blog anónimo, nota por sí mismo qué le falta al segundo. Así el criterio se entiende y se recuerda, no se memoriza."},{"q":"¿En qué momento de la escritura entra la búsqueda de fuentes?","a":"En la planificación. Antes de escribir, el estudiante define propósito, destinatario y tipo de texto, y busca y selecciona información. Si elige mal las fuentes aquí, todo el folleto tendrá datos dudosos."}],"duda":false},"2024-F1-44":{"n":44,"year":2024,"ctx":"2024-F1-c14","stem":"Otro equipo de estudiantes ha elaborado un ensayo expositivo sobre las prácticas individuales para el manejo adecuado de los residuos sólidos. Los estudiantes han terminado la primera versión de su escrito y le han pedido a la docente que lo revise para saber qué aspectos pueden mejorar. Este es un fragmento del escrito:\n\nPrácticas individuales\n\nUna forma fácil de cuidar nuestra localidad es no botar desperdicios a la vía pública, por eso, sugerimos esperar hasta ver un tacho de basura para botar envolturas de plástico o residuos de frutas, con nuestras familias podemos clasificar la basura de nuestra casa y botarla en lugares autorizados para que no termine en las calles.\n\nEn segundo lugar, no se debe tirar el plástico a la calle, como sugerencia para todos, debemos darle un nuevo uso al plástico para evitar que llegue a los océanos. Si no se cuida la forma en que desechamos el plástico, llegará a los ríos y terminará en el mar.\n\nLa docente nota que los estudiantes han usado comas en vez de puntos seguidos para delimitar sus ideas. Por ello, les ofrece comentarios para ayudarlos a identificar, por sí mismos, este problema. ¿Cuál de los siguientes comentarios es más adecuado para que la docente logre su propósito?","options":{"A":"“En el texto, mencionan: ‘En segundo lugar, no se debe tirar el plástico a la calle, como sugerencia para todos, debemos darle un nuevo uso al plástico’. ¿Cuál es la sugerencia: no tirar el plástico a la calle o darle un nuevo uso? ¿Creen que sería más clara esta parte si usan punto seguido? ¿En dónde podría colocarse dicho signo?”.","B":"“La oración ‘si no se cuida la forma en que desechamos el plástico, llegará a los ríos y terminará en el mar’ culmina en punto, y eso es correcto. En cambio, la oración ‘[…] sugerimos esperar hasta ver un tacho de basura para botar envolturas de plástico o residuos de frutas’ finaliza en coma. ¿Notan que la coma está mal usada?”.","C":"“Inician su texto con ‘una forma fácil de cuidar nuestra localidad es no botar desperdicios a la vía pública, por eso […]’ y usaron coma antes del conector. Los puntos pueden ayudar al lector a saber cuándo termina una idea y comienza otra. Lo más apropiado, en este caso, es indicar el fin de la oración utilizando un punto seguido antes del conector”."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque cita el fragmento y pregunta “¿Cuál es la sugerencia: no tirar el plástico o darle un nuevo uso?”: los estudiantes notan que la coma mezcla dos ideas y descubren dónde va el punto seguido.","La C parece correcta porque señala un caso real y explica para qué sirve el punto, pero termina dando la solución (“lo más apropiado es… un punto seguido”): los estudiantes no identifican el problema por sí mismos.","Pista: cuando el enunciado dice “identificar, por sí mismos”, descarta los comentarios que nombran el error o lo corrigen. Gana el que hace ver cómo el error afecta el sentido del texto."],"aprende_mas":[{"q":"¿Por qué la A parte del sentido y no de la regla?","a":"Porque el estudiante entiende mejor un signo cuando ve qué pasa si falta. Al preguntarle “¿cuál es la sugerencia?”, nota que la coma junta dos ideas y confunde al lector. La regla se aprende como solución a un problema real, no como dato suelto."},{"q":"¿Qué diferencia hay entre coma y punto seguido?","a":"- **Punto seguido**: cierra una idea completa; la siguiente oración sigue con el mismo tema.\n- **Coma**: separa partes dentro de una misma oración (elementos de una lista, incisos).\n- **Error típico**: unir dos oraciones completas solo con coma, como hicieron los estudiantes."},{"q":"¿Por qué la B tampoco funciona?","a":"Porque pregunta “¿Notan que la coma está mal usada?”: ya les dice dónde está el error y se responde con un “sí”. Además, no muestra por qué afecta la comprensión. Es una pregunta cerrada disfrazada de reflexión."}],"duda":false},"2024-F1-45":{"n":45,"year":2024,"ctx":"2024-F1-c15","stem":"El docente comenta a los estudiantes que los poemas “Vida aldeana” y “Raíz salvaje” tratan de modo diferente un tema en común: el amor. El docente busca que los estudiantes identifiquen la distinta manera en que los poemas abordan dicho tema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Solicitar que lean nuevamente los poemas y que identifiquen las figuras retóricas que hacen referencia al tema del amor. Sobre esta base, pedir que mencionen cuáles son las figuras distintas que se han utilizado en los poemas para hacer alusión a dicho tema.","B":"Preguntar si creen que en el poema “Raíz salvaje” se evidencia una perspectiva desbocada sobre el amor, y en “Vida aldeana”, una perspectiva idílica. Luego, pedir que, en ambos poemas, identifiquen las estrofas que den cuenta de estas perspectivas diferentes.","C":"Leer el poema “Vida aldeana” en voz alta reemplazando su segunda estrofa por la segunda estrofa de “Raíz salvaje”. A partir de esto, pedir que expliquen si se presentan diferencias en la forma en que los dos poemas aluden al tema del amor en sus versiones originales."},"answer":"C","tema":"Literatura","explicacion":["La C es correcta porque, al leer “Vida aldeana” con una estrofa de “Raíz salvaje”, los estudiantes perciben el choque de tono y luego explican cómo cada poema trata el amor: la diferencia la descubren ellos.","La B parece correcta porque pide buscar evidencias en las estrofas, pero el docente ya da la interpretación (“desbocada” e “idílica”): los estudiantes solo confirman lo que se les dijo.","Pista: en lectura literaria, descarta las alternativas donde el docente adelanta la interpretación. Gana la que crea una experiencia de contraste para que el estudiante construya su propia lectura."],"aprende_mas":[{"q":"¿Por qué intercambiar estrofas ayuda a comparar?","a":"Porque al meter una estrofa ajena, el poema “suena raro” y eso obliga a preguntarse por qué. Así el estudiante nota que “Vida aldeana” es sereno y armonioso, mientras “Raíz salvaje” es intenso y nostálgico. Es como probar una sopa con un ingrediente que no le corresponde: notas qué la hacía distinta."},{"q":"¿Qué problema tiene dar la interpretación al inicio?","a":"Que cierra la lectura. Si el docente dice “este poema es idílico”, el estudiante deja de interpretar y solo busca pruebas para esa idea. El CNEB pide que el estudiante construya y sustente sus propias interpretaciones."},{"q":"¿Por qué no basta con identificar figuras retóricas, como en la A?","a":"Porque nombrar figuras no explica la manera en que cada poema trata el amor. Dos poemas pueden usar metáforas y aun así tener tonos opuestos. La pregunta pedía el enfoque del tema, no un inventario de recursos."}],"duda":false},"2024-F1-46":{"n":46,"year":2024,"ctx":"2024-F1-c15","stem":"El docente tiene como propósito que los estudiantes construyan interpretaciones sobre el sentido global del poema titulado “Vida aldeana”. Por ello, en primer lugar, les ha propuesto que, en equipos, realicen comentarios sobre los temas abordados en el poema. Para continuar la secuencia iniciada por el docente, ¿cuál de las siguientes acciones es más adecuada?","options":{"A":"Enfatizar que, en las dos primeras estrofas, uno de los temas del poema es la armonía en la vida en el campo, y, en las dos últimas, la esperanza de volver a estar con el ser amado.","B":"Preguntar si creen que la división en dos pares de estrofas sirve para establecer una organización no solo en la forma, sino en los temas que aborda el poema.","C":"Solicitar que comenten qué diferencias y semejanzas existen entre los temas abordados en las dos primeras estrofas del poema y en las dos últimas."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque, después de comentar los temas, pide comparar semejanzas y diferencias entre las dos primeras estrofas y las dos últimas: así los estudiantes relacionan las partes y construyen el sentido global.","La B parece correcta porque apunta a la organización del poema, pero es una pregunta cerrada (“¿creen que…?”) que ya sugiere la respuesta; se contesta con sí o no y no exige integrar los temas.","Pista: sentido global es relacionar las partes del texto entre sí. Busca la acción que hace comparar o integrar ideas, no la que da la conclusión (A) ni la que la insinúa con una pregunta de sí o no (B)."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea de conjunto que sale de relacionar todas sus partes, no un tema suelto. En “Vida aldeana”, las primeras estrofas muestran la vida armoniosa en el campo y las últimas, el amor renovado bajo las estrellas; juntas expresan un amor que se vive en armonía con la naturaleza."},{"q":"¿Cómo se ve una secuencia bien armada hacia el sentido global?","a":"- **Primero**: identificar los temas o ideas de cada parte.\n- **Luego**: relacionarlos (semejanzas, diferencias, progresión).\n- **Al final**: formular una interpretación de todo el texto y sustentarla.\nLa C es justo el segundo paso."},{"q":"¿Cómo detectar una pregunta que “regala” la respuesta?","a":"Suele empezar con “¿Creen que…?”, “¿Notan que…?” o “¿No les parece que…?” y trae la idea del docente adentro; el estudiante solo dice sí. Una buena pregunta es abierta: “¿Qué semejanzas encuentran…?”, “¿Cómo se relacionan…?”."}],"duda":false},"2024-F1-47":{"n":47,"year":2024,"ctx":"2024-F1-c15","stem":"El docente tiene como propósito que los estudiantes identifiquen los recursos literarios que contribuyen a la construcción de interpretaciones sobre el sentido global del poema titulado “Vida aldeana”. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Volver a leer con los estudiantes, en plenaria, la primera y la tercera estrofa del poema. Luego, pedir que conversen sobre las expresiones “verde placidez” y “calma azul”. Finalmente, solicitar que compartan comentarios acerca de las coincidencias que pueden identificarse entre dichas expresiones.","B":"Pedir a los estudiantes que identifiquen las figuras retóricas usadas en los versos de la última estrofa del poema. Luego, solicitar que mencionen cuál es la figura retórica que creen que predomina en esa estrofa. Por último, preguntar si notan que dicha figura hace referencia al tema del amor abordado en el poema.","C":"Solicitar a los estudiantes que dialoguen acerca de los temas que creen que aborda el poema. Luego, proponer que relean el texto en voz alta haciendo énfasis en la cadencia que tienen los versos de dicho poema. Después, pedir que indiquen qué sensaciones les produce este ritmo considerando los temas que identificaron."},"answer":"C","tema":"Literatura","explicacion":["La C es correcta porque une recurso y sentido: primero dialogan sobre los temas, luego releen en voz alta atendiendo a la cadencia y explican qué sensaciones produce ese ritmo en relación con los temas identificados.","La A parece correcta porque trabaja “verde placidez” y “calma azul”, pero solo pide coincidencias entre dos expresiones: no conecta el recurso con los temas ni con la interpretación de todo el poema.","Pista: si el propósito habla de recursos que “contribuyen al sentido global”, la correcta debe tener los dos lados: percibir el recurso y relacionarlo explícitamente con lo que el poema expresa."],"aprende_mas":[{"q":"¿El ritmo cuenta como recurso literario?","a":"Sí. En poesía, el ritmo y la cadencia (cómo suenan los versos, sus pausas y acentos) también comunican. En “Vida aldeana”, los versos largos y pausados transmiten calma, igual que la vida tranquila del campo que se describe."},{"q":"¿Por qué ayuda leer poesía en voz alta?","a":"Porque muchos recursos se sienten mejor al oído: rima, ritmo, repeticiones, sonidos. Al leer en voz alta, el estudiante percibe la musicalidad y puede relacionarla con la emoción del poema. Es leer con el oído, no solo con los ojos."},{"q":"¿Qué falla en la B?","a":"Pide nombrar figuras y decir cuál predomina, que es un ejercicio técnico. Luego cierra con “¿notan que…?”, que entrega la conclusión hecha. Identificar figuras sin interpretarlas no construye sentido global."}],"duda":false},"2024-F1-48":{"n":48,"year":2024,"ctx":"2024-F1-c15","stem":"El docente y los estudiantes están dialogando sobre el poema “Raíz salvaje”. Tres estudiantes realizan comentarios sobre la última estrofa. Considerando el sentido global del poema, ¿cuál de los siguientes comentarios se ajusta más a la función que cumple dicha estrofa?","options":{"A":"“Creo que la última estrofa sirve para resaltar que el paisaje evocado y la voz poética tienen elementos comunes, y ayuda a conocer lo que la voz quiere de la persona a quien le habla”.","B":"“A mí me parece que la última estrofa sirve para dejar en claro que la voz poética no ha cambiado su manera de ser y, además, no tiene ninguna intención de querer hacerlo”.","C":"“Yo pienso que la última estrofa sirve para recordarnos uno de los temas a los que se refiere la voz poética, pues se usa la palabra ‘salvaje’, que está también en el título del poema”."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque relaciona la última estrofa (“Soy la misma muchacha salvaje”) con todo el poema: la voz comparte lo salvaje del paisaje evocado, y eso explica su deseo de llevar al amado a dormir al campo.","La B parece correcta porque la voz dice que es “la misma”, pero añade que “no tiene ninguna intención” de cambiar, idea que el poema no dice; además, se queda en esa estrofa sin vincularla con el resto.","Pista: en preguntas sobre la función de una parte según el sentido global, gana el comentario que conecta esa parte con el resto del texto. Descarta los que agregan ideas no dichas (B) o se quedan en lo superficial (C)."],"aprende_mas":[{"q":"¿Qué significa la “función” de una estrofa?","a":"Es para qué sirve esa parte dentro del poema completo: cerrar, explicar, contrastar, resumir. Para responder, pregúntate qué aporta a lo que se dijo antes. Aquí explica el deseo de la voz: si sigue siendo “salvaje”, quiere volver al campo con su amado."},{"q":"¿Cómo reconocer una sobreinterpretación?","a":"- **Se sostiene en el texto**: la voz sigue siendo la misma muchacha.\n- **Se agrega sin base**: que “no tiene ninguna intención” de cambiar.\nSi una alternativa afirma más de lo que el texto permite sostener, es trampa."},{"q":"¿Por qué la C es superficial?","a":"Porque solo se fija en que “salvaje” se repite en el título. Notar una repetición es un dato formal; no explica qué aporta la estrofa al sentido. Es como decir que un cuento trata de perros porque la palabra “perro” aparece mucho."}],"duda":false},"2024-F1-49":{"n":49,"year":2024,"ctx":"2024-F1-c15","stem":"El docente y los estudiantes han conversado sobre los temas abordados en el poema “Raíz salvaje”. En este contexto, el docente busca que identifiquen metáforas que contribuyen a construir interpretaciones sobre el sentido global de ese poema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Subrayar con los estudiantes las metáforas usadas en la tercera estrofa del poema. Luego, dialogar con ellos sobre lo que puede entenderse de cada una de esas metáforas teniendo en cuenta el contexto en que han sido usadas y proponer que expliquen si alguna de estas metáforas contribuye a interpretar el sentido global del poema.","B":"Comentar a los estudiantes que la metáfora es una figura retórica que consiste en la sustitución de un término por otro y, entre esos términos, se establece una relación de semejanza. Luego, pedir que compartan sus ideas sobre la metáfora “raíz salvaje” usada en el título y mencionar que esta contribuye a interpretar el sentido global del poema.","C":"Pedir a los estudiantes que lean el primer verso de la primera estrofa del poema e identifiquen la metáfora utilizada en ese verso. Luego, preguntar qué elementos componen esa metáfora y solicitar que fundamenten por qué se puede afirmar que la metáfora identificada contribuye a interpretar el sentido global del poema."},"answer":"A","tema":"Literatura","explicacion":["La A es correcta porque los estudiantes subrayan las metáforas de la tercera estrofa, las interpretan según su contexto y evalúan si alguna ayuda a entender el sentido global: identifican, interpretan y relacionan.","La C parece correcta porque también pide identificar y fundamentar, pero se limita a un solo verso y da por hecho que esa metáfora contribuye al sentido global: el estudiante justifica una conclusión ya dada, no la evalúa.","Pista: prefiere la acción que trabaja la metáfora en su contexto y deja abierta la evaluación (“si alguna contribuye”). Desconfía de las que definen el concepto y luego dan la conclusión (B)."],"aprende_mas":[{"q":"¿Qué es una metáfora, en simple?","a":"Es nombrar una cosa con otra por algún parecido, sin usar “como”. En “Raíz salvaje”, el “sabor de pitanga” que sube desde el fondo del alma no es un sabor real: expresa los recuerdos del campo que la voz lleva dentro."},{"q":"¿Por qué importa el contexto para interpretar una metáfora?","a":"Porque la misma imagen puede significar cosas distintas según el poema. “Fragancias de trigo” en un poema nostálgico evoca la vida en el campo; en otro podría hablar de trabajo o cosecha. Por eso hay que leerla junto a los versos que la rodean."},{"q":"¿Qué falla en la B?","a":"Empieza con una definición que da el docente, lo que es transmisivo. Luego pide ideas, pero el mismo docente cierra afirmando que la metáfora contribuye al sentido. El estudiante no llega a esa conclusión por sí mismo."}],"duda":false},"2024-F1-50":{"n":50,"year":2024,"ctx":"2024-F1-c16","stem":"Como parte del acompañamiento a los estudiantes, la docente les propone realizar diversas acciones para la producción de sus textos orales. ¿Cuál de las siguientes acciones promueve la planificación de dichos textos?","options":{"A":"Solicitar que, al pedir las donaciones, modulen sus tonos de voz para dirigirse a la audiencia.","B":"Pedir que, entre pares, ensayen sus exposiciones e intercambien sugerencias para mejorarlas.","C":"Indicar que busquen información especializada sobre los cuidados que se debe brindar a los animales."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque buscar información especializada sobre los cuidados de los animales ocurre antes de hablar: es preparar el contenido de la exposición, parte central de la planificación.","La B parece correcta porque el ensayo también ocurre antes de la exposición, pero ensayar e intercambiar sugerencias es revisar y mejorar un texto que ya está preparado, no planificarlo.","Pista: planificar un texto oral es decidir propósito, destinatario y registro, y buscar y organizar la información. Si la acción ya supone hablar (ensayar, modular la voz), no es planificación."],"aprende_mas":[{"q":"¿Qué incluye planificar un texto oral?","a":"- **Propósito**: para qué hablo (aquí, pedir donaciones).\n- **Audiencia**: a quién me dirijo y qué registro uso.\n- **Contenido**: qué información necesito y de dónde la saco.\n- **Organización**: en qué orden presento las ideas."},{"q":"¿En qué momento entra la modulación de la voz de la A?","a":"Durante la exposición, al usar recursos paraverbales como el tono, el volumen y las pausas. Es parte de la ejecución, no de la planificación. La alternativa lo dice claro: “al pedir las donaciones”."},{"q":"¿Por qué buscar información también importa en lo oral?","a":"Porque un buen discurso necesita contenido sólido, no solo buena voz. Si los estudiantes saben qué cuidados necesita un perro rescatado, su pedido de donaciones será más preciso y convincente."}],"duda":false},"2024-F1-51":{"n":51,"year":2024,"ctx":"2024-F1-c16","stem":"Un grupo de estudiantes ha invitado al aula al veterinario que colabora con el albergue para conocer qué cuidados necesitan los animales rescatados. Él está ofreciendo información sobre la alimentación de los animales, con el fin de orientar al grupo en el pedido de donaciones. A continuación, se presenta un fragmento de su exposición:\n\n“Buenos días, chicos y chicas. Gracias por invitarme a su salón para tratar este tema. Eh… ayuda mucho que todos contribuyamos con algo, por poco que sea. Este… a ver… voy a hablar sobre la alimentación de los animales. Eh… suele pasar que algunas personas donan las sobras de su comida… por lo general, huesos. Pero… es mejor que los animales no los coman, pues los huesos pueden provocarles sofocamiento. Eh… por otra parte, sugiero que pidan bidones o botellas de agua porque los animales necesitan estar bien hidratados. Ahora, si alguien quiere donar comida, puede ir al albergue a preguntar qué comida necesitan los animales. Esto es necesario porque su alimentación está en función de su estado de salud, edad, tamaño y peso. Este… no sé si tienen alguna pregunta o comentario…”.\n\nTres estudiantes deciden intervenir. ¿Cuál de los siguientes comentarios evidencia una reflexión sobre el contenido de la exposición del veterinario?","options":{"A":"“A mí también me parece que, si todos ayudamos, los animales van a estar mejor. Pero no estoy muy segura de que sea una buena idea pedir agua”.","B":"“En el albergue, nos pueden dar información sobre la comida que necesitan los animales. Con ese dato, podemos pedir las donaciones”.","C":"“No sabía que debemos evitar darles huesos a los animales. Por lo que usted nos cuenta, los huesos pueden hacerles mucho daño”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta porque la estudiante toma posición frente a lo dicho: coincide en que todos ayuden y duda de que «sea una buena idea pedir agua». Opinar y cuestionar el contenido es reflexionar sobre él.","La C parece correcta porque muestra interés («No sabía…»), pero solo repite lo que dijo el veterinario sobre los huesos. Reformular la información es comprenderla, no evaluarla.","Pista: reflexionar sobre el contenido es opinar, valorar, estar de acuerdo o en desacuerdo con razones. Si el comentario solo repite o parafrasea lo escuchado, es nivel literal."],"aprende_mas":[{"q":"¿Qué niveles de comprensión se trabajan en la competencia oral del CNEB?","a":"- **Obtiene información**: recupera datos dichos explícitamente.\n- **Infiere e interpreta**: deduce lo no dicho, como la intención del hablante.\n- **Reflexiona y evalúa**: opina sobre el contenido, la forma y el contexto del texto oral, con argumentos."},{"q":"¿Cómo se ve un comentario reflexivo en una exposición escolar?","a":"Tiene una postura y, si es posible, una razón. Por ejemplo: «No estoy de acuerdo con pedir solo agua, porque el albergue también necesita medicinas». Expresa acuerdo o desacuerdo, duda o propone algo a partir de lo escuchado."},{"q":"¿Cómo ayudo a mis estudiantes a pasar de repetir a reflexionar?","a":"Haz preguntas que pidan juicio, no datos: «¿Te parece adecuado lo que propone?, ¿por qué?», «¿Qué cambiarías?». También puedes darles inicios de frase como «Estoy de acuerdo en… pero…» para que practiquen tomar postura."}],"duda":false},"2024-F1-52":{"n":52,"year":2024,"ctx":"2024-F1-c16","stem":"Un equipo de estudiantes ha elaborado su exposición dirigida a los docentes de la IE. Una de las integrantes del equipo está practicando su presentación con la docente. A continuación, se presenta la transcripción de un fragmento de su texto:\n\n“Estimados profesores, eh… los estudiantes de tercero estamos participando en una campaña de donación de comida para perros y gatos... eh… para donarla al albergue local, ya que esos animales no tienen suficiente comida y están de hambre. Este… como estamos haciendo una campaña para juntar comida para perros y gatos, hemos venido a solicitarles una donación de alimentos. Eh… entonces, este… para la campaña de recolección de alimentos para perros y gatos que estamos haciendo, nosotros, los alumnos de tercero, queremos pedirles que puedan donar alimentos…”.\n\nLa docente le pide a la estudiante que haga una pausa en su texto oral para ofrecerle una retroalimentación que la ayude a mejorar. ¿Cuál de los siguientes problemas de coherencia presenta dicho texto?","options":{"A":"La falta de unidad temática del texto oral.","B":"La ausencia de progresión de ideas del texto oral.","C":"Los vacíos de información para conocer el propósito del texto oral."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta: la estudiante repite tres veces la misma idea (campaña, comida para perros y gatos, pedir donación) sin añadir información nueva. El texto da vueltas en el mismo punto y no avanza.","La A parece correcta porque el texto suena desordenado, pero sí tiene unidad temática: todo trata de la campaña de donación. No se desvía a otros temas; el problema es la repetición.","Pista: si el texto se sale del tema, falta unidad; si repite lo mismo sin agregar nada, falta progresión; si no se entiende para qué se habla, falta información sobre el propósito."],"aprende_mas":[{"q":"¿Qué es la progresión temática en un texto?","a":"Es el avance de la información: cada idea nueva se apoya en lo ya dicho y agrega algo más. Por ejemplo: «Hacemos una campaña. La campaña busca alimentos. Los alimentos irán al albergue de Surco». Cada oración suma un dato."},{"q":"¿Cuáles son las propiedades de la coherencia que evalúa el Minedu?","a":"- **Unidad temática**: todo gira en torno a un mismo tema.\n- **Progresión**: la información avanza sin repeticiones innecesarias.\n- **No contradicción**: las ideas no se oponen entre sí.\n- **Relación lógica**: las ideas se conectan de forma ordenada (causa, consecuencia, etc.)."},{"q":"¿Cómo retroalimento a un estudiante cuyo texto no progresa?","a":"Pídele que diga cada idea en una oración y que marque cuáles se repiten. Luego pregúntale: «¿Qué dato nuevo podrías decir aquí? ¿Cuánto necesitan? ¿Dónde pueden dejar la donación?». Así descubre por sí mismo qué falta."}],"duda":false},"2024-F1-53":{"n":53,"year":2024,"ctx":"2024-F1-c16","stem":"La docente busca que los estudiantes autoevalúen sus exposiciones. Para ello, ha elaborado una lista de cotejo con varias preguntas. ¿Cuál de las preguntas extraídas de dicha lista se centra en que identifiquen las secuencias argumentativas de sus exposiciones?","options":{"A":"¿Basé los argumentos de mi texto oral en fuentes de información confiables?","B":"¿Usé argumentos para persuadir a la audiencia y dejar clara mi postura?","C":"¿Organicé mis argumentos utilizando conectores de orden?"},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque pregunta si usó argumentos para dejar clara su postura y persuadir. Eso es lo que define una secuencia argumentativa: una tesis sostenida por argumentos.","La C parece correcta porque habla de organizar argumentos, pero se centra en los conectores de orden, que son un recurso de cohesión. Un texto puede tener «primero, segundo» sin argumentar nada.","Pista: para reconocer una secuencia textual, busca su estructura básica. En la argumentativa: postura más razones. Las fuentes (A) y los conectores (C) son aspectos de otros criterios."],"aprende_mas":[{"q":"¿Qué es una secuencia textual?","a":"Es un bloque del texto con una estructura reconocible: narrativa, descriptiva, expositiva, argumentativa o dialogal. Un mismo texto puede combinar varias. En una exposición para pedir donaciones, por ejemplo, se explica la situación del albergue y luego se argumenta por qué donar."},{"q":"¿Qué partes tiene una secuencia argumentativa?","a":"- **Tesis o postura**: lo que defiendo («Debemos donar alimento»).\n- **Argumentos**: las razones que la sostienen («Los animales están desnutridos»).\n- **Conclusión**: el cierre que refuerza la postura o invita a actuar."},{"q":"¿Cómo hago una lista de cotejo que evalúe un solo aspecto?","a":"Cada pregunta debe apuntar a un criterio distinto. Si quieres evaluar la argumentación, pregunta por postura y razones; si quieres cohesión, por conectores; si quieres fuentes, por su confiabilidad. Mezclarlos en un ítem impide saber qué debe mejorar el estudiante."}],"duda":false},"2024-F1-54":{"n":54,"year":2024,"ctx":"2024-F1-c17","stem":"Los estudiantes se encuentran intercambiando comentarios acerca del texto. ¿Cuál de los estudiantes expresa un comentario que se centra en la deducción de información de dicho texto?","options":{"A":"Ana dice: “La ‘ballena primitiva’ se alimentaba de las antiguas sardinas y tiburones. En el texto, no se menciona qué hicieron los investigadores para averiguar eso”.","B":"Braulio dice: “A algunos de mis amigos les gusta ir a museos que muestran restos de dinosaurios. Pienso que ellos considerarían que el texto resulta muy interesante”.","C":"Carla dice: “En una zona de Ica, había un lugar seguro para los cetáceos de hace millones de años. En ese lugar, que hoy es un desierto, debe haber más fósiles de animales”."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: Carla deduce que la zona era un «lugar seguro» (el texto dice que estaba protegida de las corrientes) y concluye que «debe haber más fósiles». Ninguna de esas ideas aparece tal cual; las construye.","La A parece correcta porque Ana menciona datos del texto, pero luego señala lo que el texto no explica. Eso es evaluar el contenido, no deducir. Además, su primera parte solo reformula información explícita.","Pista: deducir es llegar a una idea nueva a partir de pistas del texto. Si el comentario repite datos, es literal; si juzga al texto o lo relaciona con la vida personal, es reflexión."],"aprende_mas":[{"q":"¿Qué diferencia hay entre deducir y opinar sobre un texto?","a":"Deducir es sacar una conclusión que el texto permite, aunque no la diga: si el lugar era protegido, ahí se refugiaban animales. Opinar es valorar el texto desde tu punto de vista: «le falta explicar cómo lo averiguaron». La deducción se apoya en el texto; la opinión lo juzga."},{"q":"¿Qué tipos de inferencia se trabajan en Secundaria?","a":"- **Causa o consecuencia**: por qué pasó algo o qué provocó.\n- **Significado por contexto**: qué quiere decir una palabra o expresión.\n- **Tema e idea principal**: de qué trata el texto en conjunto.\n- **Propósito**: para qué fue escrito."},{"q":"¿Qué rol cumple el comentario de Braulio en el texto?","a":"Braulio relaciona el texto con los gustos de sus amigos. Es una conexión personal y una valoración del interés del texto, no una deducción. Sirve para motivar, pero no demuestra comprensión inferencial."}],"duda":false},"2024-F1-55":{"n":55,"year":2024,"ctx":"2024-F1-c17","stem":"Para contribuir a la comprensión del texto, el docente plantea diversas preguntas a los estudiantes. ¿Cuál de las siguientes preguntas se centra en la obtención de información explícita?","options":{"A":"¿Por qué a la especie Peregocetus pacificus se le conoce como la “Ballena viajera del Pacífico”?","B":"¿Cuál de los especialistas mencionados en el texto aportó a la difusión del hallazgo del Basilosaurus?","C":"¿Qué impacto puede tener para la paleontología el descubrimiento de fósiles en territorio peruano?"},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque la respuesta está escrita en el recuadro: se le llama «Ballena viajera del Pacífico» porque su linaje habría cruzado barreras oceánicas desde Asia o África. Basta con ubicar el dato.","La C parece correcta porque el texto menciona que el hallazgo «supone un hito», pero pregunta por el impacto de los fósiles peruanos en general y en futuro («puede tener»). Exige proyectar e interpretar, no localizar.","Pista: no te fíes de la palabra «por qué». Una pregunta es literal si su respuesta está escrita en el texto, aunque pida una causa. Verifica siempre si puedes señalar la respuesta con el dedo."],"aprende_mas":[{"q":"¿Cómo distingo una pregunta literal de una inferencial?","a":"Hazte una prueba: ¿puedo subrayar la respuesta en el texto? Si sí, es literal. Si tengo que juntar pistas, completar algo no dicho o generalizar, es inferencial. La palabra inicial (qué, por qué, cuál) no decide el nivel."},{"q":"¿Por qué la pregunta B no es literal?","a":"El texto nunca dice quién «difundió» el hallazgo. Habla de quien lo descubrió (Urbina) y de quien trabaja en el museo donde se exhibe (Salas-Gismondi). El lector debe deducir quién aportó a la difusión, así que requiere inferir."},{"q":"¿Para qué sirven las preguntas literales si son las más simples?","a":"Aseguran la base: sin ubicar bien los datos, no se puede inferir ni opinar con fundamento. En aula, conviene usarlas al inicio y luego subir a preguntas inferenciales y críticas sobre el mismo texto."}],"duda":false},"2024-F1-56":{"n":56,"year":2024,"ctx":"2024-F1-c17","stem":"En otro momento, el docente solicita a los estudiantes que realicen comentarios sobre diferentes aspectos del texto. ¿Cuál de los siguientes comentarios es una conclusión de dicho texto?","options":{"A":"“Los expertos en paleontología lograron descubrir que el Basilosaurus fue una ballena que tenía cuatro patas”.","B":"“El agua fría del mar influyó en que cetáceos, como las ballenas, hayan viajado desde Asia hasta las costas del Pacífico”.","C":"“El estudio de los restos de la ‘ballena primitiva’ contribuyó a que sepamos qué animales llegaban a los antiguos mares peruanos”."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: une varias ideas del texto (los fósiles permiten «reconstruir la historia del mar peruano», qué criaturas llegaban a Ocucaje) en una idea general que el texto respalda. Eso es una conclusión.","La A parece correcta porque menciona «cuatro patas», un dato que sí está en el texto, pero corresponde al Peregocetus del recuadro, no al Basilosaurus. Mezcla información de dos especies.","Pista: una conclusión resume o integra ideas del texto en una afirmación general y fiel. Descarta las que confunden a quién se refiere un dato o contradicen el texto (B: el mar era cálido, no frío)."],"aprende_mas":[{"q":"¿Qué es una conclusión en comprensión lectora?","a":"Es una idea que se obtiene al integrar varias partes del texto. No está escrita tal cual, pero el texto la sostiene. Por ejemplo: si los fósiles permiten reconstruir el mar antiguo, se concluye que su estudio ayuda a conocer qué animales vivían allí."},{"q":"¿Qué trampas usa el Minedu en preguntas de conclusión?","a":"- **Dato cruzado**: atribuye a un personaje o especie lo que corresponde a otro (la A).\n- **Dato invertido**: dice lo contrario del texto (la B: agua fría).\n- **Dato verdadero pero aislado**: un detalle cierto que no resume nada."},{"q":"¿Cómo leer textos con recuadros sin confundirse?","a":"Enseña a leer el cuerpo y los recuadros por separado y a preguntarse: «¿de quién habla este bloque?». Una tabla rápida con dos columnas (Basilosaurus / Peregocetus) ayuda a no mezclar fechas, lugares y rasgos."}],"duda":false},"2024-F1-57":{"n":57,"year":2024,"ctx":"2024-F1-c17","stem":"El docente busca que los estudiantes reflexionen sobre el contenido del texto. ¿Cuál de las siguientes preguntas es adecuada para ello?","options":{"A":"¿Por qué el hallazgo del Basilosaurus es “extraordinario” según el texto?","B":"¿En qué tipo de páginas web podría ser publicada la información del texto?","C":"¿Con qué intención se ofrecen datos colocados entre paréntesis en el texto?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta: para decidir en qué páginas web podría publicarse, el estudiante debe valorar qué tipo de información es (científica, de divulgación) y para qué público sirve. Es juzgar el contenido.","La A parece correcta porque «extraordinario» invita a pensar, pero dice «según el texto»: la respuesta está escrita (su excelente estado de conservación). Es una pregunta literal.","Pista: reflexionar sobre el contenido exige emitir un juicio propio sobre lo que dice el texto. La C también es reflexión, pero sobre la forma (los paréntesis), no sobre el contenido."],"aprende_mas":[{"q":"¿Qué diferencia hay entre reflexionar sobre contenido y sobre forma?","a":"- **Contenido**: qué dice el texto. Se pregunta si es útil, confiable, para quién sirve, si estás de acuerdo.\n- **Forma**: cómo está hecho. Se pregunta por recursos como recuadros, paréntesis, títulos o citas y para qué se usan."},{"q":"¿Qué señal indica que una pregunta es literal aunque parezca crítica?","a":"La expresión «según el texto» o «de acuerdo con el autor». Indica que la respuesta está en el texto. En cambio, «¿qué opinas?», «¿te parece?» o «¿dónde podría…?» piden un juicio del lector."},{"q":"¿Qué preguntas de reflexión sobre contenido puedo usar con este texto?","a":"Por ejemplo: «¿Te parece confiable la información? ¿Por qué?», «¿A quién le serviría leer esta noticia?», «¿Qué información le falta para convencerte de que es una especie nueva?». Todas piden al estudiante evaluar, no solo recordar."}],"duda":false},"2024-F1-58":{"n":58,"year":2024,"ctx":"2024-F1-c17","stem":"Continuando con la actividad de lectura, el docente busca que los estudiantes deduzcan información del texto. ¿Cuál de las siguientes preguntas es más adecuada para ello?","options":{"A":"¿Se podría utilizar alguna idea del texto para motivar que las personas realicen visitas a los museos?","B":"¿Qué información del texto permite conocer las características físicas que presentó el Basilosaurus?","C":"¿En qué consiste la labor principal de los profesionales que se dedican a la paleontología según el texto?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: el texto nunca define la paleontología.
