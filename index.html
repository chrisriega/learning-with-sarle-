El estudiante debe deducir la labor de esos profesionales a partir de lo que hacen Urbina y Salas-Gismondi: hallar fósiles, estudiarlos y reconstruir la historia del mar.","La B parece correcta porque dice «permite conocer», pero solo pide ubicar los datos explícitos del Basilosaurus: 17 metros de longitud y una poderosa dentadura. Es localización de información.","Pista: una pregunta es inferencial cuando obliga a reunir pistas dispersas para construir una idea que el texto no dice. La A, en cambio, pide valorar el uso del texto, es reflexión."],"aprende_mas":[{"q":"¿Por qué la frase «según el texto» no vuelve literal la pregunta C?","a":"Porque indica que la respuesta debe sustentarse en el texto, no que esté escrita. Aquí no hay una definición de paleontología; hay que armarla con las acciones de los expertos. El texto da las pistas, el lector construye la idea."},{"q":"¿Qué es una inferencia por generalización?","a":"Es pasar de casos concretos a una idea general. Si un paleontólogo halló un cráneo, otro estudia fósiles en un museo y ambos reconstruyen el pasado marino, se generaliza: la paleontología estudia la vida antigua a través de fósiles."},{"q":"¿Cómo acompaño a un estudiante que no logra inferir?","a":"- **Modela**: piensa en voz alta y muestra cómo juntas pistas.\n- **Guía**: pide subrayar lo que hacen los paleontólogos en el texto.\n- **Pregunta puente**: «Si hacen todo esto, ¿en qué consiste su trabajo?»."}],"duda":false},"2024-F1-59":{"n":59,"year":2024,"ctx":"2024-F1-c17","stem":"El docente busca que los estudiantes reflexionen sobre los aspectos formales del texto. ¿Cuál de las siguientes acciones pedagógicas es adecuada para ello?","options":{"A":"Pedir a los estudiantes que identifiquen el propósito del texto. Luego, solicitar que expliquen si es necesario añadir o modificar información, de modo que dicho propósito quede más claro.","B":"Proponer a los estudiantes que identifiquen la información del texto referida al Peregocetus pacificus. Luego, pedir que comenten por qué creen que dicha información ha sido colocada en recuadros.","C":"Presentar a los estudiantes los usos que se les dan a las citas en una fuente de información. Luego, proponer que subrayen las ideas del texto acerca del Basilosaurus en las que identifiquen algunos de esos usos."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta: pide explicar «por qué creen que dicha información ha sido colocada en recuadros». Los recuadros son un recurso formal, y preguntarse por su función es reflexionar sobre la forma del texto.","La C parece correcta porque las citas también son un recurso formal, pero la docente da la explicación de antemano y los estudiantes solo subrayan ejemplos. Es identificar y aplicar, no reflexionar sobre el efecto.","Pista: en reflexión sobre la forma, busca la opción que pide al estudiante explicar para qué sirve un recurso (recuadro, título, cita). La A trabaja el propósito y el contenido, no la forma."],"aprende_mas":[{"q":"¿Qué aspectos formales de un texto se pueden analizar?","a":"- **Organización**: párrafos, recuadros, subtítulos, columnas.\n- **Recursos gráficos**: negritas, imágenes, signos como paréntesis o comillas.\n- **Recursos textuales**: citas de expertos, ejemplos, preguntas al lector («¿Sabías que…?»)."},{"q":"¿Por qué no basta con identificar el recurso?","a":"Identificar es reconocer que algo está ahí; reflexionar es explicar qué efecto produce. Por ejemplo, el recuadro «¿Sabías que…?» separa datos curiosos para que el lector no pierda el hilo principal y despierte su interés."},{"q":"¿Cómo planteo una buena pregunta de reflexión sobre la forma?","a":"Usa la estructura: «¿Por qué crees que el autor usó…?» o «¿Qué pasaría si quitáramos…?». Por ejemplo: «¿Qué pasaría si la información del recuadro estuviera dentro del texto principal?». Obliga a pensar en la función del recurso."}],"duda":false},"2024-F1-60":{"n":60,"year":2024,"ctx":"2024-F1-c17","stem":"El docente busca que los estudiantes profundicen en la comprensión del texto. Por esta razón, propone que, en pares, realicen algunas acciones. ¿Cuál de las siguientes acciones supone una mayor demanda cognitiva?","options":{"A":"Pedir que identifiquen los pasajes del texto que aluden al Basilosaurus y que subrayen los que permiten sostener que podría ubicarse en la cima de la cadena alimenticia.","B":"Pedir que dialoguen sobre el aspecto físico que, según el texto, habría tenido el Basilosaurus y que mencionen qué sensaciones les genera dicho aspecto.","C":"Pedir que comenten si creen que la información del texto sobre el hallazgo del fósil del Basilosaurus puede ser corroborada y que planteen sus razones."},"answer":"C","tema":"Planificación y procesos pedagógicos","explicacion":["La C es correcta: pide juzgar si la información «puede ser corroborada» y dar razones. Implica evaluar la confiabilidad del texto (fuentes, expertos, institución) y argumentar: es pensamiento crítico.","La A parece correcta porque pide subrayar pasajes que «permiten sostener» una idea, pero esa idea ya la da el texto. Es localizar evidencias de una afirmación presente, una tarea literal o inferencial sencilla.","Pista: a mayor demanda cognitiva, más trabajo de pensamiento propio: evaluar, juzgar y argumentar están por encima de ubicar, relacionar o expresar sensaciones (la B, respuesta afectiva)."],"aprende_mas":[{"q":"¿Qué significa demanda cognitiva en una actividad?","a":"Es el nivel de esfuerzo mental que exige. Baja: recordar o ubicar datos. Media: relacionar, inferir, comparar. Alta: evaluar, argumentar, crear o resolver problemas nuevos. Es uno de los criterios de la rúbrica de observación de aula del Minedu."},{"q":"¿Cómo ordeno las actividades de lectura de menor a mayor exigencia?","a":"- **Literal**: ¿cuánto medía el Basilosaurus?\n- **Inferencial**: ¿por qué habrían ido a reproducirse a Ocucaje?\n- **Crítico**: ¿es confiable esta información?, ¿cómo podrías comprobarlo?"},{"q":"¿Qué rol tiene el trabajo en pares en una tarea de alta demanda?","a":"Permite contrastar razones antes de dar una respuesta. Si una pareja duda de la corroboración, debe convencer a la otra con argumentos. Así el diálogo hace visible el razonamiento y el docente puede retroalimentarlo."}],"duda":false},"2023-F1-01":{"n":1,"year":2023,"stem":"Fernanda es una estudiante que presenta discapacidad física y se traslada en silla de ruedas. Ella se va a incorporar la siguiente semana a un aula de una institución educativa. Por ello, el docente del aula realiza una asamblea con los estudiantes con el propósito de sensibilizarlos sobre la condición que presenta Fernanda. En este contexto, tres estudiantes comparten sus comentarios sobre las formas en que podrían ayudar a Fernanda a desplazarse en el colegio. ¿Cuál de los siguientes comentarios de los estudiantes está alineado al enfoque inclusivo del Currículo Nacional de la Educación Básica?","options":{"A":"“Para movilizar a Fernanda, es necesario que la llevemos en su silla de ruedas a todos los lugares a donde vayamos. De esta manera, la ayudaremos a desplazarse por todo el colegio y estará siempre acompañada”.","B":"“Si deseamos ayudar a Fernanda a movilizarse en el colegio, primero debemos preguntarle en qué casos requiere nuestro apoyo. Yo pienso que ella nos podría orientar sobre cuál es la mejor forma en que podemos ayudarla”.","C":"“Considero que siempre debemos estar pendientes de Fernanda para poder ayudarla cuando quiera movilizarse. Propongo que organicemos turnos entre nosotros para cuidarla y así evitar que tenga algún accidente en el colegio”."},"answer":"B","tema":"Inclusión y DUA","explicacion":["La B es correcta: propone “primero preguntarle en qué casos requiere nuestro apoyo”. Reconoce a Fernanda como persona autónoma que decide qué ayuda necesita, que es la base del enfoque inclusivo.","La C parece correcta porque muestra solidaridad, pero “organizar turnos para cuidarla” la trata como alguien frágil que necesita vigilancia constante. Es sobreprotección: decide por ella y le quita autonomía.","Pista: en inclusión, la respuesta correcta suele dar voz y decisión a la persona con discapacidad. Desconfía de las alternativas con “siempre”, “cuidarla” o “llevarla a todos lados”."],"aprende_mas":[{"q":"¿Qué diferencia hay entre ayudar y sobreproteger a un estudiante con discapacidad?","a":"Ayudar es dar el apoyo que la persona necesita y acepta. Sobreproteger es decidir por ella y hacer lo que puede hacer sola. Ejemplo: empujar la silla sin preguntar es sobreproteger; decir “¿te ayudo en la rampa?” es ayudar."},{"q":"¿Qué plantea el enfoque inclusivo o de atención a la diversidad del CNEB?","a":"- **Igualdad de oportunidades**: todos tienen derecho a aprender con calidad, sin exclusión.\n- **Valoración de la diversidad**: las diferencias son riqueza, no un problema.\n- **Participación y autonomía**: el estudiante con discapacidad participa y decide como cualquier compañero."},{"q":"¿Qué son las “barreras” en el modelo social de la discapacidad?","a":"Son los obstáculos del entorno que impiden participar: escaleras sin rampa, actitudes de lástima o actividades rígidas. Según este modelo, la escuela debe quitar barreras, no “arreglar” al estudiante. Ejemplo: ubicar el aula en el primer piso o gestionar una rampa."}],"duda":false},"2023-F1-02":{"n":2,"year":2023,"stem":"En el marco de un proyecto denominado “Yo cuido mi barrio”, los estudiantes de una institución educativa han identificado diversos problemas que afectan los espacios públicos de la localidad. Ellos comentan que uno de estos problemas es no poder utilizar la losa deportiva del barrio, debido a que se encuentra deteriorada.\n\nEn este contexto, la docente tiene como propósito que los estudiantes aborden este problema desde el enfoque de derechos del Currículo Nacional de la Educación Básica. ¿Cuál de las siguientes acciones pedagógicas es más pertinente para ello?","options":{"A":"Solicitar a los estudiantes que recojan las quejas de los vecinos de la localidad sobre el estado de la losa deportiva. Luego, pedir que organicen la información recabada y, considerando esto, que elaboren una solicitud dirigida a la municipalidad del distrito, con la finalidad de que se halle una solución que atienda las quejas de los vecinos.","B":"Realizar una plenaria con los estudiantes y dialogar sobre las mejoras que requiere la losa deportiva para que los vecinos puedan usarla. Luego, compartir acciones de participación realizadas en distintas localidades para resolver un problema similar y, sobre esta base, pedir que seleccionen la que sea más factible de replicar en su localidad.","C":"Conversar con los estudiantes sobre las limitaciones que produce no poder usar la losa deportiva en sus vidas y en las de los vecinos. Luego, solicitar que expliquen si consideran necesario actuar frente a este problema y, a partir de ello, pedir que planteen propuestas para mejorar el estado en el que se encuentra la losa."},"answer":"C","tema":"Enfoques y principios del CNEB","explicacion":["La C es correcta: parte de “las limitaciones que produce no poder usar la losa en sus vidas”, luego pide decidir si es necesario actuar y plantear propuestas. Así los estudiantes se reconocen como sujetos de derechos que pueden exigirlos.","La A parece correcta porque termina en una solicitud a la municipalidad, pero los estudiantes solo recogen y trasladan “quejas de los vecinos”. Actúan como mensajeros, sin reflexionar sobre su propio derecho vulnerado.","Pista: el enfoque de derechos pide que el estudiante se vea a sí mismo como ciudadano con derechos y responsabilidades, y que actúe desde esa conciencia, no solo que ejecute un trámite."],"aprende_mas":[{"q":"¿Qué busca el enfoque de derechos en el aula?","a":"Que los estudiantes se reconozcan como sujetos con derechos y deberes, capaces de ejercerlos y defenderlos. Sus valores son la conciencia de derechos, la libertad con responsabilidad y el diálogo y concertación."},{"q":"¿Por qué empezar por cómo el problema afecta sus propias vidas?","a":"Porque así descubren qué derecho se está afectando, por ejemplo, la recreación o el uso del espacio público. Cuando el problema se vuelve personal, la propuesta nace de su convicción y no de una orden del docente."},{"q":"¿Cómo distingo el enfoque de derechos del enfoque de orientación al bien común?","a":"- **Derechos**: el foco es reconocer, ejercer y exigir derechos propios y de los demás.\n- **Bien común**: el foco es lo compartido, la solidaridad y la responsabilidad colectiva.\n- **Pista**: si la alternativa invita a reflexionar sobre “cómo me afecta” y “qué puedo exigir”, apunta a derechos."}],"duda":false},"2023-F1-03":{"n":3,"year":2023,"ctx":"2023-F1-c1","stem":"Durante la lectura del texto, algunos estudiantes comentan al docente que tienen dudas sobre el sentido de la expresión “está guarnecido”, utilizada en el segundo párrafo del texto. Por esta razón, el docente busca que los estudiantes identifiquen qué quiere decir dicha expresión en el contexto en el que aparece. ¿Cuál de las siguientes acciones pedagógicas es menos adecuada para ello?","options":{"A":"Preguntar qué se dice sobre la lupuna en las dos primeras oraciones del segundo párrafo del texto. Luego, solicitar que indiquen si la expresión “está guarnecido” ayuda a entender, en el relato, qué función tienen las hojas triangulares en el tallo del árbol.","B":"Proponer que busquen en un diccionario las acepciones de la palabra “guarnecido”. Luego, pedir que dialoguen en pares sobre qué acepciones contribuyen a entender la información del segundo párrafo acerca de las características de la lupuna.","C":"Pedir que, en el segundo párrafo del texto, subrayen el pasaje en el que se presenta la expresión “está guarnecido”. Luego, preguntar si comparten la idea de que esa expresión da a entender que las hojas de la lupuna revisten su tallo."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es la menos adecuada: el docente ya da el significado (“las hojas revisten su tallo”) y solo pregunta si están de acuerdo. Los estudiantes no deducen nada; responden sí o no a una inferencia hecha por otro.","La B parece la menos adecuada porque usa el diccionario, pero pide elegir qué acepciones “contribuyen a entender” el párrafo. Eso obliga a contrastar las definiciones con el contexto, así que sí desarrolla la inferencia.","Pista: en preguntas de “menos adecuada”, busca la acción en la que el docente resuelve la tarea por los estudiantes. La buena práctica los hace construir el significado desde el texto."],"aprende_mas":[{"q":"¿Cómo se deduce el significado de una palabra por el contexto?","a":"El lector mira las palabras y oraciones que rodean a la expresión. Ejemplo: “el tallo está guarnecido, en la parte inferior, de unas bellas hojas” permite deducir que las hojas cubren o adornan el tallo. La pista está en el mismo texto."},{"q":"¿Usar el diccionario en clase de lectura es mala práctica?","a":"No. Es útil cuando el estudiante debe elegir la acepción que encaja con lo que lee. Lo poco formativo es copiar la primera definición sin relacionarla con el texto."},{"q":"¿Qué hace que una acción del docente favorezca la inferencia?","a":"- **Remite al texto**: pide fijarse en oraciones cercanas.\n- **Pregunta abierta**: no trae la respuesta incluida.\n- **Justificación**: pide explicar en qué parte del texto se basan."}],"duda":false},"2023-F1-04":{"n":4,"year":2023,"ctx":"2023-F1-c1","stem":"Durante el intercambio de ideas sobre el texto, los estudiantes están realizando comentarios sobre los aspectos del relato que llamaron su atención. ¿Cuál de los comentarios se ajusta a una reflexión sobre los aspectos formales del relato?","options":{"A":"André dice: “El narrador afirma que el ser que habita dentro de la lupuna sale en las noches de luna y su canto se escucha en toda la selva”.","B":"Blas dice: “Tal y como está narrada la historia sobre la lupuna, me parece que el narrador no pertenece a la comunidad de los cocamas”.","C":"Celina dice: “Según el narrador de la leyenda, la ‘madre’ de la lupuna es una sirena, que atrae con su voz a los que la escuchan”."},"answer":"B","tema":"Literatura","explicacion":["La B es correcta: Blas reflexiona sobre cómo “está narrada la historia” y concluye que el narrador no pertenece a los cocamas. Analiza la voz y la perspectiva del narrador, que es un aspecto formal del relato.","La C parece correcta porque menciona al narrador, pero solo repite lo que se cuenta: que la “madre” de la lupuna es una sirena que atrae con su voz. Es un comentario de contenido, igual que la A.","Pista: si el comentario parafrasea qué pasa en la historia, es contenido. Si opina sobre cómo está contada (quién narra, desde dónde, con qué recursos), es forma."],"aprende_mas":[{"q":"¿Qué son los aspectos formales de un relato?","a":"- **Narrador**: quién cuenta y desde qué perspectiva.\n- **Estructura**: cómo se ordenan los hechos.\n- **Lenguaje y recursos**: figuras literarias, registro, estilo.\nSe distinguen del contenido, que es lo que se cuenta."},{"q":"¿Qué tipos de narrador conviene que reconozcan los estudiantes?","a":"- **Protagonista**: cuenta su propia historia en primera persona.\n- **Testigo**: cuenta lo que vio, desde dentro de la historia.\n- **Externo u omnisciente**: cuenta en tercera persona, desde fuera.\nEn esta leyenda, el narrador habla de “los cocamas” como de otros; por eso parece externo."},{"q":"¿Basta con que aparezca la palabra “narrador” para que sea un comentario formal?","a":"No. “El narrador afirma que…” suele introducir un resumen de contenido. Lo formal es reflexionar sobre la manera de narrar: su distancia, su punto de vista o el efecto que produce en el lector."}],"duda":false},"2023-F1-05":{"n":5,"year":2023,"ctx":"2023-F1-c1","stem":"Para contribuir a la comprensión de la historia, el docente tiene como propósito que los estudiantes obtengan información explícita del relato. ¿Cuál de las siguientes acciones se centra en el logro de dicho propósito?","options":{"A":"Pedir que mencionen por qué los jóvenes tienen que considerar los testimonios de los viejos cocamas acerca del canto de la sirena.","B":"Pedir que mencionen con qué fin el narrador sostiene que se debe escuchar el canto de la sirena con recogimiento.","C":"Pedir que mencionen cuáles son los atributos que caracterizan el canto de la sirena, según el texto."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: los “atributos que caracterizan el canto, según el texto” están escritos literalmente: “claro y dulce, distinguidamente melodioso”. El estudiante solo tiene que localizarlos, que es obtener información explícita.","La A parece correcta porque el texto dice que quien siga la voz “no regresará nunca”, pero preguntar “por qué” deben considerar los testimonios exige relacionar ideas y deducir la razón. Es una pregunta inferencial.","Pista: preguntas con “según el texto”, “cuáles”, “qué dice” suelen pedir información explícita. Las que piden “por qué” o “con qué fin” suelen pedir inferir."],"aprende_mas":[{"q":"¿Qué es información explícita?","a":"Es la que está escrita tal cual en el texto. El lector la ubica sin deducir nada. Ejemplo: si el texto dice que la lupuna es “uno de los más altos del bosque”, preguntar por su altura es pedir información explícita."},{"q":"¿Cuáles son las capacidades de la competencia “Lee diversos tipos de textos”?","a":"- **Obtiene información**: localiza datos explícitos.\n- **Infiere e interpreta**: deduce lo implícito y construye el sentido global.\n- **Reflexiona y evalúa**: opina sobre la forma, el contenido y el contexto del texto."},{"q":"¿Cómo compruebo si una pregunta es literal o inferencial?","a":"Busca la respuesta en el texto. Si puedes subrayarla tal cual, es literal. Si tienes que unir datos o explicar una intención, es inferencial."}],"duda":false},"2023-F1-06":{"n":6,"year":2023,"ctx":"2023-F1-c1","stem":"Los estudiantes, acompañados por el docente, están intercambiando ideas sobre los recursos literarios utilizados en el relato. Tres estudiantes comparten sus ideas con el resto de la clase. ¿Cuál de los siguientes estudiantes identifica un recurso literario que contribuye a la construcción de interpretaciones del sentido global del relato?","options":{"A":"Arturo dice: “Hay una expresión en el tercer párrafo del relato que me gusta mucho: ‘océano vegetal’. Esa expresión me lleva a pensar que el bosque amazónico es tan grande como el mar”.","B":"Beatriz dice: “El narrador menciona que las hachas y los machetes ‘levantan aldeas’ o ‘abren caminos’. Lo que se quiere dar a entender es que esas herramientas ayudaron a construirlos”.","C":"Celeste dice: “Cuando se habla del canto de la sirena al final del texto, hay una oposición. Creo que es ‘próximo’ porque nos atrae, y, a la vez, es ‘distante’ porque no se lo puede alcanzar”."},"answer":"C","tema":"Literatura","explicacion":["La C es correcta: Celeste identifica la oposición “próximo y distante” y la explica: el canto atrae, pero no se puede alcanzar. Esa tensión entre seducción y peligro es el núcleo de toda la leyenda.","La A parece correcta porque “océano vegetal” sí es una metáfora, pero Arturo solo concluye que el bosque es “tan grande como el mar”. Interpreta una imagen aislada, sin conectarla con el sentido de todo el relato.","Pista: no basta con identificar un recurso; la pregunta pide que ayude a interpretar el sentido global. Elige el comentario que conecta la figura con el mensaje central del texto."],"aprende_mas":[{"q":"¿Qué es una antítesis y qué es un oxímoron?","a":"- **Antítesis**: opone dos ideas contrarias, como “próximo y distante”.\n- **Oxímoron**: une en una misma expresión dos términos contradictorios, como “silencio atronador”.\nAmbos sirven para expresar tensiones o contradicciones."},{"q":"¿Qué es el sentido global de un texto literario?","a":"Es la interpretación del texto como un todo: lo que nos dice más allá de una frase. En esta leyenda, por ejemplo: la belleza de la naturaleza atrae, pero hay límites que conviene respetar."},{"q":"¿Cómo saber si un recurso aporta al sentido global o solo a una parte?","a":"Pregúntate si la interpretación explica todo el relato o solo una oración. “Océano vegetal” explica el tamaño del bosque (sentido local). “Próximo y distante” explica la atracción y el peligro de la sirena (sentido global)."}],"duda":false},"2023-F1-07":{"n":7,"year":2023,"ctx":"2023-F1-c1","stem":"El docente busca que los estudiantes reflexionen sobre el contenido del relato. ¿Cuál de las siguientes preguntas es adecuada para ello?","options":{"A":"En el texto, se describe a la “madre” de la lupuna como singularmente bella. ¿En qué ideas sobre la belleza está basada esta descripción?","B":"En el texto, se afirma que la lupuna produce una sensación de “extraña belleza”. ¿Qué características específicas del árbol producen esta sensación?","C":"En el texto, se alude al tipo de trato que los cocamas brindan a los árboles del bosque. ¿Cuál es la diferencia de ese trato respecto del que dan a la lupuna?"},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta: pregunta “en qué ideas sobre la belleza” se basa describir a la “madre” como “blanca, rubia y singularmente bella”. Invita a evaluar críticamente los valores y estereotipos del texto, que es reflexionar sobre el contenido.","La C parece correcta porque exige comparar el trato a los árboles con el que recibe la lupuna, pero solo pide relacionar información del texto. Es una inferencia, no una valoración crítica.","Pista: reflexionar sobre el contenido es tomar distancia del texto y opinar sobre sus ideas o valores. Las preguntas que solo piden ubicar o comparar datos se quedan en obtener o inferir."],"aprende_mas":[{"q":"¿Qué significa reflexionar y evaluar el contenido de un texto?","a":"Es opinar con argumentos sobre las ideas, valores o creencias que presenta el texto. El estudiante toma postura. Ejemplo: “¿Te parece justo que la belleza se asocie solo a la piel blanca?”."},{"q":"¿Cómo diferenciar localizar, inferir y reflexionar con un mismo texto?","a":"- **Localizar**: “¿Cómo es el canto de la sirena?”\n- **Inferir**: “¿Por qué los cocamas no cortan la lupuna?”\n- **Reflexionar**: “¿Qué opinas de la idea de belleza que muestra el texto?”"},{"q":"¿Qué enfoque del CNEB se conecta con cuestionar estereotipos de belleza?","a":"El enfoque intercultural y el de igualdad de género, porque invitan a valorar la diversidad y a cuestionar modelos impuestos. En una leyenda amazónica, sorprende que la mujer ideal sea “blanca y rubia”: eso abre una buena discusión crítica."}],"duda":false},"2023-F1-08":{"n":8,"year":2023,"ctx":"2023-F1-c1","stem":"En otro momento de la actividad de lectura, el docente busca ayudar a los estudiantes a construir interpretaciones sobre el sentido global del relato. ¿Cuál de las siguientes acciones es más adecuada para ello?","options":{"A":"Solicitar a los estudiantes que, en el texto, subrayen la idea que permite afirmar que la lupuna es un símbolo del poder de la naturaleza en el paisaje amazónico.","B":"Solicitar a los estudiantes que, de acuerdo con el texto, indiquen qué quiere decir que el ser que habita la lupuna “derrama su canto”.","C":"Solicitar a los estudiantes que, a partir del texto, comenten qué es lo que representa la lupuna para los cocamas."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: pide comentar “qué representa la lupuna para los cocamas”. Es una pregunta abierta que obliga a integrar todo el relato (respeto, creencia en la “madre”, el canto, el peligro) para construir una interpretación propia.","La A parece correcta porque habla de un símbolo, pero el docente ya entrega la interpretación (“símbolo del poder de la naturaleza”) y solo pide subrayar dónde se apoya. Los estudiantes no la construyen.","Pista: para el sentido global, elige la acción que deja interpretar a los estudiantes a partir de todo el texto. Desconfía de las que traen la interpretación hecha o se centran en una sola expresión, como la B."],"aprende_mas":[{"q":"¿Qué preguntas ayudan a construir el sentido global?","a":"Preguntas abiertas que abarcan todo el texto: “¿Qué representa…?”, “¿Qué nos quiere decir la historia?”, “¿Qué enseñanza deja?”. Exigen unir ideas de varias partes, no ubicar un dato."},{"q":"¿Por qué no conviene dar la interpretación ya hecha?","a":"Porque el estudiante deja de interpretar y solo confirma lo que dijo el docente. Además, una interpretación impuesta puede no ser la única válida. La competencia lectora se desarrolla cuando ellos proponen y justifican con el texto."},{"q":"¿Cómo ayuda la cosmovisión del pueblo a interpretar una leyenda?","a":"Las leyendas expresan creencias de una comunidad. Para los cocamas, la lupuna “tiene madre”: es un ser sagrado que se respeta y no se tala. Preguntar qué representa para ellos conecta la lectura con el enfoque intercultural."}],"duda":false},"2023-F1-09":{"n":9,"year":2023,"ctx":"2023-F1-c2","stem":"La docente nota que los estudiantes tienen algunos problemas en la generación de ideas para planificar sus anécdotas orales. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para orientarlos en la generación de ideas?","options":{"A":"Contar una anécdota a los estudiantes, haciendo énfasis en el episodio central de la historia. Luego, pedir que piensen en una experiencia propia e interesante, y que anoten en sus cuadernos en qué situación se encontraban, qué acciones realizaron en dicha situación y quiénes los acompañaron en la experiencia.","B":"Proponer a los estudiantes ver juntos un video que presenta una anécdota narrada por un estudiante de otro grado. Luego, realizar preguntas para identificar cuáles fueron los momentos más relevantes de la historia, cuál fue el tema principal y cuál fue el propósito comunicativo del narrador al contar esa historia.","C":"Indicar a los estudiantes que una anécdota es un tipo de narración breve que presenta una historia que, por lo general, es divertida. Luego, indicar que, para escribir dicha historia, se debe utilizar un narrador en primera persona gramatical, conectores de secuencia y un lenguaje sencillo."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta: el docente modela una anécdota y luego pide pensar en una experiencia propia y anotar “en qué situación se encontraban, qué acciones realizaron y quiénes los acompañaron”. Son preguntas guía que activan sus propias ideas.","La B parece correcta porque usa un modelo, pero se queda analizando la anécdota de otro estudiante (momentos, tema, propósito). No lleva a los estudiantes a recordar y organizar sus propias experiencias.","Pista: “generar ideas” significa ayudar a que el estudiante encuentre qué va a contar. Elige la acción que lo lleva a su propia experiencia, no la que solo explica teoría (C) o analiza un texto ajeno (B)."],"aprende_mas":[{"q":"¿Qué se hace en la planificación de un texto oral?","a":"- **Propósito**: para qué voy a hablar.\n- **Destinatario**: a quién me dirijo.\n- **Ideas**: qué voy a contar y en qué orden.\n- **Registro**: si hablaré de forma formal o informal."},{"q":"¿Qué estrategias ayudan a generar ideas?","a":"- **Modelado**: el docente cuenta su propia anécdota.\n- **Preguntas guía**: ¿dónde?, ¿con quién?, ¿qué pasó?\n- **Recursos detonantes**: fotos, objetos o recuerdos del viaje.\n- **Organizadores**: un esquema simple de inicio, nudo y desenlace."},{"q":"¿Por qué la alternativa C no sirve aunque sea correcta en teoría?","a":"Porque dar la definición de anécdota y sus rasgos no ayuda a decidir qué contar. Además, habla de “escribir”, cuando la tarea es oral. La teoría puede venir después; primero los estudiantes necesitan encontrar su historia."}],"duda":false},"2023-F1-10":{"n":10,"year":2023,"ctx":"2023-F1-c2","stem":"Una estudiante está practicando su anécdota. Ella le pide a la docente que la escuche y le haga comentarios para mejorar. Esta es la transcripción de la anécdota de la estudiante:\n\n“Voy a contarles la anécdota de cómo un perrito se convirtió en la mascota de mi familia. Eso pasó un domingo que salimos a pasear al campo. Primero, todos pasamos la mañana jugando pelota. Nos dimos cuenta de que un perrito merodeaba por el lugar. Luego, mi hermano y yo nos acercamos al río para refrescarnos. Nos asustamos un poco al ver cerca al perro. Y así fue la historia sobre cómo llegamos a tener un perrito viviendo con nuestra familia”.\n\nLa docente escucha la presentación de la estudiante y nota un problema de coherencia en su texto oral. ¿Cuál es este problema?","options":{"A":"La ausencia de información relevante para comprender la historia.","B":"La inclusión de ideas que se alejan del tema central de la historia.","C":"La presentación desorganizada de los hechos de la historia."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta: la estudiante promete contar “cómo un perrito se convirtió en la mascota”, pero solo dice que lo vio y se asustó. Nunca cuenta cómo llegó a casa; falta la información clave para entender la historia.","La B parece correcta porque “jugar pelota” o ir al río podrían sonar a desvío, pero son el contexto del paseo, donde aparece el perrito. No se alejan del tema; el problema es lo que falta, no lo que sobra.","Pista: para detectar el problema de coherencia, compara lo que el hablante anuncia al inicio con lo que realmente cuenta. Aquí el orden es correcto (“primero”, “luego”), así que la C también se descarta."],"aprende_mas":[{"q":"¿Qué hace que un texto sea coherente?","a":"- **Unidad temática**: todo gira en torno a un tema.\n- **Información suficiente**: no faltan datos clave.\n- **Orden lógico**: los hechos se presentan en secuencia comprensible.\n- **Sin contradicciones**: las ideas no se oponen entre sí."},{"q":"¿Cuál es la diferencia entre coherencia y cohesión?","a":"La coherencia es el sentido global: que el texto se entienda como un todo. La cohesión son los recursos que conectan las ideas, como conectores (“primero”, “luego”) o pronombres. Esta anécdota tiene buena cohesión, pero le falta coherencia."},{"q":"¿Cómo retroalimentar a la estudiante sin darle la respuesta?","a":"Con preguntas que la lleven a notar el vacío: “Dijiste que ibas a contar cómo el perrito llegó a tu familia, ¿en qué parte lo cuentas?”. Así ella misma descubre qué falta y lo añade."}],"duda":false},"2023-F1-11":{"n":11,"year":2023,"ctx":"2023-F1-c2","stem":"Una estudiante está practicando la presentación de su anécdota frente a sus compañeros. Dichos compañeros le ofrecen algunos comentarios. ¿Cuál de los siguientes comentarios destaca el uso de recursos paraverbales en el texto oral de la estudiante?","options":{"A":"“Al mover tus manos, enfatizaste las partes más graciosas de tu anécdota. Y desplazarte por el salón al hablar ayudó a que todos pudieran escucharte”.","B":"“El volumen de tu voz estuvo bien, ni muy alto ni muy bajo. Además, al hacer énfasis en algunas ideas, se sintió que buscabas la atención del público”.","C":"“La foto que usaste para mostrarnos el lugar al que fuiste con tus primos fue muy buena idea. Así, uno puede imaginarse el sitio a donde fueron”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque comenta el volumen de la voz (“ni muy alto ni muy bajo”) y el énfasis en algunas ideas. Ambos son recursos paraverbales: dependen de cómo suena la voz, no de las palabras ni del cuerpo.","La A parece correcta porque también habla de la forma de presentar, pero mover las manos y desplazarse por el salón son recursos no verbales (gestos y movimiento corporal), no paraverbales.","Pista: si el comentario se refiere a la voz (volumen, tono, ritmo, pausas, énfasis), es paraverbal; si se refiere al cuerpo (gestos, mirada, postura, desplazamiento), es no verbal; si usa objetos, es material de apoyo."],"aprende_mas":[{"q":"¿Cuáles son los recursos paraverbales y cuáles los no verbales?","a":"- **Paraverbales**: todo lo que hace la voz: volumen, tono, entonación, ritmo, velocidad, pausas y énfasis.\n- **No verbales**: lo que hace el cuerpo: gestos, mirada, postura, expresión del rostro, movimiento y distancia con el público.\n- **Verbales**: las palabras elegidas, el orden de las ideas y el vocabulario."},{"q":"¿Dónde se ubican estos recursos en la competencia oral del CNEB?","a":"Están en la capacidad “Utiliza recursos no verbales y paraverbales de forma estratégica”. La palabra clave es “estratégica”: no basta con hablar fuerte, el estudiante debe usar la voz y el cuerpo para lograr su propósito, por ejemplo bajar la voz para crear suspenso en una anécdota."},{"q":"¿Una foto o un papelógrafo es un recurso paraverbal?","a":"No. Son materiales o recursos de apoyo (visuales). Ayudan a que el público entienda, pero no pertenecen a la voz ni al cuerpo del hablante. Por eso la alternativa C de esta pregunta queda descartada de inmediato."}],"duda":false},"2023-F1-12":{"n":12,"year":2023,"stem":"Como parte de una tertulia literaria, los estudiantes de primer grado, en equipos, seleccionan y leen cuentos con la finalidad de representar en el aula los diálogos de los diversos personajes de esos textos. Después de escuchar varias representaciones, el docente nota que el tono y el volumen de voz usados por los integrantes de los equipos no ayudan a comprender las situaciones que atraviesan los personajes de los cuentos. Por eso, el docente busca que los estudiantes, por sí mismos, identifiquen qué tono y volumen de voz son apropiados para la representación de los diálogos. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Solicitar a los estudiantes que graben en audio la representación de los diálogos de los personajes del cuento. Luego, pedir que escuchen esta grabación e incorporen los cambios necesarios en el tono y en el volumen de voz en una nueva práctica de la representación.","B":"Representar las intervenciones de uno de los personajes del cuento solicitando a los estudiantes que presten atención tanto al tono como al volumen de voz usados. Luego, pedir que, tomando como base esta representación, practiquen las intervenciones de otros personajes del cuento.","C":"Leer en voz alta los pasajes del cuento que los estudiantes quieren representar y solicitar que indiquen cuáles son las emociones que experimentan los personajes de la historia. Luego, pedir que comenten qué tipo de tono y volumen de voz creen que pueden utilizar considerando las emociones identificadas."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque lleva a los estudiantes a identificar las emociones de los personajes y, desde ahí, a decidir ellos mismos qué tono y volumen usar. Así entienden por qué la voz debe cambiar según la situación.","La A parece correcta porque los estudiantes se escuchan y corrigen, pero no reciben ningún criterio para saber qué cambiar. La B tampoco sirve: el docente da el modelo y ellos solo lo imitan, no lo descubren por sí mismos.","Pista: cuando el enunciado dice “por sí mismos identifiquen”, busca la opción que ofrezca un criterio para razonar (aquí, las emociones del personaje) y descarta la que solo pide imitar o repetir."],"aprende_mas":[{"q":"¿Por qué las emociones del personaje determinan el tono de voz?","a":"Porque el tono y el volumen transmiten lo que siente quien habla. Un personaje asustado habla bajo y entrecortado; uno furioso, fuerte y rápido. Si el estudiante primero entiende la emoción, la voz deja de ser una regla externa y se vuelve una decisión con sentido."},{"q":"¿Modelar está mal? ¿Cuándo sí conviene que el docente lo haga?","a":"Modelar no está mal. Conviene cuando los estudiantes no conocen un procedimiento y necesitan verlo hecho. Pero si la pregunta pide que “por sí mismos identifiquen” algo, el modelado les da la respuesta hecha y quita la oportunidad de descubrirla."},{"q":"¿Qué diferencia hay entre autoevaluarse con criterios y sin ellos?","a":"- **Sin criterios**: el estudiante se escucha y piensa “sonó bien” o “sonó mal”, sin saber qué mejorar.\n- **Con criterios**: se pregunta “¿mi voz transmite el miedo del personaje?” y sabe exactamente qué ajustar.\nPor eso grabarse (alternativa A) sirve más después de haber definido el criterio."}],"duda":false},"2023-F1-13":{"n":13,"year":2023,"ctx":"2023-F1-c3","stem":"En el transcurso de la actividad, el docente nota que los estudiantes tienen algunos problemas para comprender varias ideas claves del texto. Por ello, tiene como propósito orientarlos en la comprensión de dichas ideas mediante un modelado. ¿Cuál de las siguientes acciones pedagógicas es adecuada para ello?","options":{"A":"Solicitar a los estudiantes que lean el texto nuevamente y que planteen sus dudas sobre aquellas ideas que les resultan complejas de comprender. Luego, proponer que revisen más fuentes de información que los ayuden a entender esas ideas.","B":"Preguntar a los estudiantes qué ideas les resultan complejas y registrarlas en la pizarra, estableciendo un diálogo con ellos sobre por qué creen que son difíciles de entender. Sobre esta base, reescribir dichas ideas para promover que las comprendan.","C":"Realizar una plenaria con los estudiantes para volver a leer el texto. Durante la lectura, parafrasear la información que resulta compleja en términos que les sean familiares, formulando preguntas y verbalizando qué pasajes son útiles para hallar las respuestas."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque el docente lee con los estudiantes y, en voz alta, parafrasea las ideas difíciles, se hace preguntas y dice qué pasajes le ayudan a responder. Eso es modelar: mostrar cómo piensa un buen lector mientras lee.","La B parece correcta porque dialoga sobre las ideas difíciles, pero al final el docente reescribe esas ideas y entrega el resultado ya hecho. Los estudiantes ven el producto, no el proceso para comprender.","Pista: en el modelado, el docente “piensa en voz alta” mientras ejecuta la estrategia frente a los estudiantes. Si la alternativa solo explica, simplifica o manda a buscar más fuentes, no es modelado."],"aprende_mas":[{"q":"¿Qué es exactamente el modelado en lectura?","a":"Es cuando el docente lee frente a los estudiantes y verbaliza lo que hace su mente: “Esta frase no la entiendo, voy a releer el párrafo anterior… Ah, aquí dice que…”. Hace visible un proceso que normalmente es invisible, para que luego los estudiantes lo imiten."},{"q":"¿Cuáles son las fases de la enseñanza de una estrategia?","a":"- **Modelado**: el docente la hace y la explica en voz alta.\n- **Práctica guiada**: los estudiantes la hacen con ayuda del docente.\n- **Práctica independiente**: los estudiantes la aplican solos.\nEs el paso gradual de la responsabilidad del docente al estudiante."},{"q":"¿Qué es parafrasear y por qué ayuda a comprender?","a":"Parafrasear es decir la misma idea con otras palabras, más cercanas al lector. Por ejemplo, “transgresora de dichas reglas” se puede decir “alguien que rompía lo que la sociedad esperaba de ella”. Si puedes decirlo con tus palabras, demuestras que lo entendiste."}],"duda":false},"2023-F1-14":{"n":14,"year":2023,"ctx":"2023-F1-c3","stem":"El docente busca que los estudiantes deduzcan información implícita del texto. ¿Cuál de las siguientes preguntas es adecuada para ello?","options":{"A":"¿Qué obstáculo fue el menos grave de enfrentar para las mujeres que se movilizaban en bicicleta?","B":"¿Qué razones explican que la sociedad haya cambiado su perspectiva sobre las mujeres que usaban bicicleta?","C":"¿Qué opinión tienen sobre la afirmación de la feminista Susan Brownell acerca de las mujeres que montaban bicicleta?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque el texto no dice “estas son las razones del cambio”. El lector debe relacionar datos dispersos (clubes femeninos, publicidad, recomendación médica, avance de la emancipación) para deducir por qué cambió la mirada social.","La A parece una pregunta de inferencia porque pide comparar obstáculos, pero el texto lo dice literalmente: montar con vestidos y corsés incómodos “era el menor de sus obstáculos”. Basta con ubicar la frase.","Pista: si la respuesta se puede subrayar en una sola parte del texto, es literal. Si hay que unir varias partes o completar lo que el autor no dice, es inferencial."],"aprende_mas":[{"q":"¿Cómo distinguir rápido una pregunta literal de una inferencial?","a":"Hazte esta pregunta: “¿Puedo señalar con el dedo la respuesta en el texto?”.\n- **Sí**: es literal (obtiene información).\n- **No, pero la deduzco con pistas del texto**: es inferencial.\n- **No, necesito mi opinión o mi experiencia**: es reflexiva (evalúa)."},{"q":"¿Por qué la pregunta de opinión (C) no es inferencial?","a":"Porque pedir “¿qué opinan?” lleva al estudiante a valorar desde su postura, no a deducir información del texto. Eso corresponde a la capacidad “Reflexiona y evalúa la forma, el contenido y contexto del texto”, otro nivel distinto de la inferencia."},{"q":"¿Qué tipos de inferencia puede pedir el docente?","a":"- **Causa-efecto**: ¿por qué ocurrió algo?\n- **Relaciones entre ideas**: ¿qué tienen en común dos párrafos?\n- **Significado por contexto**: ¿qué quiere decir esta expresión?\n- **Tema o idea principal**: ¿de qué trata todo el texto?\nEn todas, la respuesta no está escrita tal cual."}],"duda":false},"2023-F1-15":{"n":15,"year":2023,"ctx":"2023-F1-c3","stem":"Durante el intercambio de ideas sobre el texto, una estudiante pregunta qué quiere decir la siguiente afirmación localizada en el cuarto párrafo: “[…] para las mujeres, [la bicicleta] era un trampolín que las llevaba a otro mundo”. Tres estudiantes deciden intervenir. ¿Cuál de los siguientes estudiantes identifica adecuadamente a qué se refiere dicha afirmación?","options":{"A":"Amelia dice: “Se refiere a que la bicicleta fue como un impulso para lograr la liberación de las mujeres”.","B":"Braulio dice: “Quiere decir que, con las bicicletas, las mujeres podían movilizarse hacia lugares lejanos”.","C":"Carlos dice: “Creo que significa que las mujeres que andaban en bicicleta podían mejorar su estatus social”."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque interpreta la metáfora: un trampolín impulsa, y “otro mundo” es la nueva vida con más libertad. El texto completo trata de la emancipación femenina, y la bicicleta funciona como un impulso para lograrla.","La C parece correcta porque habla de un cambio positivo para las mujeres, pero el texto no trata de subir de estatus social (clase o prestigio), sino de liberarse de reglas y roles impuestos. La B lee la frase en sentido literal.","Pista: para interpretar una expresión figurada, conéctala con el tema global del texto. La opción correcta es la que coincide con la idea central (aquí, la emancipación), no con un detalle cercano."],"aprende_mas":[{"q":"¿Cómo se interpreta una metáfora en un texto expositivo?","a":"Separa la imagen de lo que representa. Pregúntate: “¿Qué hace un trampolín?” (te impulsa hacia arriba). Luego: “¿Hacia dónde impulsaba la bicicleta a las mujeres?” (hacia la libertad). Así pasas de la imagen al significado."},{"q":"¿Por qué el sentido global ayuda a resolver preguntas de detalle?","a":"Porque cada frase del texto está al servicio de la idea principal. Si sabes que el texto trata de cómo la bicicleta ayudó a la emancipación, cualquier expresión dudosa debe leerse en esa dirección. Las alternativas que se alejan del tema central suelen ser trampas."},{"q":"¿Qué diferencia hay entre “emancipación” y “estatus social”?","a":"- **Emancipación**: liberarse de una dependencia o de reglas impuestas; ganar autonomía y derechos.\n- **Estatus social**: el lugar o prestigio que alguien ocupa en la sociedad (por ejemplo, ser rico o famoso).\nUna mujer podía emanciparse sin cambiar de clase social."}],"duda":false},"2023-F1-16":{"n":16,"year":2023,"ctx":"2023-F1-c3","stem":"En otro momento, el docente busca que los estudiantes deduzcan información implícita del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que expliquen si, hoy en día, se puede afirmar que las mujeres que montan bicicleta causan una impresión abrumadora, como señala el texto.","B":"Pedir a los estudiantes que comenten por qué, de acuerdo con el texto, se menciona que las personas más entusiastas para montar bicicleta eran las mujeres.","C":"Pedir a los estudiantes que, a partir de la información del texto, identifiquen cuáles son los beneficios para la salud de las personas que montan bicicleta."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque el texto afirma que las mujeres eran las usuarias más entusiastas, pero no explica por qué. El estudiante debe deducirlo con pistas, como la cita de Brownell: la bicicleta les daba independencia.","La C parece buena porque usa información del texto, pero los beneficios para la salud están escritos tal cual (“fortalecer las articulaciones y mejorar el sistema cardiovascular”). Es una tarea literal: solo hay que ubicarlos.","Pista: busca la opción donde el texto da el “qué” pero no el “por qué”. Cuando el estudiante debe completar esa causa con pistas del texto, está infiriendo."],"aprende_mas":[{"q":"¿Qué son las “pistas textuales” para hacer inferencias?","a":"Son datos del texto que, unidos, permiten deducir algo no dicho. Por ejemplo: la cita “le da independencia” más el contexto de reglas que limitaban a la mujer permiten inferir que se entusiasmaban porque la bicicleta les daba libertad de movimiento."},{"q":"¿Por qué la alternativa A no es una inferencia?","a":"Porque pide comparar el texto con la realidad actual (“hoy en día”). Eso exige opinión y experiencia propia, así que corresponde a reflexionar y evaluar el contexto, no a deducir información implícita del texto."},{"q":"¿Cómo puede el docente comprobar que la inferencia es válida?","a":"Pidiendo que el estudiante justifique: “¿Qué parte del texto te hace pensar eso?”. Una inferencia válida siempre se apoya en el texto. Si el estudiante no puede señalar ninguna pista, probablemente está inventando u opinando."}],"duda":false},"2023-F1-17":{"n":17,"year":2023,"ctx":"2023-F1-c3","stem":"El docente busca que los estudiantes reflexionen sobre el contenido del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Solicitar que, a partir de la información ubicada en el penúltimo párrafo del texto, realicen un mapa mental que describa a la “nueva mujer”.","B":"Indicar que expliquen la intención de la autora al incluir las citas textuales que se encuentran en el primer y segundo párrafo del texto.","C":"Pedir que identifiquen las repercusiones sociales que, según el texto, comenzaron a surgir cuando las mujeres empezaban a movilizarse en bicicleta."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque explicar la intención de la autora al incluir dos citas opuestas (Brownell a favor, la corresponsal del Chicago Tribune en contra) exige tomar distancia del texto y evaluar cómo se construye su mensaje. Eso es reflexionar.","La C parece reflexiva porque habla de “repercusiones sociales”, pero dice “según el texto”: el estudiante solo ubica o deduce lo que el texto ya presenta, sin evaluarlo. La A solo organiza información en un mapa mental.","Pista: “reflexionar” implica opinar, juzgar o explicar propósitos del autor. Las expresiones “según el texto” o “a partir de la información del párrafo” suelen indicar tareas literales o inferenciales."],"aprende_mas":[{"q":"¿Qué incluye la capacidad “Reflexiona y evalúa” del CNEB?","a":"- **Sobre el contenido**: juzgar si las ideas son válidas o actuales.\n- **Sobre la forma**: valorar por qué el autor usó ciertos recursos (citas, ejemplos, imágenes).\n- **Sobre el contexto**: relacionar el texto con la época o la realidad del lector.\nEn todas, el estudiante emite un juicio con argumentos."},{"q":"¿Para qué sirve que un autor incluya citas opuestas?","a":"Para mostrar que había un debate en esa época y dar credibilidad al texto con voces reales. En el aula, el docente puede preguntar: “¿Por qué la autora puso primero una opinión a favor y luego una en contra?”. Así el estudiante analiza la estrategia de la autora."},{"q":"¿Un mapa mental desarrolla la reflexión crítica?","a":"Por sí solo, no. Un mapa mental sirve para organizar y jerarquizar información, lo que ayuda a comprender. Pero si se arma con datos de un párrafo, el estudiante no juzga ni evalúa nada; solo reordena lo que ya está escrito."}],"duda":false},"2023-F1-18":{"n":18,"year":2023,"ctx":"2023-F1-c3","stem":"Como parte de la actividad de lectura, el docente realiza diversas acciones pedagógicas con los estudiantes. ¿Cuál de las siguientes acciones supone que los estudiantes desarrollen procesos cognitivos de mayor complejidad?","options":{"A":"Indicar a los estudiantes que elaboren una reseña crítica en la que señalen con qué personas de su entorno pueden compartir el texto y por qué.","B":"Solicitar a los estudiantes que reescriban el texto en una infografía manteniendo los hechos relevantes, el tema central y la misma tipología textual.","C":"Proporcionar a los estudiantes una ficha con preguntas de respuesta abierta que busquen recoger información explícita e implícita del texto."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque una reseña crítica exige comprender el texto, valorarlo y argumentar a quién le sería útil y por qué. Eso combina evaluación y producción, los procesos de mayor complejidad.","La B parece exigente porque transforma el texto a infografía, pero mantiene los mismos hechos, el mismo tema y la misma tipología. Es reorganizar y sintetizar información, no evaluarla ni emitir un juicio propio.","Pista: ordena las opciones de menor a mayor: recordar/ubicar, inferir, organizar o resumir, y al final evaluar/crear. La opción que pide juzgar y justificar suele ser la de mayor complejidad."],"aprende_mas":[{"q":"¿Cómo se ordenan los procesos cognitivos de menor a mayor complejidad?","a":"Según la taxonomía de Bloom revisada:\n- **Recordar y comprender**: ubicar y explicar información.\n- **Aplicar y analizar**: usar y descomponer información.\n- **Evaluar**: juzgar con criterios.\n- **Crear**: producir algo nuevo y propio.\nLa reseña crítica pide evaluar y crear a la vez."},{"q":"¿Qué distingue una reseña crítica de un resumen?","a":"El resumen solo reduce el texto a sus ideas principales, sin opinar. La reseña crítica resume brevemente y, además, valora el texto: dice si es útil, convincente o relevante, y lo justifica. Esa valoración es lo que eleva la exigencia."},{"q":"¿Por qué una ficha con preguntas abiertas no es lo más complejo?","a":"Porque, aunque las preguntas sean abiertas, buscan recoger información explícita e implícita, es decir, niveles literal e inferencial. Una pregunta abierta no es automáticamente crítica: lo que importa es qué proceso mental exige."}],"duda":false},"2023-F1-19":{"n":19,"year":2023,"ctx":"2023-F1-c4","stem":"Un grupo de estudiantes está planificando su exposición sobre la planta conocida como “uña de gato”. A continuación, se presenta la transcripción del diálogo que se suscita entre ellos:\n\nNely dice: “En la página de PromPerú, encontré bastante información sobre la uña de gato y… ”.\n\nJuvenal, interrumpiendo a Nely, dice: “Yo también revisé esa página. Hay mucha información. ¿Alguien más la ha revisado?”.\n\nSandra dice: “Sí, yo también la vi. Con eso, creo que ya podríamos empezar a armar nuestra exposición para…”.\n\nNely, interrumpiendo a Sandra, dice: “Claro. Se dice, por ejemplo, que la uña de gato sirve para tratar varias enfermedades”.\n\nJuvenal dice: “Ah, sí. Sirve como antiinflamatorio porque…”.\n\nSandra, interrumpiendo a Juvenal, dice: “No, no creo que se refiera a eso, sino a que se pueden tratar casos de gastritis, por ejemplo”.\n\nJuvenal dice: “Ah, ya veo. Tienes razón”.\n\nComo parte de la retroalimentación para la planificación de los textos orales, el docente identifica aspectos positivos y negativos en el diálogo del equipo. ¿Qué aspecto positivo asociado con la escucha activa se evidencia en este diálogo?","options":{"A":"La intervención, a través de turnos, de los integrantes del equipo.","B":"El parafraseo de ideas realizado por los participantes de la conversación.","C":"La manifestación explícita de que comprenden las ideas de los interlocutores."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque Juvenal dice “Ah, ya veo. Tienes razón” después de escuchar la corrección de Sandra. Es una señal explícita de que comprendió la idea de su interlocutora, rasgo propio de la escucha activa.","La B parece correcta porque parafrasear es una técnica clásica de escucha activa, pero en el diálogo nadie repite con otras palabras lo que dijo otro: Sandra corrige y Juvenal acepta. La A falla porque se interrumpen constantemente.","Pista: en preguntas sobre un diálogo transcrito, no elijas la técnica que “debería” aparecer; busca la que realmente está en el texto y señala la frase exacta que la prueba."],"aprende_mas":[{"q":"¿Qué conductas muestran que alguien escucha activamente?","a":"- **Señales de comprensión**: “ya veo”, “entiendo”, asentir.\n- **Parafraseo**: “o sea, lo que dices es que…”.\n- **Preguntas de aclaración**: “¿te refieres a…?”.\n- **Respeto de turnos**: esperar a que el otro termine.\nEn el diálogo de la pregunta solo aparece con claridad la primera."},{"q":"¿Qué aspecto negativo debería retroalimentar el docente en este diálogo?","a":"Las interrupciones constantes: Juvenal corta a Nely, Nely corta a Sandra y Sandra corta a Juvenal. El docente podría acordar con el equipo una señal para pedir la palabra y practicar dejar terminar la idea del compañero antes de responder."},{"q":"¿Dónde se ubica la escucha activa en la competencia oral del CNEB?","a":"En la capacidad “Interactúa estratégicamente con distintos interlocutores”. Esta capacidad incluye participar alternando los roles de hablante y oyente, respetar turnos y mostrar que se toma en cuenta lo que dice el otro."}],"duda":false},"2023-F1-20":{"n":20,"year":2023,"ctx":"2023-F1-c4","stem":"Un equipo de estudiantes busca recoger información sobre las plantas medicinales utilizadas en su localidad. Para ello, los estudiantes han decidido aplicar un cuestionario dentro de la IE. El docente nota que tienen problemas en la generación de ideas para plantear las preguntas de su cuestionario. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ayudarlos a generar ideas?","options":{"A":"Pedir que, en plenaria, compartan la información que conocen sobre las plantas medicinales de su localidad y la que creen que necesitan conocer. Luego, evaluar con ellos si la información compartida los ayudará a elaborar un cuestionario que contribuya al logro de su propósito.","B":"Indicar que su cuestionario debe tener como fin saber cuáles son y cómo se usan las plantas medicinales en su localidad. Después, ofrecer ejemplos de cuestionarios y pedir que los revisen para identificar las preguntas que pueden adaptar, tomando en cuenta el logro de su propósito.","C":"Facilitar diversas fuentes que incluyan información sobre las plantas medicinales que se emplean en su localidad. A partir de esto, mencionar qué ideas de estas fuentes pueden utilizar en la formulación de las preguntas de su cuestionario, de modo que puedan lograr su propósito."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque activa lo que los estudiantes ya saben y lo que necesitan saber sobre las plantas medicinales. A partir de ese vacío generan sus propias preguntas y luego las evalúan según su propósito.","La C parece correcta porque ofrece fuentes útiles, pero quien decide qué ideas usar es el docente (“mencionar qué ideas pueden utilizar”). Los estudiantes no generan ideas, las reciben. La B también les da preguntas hechas para adaptar.","Pista: en preguntas sobre “generar ideas”, la mejor opción hace pensar a los estudiantes desde sus saberes previos. Descarta las opciones donde el docente o un modelo les entrega las ideas ya listas."],"aprende_mas":[{"q":"¿En qué momento de la escritura se ubica la generación de ideas?","a":"En la planificación, el primer momento del proceso de escritura (planificar, textualizar, revisar). Antes de redactar, el estudiante define propósito, destinatario y qué va a decir. Generar ideas es parte de “Adecúa el texto a la situación comunicativa” y de organizar el contenido."},{"q":"¿Qué técnicas sirven para que los estudiantes generen ideas?","a":"- **Lluvia de ideas**: todos dicen lo que saben sin filtrar.\n- **Cuadro SQA**: qué Sé, qué Quiero saber, qué Aprendí.\n- **Preguntas guía**: ¿qué?, ¿cómo?, ¿para qué?, ¿quién?\nLa alternativa A usa la lógica del cuadro SQA: lo que conocen y lo que necesitan conocer."},{"q":"¿Está mal dar ejemplos o fuentes a los estudiantes?","a":"No, son útiles en otros momentos: para conocer la estructura de un cuestionario o para investigar después. El problema es usarlos cuando el objetivo es que los estudiantes generen sus propias ideas, porque los lleva a copiar en lugar de pensar."}],"duda":false},"2023-F1-21":{"n":21,"year":2023,"ctx":"2023-F1-c5","stem":"La docente busca orientar a los estudiantes en la identificación de los recursos literarios que aportan al sentido global del poema “A la realidad”. ¿Cuál de las siguientes preguntas es más adecuada para que logre su propósito?","options":{"A":"La poeta menciona que a la realidad se le rinde “el gran homenaje”. ¿A qué tipo de situaciones se refiere? Den ejemplos.","B":"Según el poema, la realidad genera en nosotros “el mayor asombro” y “el bostezo”. ¿Qué ideas les produjo esta oposición?","C":"En el poema “A la realidad”, se han usado figuras literarias. ¿En qué versos se evidencia el empleo de una metáfora?"},"answer":"B","tema":"Literatura","explicacion":["La B es correcta porque dirige la mirada a la oposición entre «el mayor asombro» y «el bostezo», el recurso que sostiene todo el poema: la realidad nos maravilla y, a la vez, nos aburre. Además, pide a los estudiantes construir sus propias ideas.","La C parece correcta porque menciona figuras literarias, pero solo pide ubicar una metáfora. Es una tarea de identificación aislada que no conecta el recurso con el sentido global del poema.","Pista: cuando el enunciado dice «recursos que aportan al sentido global», busca la opción que une el recurso con lo que significa el texto. Nombrar o ubicar la figura no basta."],"aprende_mas":[{"q":"¿Qué es la antítesis y cómo se trabaja en el aula?","a":"Es poner juntas dos ideas opuestas para crear contraste, como «asombro» y «bostezo». En clase, no basta con decir «esto es antítesis». Se pregunta: ¿por qué el poeta junta cosas tan distintas? ¿Qué nos quiere decir de la realidad con ese choque?"},{"q":"¿Qué diferencia hay entre identificar un recurso e interpretarlo?","a":"- **Identificar**: reconocer y nombrar el recurso («en este verso hay una metáfora»).\n- **Interpretar**: explicar qué efecto o sentido produce en el texto («esta oposición muestra que la realidad es ambigua»).\nEl CNEB pide llegar a interpretar, no quedarse en la etiqueta."},{"q":"¿Qué es el sentido global de un poema?","a":"Es la idea o experiencia de fondo que el poema transmite como un todo, más allá de cada verso suelto. Se construye juntando las imágenes, los recursos y el título. Por ejemplo, en «A la realidad», el sentido global podría ser que la realidad provoca a la vez admiración y hastío."}],"duda":false},"2023-F1-22":{"n":22,"year":2023,"ctx":"2023-F1-c5","stem":"La docente busca que los estudiantes construyan interpretaciones sobre el sentido global del poema “Lunario musical”. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para que logre su propósito?","options":{"A":"Pedir que mencionen qué ideas se pueden desprender del título “Lunario musical”. Luego, comentar que dicho título ayuda a anticipar que el poeta va a asociar su experiencia de observar la Luna con la experiencia de escuchar una obra musical.","B":"Indicar que, en el poema, se realizan asociaciones entre los diversos sentidos, como del tacto y el olfato. Luego, señalar que a este recurso se le conoce como sinestesia y que, en este caso, permite mostrar la experiencia que el poeta busca compartir.","C":"Solicitar que visualicen las imágenes que les surgen al leer el poema y preguntar qué sensaciones les producen dichas imágenes. Luego, pedir que expliquen cómo estas imágenes aportan en la descripción de la experiencia que vive el yo poético."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque los estudiantes visualizan las imágenes, expresan qué sensaciones les producen y luego explican cómo esas imágenes describen la experiencia del yo poético. Son ellos quienes construyen la interpretación, paso a paso.","La A parece correcta porque parte del título, pero luego la docente «comenta» lo que el título anticipa. Termina dando ella la interpretación, en lugar de que los estudiantes la construyan.","Pista: si el propósito es que los estudiantes «construyan interpretaciones», descarta las opciones donde la docente explica, indica o señala la respuesta. Elige la que los hace pensar y justificar."],"aprende_mas":[{"q":"¿Por qué partir de imágenes y sensaciones al leer poesía?","a":"Porque la poesía se comprende primero desde la experiencia sensorial: lo que vemos, olemos u oímos al leer. Si el estudiante describe qué imagina con «mi cuarto es un lago de aromas», ya está dando el primer paso para interpretar. Luego se le pide relacionar esas imágenes con el sentido del poema."},{"q":"¿Qué es el yo poético?","a":"Es la voz que habla en el poema. No es lo mismo que el autor real, aunque a veces se parezcan. Por ejemplo, en «Lunario musical», el yo poético vive una noche de luna y música; preguntamos qué siente él, no qué sentía Alejandro Peralta."},{"q":"¿Cómo distinguir una acción que transmite de una que hace construir?","a":"- **Transmite**: la docente «indica», «comenta», «señala» o «explica» la respuesta.\n- **Hace construir**: la docente «pregunta», «pide que expliquen», «solicita que relacionen».\nEn la prueba, casi siempre gana la segunda cuando el propósito es interpretar."}],"duda":false},"2023-F1-23":{"n":23,"year":2023,"ctx":"2023-F1-c6","stem":"Durante la planificación de las propuestas de los equipos, el docente escucha que un estudiante realiza el siguiente comentario:\n\n“Amigos, si nos toca exponer, debemos estar relajados porque nos van a entender sin importar cómo nos expresemos. Al final, todos hablamos el mismo idioma. Este… lo que quiero decir es que podemos expresarnos como cuando hablamos con nuestros amigos. Así, estaremos tranquilos y no usaremos fichas de ayuda memoria constantemente en la asamblea, sino solo de vez en cuando. Eh… por cierto, no olvidemos hacer gestos para poner énfasis en las ideas más importantes ni mover nuestras manos según lo que vamos diciendo”.\n\nEl docente identifica una concepción errónea sobre la oralidad en la intervención del estudiante. ¿Cuál es esa concepción?","options":{"A":"Ciertas formas de lenguaje no verbal ayudan a dar énfasis a las ideas de un texto oral.","B":"Al presentar un texto oral, una ayuda memoria debe ser usada con poca frecuencia.","C":"Un texto oral puede ser producido sin considerar la situación comunicativa."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque el estudiante dice que los entenderán «sin importar cómo nos expresemos» y que pueden hablar «como cuando hablamos con nuestros amigos». Ignora que una asamblea es una situación formal que exige adecuar el registro.","La B parece un error, pero usar la ayuda memoria «de vez en cuando» es una práctica adecuada: sirve de apoyo, no para leer todo. Por eso no es la concepción errónea.","Pista: en preguntas de oralidad, la idea clave es la adecuación a la situación comunicativa (público, propósito, formalidad). Cualquier idea de «da igual cómo hable» es la errónea."],"aprende_mas":[{"q":"¿Qué es la situación comunicativa?","a":"- **Quién habla y a quién**: el emisor y su público.\n- **Para qué**: el propósito (convencer, informar, pedir).\n- **Dónde y cómo**: el contexto (asamblea, recreo, clase) y el grado de formalidad.\nTodo texto oral se ajusta a estos elementos."},{"q":"¿Qué es el registro formal e informal?","a":"Es el nivel de lenguaje que elegimos según la situación. Con amigos usamos un registro informal («pucha, causa»). En una asamblea escolar, frente a autoridades y compañeros, se espera un registro formal: vocabulario cuidado, ideas ordenadas y saludo adecuado."},{"q":"¿Para qué sirve una ayuda memoria en una exposición?","a":"Sirve para recordar el orden de las ideas principales, no para leerla de corrido. Debe tener palabras clave o un esquema breve. Así el expositor mantiene el contacto visual con el público y suena natural."}],"duda":false},"2023-F1-24":{"n":24,"year":2023,"ctx":"2023-F1-c6","stem":"El docente ha elaborado una lista de cotejo para que los estudiantes evalúen los textos orales que presentarán en la asamblea. ¿Cuál de las siguientes preguntas incluidas en dicha lista evalúa la coherencia de los textos orales?","options":{"A":"¿Las ideas planteadas ayudan a desarrollar aspectos específicos de la acción solidaria?","B":"¿La acción solidaria se presenta en un género alineado a la intención del expositor?","C":"¿El léxico utilizado en la presentación de la acción solidaria es variado y preciso?"},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta porque pregunta si las ideas «ayudan a desarrollar aspectos específicos» de la acción solidaria. Eso es coherencia: que todas las ideas se relacionen con el tema y lo vayan desarrollando.","La B parece correcta porque habla de la intención del expositor, pero evalúa si el género se ajusta al propósito. Eso corresponde a la adecuación, no a la coherencia.","Pista: coherencia = las ideas giran en torno a un tema y avanzan con sentido. Adecuación = se ajusta a la situación (género, registro, público). Léxico preciso = uso de recursos de la lengua."],"aprende_mas":[{"q":"¿Qué es la coherencia en un texto?","a":"Es la propiedad que hace que el texto tenga sentido como un todo. Las ideas tratan de un mismo tema, no se contradicen, no se salen del asunto y avanzan sin repetirse. Ejemplo: si la propuesta es ayudar al comedor, no debería terminar hablando de un partido de fútbol."},{"q":"¿En qué se diferencian coherencia, cohesión y adecuación?","a":"- **Coherencia**: el sentido global; las ideas se relacionan con el tema.\n- **Cohesión**: los enlaces entre ideas (conectores, referentes, sinónimos).\n- **Adecuación**: el ajuste a la situación (propósito, público, registro, género)."},{"q":"¿Qué es una lista de cotejo?","a":"Es un instrumento de evaluación con criterios que se marcan como «sí» o «no» (logrado o no logrado). Sirve para observar si el estudiante muestra cierta conducta o característica. Cada pregunta debe evaluar un solo aspecto, como aquí la coherencia."}],"duda":false},"2023-F1-25":{"n":25,"year":2023,"ctx":"2023-F1-c6","stem":"Una de las delegadas está practicando su texto oral cuyo propósito es recolectar donaciones para la guardería de la localidad. La estudiante presenta dicho texto frente a los miembros de su equipo para recibir sus comentarios. Esta es la transcripción del texto oral:\n\n“A todos en el barrio nos preocupa que la guardería de la zona no tenga recursos suficientes para atender a los niños y a los bebés. Eh… por eso, nosotros proponemos recolectar donaciones para la guardería. Solicitaríamos donaciones a los vecinos, y a los dueños de tiendas y negocios del barrio. Eh… para organizarnos, haríamos tres comisiones de estudiantes: una para difundir información sobre la acción solidaria en las asambleas comunales, otra para recolectar y una más para entregar las donaciones. Además, debemos mencionar algo importante (haciendo una pausa larga): si todos nos involucramos, sí es posible ayudar a mejorar la situación de la guardería. Eh… por eso, creemos que los vecinos que no estén en posibilidades de donar podrían ayudar a las comisiones encargadas en la recolección y entrega de las donaciones”.\n\nAl final de la presentación, tres estudiantes realizan comentarios sobre la intervención de su compañera. ¿Cuál de los siguientes comentarios evidencia la capacidad de reflexionar sobre el contenido del texto oral?","options":{"A":"“He notado que, casi al final de la presentación, realizaste una pausa bien notoria. Esto puede hacer que el público tenga mayor expectativa por lo que vas a decir a continuación”.","B":"“Para mejorar la propuesta, podríamos añadir que usaremos nuestras redes sociales en la difusión de la acción solidaria. Con las redes, lograríamos que más personas tengan interés en participar”.","C":"“La guardería de la localidad necesita de mucha ayuda económica para atender a los niños y a los bebés. Por eso, la participación de todos los vecinos que tengan tiendas y negocios será de utilidad”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque el compañero evalúa el contenido de la propuesta y aporta una mejora: usar redes sociales para la difusión, explicando por qué lograría más participación. Eso es reflexionar críticamente sobre lo que se dijo.","La C parece correcta porque habla del contenido, pero solo repite lo que la compañera ya dijo sobre la guardería y los vecinos. Parafrasear no es reflexionar ni evaluar.","Pista: reflexionar sobre el contenido implica opinar, valorar o proponer mejoras a las ideas. La A también reflexiona, pero sobre la forma (la pausa), un recurso paraverbal."],"aprende_mas":[{"q":"¿Qué pide la capacidad «reflexiona y evalúa» en oralidad?","a":"Que el estudiante tome distancia del texto oral y lo juzgue. Puede evaluar el contenido (si las ideas son pertinentes, suficientes, válidas), la forma (recursos verbales, no verbales y paraverbales) y el contexto (si se adecúa a la situación). Siempre opinando con razones."},{"q":"¿Qué son los recursos paraverbales y no verbales?","a":"- **Paraverbales**: cómo suena la voz: volumen, entonación, ritmo, pausas.\n- **No verbales**: lo que comunica el cuerpo: gestos, mirada, postura, movimientos.\nAmbos refuerzan o debilitan el mensaje, pero son parte de la forma, no del contenido."},{"q":"¿Cómo diferenciar parafrasear de reflexionar?","a":"Parafrasear es decir con otras palabras lo mismo que dijo el texto («la guardería necesita ayuda»). Reflexionar es agregar un juicio propio sobre eso («esa idea es buena, pero faltaría…»). Si el comentario no añade una valoración, no es reflexión."}],"duda":false},"2023-F1-26":{"n":26,"year":2023,"ctx":"2023-F1-c6","stem":"La delegada de un equipo ha grabado su presentación en un audio y le pide al docente que lo escuche para recibir retroalimentación. A continuación, se muestra la transcripción del texto oral:\n\n“Eh… nuestra propuesta tiene como propósito atender a animales callejeros. Yo les explicaré por qué nuestra propuesta es viable. Primero, es fácil de llevar a cabo. Algunos podríamos dar comida a los animalitos, y otros, hacer bebederos de agua con botellas plásticas. Yo sé hacer esos bebederos. De hecho, soy voluntaria en un grupo juvenil que cuida el ambiente. Ahí aprendí varias estrategias de reciclaje. Eh… por otro lado, si hacemos una colecta en el barrio, obtendríamos dinero para comprar comida. Varios tenemos experiencia recolectando fondos. El año pasado, mi familia hizo una actividad profondos por la salud de mi tío Juan. Por suerte, él ya está mejor. Vendimos tamales. Para mí, es fácil cocinar, porque mi familia se reparte las tareas de la casa. Mi papá y mi mamá nos asignan tareas por igual a mis hermanos y a mí. Aquí termina mi participación”.\n\nEl docente se da cuenta de que algunas ideas del texto oral no contribuyen al logro del propósito comunicativo de la estudiante. Por esta razón, busca orientarla para que identifique este problema en su texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a la estudiante que indique cuál es el propósito de su propuesta de acción solidaria. Luego, sugerir que, en una nueva práctica, sustituya las ideas sobre su participación en el voluntariado y la actividad profondos por otras ideas alineadas a su propósito.","B":"Solicitar a la estudiante que exprese, en pocas palabras, en qué consiste la propuesta de acción solidaria que ha presentado. A partir de esto, indicar que vuelva a escuchar la grabación y que explique si todas las ideas que expuso en su texto aportan al logro de su propósito.","C":"Reproducir el audio del texto oral frente a la estudiante haciendo pausas ante la información que desarrolla aspectos específicos de su propuesta de acción solidaria. Después, mencionar que su texto presenta información que podría obstaculizar el logro de su propósito."},"answer":"B","tema":"Evaluación y retroalimentación","explicacion":["La B es correcta porque la estudiante resume su propuesta, vuelve a escuchar la grabación y explica si cada idea aporta al propósito. Así ella misma descubre que el voluntariado o la salud de su tío no suman.","La A parece correcta porque parte del propósito, pero luego el docente le dice qué ideas sustituir. Le da la respuesta y ella no llega a identificar el problema por sí misma.","Pista: si el enunciado dice «que identifique el problema», gana la opción donde el estudiante compara su texto con el propósito y lo detecta solo. Si el docente señala o corrige, descártala."],"aprende_mas":[{"q":"¿Qué es la retroalimentación por descubrimiento o reflexión?","a":"Es cuando el docente guía con preguntas o acciones para que el estudiante encuentre su propio error y cómo mejorarlo. No le dice la respuesta. Ejemplo: «Escucha de nuevo tu audio: ¿esta parte ayuda a convencer de que tu propuesta es viable?»."},{"q":"¿Qué tipos de retroalimentación reconoce el Minedu?","a":"- **Elemental**: solo dice si está bien o mal.\n- **Descriptiva**: explica qué logró y qué falta, con sugerencias concretas.\n- **Por descubrimiento o reflexión**: guía para que el estudiante descubra el error y la mejora.\nEn la prueba suele preferirse la última."},{"q":"¿Por qué grabar y volver a escuchar ayuda a mejorar un texto oral?","a":"Porque el texto oral es efímero: se dice y se pierde. Grabarlo lo convierte en algo que se puede revisar con calma, como un borrador escrito. Así el estudiante se escucha «desde afuera» y nota repeticiones, digresiones o ideas que sobran."}],"duda":false},"2023-F1-27":{"n":27,"year":2023,"ctx":"2023-F1-c6","stem":"Durante la práctica de los textos orales, uno de los delegados solicita al docente que le brinde retroalimentación sobre su texto, que tiene como propósito brindar ayuda al centro del adulto mayor de la localidad. A continuación, se presenta un fragmento de la transcripción del texto oral:\n\n“Buen día. Eh… yo expondré cuál es nuestra propuesta. Muchos conocemos a las señoras y señores que se atienden en el centro del adulto mayor. Nuestra propuesta se centrará en los señores y señoras de la tercera edad del centro del adulto mayor de nuestra localidad. No obstante, es cierto que el centro del adulto mayor de nuestra localidad tiene cada vez más señoras y señores que atender. Lo bueno es que todos nos preocupamos por ellos. Eh… en principio, esa es nuestra propuesta. Así también, les agradezco por la atención”.\n\nEl docente ha identificado varios problemas que afectan la comprensión del texto oral. ¿Qué problema debe priorizar en su retroalimentación?","options":{"A":"La repetición innecesaria de frases como “centro del adulto mayor”.","B":"La utilización inadecuada de conectores entre algunas ideas del texto oral.","C":"La falta de información para saber en qué consiste la propuesta de acción solidaria."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque el delegado nunca dice en qué consiste la propuesta: solo repite a quién va dirigida y cierra con «esa es nuestra propuesta». Sin ese contenido central, el público no comprende el texto.","La B parece correcta porque hay conectores mal usados, como «No obstante». Pero es un problema local; aunque se corrija, el texto seguiría sin decir qué se propone.","Pista: cuando preguntan qué priorizar, elige el problema que afecta el sentido global (falta de información, propósito no logrado) antes que los locales (conectores, repeticiones, vocabulario)."],"aprende_mas":[{"q":"¿Qué son problemas globales y locales de un texto?","a":"- **Globales**: afectan el sentido de todo el texto: falta la idea principal, no se cumple el propósito, hay contradicciones.\n- **Locales**: afectan una parte: un conector mal puesto, una palabra repetida, un error de concordancia.\nPrimero se atienden los globales."},{"q":"¿Por qué no conviene corregir todos los errores a la vez?","a":"Porque el estudiante se abruma y no sabe por dónde empezar. Es mejor priorizar lo que más afecta la comprensión y trabajarlo bien. Los detalles de forma se pulen en una siguiente versión."},{"q":"¿Qué es la progresión temática?","a":"Es cómo el texto avanza añadiendo información nueva sobre el tema. En este texto no hay progresión: se repite «centro del adulto mayor» sin agregar qué se hará. Un texto que progresa diría, por ejemplo: «Proponemos visitarlos cada viernes para leerles y acompañarlos»."}],"duda":false},"2023-
