s de hobbies?\n\n• Hacer preguntas y responder a otros miembros.\n\n• Compartir información que interece al grupo.\n\nMucha gente pierde horas revisando sus redes sociales. Por eso, mejor intentar conocer gente en persona que mediante internet.\n\nEl docente nota que hay varios aspectos del texto que los estudiantes pueden mejorar. ¿Qué problema de escritura debe priorizar en su retroalimentación?","options":{"A":"La escritura incorrecta de algunas palabras.","B":"La inclusión de ideas que se contradicen entre sí.","C":"La ausencia de verbos principales en varias oraciones."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta: el tríptico invita a unirse a comunidades de hobbies, pero dice “Hablar de nuestros hobbies en internet es peligroso” y cierra recomendando “conocer gente en persona”. Esas contradicciones rompen la coherencia y el propósito del texto.","La C parece correcta porque hay oraciones incompletas (“Para eso, las comunidades o grupos en las redes”), pero es un problema más local. Las contradicciones afectan el sentido de todo el texto, por eso van primero.","Pista: en retroalimentación se prioriza lo global (propósito, coherencia, ideas) antes que lo local (ortografía como “conección” o “hayar”, sintaxis). Primero que el texto tenga sentido."],"aprende_mas":[{"q":"¿Qué es la coherencia en un texto escrito?","a":"Es que todas las ideas apunten al mismo tema y propósito, sin contradecirse ni desviarse. Un texto que invita a usar redes y luego dice que son peligrosas confunde al lector, aunque esté bien escrito."},{"q":"¿En qué orden revisar un primer borrador?","a":"- **Primero, lo global**: propósito, destinatario, coherencia de ideas.\n- **Luego, la organización**: párrafos, cohesión, conectores.\n- **Al final, lo local**: ortografía, puntuación, concordancia."},{"q":"¿Por qué no corregir todo a la vez?","a":"Si el docente señala muchos errores juntos, el estudiante se abruma y suele arreglar solo la ortografía, que es lo más fácil. Priorizar un problema importante hace que la retroalimentación sea útil y que el estudiante mejore de verdad."}],"duda":false},"2023-F1-57":{"n":57,"year":2023,"ctx":"2023-F1-c15","stem":"Los integrantes de un equipo le muestran al docente la primera versión de su tríptico para que les brinde retroalimentación. A continuación, se muestra la introducción del texto:\n\nLas redes sociales y cómo aprovechar todas sus ventajas\n\nLas redes sociales se usan con diferentes objetivos. Tienen un gran alcance. Las redes sociales pueden servir para informarse. Los programas de noticias en televisión y los periódicos impresos solo llegan a cierto público. Mucha gente adulta las usa mayormente para leer noticias. Los adolescentes usan las redes sociales con varios propósitos. Hay adolescentes que se dedican a publicar sus videos de baile, canto, etc. Se hacen famosos en todo el mundo. Los adolescentes muestran sus talentos. Ganan muchos seguidores. Explicaremos cómo podemos aprovechar las redes sociales.\n\nLuego de revisar el texto, el docente busca orientar a los estudiantes en el uso de conectores lógicos para mejorar la cohesión de las ideas del tríptico. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Indicar a los estudiantes que expliquen qué relación lógica existe entre “los adolescentes muestran sus talentos” y “ganan muchos seguidores”. Luego, preguntar qué conectores pueden utilizar para evidenciar esa relación. Sobre esta base, pedir que relean las ideas de su tríptico y determinen las relaciones lógicas entre ellas con conectores diversos.","B":"Volver a leer el tríptico con los estudiantes, y proponer que unan la segunda y la tercera oración con el conector “por eso”. Luego, preguntar si la relación lógica entre dichas oraciones les parece más clara. Por último, entregar una lista con conectores con la finalidad de que evalúen en qué ideas creen que se requiere utilizarlos.","C":"Preguntar a los estudiantes cuál es la utilidad de emplear conectores lógicos en sus producciones escritas. Luego, conversar con ellos sobre qué ideas de su tríptico necesitan conectores para explicitar las relaciones lógicas entre ellas. A partir de esto, sugerir qué tipo de conectores podrían emplear en su escrito."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta: parte de un caso de su propio texto (“muestran sus talentos” / “ganan muchos seguidores”), pide que identifiquen primero la relación lógica (causa-consecuencia), luego el conector, y después que lo apliquen a todo el tríptico.","La B parece correcta porque también usa el texto de los estudiantes, pero el docente les da el conector “por eso” ya elegido y luego una lista. Ellos no razonan qué relación hay entre las ideas.","Pista: la mejor acción hace que el estudiante descubra la relación lógica antes de elegir el conector, con un ejemplo de su texto, y luego transfiera lo aprendido."],"aprende_mas":[{"q":"¿Qué es la cohesión y qué papel cumplen los conectores?","a":"La cohesión es cómo se enlazan las ideas en la superficie del texto. Los conectores hacen visible la relación lógica: causa (“porque”), consecuencia (“por eso”), contraste (“sin embargo”), adición (“además”)."},{"q":"¿Por qué primero la relación y después el conector?","a":"Porque el conector depende del significado. Si el estudiante no entiende que “muestran sus talentos” causa “ganan seguidores”, puede usar cualquier conector de la lista y equivocarse. Entender la relación evita usarlos de memoria."},{"q":"¿Qué falla en la C?","a":"Empieza con una pregunta general sobre la utilidad de los conectores y termina con el docente sugiriendo cuáles usar. No modela con un caso concreto ni deja que el estudiante identifique por sí mismo la relación lógica."}],"duda":false},"2023-F1-58":{"n":58,"year":2023,"ctx":"2023-F1-c15","stem":"Al iniciar la escritura de las segundas versiones de los trípticos, el docente plantea a los estudiantes las siguientes preguntas:\n\n1. ¿Han reconocido problemas de escritura difíciles de superar al escribir la primera\n\nversión de sus textos?\n\n2. ¿Cuáles fueron las acciones que tuvieron que realizar para superar dichos problemas? 3. ¿Qué acciones han realizado para ayudar a los compañeros que tenían mayores\n\nproblemas al escribir?\n\n¿Por qué las preguntas promueven que los estudiantes desarrollen procesos metacognitivos?","options":{"A":"Porque las preguntas son planteadas después de que los estudiantes han terminado de escribir las primeras versiones de sus textos.","B":"Porque las preguntas buscan que los estudiantes mencionen las estrategias empleadas en la escritura de las primeras versiones de sus textos.","C":"Porque las preguntas propician que los estudiantes conozcan los problemas de escritura que suelen surgir cuando escriben las primeras versiones de sus textos."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta: las preguntas piden que los estudiantes reconozcan qué problemas tuvieron y qué acciones realizaron para superarlos. Pensar en las propias estrategias de escritura es justamente metacognición.","La C parece correcta porque habla de “problemas de escritura”, pero se queda en conocer qué problemas suelen surgir. La metacognición va más allá: analizar cómo uno mismo los enfrentó.","Pista: metacognición es pensar sobre el propio proceso de aprendizaje (qué hice, cómo lo hice, qué me funcionó). Busca la alternativa que hable de estrategias propias, no del momento ni de saberes generales."],"aprende_mas":[{"q":"¿Qué es la metacognición en palabras sencillas?","a":"Es “pensar sobre cómo pienso y aprendo”. El estudiante se da cuenta de qué estrategias usó, cuáles funcionaron y qué cambiaría. Ejemplo: “Me trabé en la introducción; me ayudó hacer primero una lista de ideas”."},{"q":"¿Qué preguntas metacognitivas sirven en escritura?","a":"- **Planificación**: ¿Qué hice antes de escribir?\n- **Monitoreo**: ¿Qué dificultades tuve mientras escribía?\n- **Regulación**: ¿Qué hice para superarlas?\n- **Evaluación**: ¿Qué haré distinto en la siguiente versión?"},{"q":"¿Por qué la A no explica la metacognición?","a":"El momento en que se hacen las preguntas (después de la primera versión) no las hace metacognitivas. Lo que importa es qué piden pensar. Una pregunta hecha al final puede ser solo de contenido."}],"duda":false},"2023-F1-59":{"n":59,"year":2023,"ctx":"2023-F1-c16","stem":"Un equipo de estudiantes se encuentra practicando sus intervenciones para el debate frente al docente. Esta es la transcripción de la intervención de uno de los integrantes del equipo:\n\n“Les quiero agradecer a mis compañeros… eh… y al público por interesarse por este tema. Nosotros creemos que, de todas maneras, la experimentación con animales es necesaria, y estamos… eh… a favor de que sea así. Estamos a favor porque yo no sé de qué se quejan los que están en contra. Yo he visto que ellos ni siquiera se preocupan por sus mascotas o por otros animales…”.\n\nEl docente pide al equipo hacer una pausa en la práctica, pues busca ofrecer una retroalimentación que los ayude a plantear argumentos consistentes. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"“¿Han escuchado hablar del término ‘falacia’? ¿Cuántos tipos de falacia argumentativa existen? ¿Qué falacia es aquella en la que se busca desacreditar a las personas que toman una postura contraria a la de nosotros?”.","B":"“¿Cuántos argumentos han preparado para defender su postura? ¿Cuál de esos argumentos tiene más información? ¿Los autores en que han basado ese argumento son expertos en el tema de la experimentación con animales?”.","C":"“¿Qué razones sostienen las personas que rechazan la experimentación con animales? ¿Mencionar el trato que les dan a sus mascotas ayuda a discutir esas razones? ¿Qué otros argumentos podrían poner en discusión las ideas de esas personas?”."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta: lleva al estudiante a conocer las razones del otro bando, a notar que hablar de cómo tratan a sus mascotas no las refuta, y a buscar argumentos que sí discutan esas ideas.","La A parece correcta porque apunta a la falacia ad hominem que cometió el estudiante, pero se queda en teoría (definición, cuántos tipos hay). No lo ayuda a construir un argumento mejor para su intervención.","Pista: una buena retroalimentación parte del error concreto y guía con preguntas hacia la mejora. Desconfía de preguntas que piden definiciones o cantidades."],"aprende_mas":[{"q":"¿Qué es una falacia ad hominem?","a":"Es atacar a la persona en lugar de discutir su argumento. Ejemplo del caso: “Los que están en contra ni cuidan a sus mascotas”. Aunque fuera cierto, no prueba que la experimentación con animales sea necesaria."},{"q":"¿Qué hace consistente a un argumento?","a":"- **Postura clara**: qué defiendo.\n- **Razones pertinentes**: relacionadas con el tema, no con las personas.\n- **Evidencias**: datos, ejemplos o fuentes confiables.\n- **Respuesta a la postura contraria**: discutir las razones del otro."},{"q":"¿Por qué la B tampoco ayuda en este caso?","a":"Pregunta por cantidad de argumentos y por la autoridad de las fuentes, pero no toca el problema que se escuchó: desacreditar al oponente. La retroalimentación debe responder a lo que el estudiante hizo."}],"duda":false},"2023-F1-60":{"n":60,"year":2023,"ctx":"2023-F1-c16","stem":"Los equipos han culminado la práctica de sus intervenciones orales. Durante el monitoreo, el docente tomó nota de algunos recursos empleados por los estudiantes para presentar sus argumentos. En este contexto, él desea promover la capacidad de reflexionar sobre los aspectos formales de los textos orales. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Preguntar a los estudiantes si identificaron las preguntas retóricas usadas por algunos de sus compañeros al presentar sus textos orales. Luego, solicitar que comenten qué intención creen que tuvieron al emplearlas y qué efecto generaron.","B":"Pedir a los estudiantes que indiquen los tipos de entonación de voz que emplearon sus compañeros para presentar sus argumentos durante el debate. Luego, mencionar que la entonación de voz permite añadir matices a los argumentos.","C":"Proponer a los estudiantes que mencionen los argumentos que más llamaron su atención por la información que ofrecían. Luego, solicitar que compartan con el resto de la clase qué argumentos consideran que fueron más sólidos."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta: los estudiantes identifican un recurso formal (las preguntas retóricas) y reflexionan sobre la intención con que se usó y el efecto que causó en el público. Eso es reflexionar sobre la forma del texto oral.","La B parece correcta porque la entonación también es un aspecto formal, pero los estudiantes solo nombran tipos de entonación y es el docente quien explica para qué sirve. Ellos no llegan a reflexionar.","Pista: reflexionar sobre la forma no es solo identificar un recurso; es explicar su intención y efecto. Si la alternativa habla de qué tan sólidos son los argumentos (como la C), eso es contenido."],"aprende_mas":[{"q":"¿Qué son los aspectos formales de un texto oral?","a":"Son el “cómo” se dice algo, no el “qué”:\n- **Recursos verbales**: preguntas retóricas, ejemplos, repeticiones.\n- **Recursos paraverbales**: entonación, volumen, pausas, ritmo.\n- **Recursos no verbales**: gestos, mirada, postura."},{"q":"¿Qué es una pregunta retórica?","a":"Es una pregunta que no espera respuesta; se usa para hacer pensar al público o reforzar una idea. Ejemplo en un debate: “¿Acaso no merecen los enfermos un tratamiento seguro?”. Busca convencer, no informar."},{"q":"¿Qué capacidad del CNEB trabaja esta pregunta?","a":"“Reflexiona y evalúa la forma, el contenido y contexto del texto oral”. En la forma, el estudiante evalúa si los recursos usados fueron adecuados y qué efecto lograron en quienes escuchaban."}],"duda":false}}}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const Q = DATA.questions, CTX = DATA.contexts, EXAMS = DATA.exams;
const META = 46, TOTAL = 60, MIN = 180, EXAM_DATE = new Date(2026,10,8);
const TEMAS = ["Inclusión y DUA","Enfoques y principios del CNEB","Planificación y procesos pedagógicos","Evaluación y retroalimentación","Convivencia y desarrollo del estudiante","Lectura: sentido global e inferencias","Escritura y revisión de textos","Comunicación oral","Literatura"];
const PRACTICE_IDS = Object.keys(Q).filter(id => Q[id].explicacion);
const KEY = 'ruta46.v1';

/* ---------- almacenamiento ---------- */
function blank(){ return {att:{}, err:{}, sims:[], fb:{}, cur:null, tema:'todos', box:{}}; }
let S = blank();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} updateNav(); }

/* repaso cíclico: si fallas, vuelve hoy; si aciertas, vuelve en 1, 3, 7 y 14 días */
const DAY = 864e5, GAPS = [1,3,7,14];
const dayStart = t => { const d = new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
function record(id, ok, mode, choice){
  const now = Date.now();
  (S.att[id] = S.att[id] || []).push([now, ok?1:0, mode, choice||'']);
  if (!ok) S.err[id] = 0;
  else if (id in S.err) { S.err[id]++; if (S.err[id] >= 2) delete S.err[id]; }
  const b = S.box[id] || {b:0, due:0};
  if (ok){ b.due = dayStart(now) + GAPS[Math.min(b.b, GAPS.length-1)]*DAY; b.b = Math.min(b.b+1, GAPS.length); }
  else { b.b = 0; b.due = now; }
  S.box[id] = b;
}
Object.keys(S.att).forEach(id => { if (!S.box[id]) { const a = S.att[id], l = a[a.length-1]; S.box[id] = l[1] ? {b:1, due:dayStart(l[0])+DAY} : {b:0, due:l[0]}; } });
const isDue = id => S.box[id] && S.box[id].due <= Date.now();
const dueIds = () => Object.keys(S.box).filter(isDue);
const last = id => { const a = S.att[id]; return a && a.length ? a[a.length-1] : null; };

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const paras = s => s.split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');
function md(s){
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split('\n');
  let out = '', inList = false;
  for (const l of lines){
    const m = l.match(/^\s*[-•]\s+(.*)/);
    if (m){ if(!inList){ out += '<ul>'; inList = true; } out += `<li>${m[1]}</li>`; }
    else { if(inList){ out += '</ul>'; inList = false; } if (l.trim()) out += `<p>${l}</p>`; }
  }
  return out + (inList ? '</ul>' : '');
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=>t.hidden = true, 2200); }

const VIEWS = [['inicio','Inicio','home'],['practica','Práctica','study'],['simulacro','Simulacro','test'],['errores','Mis errores','redo'],['progreso','Mi progreso','map']];
let view = 'inicio';
function updateNav(){
  const n = Object.keys(S.err).length;
  $('#nav').innerHTML = VIEWS.map(([k,l,i]) => `<button data-v="${k}" aria-current="${view===k}">${ICON[i]}<span>${l}</span>${k==='errores'&&n?`<span class="count">${n}</span>`:''}</button>`).join('');
}
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); });
function go(v){ if (view==='simulacro' && v!=='simulacro') pauseSim(); view = v; updateNav(); clearInterval(timerH); R[v](); window.scrollTo(0,0); }

}

function streak(){
  const days = new Set(Object.values(S.att).flatMap(a => a.map(x => dayStart(x[0]))));
  let d = dayStart(Date.now()); const hoy = days.has(d); if (!hoy) d -= DAY;
  let n = 0; while (days.has(d)) { n++; d -= DAY; }
  return {n, hoy};
}
function rachaHTML(){
  const r = streak();
  return r.n ? `<span class="racha" title="Días seguidos estudiando"><span class="pata">${ICON.paw}</span>${r.n} ${r.n===1?'día seguido':'días seguidos'}</span>`
             : `<span class="racha off"><span class="pata">${ICON.paw}</span>Empieza hoy</span>`;
}
function optsHTML(q, st){
  return `<div class="opts">${['A','B','C'].map(L => {
    let cls = '';
    if (st.revealed){ if (L === q.answer) cls='ok'; else if (L === st.choice) cls='bad'; }
    else if (L === st.choice) cls = 'sel';
    return `<button class="opt ${cls}" data-opt="${L}" ${st.revealed?'disabled':''} aria-pressed="${L===st.choice}" aria-label="Alternativa ${L}"><span class="l">${L}</span><span>${esc(q.options[L])}</span></button>`;
  }).join('')}</div>`;
}
/* panel de feedback con Sarle + explicación + Aprende más */
function explHTML(q, st, opts){
  const ok = st.choice === q.answer;
  const kind = !st.choice ? 'neutral' : ok ? 'ok' : 'bad';
  const pose = kind==='ok' ? IMG.celebra : kind==='bad' ? IMG.animo : IMG.piensa;
  const titulo = kind==='ok' ? '¡Correcto!' : kind==='bad' ? `Casi. La respuesta es ${q.answer}` : `La respuesta es ${q.answer}`;
  const next = opts.next ? `<button class="btn ${kind==='ok'?'btn-ojo':kind==='bad'?'btn-corbatin':'btn-blue'}" data-act="next">${kind==='bad'?'Entendido':'Continuar'}</button>` : '';
  return `<div class="expl">
    <div class="feedback ${kind}" role="status">
      <div class="cabeza">${opts.sarle===false?'':`<img src="${pose}" alt="">`}<p class="titulo">${titulo}</p></div>
      <ul>${(q.explicacion||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
      ${q.duda?'<p class="note">Esta clave genera debate entre docentes. En el examen vale la respuesta oficial del Minedu, que es la que se explica aquí.</p>':''}
      <div class="acciones">${next}<button class="btn btn-ghost" data-act="learn" aria-expanded="${!!st.learn}">${st.learn?'Ocultar Aprende más':'Aprende más'}</button></div>
    </div>
    ${st.learn?`<div class="acc">${q.aprende_mas.map(a=>`<details><summary>${ICON.qa}<span>${esc(a.q)}</span>${ICON.chev}</summary><div class="ans">${md(a.a)}</div></details>`).join('')}</div>`:''}
  </div>`;
}
function metaHTML(q, extra){
  return `<div class="qmeta">${extra||''}${q.tema?`<span class="chip tema">${esc(q.tema)}</span>`:''}<span class="chip">Prueba ${q.year} · pregunta ${q.n}</span></div>`;
}
function thumbsHTML(id){
  const v = S.fb[id]||0;

}

/* ---------- PRÁCTICA (estudio inteligente) ---------- */
let P = {id:null, st:{}, hist:[], src:'practica'};
function pool(){
  const ids = P.src==='errores' ? Object.keys(S.err).filter(id=>Q[id].explicacion) : PRACTICE_IDS;
  return S.tema==='todos' || P.src==='errores' ? ids : ids.filter(id => Q[id].tema === S.tema);
}
function mastered(ids){ return ids.filter(id => { const l = last(id); return l && l[1]; }).length; }
function pickNext(){
  const ids = pool(); if (!ids.length) return null;
  const due = ids.filter(id => isDue(id) && id !== P.id).sort((a,b)=>S.box[a].due-S.box[b].due);
  if (due.length && P.src!=='errores') return due[0];
  const unseen = ids.filter(id => !S.att[id] && id !== P.id);
  if (unseen.length) return shuffle(unseen)[0];
  const wrong = ids.filter(id => { const l = last(id); return (!l || !l[1]) && id !== P.id; });
  if (wrong.length) return shuffle(wrong)[0];
  const rest = ids.filter(id => id !== P.id);
  return rest.length ? shuffle(rest)[0] : ids[0];
}
function practiceView(src){
  P.src = src;
  if (!P.id || !pool().includes(P.id) || P.st.revealed) { P.id = pickNext(); P.st = {}; }
  renderPractice();
}
function levelHTML(){
  const ids = P.src==='errores' ? Object.keys(S.err) : (S.tema==='todos'?PRACTICE_IDS:PRACTICE_IDS.filter(id=>Q[id].tema===S.tema));
  if (P.src==='errores'){
    return `<div class="levelbar"><h1 style="flex:1">Mis errores</h1>${rachaHTML()}</div>
      <p class="hint"><b>${ids.length}</b> ${ids.length===1?'pregunta por corregir':'preguntas por corregir'}. Cada una sale de la lista cuando la aciertas 2 veces seguidas.</p>`;
  }
  const pct = ids.length ? Math.round(100*mastered(ids)/ids.length) : 0;
  const lvl = pct>=77?3:pct>=50?2:1;
  const d = ids.filter(isDue).length;
  return `<div class="levelbar"><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="bartxt">Nivel ${lvl} · ${pct}% dominado</span>${rachaHTML()}<button class="iconbtn" data-act="settings" aria-label="Elegir tema y ajustes" title="Elegir tema">${ICON.gear}</button></div>
    <p class="hint">${S.tema!=='todos'?`Practicando: <b>${esc(S.tema)}</b>. `:''}${d ? `Hoy te tocan <b>${d}</b> ${d===1?'pregunta':'preguntas'} de repaso; salen primero.` : 'Hoy no tienes repasos pendientes: siguen preguntas nuevas.'}</p>`;
}
function renderPractice(){
  const v = $('#view');
  if (!P.id){
    v.innerHTML = levelHTML() + (P.src==='errores'
      ? `<div class="empty"><img src="${IMG.duerme}" alt=""><h2>No tienes errores pendientes</h2><p class="muted">Sarle está descansando. Cuando falles una pregunta en la práctica o en un simulacro, aparecerá aquí para repasarla.</p><button class="btn btn-blue" data-go="practica">Ir a práctica</button></div>`
      : `<div class="empty"><img src="${IMG.piensa}" alt=""><h2>No hay preguntas con este filtro</h2><button class="btn btn-blue" data-act="settings">Cambiar tema</button></div>`);
    bindCommon(v); return;
  }
  const q = Q[P.id], st = P.st;
  v.innerHTML = `${levelHTML()}
    ${metaHTML(q, (S.att[P.id] && S.att[P.id].length > (st.revealed?1:0)) ? '<span class="chip rep">Repaso</span>' : '<span class="chip">Nueva</span>')}
    ${ctxHTML(q, true)}
    <div class="stem">${paras(q.stem)}</div>
    ${optsHTML(q, st)}
    ${st.revealed
      ? `${explHTML(q, st, {next:true})}<div class="row"><button class="btn btn-ghost btn-sm" data-act="history">Historial</button>${thumbsHTML(P.id)}</div>`
      : `<div class="row"><button class="btn btn-blue" data-act="check" ${st.choice?'':'disabled'}>Comprobar</button><button class="btn btn-ghost" data-act="skip">Saltar</button><button class="btn btn-ghost" data-act="show">Ver respuesta</button></div>`}`;
  v.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { if (P.st.revealed) return; P.st.choice = b.dataset.opt; renderPractice(); });

}
function answerPractice(L){
  if (P.st.revealed || !L) return;
  const q = Q[P.id]; P.st = {choice:L, revealed:true};
  record(P.id, L===q.answer, P.src, L); P.hist.unshift([P.id, L===q.answer]); save(); renderPractice();
  setTimeout(()=>{ const e=document.querySelector('.feedback'); if(e && e.getBoundingClientRect().top > innerHeight*0.6) e.scrollIntoView({behavior:'smooth',block:'start'}); }, 50);

function bindCommon(v){

/* ---------- SIMULACRO ---------- */
let timerH = null;
const examOf = o => o.qs ? {id:o.exam, title:o.title||'Simulacro mixto', questions:o.qs} : Object.assign({title:'Prueba oficial '+o.exam}, EXAMS.find(e=>e.id===o.exam));
const usedSecs = c => (c.used||0) + (c.run ? (Date.now()-c.run)/1000 : 0);
function pauseSim(){ const c = S.cur; clearInterval(timerH); if (c && c.run){ c.used = usedSecs(c); c.run = null; save(); } }
function buildMix(){
  /* 60 preguntas de las 180, sin separar las que comparten lectura; pesan más las falladas y las no vistas */
  const units = [], byKey = {};
  EXAMS.forEach(ex => ex.questions.forEach(id => { const k = Q[id].ctx || id; if (!byKey[k]){ byKey[k] = {ids:[]}; units.push(byKey[k]); } byKey[k].ids.push(id); }));
  const w = id => { const l = last(id); return !l ? 2 : l[1] ? 1 : 3; };
  units.forEach(u => u.w = u.ids.reduce((s,id)=>s+w(id),0)/u.ids.length * (0.35 + Math.random()));
  units.sort((x,y)=>y.w-x.w);
  const pick = []; let n = 0;
  for (const u of units){ if (n + u.ids.length <= 60){ pick.push(u); n += u.ids.length; } if (n === 60) break; }
  return shuffle(pick).flatMap(u => u.ids);
}
function simView(){
  if (S.cur) return renderSim();
  const v = $('#view');
  const done = id => S.sims.filter(s=>s.exam===id);

  v.innerHTML = `<h1>Simulacros de 60 preguntas</h1>
    <p class="muted" style="max-width:68ch">Como el día del examen: 3 horas y sin ver respuestas hasta el final. Para la 7.ª escala necesitas <b>46 correctas</b>. Equivocarse no resta, así que responde todas. Si tienes que dejarlo, pulsa <b>Pausar</b> o cierra la página: el reloj se detiene y luego sigues donde te quedaste.</p>
    <div class="examlist">${EXAMS.map(ex=>{ const d=done(ex.id); const best=d.length?Math.max(...d.map(s=>s.correct)):null;
      return `<div class="card"><h2>Prueba oficial ${ex.id}</h2><p class="small muted">Las 60 preguntas del Minedu en su orden real</p>
      <p class="small">${best===null?'Aún no la haces':`Mejor resultado: <b>${best}/60</b> · ${d.length} ${d.length===1?'intento':'intentos'}`}</p>
      <div class="row" style="margin-top:auto;padding-top:6px"><button class="btn btn-ghost" data-start="${ex.id}">Empezar</button>${d.length?`<button class="btn btn-ghost" data-res="${ex.id}">Ver último</button>`:''}</div></div>`; }).join('')}</div>
    <div class="card mixcard"><h2>Simulacro mixto</h2>
      <p class="small muted" style="max-width:70ch">Arma uno nuevo cada vez: 60 preguntas al azar de las 180, con más peso en las que fallaste o aún no has visto. Haz todos los que quieras.</p>
      <p class="small">${bestMix===null?'Aún no haces ninguno':`${mix.length} ${mix.length===1?'hecho':'hechos'} · mejor resultado: <b>${bestMix}/60</b>`}</p>
      <div class="row" style="padding-top:6px"><button class="btn btn-blue" data-start="mixto">Armar un simulacro nuevo</button>${mix.length?`<button class="btn btn-ghost" data-res="mixto">Ver último</button>`:''}</div></div>`;
  v.querySelectorAll('[data-start]').forEach(b => b.onclick = () => {
    const ex = b.dataset.start;
    S.cur = ex==='mixto' ? {exam:'mixto', title:'Simulacro mixto', qs:buildMix(), used:0, run:Date.now(), ans:{}, flag:{}, idx:0}
                         : {exam:ex, used:0, run:Date.now(), ans:{}, flag:{}, idx:0};
    save(); renderSim();
  });
  v.querySelectorAll('[data-res]').forEach(b => b.onclick = () => { const s = S.sims.filter(x=>x.exam===b.dataset.res).pop(); renderResult(s); });
}
function renderSim(){
  const c = S.cur;
  if (c.start && c.used === undefined){ c.used = (Date.now()-c.start)/1000; delete c.start; }
  if (!c.run){ c.run = Date.now(); save(); }
  const ex = examOf(c), N = ex.questions.length, id = ex.questions[c.idx], q = Q[id];
  const v = $('#view');
  const answered = Object.keys(c.ans).length;
  v.innerHTML = `<div class="simtop"><h2>${esc(ex.title)}</h2><span class="timer" id="timer">${fmt(MIN*60-usedSecs(c))}</span><span class="muted small">${answered}/${N} respondidas</span><span style="margin-left:auto" class="row"><button class="btn btn-ghost" data-sim="pause">Pausar</button><button class="btn btn-ghost" data-sim="finish">Terminar y ver nota</button></span></div>
    <div class="grid60" aria-label="Ir a pregunta">${ex.questions.map((qid,i)=>`<button class="cell ${c.ans[qid]?'ans':''} ${c.flag[qid]?'flag':''} ${i===c.idx?'cur':''}" data-goto="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join('')}</div>
    <div class="qmeta"><span class="chip">Pregunta ${c.idx+1} de ${N}</span>${c.flag[id]?'<span class="chip" style="color:var(--warn)">Marcada para revisar</span>':''}</div>
    ${ctxHTML(q, true)}
    <div class="stem">${paras(q.stem)}</div>
    ${optsHTML(q, {choice:c.ans[id]})}
    <div class="row spread"><button class="btn btn-ghost" data-sim="prev" ${c.idx===0?'disabled':''}>Anterior</button><button class="btn btn-ghost" data-sim="flag">${c.flag[id]?'Quitar marca':'Marcar para revisar'}</button><button class="btn btn-blue" data-sim="next">${c.idx===N-1?'Terminar':'Siguiente'}</button></div>
    <div id="confirm"></div>`;
  v.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { c.ans[id] = b.dataset.opt; save(); renderSim(); });
  v.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { c.idx = +b.dataset.goto; save(); renderSim(); window.scrollTo(0,0); });
  v.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => {
    const a = b.dataset.sim;
    if (a==='prev'){ c.idx--; save(); renderSim(); window.scrollTo(0,0); }
    if (a==='next'){ if (c.idx===N-1) return askFinish(); c.idx++; save(); renderSim(); window.scrollTo(0,0); }
    if (a==='flag'){ c.flag[id] = !c.flag[id]; save(); renderSim(); }
    if (a==='finish') askFinish();
    if (a==='pause') renderPaused();
  });
  clearInterval(timerH);
  timerH = setInterval(() => { const left = MIN*60-usedSecs(c); const t=$('#timer'); if (!t) return clearInterval(timerH); t.textContent = fmt(left); t.classList.toggle('low', left<900); if (left<=0){ clearInterval(timerH); finishSim(); } }, 1000);
}
function renderPaused(){
  pauseSim();
  const c = S.cur, ex = examOf(c);
  $('#view').innerHTML = `<div class="empty"><img src="${IMG.duerme}" alt=""><h2>${esc(ex.title)} en pausa</h2><p class="muted">Sarle te espera. Llevas ${Object.keys(c.ans).length} de ${ex.questions.length} respondidas y te quedan ${fmt(MIN*60-usedSecs(c))}. Puedes cerrar la página: tu avance queda guardado.</p><button class="btn btn-blue" id="resume">Continuar</button></div>`;

function askFinish(){

function finishSim(){
  const c = S.cur; if (!c) return; clearInterval(timerH);
  const ex = examOf(c);

  ex.questions.forEach(id => { const ch = c.ans[id]||''; const ok = ch===Q[id].answer; if (ok) correct++; record(id, ok, 'simulacro', ch); });
  const res = {exam:c.exam, date:Date.now(), correct, total:ex.questions.length, ans:c.ans, secs:Math.min(MIN*60, Math.round(usedSecs(c)))};
  if (c.qs){ res.qs = c.qs; res.title = c.title; }

window.addEventListener('pagehide', pauseSim);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseSim(); else if (view==='simulacro' && S.cur && $('#timer')) renderSim(); });

/* ---------- MI PROGRESO ---------- */
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','set','oct','nov','dic'];
const dlabel = ts => { const d = new Date(ts); return `${d.getDate()} ${MES[d.getMonth()]}`; };
function scoreChart(sims){
  const W = 720, H = 260, L = 44, Rt = 24, T = 18, B = 40, iw = W-L-Rt, ih = H-T-B;
  const n = sims.length, X = i => L + (n===1 ? iw/2 : i*iw/(n-1)), Y = v => T + ih - v/60*ih;
  const grid = [0,15,30,45,60].map(v => `<line x1="${L}" x2="${W-Rt}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${v}</text>`).join('');
  const meta = `<line x1="${L}" x2="${W-Rt}" y1="${Y(META)}" y2="${Y(META)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-Rt}" y="${Y(META)-7}" text-anchor="end" font-size="12" font-weight="600" fill="var(--ink)">Meta 46</text>`;
  const path = sims.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(s.correct).toFixed(1)}`).join(' ');
  const step = Math.max(1, Math.ceil(n/8));
  const xl = sims.map((s,i)=> (i%step===0 || i===n-1) ? `<text x="${X(i)}" y="${H-14}" text-anchor="middle" font-size="12" fill="var(--muted)">${dlabel(s.date)}</text>` : '').join('');
  const pts = sims.map((s,i)=>`<g class="pt" data-i="${i}"><circle cx="${X(i)}" cy="${Y(s.correct)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(s.correct)}" r="5" fill="${s.correct>=META?'var(--ok)':'var(--accent)'}" stroke="var(--surface-2)" stroke-width="2"/></g>`).join('');
  const lastS = sims[n-1];
  const lab = `<text x="${X(n-1)}" y="${Y(lastS.correct)-12}" text-anchor="${n===1?'middle':'end'}" font-size="13" font-weight="700" fill="var(--ink)">${lastS.correct}</text>`;
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Correctas por simulacro">${grid}${meta}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${xl}${pts}${lab}</svg><div class="tip" hidden></div></div>`;
}
function bindChart(root, sims){
  const box = root.querySelector('.chartbox'); if (!box) return;
  const tip = box.querySelector('.tip');
  box.querySelectorAll('.pt').forEach(g => {
    g.addEventListener('pointerenter', () => { const s = sims[+g.dataset.i], c = g.querySelector('circle'); const r = box.getBoundingClientRect(), p = c.getBoundingClientRect();
      tip.innerHTML = `<b>${s.correct}/60</b> · ${esc(examOf(s).title)}<br><span class="muted">${dlabel(s.date)} · ${fmt(s.secs)}</span>`; tip.hidden = false;
      tip.style.left = Math.min(r.width-190, Math.max(0, p.left - r.left - 90)) + 'px'; tip.style.top = (p.top - r.top - 64) + 'px'; });
    g.addEventListener('pointerleave', () => tip.hidden = true);
  });
}
function activityStrip(){
  const days = []; const t0 = dayStart(Date.now());
  for (let i=13;i>=0;i--) days.push(t0 - i*DAY);
  const cnt = {}; Object.values(S.att).forEach(a => a.forEach(x => { const d = dayStart(x[0]); cnt[d] = (cnt[d]||0)+1; }));
  const max = Math.max(1, ...days.map(d=>cnt[d]||0));
  return `<div class="strip">${days.map(d=>{ const c = cnt[d]||0; return `<div class="day" title="${dlabel(d)}: ${c} ${c===1?'pregunta':'preguntas'}"><i style="opacity:${c?0.25+0.75*c/max:0}"></i><span>${new Date(d).getDate()}</span></div>`; }).join('')}</div>`;
}
function progresoView(){
  const v = $('#view');
  const rows = TEMAS.map(t => { const ids = Object.keys(Q).filter(id=>Q[id].tema===t); const seen = ids.filter(id=>S.att[id]); const ok = seen.filter(id=>last(id)[1]).length; return {t, total:ids.length, seen:seen.length, ok, p: seen.length? Math.round(ok/seen.length*100) : null}; }).filter(r=>r.total);
  rows.sort((a,b)=> (a.p===null)-(b.p===null) || a.p-b.p);
  const total = Object.values(S.att).reduce((s,a)=>s+a.length,0);
  const dom = mastered(PRACTICE_IDS);
  const active = new Set(Object.values(S.att).flatMap(a=>a.map(x=>dayStart(x[0])))).size;
  const sims = S.sims;
  const weak = rows.find(r=>r.p!==null && r.p<77);
  v.innerHTML = `<div class="levelbar"><h1 style="flex:1">Mi progreso</h1>${rachaHTML()}</div>
    <div class="globo"><img src="${IMG.piensa}" alt="Sarle"><p class="texto">${weak?`Tu tema más flojo ahora es <b>${esc(weak.t)}</b> (${weak.p}%). ¿Lo repasamos hoy?`:rows.some(r=>r.seen)?'Todos tus temas vistos están sobre la meta. Sigue con un simulacro mixto.':'Cuando practiques, aquí te diré qué tema conviene repasar.'}</p></div>
    <div class="cards four">
      <div class="card"><span class="small muted">Preguntas respondidas</span><span class="big">${total}</span><span class="small muted">en ${active} ${active===1?'día':'días'} de estudio</span></div>
      <div class="card"><span class="small muted">Dominadas</span><span class="big">${dom}<small class="muted" style="font-size:18px">/${PRACTICE_IDS.length}</small></span><span class="small muted">acertadas en su último intento</span></div>
      <div class="card"><span class="small muted">Repaso de hoy</span><span class="big">${dueIds().length}</span><span class="small muted">preguntas que vuelven hoy</span></div>
      <div class="card"><span class="small muted">Simulacros</span><span class="big">${sims.length}</span><span class="small muted">${sims.length?`mejor: ${Math.max(...sims.map(s=>s.correct))}/60`:'aún ninguno'}</span></div>
    </div>
    <div class="panel"><h2>Correctas en cada simulacro</h2>
      ${sims.length ? scoreChart(sims) + `<p class="small muted">Cada punto es un simulacro terminado. Verde: pasó la meta de 46.</p>` : `<div class="empty"><p class="muted">Cuando termines tu primer simulacro, aquí verás cómo sube tu puntaje de uno a otro.</p><button class="btn btn-blue" data-go="simulacro">Hacer un simulacro</button></div>`}
    </div>
    <div class="panel"><h2>Tus últimos 14 días</h2>${activityStrip()}<p class="small muted">Más intenso, más preguntas ese día. Un poco cada día rinde más que mucho un solo día.</p></div>
    <h2>Mis temas</h2><p class="muted" style="max-width:70ch;margin-top:-12px">Acierto en el último intento de cada pregunta, del tema más flojo al más fuerte. La línea marca la meta del 77%.</p>
    <div class="topics">${rows.map(r=>topicCard(r.t, r.p, `${r.seen} de ${r.total} preguntas vistas`, `<button class="btn btn-ghost btn-sm" data-tema="${esc(r.t)}">Practicar</button>`)).join('')}</div>`;
  bindCommon(v); bindChart(v, sims);
  v.querySelectorAll('[data-tema]').forEach(b => b.onclick = () => { S.tema = b.dataset.tema; save(); P.id = null; go('practica'); });
}

/* ---------- INICIO ---------- */
function inicioView(){
  const v = $('#view');
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.max(0, Math.round((EXAM_DATE - today)/864e5));
  const lastSim = S.sims[S.sims.length-1];
  const lvl = Math.round(100*mastered(PRACTICE_IDS)/PRACTICE_IDS.length);
  const due = dueIds().length, nErr = Object.keys(S.err).length;
  const cta = !S.sims.length ? ['simulacro','Empezar el simulacro 2025'] : due ? ['practica','Empezar repaso'] : ['practica','Seguir practicando'];
  const r = streak();
  const saludo = !S.sims.length ? 'Empecemos con un simulacro para ver dónde estás. Vamos con calma.'
    : !r.n ? `Sarle se quedó dormido esperándote. ¿Seguimos?${due?` Te tocan ${due} de repaso.`:''}`
    : due ? `Hoy te tocan ${due} ${due===1?'pregunta':'preguntas'} de repaso.` : r.hoy ? 'Hoy ya estudiaste. Si quieres, seguimos con preguntas nuevas.' : 'Hoy no tienes repasos pendientes. ¿Seguimos con preguntas nuevas?';
  v.innerHTML = `<div class="hero"><img src="${r.n||!S.sims.length?IMG.hola:IMG.duerme}" alt="Sarle saludando"><div class="body">
      <p class="eyebrow">Prueba Nacional · domingo 8 de noviembre</p>
      <h1>¡Hola, mamá!</h1>
      <p style="max-width:56ch">${saludo} Tu meta es 46 de 60 correctas.</p>
      <div class="row"><button class="btn btn-blue" data-go="${cta[0]}">${cta[1]}</button>${rachaHTML()}</div></div></div>
    <div class="cards">
      <div class="card"><span class="small muted">Faltan</span><span class="big">${days} días</span><span class="small muted">para la prueba</span></div>
      <div class="card"><span class="small muted">Último simulacro</span><span class="big">${lastSim?lastSim.correct+'/60':'—'}</span><span class="small muted">${lastSim?(lastSim.correct>=META?'Pasaste la meta':`Faltan ${META-lastSim.correct} para 46`):'Aún no haces uno'}</span></div>
      <div class="card"><span class="small muted">Dominio de las 180</span><span class="big">${lvl}%</span><span class="small muted">${due?`${due} para repasar hoy`:nErr?`${nErr} errores por corregir`:'sigue así'}</span></div>
    </div>
    <h2>Tu ciclo con Sarle</h2>
    <div class="steps">
      <div class="step"><span class="n">1 · Mide</span><b>Haz un simulacro</b><p class="small muted">60 preguntas con reloj. Empieza por el 2025; después arma simulacros mixtos cuando quieras.</p><button class="btn btn-ghost" data-go="simulacro">Simulacro</button></div>
      <div class="step"><span class="n">2 · Practica</span><b>Repasa y aprende</b><p class="small muted">Cada día salen primero las preguntas que te tocan repasar. Las que fallas vuelven hoy; las que aciertas, en 1, 3, 7 y 14 días.</p><button class="btn btn-ghost" data-go="practica">Práctica</button></div>
      <div class="step"><span class="n">3 · Mira</span><b>Revisa tu progreso</b><p class="small muted">Tu puntaje simulacro a simulacro y tus temas del más flojo al más fuerte. Luego vuelve al paso 1.</p><button class="btn btn-ghost" data-go="progreso">Mi progreso</button></div>
    </div>
    <p class="small muted">Tu avance se guarda en este navegador. Usa siempre la misma laptop y el mismo navegador.</p>`;
  bindCommon(v);
}

const R = { inicio:inicioView, practica:()=>practiceView('practica'), simulacro:simView, errores:()=>{ P.id=null; practiceView('errores'); }, progreso:progresoView };
if (S.cur) view = 'simulacro';
updateNav(); R[view]();
})();
</script>
