F1-28":{"n":28,"year":2023,"ctx":"2023-F1-c7","stem":"Durante la planificación de los ensayos, los integrantes de uno de los equipos le comentan al docente que no saben qué postura asumir acerca del consumo de productos transgénicos. Por ello, el docente busca orientarlos para que asuman una posición informada sobre el tema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Preguntar qué fuentes de información han podido recabar sobre el consumo de transgénicos. Luego, pedir que identifiquen cuál es la postura que la mayoría de fuentes defiende, a fin de que asuman dicha postura como equipo.","B":"Indicar a cada integrante del equipo que comente cuál es su posición sobre el consumo de transgénicos y por qué. Luego, mencionar cuál de las posturas cuenta con fuentes más actualizadas y sugerir que asuman dicha postura como equipo.","C":"Ofrecer una selección de fuentes confiables de información con posturas diversas acerca del consumo de transgénicos. Luego, pedir que conversen sobre la postura que presente sustentos más sólidos para que evalúen qué posición deben asumir como equipo."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque el docente ofrece fuentes confiables con posturas diversas y pide que evalúen cuál tiene sustentos más sólidos. Así el equipo decide su posición con información y criterio propio.","La A parece correcta porque trabaja con fuentes de los estudiantes, pero los lleva a adoptar la postura de la mayoría. Que muchos digan algo no lo hace verdad; no se evalúa la calidad de los argumentos.","Pista: una «posición informada» nace de contrastar fuentes confiables y diversas y valorar sus argumentos. Desconfía de opciones que deciden por mayoría o donde el docente sugiere la postura (como la B)."],"aprende_mas":[{"q":"¿Qué es una fuente confiable?","a":"- **Autor identificable**: se sabe quién lo escribe y si es especialista.\n- **Institución seria**: universidades, organismos de salud, revistas científicas.\n- **Datos verificables**: cita estudios o evidencias.\nUn post anónimo en redes no cumple estos criterios."},{"q":"¿Por qué ofrecer posturas diversas y no solo una?","a":"Porque para tomar una posición propia hay que conocer los distintos lados del debate. Si solo leen fuentes a favor, terminarán repitiendo una opinión ajena. Contrastar ayuda a desarrollar pensamiento crítico y también prepara para anticipar contraargumentos en el ensayo."},{"q":"¿Qué se hace en la planificación de un ensayo argumentativo?","a":"Se define el propósito, el destinatario y la postura (tesis). Luego se buscan y seleccionan fuentes, y se organizan los argumentos y evidencias en un esquema. Sin una postura clara al planificar, el ensayo saldrá confuso."}],"duda":false},"2023-F1-29":{"n":29,"year":2023,"ctx":"2023-F1-c7","stem":"Un equipo de estudiantes le ha pedido al docente que revise la primera versión de su ensayo que presenta una postura a favor del consumo de productos transgénicos. Durante la revisión, el docente nota que los estudiantes han presentado ideas que contradicen la postura que quieren defender. Por esta razón, busca que se den cuenta de este problema en su texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Comentar que el propósito de su texto es defender su postura a favor del consumo de transgénicos. A partir de esto, pedir que identifiquen los argumentos más convincentes y que los refuercen con información nueva en una segunda versión de su ensayo.","B":"Solicitar que, de forma oral, expliquen por qué están de acuerdo con el consumo de transgénicos. Luego, pedir que lean su ensayo y subrayen con un color las ideas que creen que sirven para apoyar su postura y con otro, las ideas que no lo hacen.","C":"Indicar que las contradicciones en un texto son un problema de coherencia que afecta la claridad del mensaje que se quiere comunicar. Luego, señalar cuáles son las ideas de su ensayo que contradicen su postura acerca del consumo de transgénicos."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque primero explican oralmente su postura y luego subrayan con un color las ideas que la apoyan y con otro las que no. Así ellos mismos descubren qué ideas contradicen lo que defienden.","La C parece correcta porque nombra bien el problema (coherencia), pero el docente «señala» las ideas contradictorias. Les da la respuesta y no se cumple el propósito de que se den cuenta solos.","Pista: si el propósito es que los estudiantes «se den cuenta», elige la acción que les da una herramienta para revisar su texto, no la que les entrega el diagnóstico hecho."],"aprende_mas":[{"q":"¿Por qué pedir que expliquen su postura oralmente antes de releer?","a":"Porque al decirla en voz alta tienen clara la idea que quieren defender. Con esa «brújula», al releer el ensayo es más fácil notar qué ideas se alejan o la contradicen. Hablar ordena el pensamiento antes de revisar."},{"q":"¿Qué es la revisión en el proceso de escritura?","a":"Es la etapa en que se relee el borrador para mejorarlo según el propósito: contenido, organización y forma. No es solo corregir ortografía. Ejemplo: verificar que cada argumento respalde la tesis y eliminar los que la contradicen."},{"q":"¿Qué estrategias ayudan a que el estudiante revise su propio texto?","a":"- **Subrayado con colores**: distinguir ideas que apoyan o no la tesis.\n- **Preguntas guía**: «¿Esta idea ayuda a defender tu postura?».\n- **Lectura entre pares**: un compañero lee y comenta.\nTodas promueven la autonomía y la metacognición."}],"duda":false},"2023-F1-30":{"n":30,"year":2023,"ctx":"2023-F1-c8","stem":"La docente busca orientar a los estudiantes en la identificación de los recursos literarios que aportan al sentido global de la fábula. ¿Cuál de las siguientes preguntas es más adecuada para ello?","options":{"A":"¿Qué función cumple la pregunta “¿cómo amar, entonces, sin comunicarse?”, en esta narración?","B":"¿Qué figura literaria se usa en la expresión “[…] una visión del mundo tan aguda, como la de un sabio”?","C":"¿Qué quiere decir el narrador cuando menciona que Raimundo “ante sus amigos, se castigaba con humor”?"},"answer":"A","tema":"Literatura","explicacion":["La A es correcta porque pregunta por la función de la pregunta retórica «¿cómo amar, entonces, sin comunicarse?». Esa frase explica por qué Raimundo aprende a ladrar y conecta con el sentido global: el amor exige comunicarse.","La B parece correcta porque pregunta por una figura literaria, pero solo pide nombrarla (una comparación). No relaciona el recurso con el sentido de la fábula.","Pista: la palabra «función» es clave. Preguntar qué función cumple un recurso obliga a relacionarlo con el sentido global; preguntar qué figura es, solo pide clasificar. La C es una inferencia local."],"aprende_mas":[{"q":"¿Qué es una pregunta retórica?","a":"Es una pregunta que no espera respuesta, porque la respuesta ya está implícita. Se usa para hacer pensar o reforzar una idea. En la fábula, «¿cómo amar sin comunicarse?» quiere decir «no se puede amar sin comunicarse»."},{"q":"¿Qué caracteriza a una fábula contemporánea?","a":"Mantiene rasgos de la fábula clásica, como animales con rasgos humanos y una enseñanza. Pero suele usar humor, ironía y finales sorpresivos, y no siempre da una moraleja explícita. Aquí la ironía está en que el perro corrige el «acento humano» del hombre."},{"q":"¿Cómo formular buenas preguntas sobre recursos literarios?","a":"- **Evita**: «¿Qué figura es esta?» (solo clasifica).\n- **Prefiere**: «¿Qué función cumple…?», «¿Qué efecto produce…?», «¿Cómo ayuda a entender la historia…?».\nAsí el estudiante conecta el recurso con el sentido del texto."}],"duda":false},"2023-F1-31":{"n":31,"year":2023,"ctx":"2023-F1-c8","stem":"En otro momento de la actividad de lectura, la docente busca que los estudiantes reflexionen sobre el contenido de la fábula. ¿Cuál de las siguientes preguntas es adecuada para ello?","options":{"A":"Según Raimundo, Leo tenía una visión aguda del mundo. ¿Qué idea del texto permite defender o refutar la opinión de Raimundo?","B":"De acuerdo con la fábula, Raimundo tenía una razón importante que lo motivaba a aprender a ladrar. ¿Cuál era esta razón?","C":"Teniendo en cuenta las acciones realizadas por Raimundo, ¿qué rasgos de su personalidad pueden identificarse?"},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque pide “defender o refutar” la opinión de Raimundo con ideas del texto: el estudiante debe tomar postura y sustentarla. Eso es reflexionar y evaluar el contenido, el nivel más alto de la comprensión.","La C parece correcta porque exige pensar, pero solo pide deducir rasgos de personalidad a partir de las acciones: es una inferencia, no una evaluación. La B es aún más simple: recupera una razón que el texto dice explícitamente.","Pista: si la pregunta pide opinar, valorar, estar de acuerdo o no, o juzgar algo usando el texto como prueba, es “reflexionar sobre el contenido”. Si solo pide deducir algo no dicho, es inferencia."],"aprende_mas":[{"q":"¿Cuáles son los tres niveles de comprensión que evalúa el CNEB?","a":"- **Obtiene información**: ubica datos que están escritos tal cual en el texto.\n- **Infiere e interpreta**: deduce lo que no está dicho (causas, rasgos, tema, sentido global).\n- **Reflexiona y evalúa**: opina sobre el contenido o la forma del texto y sustenta su postura con evidencias."},{"q":"¿Qué verbos delatan una pregunta de reflexión sobre el contenido?","a":"- **Opinar / valorar**: “¿Qué opinas de…?”, “¿Estás de acuerdo con…?”.\n- **Defender / refutar**: “¿Qué idea del texto te permite sostener o rechazar…?”.\n- **Juzgar acciones**: “¿Fue correcto lo que hizo el personaje?, ¿por qué?”."},{"q":"¿Por qué la reflexión debe apoyarse en ideas del texto?","a":"Porque reflexionar no es opinar “al aire”. El estudiante relaciona lo que piensa con lo que el texto dice y lo usa como evidencia. Ejemplo: “Leo sí es sabio, porque su consejo sobre el acento humano muestra que entiende muy bien la diferencia entre imitar y ser”."}],"duda":false},"2023-F1-32":{"n":32,"year":2023,"ctx":"2023-F1-c9","stem":"La docente y los estudiantes están conversando sobre los aspectos que deben considerar para adecuar sus escritos a la situación comunicativa. Tres estudiantes comparten sus comentarios con el resto de la clase. ¿Qué estudiante NO evidencia, en su comentario, un aspecto que contribuya a la adecuación de los textos a la situación comunicativa?","options":{"A":"Ada dice: “¿Recuerdan que una vez la profesora nos preguntó sobre las diferencias entre escribir un mensaje a un amigo y un correo al director del colegio? Lo decía porque debemos estar seguros de qué palabras usar según quién nos leerá”.","B":"Briana dice: “Las fuentes que utilicemos al escribir los textos deberían ser pertinentes. Por esto, me parece que tenemos que conversar acerca de los criterios que podemos usar para seleccionar fuentes que tengan información confiable”.","C":"Caleb dice: “Estaba pensando en que, a veces, abordamos el tema de nuestros textos dejando de lado lo que nos propusimos en un inicio. Al final, terminamos redactando un texto que no llega a cumplir con nuestras expectativas”."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es la que NO aporta a la adecuación: Briana habla de seleccionar fuentes confiables, que tiene que ver con la calidad y veracidad de la información, no con ajustar el texto al destinatario, propósito o registro.","La C parece no relacionarse con la adecuación, pero Caleb advierte que se alejan de “lo que nos propusimos en un inicio”: está hablando del propósito comunicativo, que es un elemento central de la adecuación. La A trata del registro según el lector.","Pista: la adecuación responde a tres preguntas: ¿para quién escribo?, ¿para qué escribo? y ¿qué registro y formato uso? Si un comentario no toca ninguna, no es adecuación."],"aprende_mas":[{"q":"¿Qué es adecuar un texto a la situación comunicativa?","a":"Es ajustar lo que escribo a quién lo leerá, para qué lo escribo y en qué contexto se publicará. Ejemplo: no se escribe igual un mensaje a un amigo que un correo al director; cambian el saludo, las palabras y el tono."},{"q":"¿Qué elementos forman la situación comunicativa?","a":"- **Destinatario**: quién leerá el texto (compañeros, docentes, director).\n- **Propósito**: para qué se escribe (informar, convencer, explicar).\n- **Registro**: formal o informal, según destinatario y contexto.\n- **Formato o soporte**: dónde se publicará (periódico mural, redes, carta)."},{"q":"¿En qué capacidad de escritura entra la selección de fuentes confiables?","a":"Entra en “organiza y desarrolla las ideas de forma coherente y cohesionada”, porque se relaciona con el contenido y la información que se incluye. Es importante, pero no ajusta el texto al lector ni al propósito, por eso no es adecuación."}],"duda":false},"2023-F1-33":{"n":33,"year":2023,"ctx":"2023-F1-c9","stem":"Durante la planificación de los textos, los integrantes de un equipo comentaron a la docente que su propósito es explicar los beneficios de organizar brigadas de limpieza. Sin embargo, tienen dudas sobre el género textual que podrían emplear. Por esta razón, la docente busca orientarlos en la selección de un género apropiado para el mensaje que quieren comunicar. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Ofrecer a los estudiantes una lista con una breve definición de los géneros y de sus características textuales, y entregar algunos textos para que identifiquen el género que correspondería a cada uno de estos textos. A partir de esto, mencionar qué género es pertinente utilizar para que elaboren su escrito.","B":"Comentar a los estudiantes que los géneros textuales que podrían seleccionar para presentar los beneficios de organizar brigadas de limpieza son afiche, tríptico o infografía. Después, solicitar que compartan lo que conocen sobre las características textuales de estos géneros y elijan uno de ellos.","C":"Leer con los estudiantes textos de diversos géneros, que suelen ser publicados en periódicos murales, para identificar sus características textuales. Luego, conversar con ellos sobre las diferencias que presentan estos textos y pedir que expresen cuál de esos géneros se ajusta mejor a su propósito."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque los estudiantes leen textos reales de periódicos murales, comparan sus características y luego deciden ellos mismos qué género se ajusta a su propósito de explicar beneficios. Aprenden desde modelos y con autonomía.","La B parece correcta porque deja elegir, pero la docente ya restringe las opciones (afiche, tríptico, infografía) y los estudiantes eligen solo con lo que recuerdan, sin analizar textos ni vincular el género con su propósito. La A es peor: la docente decide el género.","Pista: en escritura, la mejor acción suele combinar leer textos modelo, analizar sus características y que el estudiante decida en función de su propósito. Desconfía de las opciones donde la docente da la respuesta o las alternativas cerradas."],"aprende_mas":[{"q":"¿Qué son los textos modelo y para qué sirven al escribir?","a":"Son textos reales del mismo tipo que los estudiantes van a producir. Al leerlos, descubren cómo están organizados, qué lenguaje usan y para qué sirven. Ejemplo: antes de escribir una infografía, leen dos o tres infografías y anotan qué tienen en común."},{"q":"¿Cómo se relaciona el género textual con el propósito?","a":"Cada género sirve mejor para ciertos propósitos.\n- **Afiche**: motivar o persuadir con un mensaje breve.\n- **Infografía**: explicar información con datos e imágenes.\n- **Artículo de opinión**: argumentar una postura.\nPor eso, primero se define el propósito y después se elige el género."},{"q":"¿Por qué el CNEB prefiere que el estudiante decida y no la docente?","a":"Porque el enfoque comunicativo busca estudiantes autónomos que tomen decisiones como escritores reales. Si la docente elige por ellos, aprenden a obedecer, no a escribir. La docente guía con preguntas y modelos; el estudiante decide y justifica."}],"duda":false},"2023-F1-34":{"n":34,"year":2023,"ctx":"2023-F1-c9","stem":"Un equipo de estudiantes se encuentra planificando un afiche para motivar a sus compañeros a tener prácticas que contribuyan a la limpieza de los patios durante el recreo. Los integrantes del equipo le presentan a la docente el siguiente esquema de ideas para recibir su retroalimentación:\n\nTítulo. ¡Mantengamos los patios limpios durante el recreo! • Estado de los patios antes, durante y después del recreo • Directivos\n\nP Sus nombres y edad P Domicilio actual\n\n• Evitar accidentes al tener los patios limpios y ordenados • Aseo personal de los estudiantes\n\nP Jabón, cepillo y pasta dental P Toallas higiénicas\n\nLa docente nota que varias ideas del esquema se alejan del propósito comunicativo del afiche. Por esta razón, busca que los estudiantes identifiquen este problema en su esquema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Preguntar cuál es el propósito comunicativo del afiche que desean elaborar. Luego, indicar que revisen el esquema para que determinen si cada una de las ideas que incluyeron, al ser desarrolladas, contribuiría a lograr el propósito del afiche.","B":"Enfatizar que un esquema debe contener ideas que, al escribirlas, contribuyan a lograr el propósito comunicativo de un texto. Luego, indicar que el desarrollo de las ideas sobre los directivos y el aseo de los estudiantes afectaría el logro de su propósito.","C":"Solicitar que mencionen qué información aporta cada una de las ideas del esquema al propósito comunicativo del afiche. Luego, indicar qué ideas, al ser escritas, no favorecerían el logro de su propósito y ofrecer otras para que evalúen su utilidad."},"answer":"A","tema":"Evaluación y retroalimentación","explicacion":["La A es correcta porque la docente pregunta por el propósito del afiche y luego pide que los propios estudiantes revisen si cada idea contribuye a lograrlo. Así ellos mismos descubren qué ideas sobran.","La C parece correcta porque empieza preguntando qué aporta cada idea, pero luego la docente “indica qué ideas no favorecerían” y ofrece otras: termina resolviendo el problema por ellos. La B también les dice directamente qué ideas fallan.","Pista: cuando el enunciado dice que la docente busca que los estudiantes “identifiquen” el problema, la respuesta correcta es la que no les dice cuál es. Si la docente señala el error, la alternativa es incorrecta."],"aprende_mas":[{"q":"¿Qué es la retroalimentación por descubrimiento o reflexión?","a":"Es ayudar al estudiante a encontrar su error por sí mismo mediante preguntas, en lugar de decirle qué está mal. Ejemplo: “¿Para qué es tu afiche? ¿Esta idea del jabón y la pasta dental ayuda a que tus compañeros cuiden el patio?”."},{"q":"¿Qué tipos de retroalimentación distingue el Minedu?","a":"- **Incorrecta**: da información errónea.\n- **Elemental**: solo dice “bien” o “mal”.\n- **Descriptiva**: describe qué falta o cómo mejorar.\n- **Por descubrimiento o reflexión**: guía con preguntas para que el estudiante descubra el error. Es la más valorada."},{"q":"¿Qué tiene que ver el propósito con revisar un esquema?","a":"El propósito es el filtro para decidir qué ideas se quedan. Si el afiche busca que cuiden el patio en el recreo, toda idea que no ayude a eso (domicilio de los directivos, toallas higiénicas) sobra. Enseñar a usar ese filtro sirve para cualquier texto futuro."}],"duda":false},"2023-F1-35":{"n":35,"year":2023,"ctx":"2023-F1-c10","stem":"Para contribuir a la comprensión del texto, la docente plantea diversas preguntas a los estudiantes. ¿Cuál de las siguientes preguntas se centra en que obtengan información explícita del relato?","options":{"A":"¿Cuál es la razón por la que se apagó la vela que el maestro pidió cuidar a los discípulos?","B":"¿Por qué los discípulos consideraban un maestro al hombre que pertenecía a la secta?","C":"¿En qué consistieron los dos encargos que el maestro encomendó a los discípulos?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque los dos encargos están escritos tal cual en el relato: cuidar el tazón sin destaparlo y cuidar la vela del viento. El estudiante solo tiene que ubicarlos.","La B parece explícita porque el texto menciona a quienes “deseosos de dominar las artes tenebrosas, lo tomaban por maestro”, pero no dice el porqué: hay que deducir que lo creían dueño de ese saber. La A tampoco está escrita; la causa de la vela apagada se infiere.","Pista: información explícita es la que puedes señalar con el dedo en el texto. Las preguntas “¿por qué…?” suelen pedir inferencias, salvo que el texto use un “porque” claro."],"aprende_mas":[{"q":"¿Cómo distinguir información explícita de información implícita?","a":"- **Explícita**: está escrita en el texto y se puede subrayar.\n- **Implícita**: no está escrita; se deduce juntando pistas.\nPrueba práctica: si dos estudiantes la encuentran subrayando la misma línea, es explícita."},{"q":"¿Las preguntas “¿por qué…?” siempre son inferenciales?","a":"No siempre, pero casi siempre. Son explícitas solo cuando el texto dice la causa directamente (“se fue porque llovía”). Si el lector tiene que unir hechos para hallar la causa, como la vela apagada mientras dormían, es inferencial."},{"q":"¿Para qué sirven las preguntas literales en un taller de lectura?","a":"Sirven para asegurar que todos tengan claros los hechos básicos antes de interpretar. Si un estudiante no sabe cuáles fueron los encargos, no podrá entender después que el maestro los estaba poniendo a prueba. Son la base, no el objetivo final."}],"duda":false},"2023-F1-36":{"n":36,"year":2023,"ctx":"2023-F1-c10","stem":"Durante el intercambio de ideas sobre el relato, los estudiantes están realizando diversos comentarios. ¿Cuál de los siguientes comentarios se ajusta a una interpretación del sentido global del relato?","options":{"A":"“Los discípulos empujaron el barquito de paja. Esto ocasionó que la nave del maestro estuviera a punto de hundirse en el mar Amarillo”.","B":"“Los discípulos fueron puestos a prueba por el maestro. Él tenía la intención de demostrar que era capaz de saber todo lo que ellos hacían”.","C":"“Los discípulos desobedecieron la primera indicación del maestro y él los descubrió. Pese a esto, se atrevieron a desobedecerlo una segunda vez”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque resume la intención de todo el relato: el maestro “puso a prueba” a los discípulos y demostró que “era capaz de saber todo lo que ellos hacían”. Integra ambos episodios en una sola idea.","La C parece correcta porque abarca los dos episodios, pero solo los resume en secuencia (desobedecieron, los descubrió, desobedecieron otra vez). Cuenta qué pasó, no qué significa. La A se queda en un detalle y además lo distorsiona.","Pista: el sentido global responde “¿de qué trata en el fondo y para qué ocurre todo esto?”. Si la alternativa solo narra hechos en orden, es un resumen; si explica la intención o el significado del conjunto, es sentido global."],"aprende_mas":[{"q":"¿Cuál es la diferencia entre resumen y sentido global?","a":"- **Resumen**: cuenta los hechos principales en orden (“primero… luego…”).\n- **Sentido global**: explica qué significan esos hechos juntos, la intención o el mensaje.\nEjemplo: “Desobedecieron dos veces” es resumen; “El maestro los probaba para mostrar su poder” es sentido global."},{"q":"¿Cómo ayudo a mis estudiantes a construir el sentido global?","a":"Usa preguntas que obliguen a mirar todo el texto: “¿Por qué crees que el maestro repitió la prueba?”, “¿Qué tienen en común los dos episodios?”, “¿Qué quería lograr el maestro?”. Al relacionar las partes, aparece el sentido global."},{"q":"¿Por qué los detalles sueltos no expresan el sentido global?","a":"Porque un detalle explica solo una parte del texto. El sentido global debe valer para todo el relato. Si una idea solo funciona para el episodio del barquito y no para el de la vela, no es global."}],"duda":false},"2023-F1-37":{"n":37,"year":2023,"ctx":"2023-F1-c10","stem":"En otro momento de la actividad, la docente busca que los estudiantes reflexionen sobre el contenido del texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Indicar a los estudiantes que mencionen las circunstancias que llevaron a los discípulos a mentirle al maestro. Luego, pedir que comenten si, ante dichas circunstancias, los discípulos podrían haber actuado de otro modo.","B":"Indicar a los estudiantes que identifiquen los pasajes del texto en los que los discípulos mintieron al maestro. Luego, solicitar que expresen, usando sus propias palabras, la enseñanza que se puede extraer del relato.","C":"Indicar a los estudiantes que los discípulos mintieron al maestro en dos oportunidades y este se dio cuenta. Luego, mencionar que el maestro tuvo razón en cuestionarlos, puesto que querían engañarlo."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque los estudiantes analizan las circunstancias que llevaron a mentir y luego evalúan si los discípulos “podrían haber actuado de otro modo”. Están juzgando la conducta de los personajes: eso es reflexionar sobre el contenido.","La B parece correcta porque pide expresar “la enseñanza” del relato, pero eso es interpretar el sentido o mensaje (inferencia), y ubicar pasajes es obtener información. No hay valoración personal. La C es la docente dando su propio juicio.","Pista: reflexionar sobre el contenido implica que el estudiante tome postura sobre lo que pasa en el texto (¿estuvo bien?, ¿qué otra opción había?). Extraer la moraleja es interpretar, no evaluar."],"aprende_mas":[{"q":"¿En qué se diferencia interpretar la enseñanza de reflexionar sobre ella?","a":"- **Interpretar**: decir cuál es el mensaje (“no hay que mentir”).\n- **Reflexionar**: opinar sobre ese mensaje o sobre las acciones (“mintieron por miedo; yo habría dicho la verdad porque…”).\nLa reflexión siempre incluye una postura propia sustentada."},{"q":"¿Por qué la alternativa donde la docente da su opinión es incorrecta?","a":"Porque quien debe reflexionar es el estudiante. Si la docente dice “el maestro tuvo razón”, cierra la conversación y los estudiantes solo escuchan. En el enfoque comunicativo, la docente pregunta y modera; no impone su lectura."},{"q":"¿Qué preguntas sirven para reflexionar sobre acciones de personajes?","a":"- “¿Qué habrías hecho tú en su lugar?”\n- “¿Era la mejor decisión? ¿Por qué?”\n- “¿Qué consecuencias tuvo su acción?”\n- “¿Estás de acuerdo con cómo reaccionó el otro personaje?”"}],"duda":false},"2023-F1-38":{"n":38,"year":2023,"ctx":"2023-F1-c10","stem":"En otro momento, la docente busca que los estudiantes identifiquen que el uso de un tipo de narrador ofrece una determinada perspectiva a la historia. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Entregar diversos relatos a los estudiantes en los que se hayan empleado distintos tipos de narradores. Luego, indicar cuáles son los narradores usados en cada uno de esos relatos. Después, solicitar que identifiquen el tipo de narrador utilizado en la historia “La secta del loto blanco”.","B":"Conversar con los estudiantes sobre el tipo de narrador de “La secta del loto blanco”. Luego, solicitar que reescriban este relato usando como narrador a uno de los discípulos o al maestro. Después, pedir que contrasten la historia original y la historia reescrita, y compartan las diferencias identificadas.","C":"Mencionar a los estudiantes que el narrador es la voz ficcional que describe y relata la historia. Luego, comentar que esta voz tiene influencia en la información que recibimos como lectores y en el estilo en que la historia es contada. Después, preguntar si, en “La secta del loto blanco”, identificaron esta influencia."},"answer":"B","tema":"Literatura","explicacion":["La B es correcta porque los estudiantes reescriben el relato con un discípulo o el maestro como narrador y luego contrastan ambas versiones. Al vivir el cambio de voz, comprueban por sí mismos cómo cambia la perspectiva de la historia.","La C parece correcta porque menciona que el narrador influye en la información que recibe el lector, pero la docente solo lo explica y pregunta; los estudiantes no experimentan ese efecto. La A se queda en clasificar tipos de narrador.","Pista: si el objetivo es que “identifiquen” un efecto literario, busca la acción donde lo experimentan y comparan (reescribir, transformar, contrastar). Explicar teoría o clasificar no basta."],"aprende_mas":[{"q":"¿Qué tipos de narrador se trabajan en secundaria?","a":"- **Narrador protagonista**: cuenta su propia historia en primera persona (“yo empujé el barquito”).\n- **Narrador testigo**: cuenta lo que vio, en primera persona, sin ser el centro.\n- **Narrador omnisciente**: en tercera persona, sabe todo, incluso pensamientos.\n- **Narrador observador**: en tercera persona, solo cuenta lo que se ve."},{"q":"¿Qué significa que el narrador da una perspectiva a la historia?","a":"Significa que el narrador decide qué sabemos y cómo lo sentimos. Si un discípulo narra, conocemos su miedo y no sabemos cómo el maestro se enteró; si narra el maestro, quizás sabríamos su secreto. La misma historia cambia según quién la cuente."},{"q":"¿Por qué la reescritura es buena estrategia para enseñar literatura?","a":"Porque convierte un concepto abstracto en algo que el estudiante hace. Al transformar el texto, nota qué cambia y por qué. Es aprender haciendo, como en un taller, en vez de memorizar definiciones."}],"duda":false},"2023-F1-39":{"n":39,"year":2023,"ctx":"2023-F1-c10","stem":"La docente solicita a los estudiantes que reescriban el relato. La consigna propuesta es que escriban el texto con un estilo indirecto y cambien el final de la historia. Tres estudiantes presentaron la reescritura del final del relato. ¿Cuál de los siguientes finales reescritos cumple con la consigna planteada por la docente?","options":{"A":"El maestro les dijo: “¿Por qué me han desobedecido?”. En ese preciso momento, los discípulos, arrepentidos, decidieron pedir perdón.","B":"El maestro les gritó por haberlo desobedecido. Sin embargo, a los discípulos no les importó. Tomaron sus cosas y se fueron.","C":"El maestro les increpó porque lo desobedecieron por segunda vez. Y los discípulos se miraron las caras con asombro."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque cumple las dos condiciones: usa estilo indirecto (“les gritó por haberlo desobedecido”, sin citar palabras textuales) y cambia el final, pues los discípulos se van sin importarles, algo que no ocurre en el original.","La C parece correcta porque también usa estilo indirecto, pero su final es casi el mismo del original: el maestro reprocha la segunda desobediencia y los discípulos quedan asombrados. No cambia la historia. La A falla porque cita entre comillas (estilo directo).","Pista: cuando una consigna tiene dos condiciones, revisa cada alternativa contra ambas. La trampa suele cumplir solo una."],"aprende_mas":[{"q":"¿Cuál es la diferencia entre estilo directo e indirecto?","a":"- **Estilo directo**: reproduce las palabras exactas del personaje, con comillas o guion (El maestro dijo: “¿Por qué me desobedecieron?”).\n- **Estilo indirecto**: el narrador cuenta lo que dijo, sin citarlo (El maestro les preguntó por qué lo habían desobedecido)."},{"q":"¿Qué cambios gramaticales hay al pasar a estilo indirecto?","a":"- **Se quitan comillas o guiones**.\n- **Aparece un verbo introductorio**: dijo que, preguntó si, ordenó que.\n- **Cambian personas y tiempos**: “me han desobedecido” pasa a “lo habían desobedecido”."},{"q":"¿Cómo reviso si un texto cumple una consigna con varias condiciones?","a":"Haz una lista de cotejo con cada condición y marca sí o no. Ejemplo: ¿usa estilo indirecto? ¿cambia el final? Solo es correcto si todas están en sí. Enseñar esto ayuda a los estudiantes a autoevaluarse."}],"duda":false},"2023-F1-40":{"n":40,"year":2023,"ctx":"2023-F1-c11","stem":"La docente ha empezado a elaborar una rúbrica para orientar el proceso de escritura de los textos. En el criterio cohesión, la rúbrica presenta la siguiente descripción para el nivel en inicio:\n\nCriterioNivel CohesiónEn inicio\n\nEl texto carece de conectores que expliciten las relaciones lógicas entre las ideas.\n\nVinculación lógica entre las ideas mediante el uso de mecanismos O de cohesión\n\nEl uso de conectores no aclara la relación lógica entre las ideas del texto.\n\nLa docente ya ha elaborado las descripciones para los niveles en proceso y logrado de ese criterio. Ahora, busca elaborar la descripción del nivel destacado. ¿Cuál de las siguientes alternativas presenta una descripción apropiada de dicho nivel?","options":{"A":"El texto presenta una adecuada organización de párrafos, cuyas ideas se vinculan con diversos conectores.","B":"El uso de mecanismos de referencia ayuda a evitar la repetición innecesaria de palabras en el texto.","C":"Los recursos cohesivos utilizados en el texto contribuyen a relacionar estratégicamente las ideas."},"answer":"C","tema":"Evaluación y retroalimentación","explicacion":["La C es correcta porque describe el máximo dominio de la cohesión: los “recursos cohesivos” (no solo conectores) se usan para relacionar las ideas “estratégicamente”, es decir, con intención y eficacia. Es una progresión natural desde el nivel en inicio.","La A parece correcta porque menciona “diversos conectores”, pero mezcla organización de párrafos (otro criterio) y valora la variedad, no la calidad de la relación lógica. La B se limita a un solo mecanismo, la referencia, y no describe el criterio completo.","Pista: en una rúbrica, todos los niveles deben describir el mismo criterio, cambiando solo el grado de calidad. El nivel destacado usa palabras como “estratégicamente”, “pertinente”, “eficaz”, no solo “más cantidad”."],"aprende_mas":[{"q":"¿Qué son los mecanismos o recursos de cohesión?","a":"Son las herramientas que unen las ideas de un texto.\n- **Conectores**: además, pero, por eso, en cambio.\n- **Referentes**: pronombres y sinónimos que evitan repetir (la receta → esta, la preparación).\n- **Signos de puntuación**: separan y relacionan ideas."},{"q":"¿Cómo se construyen los niveles de una rúbrica analítica?","a":"Se mantiene el mismo criterio en todas las filas y se describe cómo mejora en calidad. Ejemplo en cohesión: inicio, no hay conectores o confunden; proceso, algunos aciertos; logrado, relacionan bien las ideas; destacado, los recursos se eligen estratégicamente para dar fluidez."},{"q":"¿Por qué no basta con contar conectores para medir la cohesión?","a":"Porque un texto puede tener muchos conectores mal usados. Lo que importa es que cada recurso exprese bien la relación entre ideas (causa, contraste, secuencia). Calidad antes que cantidad."}],"duda":false},"2023-F1-41":{"n":41,"year":2023,"ctx":"2023-F1-c11","stem":"Una estudiante ha culminado la primera versión de su texto sobre la preparación de una ensalada de quinua. Ella le ha presentado su escrito a la docente para que la ayude con la revisión.\n\nEnsalada de quinua\n\nEste es un plato muy nutritivo y fácil de preparar. Necesitamos 1 taza de quinua, 2 cebollas, 10 aceitunas, 2 tomates, 1 palta, jugo de limón y sal.\n\nEsta receta es para 2 personas. Primero, se lava la quinua y se sancocha en una olla con bastante agua. Luego, se cortan los tomates y las cebollas. He elegido esta receta porque sus ingredientes son fáciles de conseguir. Mi familia consume mucha quinua. Mis padres dicen que es buena porque tiene muchos nutrientes. Aunque a mí no me gustan las verduras, por ejemplo, la cebolla, la aceituna o el tomate, esta ensalada sí la como porque sé que la quinua es un superalimento.\n\nLa docente nota que el texto de la estudiante presenta ideas que se alejan de su propósito comunicativo. Por ello, busca ofrecerle una orientación que la ayude a mejorar su texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Preguntar a la estudiante qué pasos de la preparación de la ensalada involucran utilizar aceitunas, tomate, limón o sal. Luego, mencionar que no incluir dichos pasos afecta el propósito de su texto. Finalmente, pedir que, en lugar de referirse a su familia y a sus gustos sobre la comida, escriba las ideas que hacen falta para comprender el empleo de esos ingredientes en la receta.","B":"Preguntar a la estudiante si su texto cumple el propósito de brindar instrucciones para preparar un plato de comida. Luego, mostrar la receta de un plato indicando qué aspectos contribuyen a que se comprendan los pasos para prepararlo. Finalmente, proponer que evalúe si las tres últimas oraciones de su texto aportan información para la preparación de la ensalada.","C":"Preguntar a la estudiante cuál es el propósito de su escrito. Luego, pedir que explique cuál es el aporte de cada idea de su texto a la comprensión de los pasos de la preparación de la ensalada. Finalmente, solicitar que mencionen qué información cree que es necesaria para que el texto logre su propósito e indicar que incluya dicha información en una nueva versión."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque la estudiante revisa su propio texto desde el propósito: explica qué aporta cada idea a los pasos de la receta, decide qué información falta y la incluye en una nueva versión.","La B parece correcta, pero la docente le señala directamente “las tres últimas oraciones” y desvía la atención a otra receta; además, no la lleva a notar que faltan pasos (aceitunas, palta, limón, sal).","Pista: en revisión gana la opción donde el estudiante contrasta su texto con el propósito y descubre él mismo qué sobra y qué falta. Desconfía cuando la docente ya marca el error o dicta la solución (A)."],"aprende_mas":[{"q":"¿Qué significa que una idea “se aleje del propósito” del texto?","a":"Significa que la idea no ayuda a lograr lo que el texto busca. En una receta, el propósito es que el lector pueda preparar el plato. Contar que a la autora no le gusta la cebolla es interesante, pero no ayuda a cocinar: es una digresión."},{"q":"¿Qué capacidades de escritura del CNEB se trabajan en esta pregunta?","a":"- **Adecúa el texto a la situación comunicativa**: ajustar el texto al propósito y al lector (una receta para compañeros).\n- **Reflexiona y evalúa la forma, el contenido y contexto del texto escrito**: releer y juzgar si cada idea sirve.\nCuando el enunciado dice “se aleja del propósito”, piensa en adecuación."},{"q":"¿Por qué es mejor preguntar que corregir directamente?","a":"Si la docente corrige, el estudiante arregla ese texto pero no aprende a revisar el siguiente. Al preguntar (“¿esta idea te ayuda a explicar cómo se prepara?”), practica el criterio y luego lo usa solo. Eso es autonomía y metacognición."}],"duda":false},"2023-F1-42":{"n":42,"year":2023,"ctx":"2023-F1-c11","stem":"Un estudiante le presenta a la docente la primera versión de una receta para preparar una tortilla de frutas. A continuación, se presenta la sección que ofrece las indicaciones para la preparación de la tortilla:\n\nPreparación de la tortilla\n\nSe deben cortar las manzanas en rodajas para usarlas al final. Se deben machacar los plátanos para que queden como puré. Hay que picar en trozos chiquitos. En un plato, hay que mezclarlos con el puré de plátano. Luego, le echamos el jugo de limón para que no se oxide. Si no tienen, pueden reemplazarla por mango.\n\nEn un recipiente, pueden colocar la harina, los huevos y batirlos con un tenedor. Aparte, hay que calentar el aceite en una sartén y verter la mezcla. Por último, hay que poner la otra fruta encima. Debe freírse por un minuto aproximadamente por ambos lados.\n\n¡Y listo!\n\nLa docente nota que el estudiante no ha establecido una correspondencia clara entre los mecanismos de referencia y los elementos referidos en el texto. Por ello, busca orientarlo para que identifique este problema en su escrito. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Subrayar la oración “si no tienen, pueden reemplazarla por mango” y pedir que comente cuál de las frutas de la receta podría ser reemplazada por mango. Luego, preguntar si cree que debe incluir información en esa oración para ayudar a comprender este paso de la receta. Por último, solicitar que indique si, en todos los pasos de la preparación, es claro a qué ingredientes está aludiendo.","B":"Indicar que no es claro a qué ingrediente se refiere con “la otra fruta” en la penúltima oración del segundo párrafo. Luego, reescribir dicha oración en el texto reemplazando “otra fruta” por “manzanas”, y preguntar si la oración reescrita comunica con claridad este paso de la receta. Por último, señalar qué oraciones del texto requieren que se mencione qué ingredientes se están usando.","C":"Leer juntos el texto y preguntar si, en la cuarta oración del primer párrafo, es necesario explicitar cuál es la fruta que debe mezclarse con el plátano. Luego, indicar que corrija dicha oración para que se comprenda que la fruta cortada en trozos forma parte de esa mezcla. Por último, pedir que vuelva a leer el texto sobre la preparación de la receta y verifique que quede claro a qué ingredientes se está refiriendo."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta: parte de un caso ambiguo (“reemplazarla por mango”: ¿qué fruta?), deja que el estudiante descubra el problema y luego le pide revisar por sí mismo si en todos los pasos queda claro a qué ingrediente alude.","La C parece correcta, pero su pregunta ya trae la respuesta (“¿es necesario explicitar cuál es la fruta?”) y luego la docente le indica qué corregir; el estudiante no identifica el problema por sí mismo.","Pista: si el enunciado dice “que identifique el problema”, elige la opción donde el estudiante detecta la falla con una pregunta abierta y luego la busca en todo el texto, no donde la docente la señala o la reescribe (B)."],"aprende_mas":[{"q":"¿Qué son los mecanismos de referencia en un texto?","a":"Son las palabras que usamos para volver a mencionar algo sin repetirlo: pronombres (“la”, “los”), sinónimos, expresiones como “la otra fruta” o la simple omisión. Funcionan solo si el lector sabe a qué se refieren. En “pueden reemplazarla por mango”, no se sabe qué es “la”."},{"q":"¿Qué es la elipsis y cuándo genera problemas?","a":"Es omitir una palabra que el lector puede recuperar por el contexto. Bien usada: “Lava las fresas y córtalas en dos”. Mal usada: “Hay que picar en trozos chiquitos”: ¿picar qué? Si el referente no se recupera, el texto pierde cohesión."},{"q":"¿Qué capacidad del CNEB se trabaja al revisar los referentes?","a":"- **Organiza y desarrolla las ideas de forma coherente y cohesionada**: incluye usar bien referentes y conectores.\n- **Reflexiona y evalúa**: releer pensando en si el lector entenderá.\nEstrategia de aula: que subrayen cada pronombre y tracen una flecha hacia la palabra que reemplaza."}],"duda":false},"2023-F1-43":{"n":43,"year":2023,"ctx":"2023-F1-c12","stem":"La docente busca que los estudiantes profundicen en las interpretaciones sobre el sentido global del poema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Subrayar los versos referidos a los atributos de los morochucos. Luego, mencionar cuál de los atributos es reiterado con mayor frecuencia en el poema.","B":"Ofrecer información sobre el origen histórico de los morochucos. Luego, preguntar en qué estrofa del poema consideran que se da cuenta de este origen.","C":"Indicar las condiciones climáticas y geográficas que tienen los Andes. Luego, preguntar si, según el poema, los morochucos podrían imponerse o no en esas condiciones."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque lleva a integrar todo el poema en su idea central: los morochucos se han adaptado a la dureza andina y son “invencibles donde el aire en la altura se afila”. Conocer clima y geografía ayuda a interpretar esa fortaleza.","La A parece correcta porque trabaja los atributos, pero contar cuál se repite más es localizar información literal, no interpretar. La B también se queda en ubicar una estrofa (el origen) sin mirar el poema completo.","Pista: el sentido global se trabaja cuando la tarea obliga a unir todo el texto en una interpretación (¿qué nos quiere decir?). Subrayar, contar o ubicar una estrofa son tareas literales o parciales."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea que resume lo que todo el texto quiere comunicar, no solo una parte. Se construye uniendo pistas: cascos duros, comedores de ichu, incansables, invencibles… todo apunta a la fortaleza y adaptación de los morochucos a los Andes. Pregunta típica: “Si tuvieras que decir en una oración de qué trata el poema, ¿qué dirías?”."},{"q":"¿Cómo distinguir una tarea literal de una inferencial?","a":"- **Literal**: la respuesta está escrita tal cual (ubicar, subrayar, contar). Ej.: “¿De dónde vienen, según el poema?”.\n- **Inferencial**: hay que unir pistas y deducir lo que no se dice. Ej.: “¿Por qué el poeta los llama invencibles?”.\n- **Crítica**: opinar o valorar. Ej.: “¿Te parece justa esta imagen de los morochucos?”."},{"q":"¿Por qué ayuda dar información del contexto antes de interpretar?","a":"Porque el lector necesita saberes previos para entender las imágenes. Si un estudiante no sabe cómo es la puna (frío, viento, poco oxígeno), no capta por qué ser “bebedores de vientos” es una hazaña. El contexto es un andamio, siempre que luego se vuelva al poema para interpretar."}],"duda":false},"2023-F1-44":{"n":44,"year":2023,"ctx":"2023-F1-c12","stem":"En otro momento de la sesión, los estudiantes comparten sus comentarios acerca del texto. ¿Cuál de los comentarios se ajusta a una reflexión sobre el contenido del poema?","options":{"A":"“El poema da a entender que los morochucos son tan veloces que vuelan como cóndores por las cumbres”.","B":"“A mí me llamó la atención que en el poema se mencione que los gauchos vienen de la misma época que los morochucos”.","C":"“Me gustó el poema, porque pienso que los morochucos, que son fuertes y tienen mucha energía, son algo así como superhéroes”."},"answer":"C","tema":"Literatura","explicacion":["La C es correcta porque el estudiante toma una postura personal sobre lo que dice el poema (son fuertes, tienen mucha energía) y la relaciona con sus propias ideas (“son algo así como superhéroes”). Eso es reflexionar sobre el contenido.","La A parece correcta porque “da a entender” suena a reflexión, pero es una inferencia, y además errada: “volar como cóndores a las cumbres” es una comparación sobre su ascenso a la altura, no sobre velocidad.","Pista: “reflexión sobre el contenido” es una opinión o valoración del lector apoyada en lo que dice el texto (me gustó porque…, estoy de acuerdo porque…). Si solo explica o ubica información (B), es comprensión, no reflexión."],"aprende_mas":[{"q":"¿Qué diferencia hay entre reflexionar sobre el contenido y sobre la forma?","a":"- **Contenido**: opinar sobre lo que dice el texto (ideas, personajes, valores). Ej.: “Los morochucos me parecen admirables porque…”.\n- **Forma**: opinar sobre cómo está escrito (metáforas, ritmo, estructura). Ej.: “Las comparaciones con el cóndor hacen el poema más visual”.\nAmbas están en la capacidad “Reflexiona y evalúa la forma, el contenido y contexto del texto”."},{"q":"¿Qué es una comparación o símil en un poema?","a":"Es una figura que relaciona dos cosas con un nexo como “como” o “cual”. En “ruedan como galgas” y “volar como cóndores”, el poeta no dice que vuelen de verdad: resalta su agilidad para bajar y subir montañas. Leerla al pie de la letra es un error frecuente."},{"q":"¿Cómo promover comentarios reflexivos en un taller de lectura literaria?","a":"Con preguntas que pidan opinión con sustento: “¿Qué te pareció…? ¿Por qué?”, “¿Con qué héroe lo compararías?”, “¿Estás de acuerdo con la imagen que da el poeta?”. Lo importante es que el estudiante vuelva al texto para justificar, no que opine en el aire."}],"duda":false},"2023-F1-45":{"n":45,"year":2023,"ctx":"2023-F1-c13","stem":"Como parte de la planificación de los videos, la docente busca compartir información sobre las acciones que las autoridades públicas realizan para proteger el patrimonio cultural. Ella comenta a los estudiantes que verán un video que tiene como título “¿Qué es el patrimonio cultural? Defensores del patrimonio”, publicado por el Ministerio de Cultura. Antes de reproducirlo, la docente tiene como propósito que los estudiantes realicen anticipaciones acerca del contenido del video a partir de su título. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"¿Cuál es la raíz léxica de “patrimonio”? ¿Esta raíz tiene influencia en lo que quiere decir patrimonio hoy en día?","B":"¿Qué características debería tener un lugar u objeto para ser declarado patrimonio? ¿Por qué sería necesario defenderlo?","C":"¿Creen que la defensa del patrimonio exige la participación de los estudiantes? ¿En qué acciones concretas han participado recientemente?"},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque sus preguntas salen de las dos partes del título: “¿Qué es el patrimonio cultural?” (qué características debe tener) y “Defensores del patrimonio” (por qué defenderlo). Así los estudiantes formulan hipótesis sobre el contenido.","La C parece correcta porque habla de defender el patrimonio, pero se centra en la experiencia de los estudiantes, no en anticipar qué dirá el video, que trata de las acciones de las autoridades.","Pista: anticipar es predecir el contenido usando pistas del texto (título, imágenes, autor). La opción correcta se apoya en esas pistas; descarta las que se van a la experiencia personal (C) o a datos ajenos como la etimología (A)."],"aprende_mas":[{"q":"¿Qué son las anticipaciones o hipótesis sobre un texto?","a":"Son predicciones que el estudiante hace antes de leer o escuchar, usando pistas como el título, las imágenes o quién lo publica. Ej.: “Si se llama ‘Defensores del patrimonio’, seguro hablará de quiénes lo protegen y cómo”. Después se contrastan: ¿acertamos?"},{"q":"¿En qué momento de la comprensión se hacen las anticipaciones?","a":"- **Antes**: activar saberes previos y anticipar el contenido (aquí está esta pregunta).\n- **Durante**: verificar o ajustar las hipótesis, tomar notas.\n- **Después**: contrastar las hipótesis, interpretar y opinar."},{"q":"¿Activar saberes previos es lo mismo que anticipar?","a":"No exactamente. Activar saberes previos es recordar lo que ya sé del tema (“¿qué patrimonio conocen?”). Anticipar es usar eso más las pistas del texto para predecir qué dirá. Si el enunciado pide anticipar a partir del título, la respuesta debe conectarse con ese título."}],"duda":false},"2023-F1-46":{"n":46,"year":2023,"ctx":"2023-F1-c13","stem":"Como parte del acompañamiento a la planificación de los textos orales, la docente nota que, en el diálogo de uno de los equipos, los estudiantes no están escuchando las opiniones de sus compañeros ni están respetando los turnos para intervenir. Por esta razón, ella tiene como propósito ofrecerles una orientación para que, por sí mismos, se den cuenta de este problema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para lograr dicho propósito?","options":{"A":"Indicar que, durante el diálogo del equipo, algunos estudiantes no mostraban estar escuchando las intervenciones de su interlocutor o interrumpían a sus compañeros. Luego, preguntar si consideran que escuchar y respetar los turnos de intervención pueden contribuir a realizar una mejor planificación de los textos orales.","B":"Solicitar que comenten si, en el diálogo del equipo, creen que han respetado los turnos de intervención o han escuchado a sus compañeros. Luego, pedir que indiquen por qué plantear repreguntas, parafrasear la información compartida y llegar a acuerdos pueden ayudar a intercambiar y escuchar las ideas de todo el equipo.","C":"Participar en el diálogo con los estudiantes respetando los turnos de intervención y dando señales no verbales y verbales para demostrar comprensión de las ideas. Luego, mencionar que respetar los turnos para intervenir y utilizar esas señales contribuyen a que las ideas expuestas en el diálogo sean comprendidas."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque los estudiantes evalúan su propio diálogo (“¿han respetado los turnos? ¿han escuchado?”) y luego reflexionan sobre estrategias concretas para escucharse mejor: repreguntar, parafrasear y llegar a acuerdos.","La A parece correcta porque termina con una pregunta, pero la docente ya les dice el problema (“algunos no escuchaban o interrumpían”); entonces no se dan cuenta por sí mismos, que era el propósito.","Pista: cuando el enunciado dice “por sí mismos se den cuenta”, descarta las opciones donde la docente nombra el problema (A) o solo lo modela (C). Busca la que empieza con una pregunta de autoevaluación."],"aprende_mas":[{"q":"¿Qué es la escucha activa?","a":"Es escuchar para entender y responder a lo que el otro dice, no solo esperar mi turno. Se nota en tres conductas:\n- **Repreguntar**: “¿Te refieres a…?”.\n- **Parafrasear**: “O sea, tú propones que…”.\n- **Retomar la idea del otro**: en vez de cambiar de tema."},{"q":"¿Qué capacidad de la competencia oral se trabaja aquí?","a":"“Interactúa estratégicamente con distintos interlocutores”. Incluye respetar turnos, escuchar, preguntar y aportar ideas relacionadas con lo que dijo el otro. En aula ayuda asignar roles: un moderador que da la palabra y un secretario que parafrasea los acuerdos."},{"q":"¿Por qué la autoevaluación funciona mejor que el señalamiento directo?","a":"Porque cuando el estudiante reconoce su error, lo asume como propio y es más probable que cambie. Si la docente lo señala, puede sentirse corregido sin reflexionar. Es metacognición: pensar sobre cómo estoy actuando y cómo mejorarlo."}],"duda":false},"2023-F1-47":{"n":47,"year":2023,"ctx":"2023-F1-c13","stem":"Los integrantes de un equipo están practicando su exposición para el video frente a la docente. Ellos tienen como propósito sensibilizar a la audiencia sobre los retos para la conservación del parque natural de la localidad. Durante la práctica, la docente se da cuenta de que los estudiantes han utilizado secuencias argumentativas para el logro de su propósito. ¿Cuál de las siguientes ideas tomadas de las intervenciones de los estudiantes presenta este tipo de secuencia?","options":{"A":"“En el parque natural, viven muchos animales. Puede que llamen nuestra atención para alimentarlos, pero esto perjudicaría su salud y les generaríamos dependencia”.","B":"“Todos los 26 de enero se celebra el Día Mundial de la Educación Ambiental. Y ese día, es una buena ocasión para pensar en cómo ayudar a cuidar los parques naturales”.","C":"“Casi toda el área del parque natural está señalizada con letreros y avisos. Además, existen guías preparados que pueden ayudar a los visitantes a disfrutar del parque”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta: hay una postura implícita (no hay que alimentar a los animales) sostenida con razones (“perjudicaría su salud y les generaríamos dependencia”). El “pero” reconoce una idea contraria y la refuta.","La B parece correcta porque invita a cuidar los parques, pero solo informa una fecha y hace una sugerencia; no ofrece razones que sostengan una postura.","Pista: una secuencia argumentativa tiene postura + razón o consecuencia que la justifica. Busca conectores como “pero”, “porque”, “por eso”. Si solo describe o informa datos (C), es descriptiva o expositiva."],"aprende_mas":[{"q":"¿Qué es una secuencia textual?","a":"Es un bloque de ideas organizado de una forma típica. Un mismo texto puede mezclar varias:\n- **Narrativa**: cuenta hechos en el tiempo.\n- **Descriptiva**: dice cómo es algo (la C: letreros, guías).\n- **Expositiva**: explica o informa (la B: la fecha).\n- **Argumentativa**: defiende una postura con razones (la A)."},{"q":"¿Cuáles son las partes básicas de un argumento?","a":"- **Postura o tesis**: lo que defiendo (no alimentar a los animales).\n- **Razón**: por qué lo defiendo (perjudica su salud).\n- **Respaldo**: datos o consecuencias que lo apoyan (generan dependencia).\n- **Contraargumento**: a veces se reconoce otra idea y se refuta (“puede que…, pero…”)."},{"q":"¿Una postura puede estar implícita?","a":"Sí. En la A nadie dice “no alimenten a los animales”, pero se entiende por las consecuencias que se mencionan. En el examen no busques solo frases como “yo opino”; fíjate si hay razones que empujan al oyente a pensar o actuar de cierta manera."}],"duda":false},"2023-F1-48":{"n":48,"year":2023,"ctx":"2023-F1-c13","stem":"Los integrantes de un equipo están practicando su texto oral, cuyo propósito es presentar información sobre los tipos de patrimonio cultural de la localidad. La docente nota que los estudiantes pueden ayudar a la audiencia a comprender mejor el contenido de su texto si añaden ilustraciones de los tipos de patrimonio. Por esta razón, busca ofrecer una orientación para que, por sí mismos, identifiquen que la incorporación de ejemplos gráficos contribuye al logro de su propósito. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Proponer que seleccionen fuentes de información que contengan diversas imágenes sobre los tipos de patrimonio cultural. Después, solicitar que vuelvan a practicar su texto oral y recomendar en qué partes de su exposición sería pertinente emplear dichas imágenes.","B":"Solicitar que indiquen si, en la localidad, existen lugares representativos de los tipos de patrimonio cultural. Después, pedir que expliquen si creen que añadir imágenes de dichos tipos de patrimonio ayudaría a que la audiencia reconozca mejor las diferencias que se presentan entre ellos.","C":"Mencionar que la ejemplificación consiste en ofrecer casos particulares de determinados conceptos o definiciones. Después, comentar que pueden presentar imágenes de los tipos de patrimonio cultural en su texto oral y que pueden anticiparlas con “por ejemplo” o “una muestra de esto es”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta: primero conecta con lugares reales de la localidad y luego pide a los estudiantes explicar si las imágenes ayudarían a la audiencia a reconocer las diferencias entre tipos de patrimonio. Ellos mismos llegan a la conclusión.","La A parece correcta porque los estudiantes buscan imágenes y practican, pero la docente ya decidió que hacen falta y además les recomienda dónde usarlas; no identifican por sí mismos su utilidad.","Pista: si el propósito es que “por sí mismos identifiquen”, elige la opción que termina con una pregunta que los hace evaluar el efecto en la audiencia, no la que da la solución (A) o la teoría (C)."],"aprende_mas":[{"q":"¿Qué son los recursos de apoyo en un texto oral?","a":"Son materiales que acompañan la voz para que el público entienda mejor: imágenes, mapas, diapositivas, objetos. No reemplazan la exposición, la refuerzan. En un video sobre patrimonio, mostrar una huaca y una danza ayuda a ver la diferencia entre patrimonio material e inmaterial."},{"q":"¿Con qué capacidad oral se relaciona elegir ejemplos?","a":"Con “Adecúa, organiza y desarrolla las ideas de forma coherente y cohesionada”. Elegir ejemplos y apoyos pensando en quién escucha es adecuar el texto al propósito y al público. La pregunta guía siempre es: ¿qué necesita mi audiencia para entenderme?"},{"q":"¿Qué es la ejemplificación y para qué sirve?","a":"Es presentar un caso concreto de una idea general. Ej.: “El patrimonio inmaterial son las tradiciones vivas; por ejemplo, la danza de tijeras”. Vuelve fácil una definición abstracta. Las imágenes funcionan como ejemplos visuales."}],"duda":false},"2023-F1-49":{"n":49,"year":2023,"ctx":"2023-F1-c13","stem":"Durante la práctica de los textos orales, una estudiante expone sus argumentos para fundamentar por qué se debe cuidar el patrimonio cultural. Dicha estudiante presenta su exposición a la docente y a sus compañeros de equipo, quienes están tomando apuntes sobre el contenido del texto. Este es un fragmento del texto oral de la estudiante:\n\n“Todos debemos participar en el cuidado del patrimonio cultural, ya sea difundiendo información o con otro tipo de acciones. Pero... ¿por qué cuidarlo es importante? Porque detrás de ese patrimonio está nuestra propia historia. Veamos, por ejemplo, los sitios arqueológicos. Eh… hay raíces de nuestra cultura en esos sitios. Evidencian qué tradiciones había en el pasado. También pueden mostrar la gran creatividad y organización de nuestros antepasados. Eh… por eso, creemos que es esencial ser conscientes de que debemos valorar y cuidar el patrimonio”.\n\nLuego de escucharla, la docente busca que los compañeros de equipo de la estudiante evalúen los argumentos del texto oral. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Indicar a los estudiantes que poner como ejemplo los sitios arqueológicos ayuda a que el argumento de su compañera sea convincente. Luego, solicitar que comenten si dar el nombre de un sitio en particular ayudaría a dejar clara la postura de cuidar el patrimonio y que expliquen por qué.","B":"Indicar a los estudiantes que la postura de su compañera es que debemos involucrarnos en acciones para cuidar el patrimonio. Luego, solicitar que comenten si utilizar una pregunta para anticipar el argumento contribuye a que dicha postura sea convincente y que expliquen por qué.","C":"Indicar a los estudiantes que, tomando en cuenta la postura que expresó su compañera, identifiquen las ideas que utilizó para defenderla. Luego, solicitar que comenten cuál de esas ideas los convencieron más de participar en el cuidado del patrimonio y que expliquen por qué."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque pide a los compañeros identificar las ideas que sostienen la postura (nuestra historia, raíces culturales, creatividad de los antepasados) y juzgar cuáles convencen más y por qué. Eso es evaluar argumentos.","La B parece correcta, pero se enfoca en un recurso de forma (la pregunta que anticipa el argumento) y no en evaluar los argumentos; además, la docente les entrega la postura ya resuelta.","Pista: “evaluar argumentos” exige que los estudiantes juzguen la fuerza de las razones y lo justifiquen. Descarta opciones donde la docente ya emite el juicio (A) o donde se analiza otro aspecto del texto (B)."],"aprende_mas":[{"q":"¿Qué significa evaluar un argumento?","a":"Es juzgar si una razón realmente sostiene la postura. Tres preguntas útiles:\n- **Pertinencia**: ¿la razón se relaciona con la postura?\n- **Solidez**: ¿tiene datos o ejemplos que la respalden?\n- **Fuerza**: ¿me convence? ¿por qué?"},{"q":"¿En qué capacidad oral se ubica esta tarea?","a":"En “Reflexiona y evalúa la forma, el contenido y contexto del texto oral”. El oyente no solo entiende lo que dice el expositor: opina con fundamento sobre la calidad de sus ideas. Por eso las alternativas correctas suelen cerrar con “y que expliquen por qué”."},{"q":"¿Qué es una pregunta retórica en una exposición?","a":"Es una pregunta que el expositor lanza sin esperar respuesta, para captar atención o introducir su argumento: “¿Por qué cuidarlo es importante? Porque…”. Es un recurso de forma útil, pero analizarlo no es lo mismo que evaluar si los argumentos son buenos."}],"duda":false},"2023-F1-50":{"n":50,"year":2023,"ctx":"2023-F1-c13","stem":"Un equipo de estudiantes está practicando su texto oral frente a la docente. El equipo tiene como propósito ofrecer información sobre el estado de conservación del Centro Histórico de la ciudad en que se ubica la IE. Al escuchar a los estudiantes, la docente nota que evitan hacer contacto visual con la audiencia, no emplean gestos ni varían la entonación de su voz. Por esta razón, la docente busca orientarlos en el uso de estos recursos expresivos. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Comentar a los estudiantes que hacer contacto visual, cambiar la entonación de su voz o emplear gestos en la presentación del texto oral pueden ayudar a llamar la atención del público que los está escuchando. Luego, pedir que vuelvan a practicar su presentación y señalar qué pasajes del texto oral necesitan el uso de esos recursos.","B":"Mostrar a los estudiantes un video de un expositor que cambia la entonación de su voz, hace contacto visual y usa gestos para presentar las ideas de su texto oral, y preguntar si el uso de esos recursos ayuda a enfatizar las ideas claves de ese texto. Luego, pedir que indiquen qué información que van a exponer requeriría usar esos recursos.","C":"Entregar a los estudiantes una lista de cotejo con diversas preguntas orientadas a evaluar el uso de recursos no verbales y paraverbales en textos orales. Luego, pedir que utilicen dicha lista en la presentación de cada una de sus intervenciones, de manera que determinen qué compañeros del equipo han empleado o no esos recursos."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque usa un modelo (video de un expositor), lleva a reflexionar sobre para qué sirven esos recursos (enfatizar ideas clave) y luego a aplicarlos, decidiendo qué partes de su propia exposición los requieren.","La A parece correcta porque explica los recursos y hace practicar, pero la docente es quien señala qué pasajes los necesitan; los estudiantes no aprenden a decidirlo. Además, reduce su función a “llamar la atención”.","Pista: para enseñar un recurso, la secuencia ganadora suele ser modelo → reflexión sobre su función → aplicación al propio texto. La lista de cotejo (C) sirve para evaluar, no para orientar su uso."],"aprende_mas":[{"q":"¿Qué diferencia hay entre recursos no verbales y paraverbales?","a":"- **No verbales**: lo que comunica el cuerpo: gestos, mirada, postura, manos.\n- **Paraverbales**: lo que acompaña a la voz: entonación, volumen, ritmo, pausas.\nEj.: bajar la voz y hacer una pausa antes de un dato alarmante sobre el Centro Histórico lo resalta."},{"q":"¿Por qué es útil el modelado con un ejemplo?","a":"Porque los estudiantes ven el recurso funcionando antes de usarlo; “varía tu entonación” se entiende mejor si escuchan a alguien hacerlo. Pero el modelo debe ir con reflexión (“¿para qué lo usó?”) y aplicación al propio texto; si no, se queda en imitación."},{"q":"¿Cuándo sí conviene usar una lista de cotejo?","a":"Cuando el propósito es evaluar o autoevaluar con criterios que los estudiantes ya conocen, por ejemplo en el ensayo final, después de haber aprendido los recursos. Si todavía no saben usarlos, primero hay que enseñarlos: la lista de cotejo no enseña por sí sola."}],"duda":false},"2023-F1-51":{"n":51,"year":2023,"ctx":"2023-F1-c14","stem":"Para contribuir a la comprensión del texto, la docente plantea varias preguntas a los estudiantes. ¿Cuál de las siguientes preguntas se centra en que obtengan información explícita?","options":{"A":"¿Cuál es la razón por la que Matías se queda paralizado?","B":"¿Cuál es la razón por la que Matías ha sido despedido de su trabajo?","C":"¿Cuál es la razón por la que Matías tiene pocas esperanzas de hallar un nuevo empleo?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta: el texto lo dice con todas sus letras, “Acaba de ser despedido: lo han acusado de desfalco”. El estudiante solo tiene que ubicar el dato, no deducirlo.","La C parece correcta porque el texto menciona “a los cuarenta años”, pero nunca dice “porque tiene cuarenta”. Esa relación de causa la tiene que armar el lector: es una inferencia, no información explícita.","Pista: pregúntate si la respuesta se puede subrayar tal cual en el texto. Si hay que unir dos datos o suponer un “porque” que el autor no escribió, ya es inferencia."],"aprende_mas":[{"q":"¿Qué diferencia hay entre información explícita e implícita?","a":"- **Explícita**: está escrita en el texto; basta con localizarla (quién, qué, cuándo, dónde).\n- **Implícita**: no está escrita; el lector la deduce juntando pistas (causas, intenciones, sentimientos, significado de una frase)."},{"q":"¿Puede una pregunta de “por qué” ser literal?","a":"Sí. Si el texto dice la causa directamente (con “porque”, “ya que” o dos puntos que explican), la pregunta es literal. Si la causa no está dicha y el lector la deduce, es inferencial. Lo que manda es el texto, no la palabra “por qué”."},{"q":"¿Qué capacidad del CNEB trabaja una pregunta literal?","a":"La capacidad “Obtiene información del texto escrito”. Es la base: sin ubicar bien los datos, el estudiante no puede inferir ni opinar. Ejemplo: “¿De qué acusaron a Matías?”."}],"duda":false},"2023-F1-52":{"n":52,"year":2023,"ctx":"2023-F1-c14","stem":"En otro momento de la actividad de lectura, los estudiantes comparten comentarios sobre los aspectos del texto que llamaron su atención. Estos son los comentarios de tres estudiantes. ¿Cuál de los siguientes comentarios se ajusta a una reflexión sobre el contenido del texto?","options":{"A":"“Matías recibió un castigo suficiente luego de haber robado el dinero de la caja de su trabajo. Felizmente, no fue denunciado con la Policía”.","B":"“Creo que Matías piensa que la moneda que se encontró en la calle es una señal de los cielos. Para él, eso significa que su mala suerte ha culminado”.","C":"“Al inicio de la obra, se entiende que Matías camina por un barrio peligroso. Su estado de ánimo no le permite ver el peligro al que puede estar expuesto”."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque el estudiante toma postura y valora lo que pasa en la historia: juzga si el despido fue “castigo suficiente” y opina que “felizmente” no lo denunciaron. Eso es reflexionar sobre el contenido.","La B parece correcta porque empieza con “Creo que…”, pero solo repite lo que Matías ya dice: que la moneda es “una señal de los cielos”. Es comprensión del texto, no una valoración personal.","Pista: reflexionar sobre el contenido es opinar o juzgar ideas, hechos o conductas del texto desde la propia experiencia o valores. Que diga “creo” no basta: fíjate si hay juicio."],"aprende_mas":[{"q":"¿Qué significa “reflexiona y evalúa” en lectura?","a":"Es la tercera capacidad de lectura del CNEB. El estudiante se distancia del texto y lo juzga:\n- **Contenido**: opina sobre ideas, hechos o conductas de los personajes.\n- **Forma**: evalúa cómo está escrito (recursos, estructura).\n- **Contexto**: relaciona el texto con su época o realidad."},{"q":"¿Cómo distinguir una reflexión de una inferencia?","a":"La inferencia explica lo que el texto quiere decir (“Matías se siente fracasado”). La reflexión dice lo que yo pienso de eso (“Me parece injusto que culpe a otros de su robo”). Una mira hacia adentro del texto; la otra, desde fuera."},{"q":"¿Qué pregunta promueve una reflexión sobre el contenido?","a":"Preguntas que piden postura y razones: “¿Estás de acuerdo con que Matías tomara el dinero porque tenía deudas? ¿Por qué?”. El docente valora que el estudiante sustente su opinión con datos del texto."}],"duda":false},"2023-F1-53":{"n":53,"year":2023,"ctx":"2023-F1-c14","stem":"La docente tiene como propósito que los estudiantes deduzcan información implícita del texto. ¿Cuál de las siguientes preguntas es más adecuada para que logre su propósito?","options":{"A":"¿Consideras que el despido de Matías fue justificado?","B":"¿Qué expectativas tiene Matías acerca del futuro de su carrera?","C":"¿A qué se refiere Matías cuando dice que encontrar una moneda fue pura casualidad?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: el texto no explica qué quiere decir “pura casualidad”. El estudiante debe deducir que Matías se arrepiente de haber creído en una señal divina y se aferra otra vez a su escepticismo.","La B parece inferencial, pero las expectativas de Matías están dichas literalmente: “se vislumbra un buen empleo en mi carrera”, “Algún día todavía puedo ser exitoso”. Basta con ubicarlas.","Pista: una buena pregunta inferencial pide el sentido de una expresión, una intención o un sentimiento que el texto no nombra. Si la respuesta está escrita, es literal."],"aprende_mas":[{"q":"¿Qué tipos de inferencias se pueden pedir en un texto?","a":"- **Causa-efecto**: por qué ocurre algo que el texto no explica.\n- **Sentido de una expresión**: qué quiere decir una frase en ese contexto.\n- **Rasgos del personaje**: cómo es, a partir de lo que hace o dice.\n- **Intención**: para qué dice algo el personaje o el autor."},{"q":"¿Por qué la A no es inferencial?","a":"“¿Consideras que el despido fue justificado?” pide la opinión del estudiante. Eso corresponde a reflexionar y evaluar, no a deducir información del texto. Opinar e inferir son capacidades distintas."},{"q":"¿Cómo acompañar a un estudiante que no logra inferir?","a":"Pídele que vuelva al pasaje y busque pistas: “¿Qué dice Matías justo antes? ¿Qué hace?”. Luego que una esas pistas: “Si primero agradece a Dios y luego se llama tonto, ¿qué está pensando?”. Así aprende a deducir con evidencia."}],"duda":false},"2023-F1-54":{"n":54,"year":2023,"ctx":"2023-F1-c14","stem":"La docente busca que los estudiantes construyan interpretaciones sobre el sentido global del pasaje leído. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que indiquen cuál es el aporte de las expresiones colocadas entre paréntesis en la historia sobre Matías.","B":"Pedir a los estudiantes que expliquen si ellos, al igual que el personaje principal, compartirían sus sensaciones con una moneda.","C":"Pedir a los estudiantes que vuelvan a leer el primer párrafo del texto y propongan un subtítulo que aborde el tema tratado en ese párrafo."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque las acotaciones entre paréntesis (“con deleite”, “desconcertado”, “sombrío”, “furioso”, “emocionado”) recorren todo el monólogo y muestran los cambios emocionales de Matías. Analizarlas permite interpretar el sentido del pasaje completo.","La C parece correcta porque pide un subtítulo sobre el tema, pero solo del primer párrafo. Trabaja el tema de una parte, no el sentido global del pasaje entero.","Pista: sentido global exige mirar el texto completo y construir una interpretación. Desconfía de alternativas que se quedan en un párrafo o que piden una opinión personal."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la interpretación del texto como un todo: qué significa, qué revela o qué propone, más allá de los datos sueltos. En el caso de Matías: un hombre que oscila entre la euforia y el rencor, y no asume su culpa."},{"q":"¿Para qué sirven las acotaciones en un texto teatral?","a":"- **Indican emociones y gestos**: cómo dice el personaje lo que dice.\n- **Marcan cambios de ánimo**: muestran la evolución del personaje.\n- **Aportan sentido**: lo que el personaje no dice en palabras, lo muestra la acotación."},{"q":"¿Por qué la B tampoco favorece el sentido global?","a":"Preguntar si ellos “compartirían sus sensaciones con una moneda” lleva al estudiante a su experiencia personal. Es una reflexión o conexión con la vida, no una interpretación del pasaje completo."}],"duda":false},"2023-F1-55":{"n":55,"year":2023,"ctx":"2023-F1-c14","stem":"La docente y los estudiantes releen la sección subtitulada “Descubrimiento de un pecador”. Ella busca que construyan interpretaciones sobre su sentido global a partir de las figuras retóricas usadas en esa sección. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir que lean este pasaje: “Mi racha de interminables desgracias se acabó: ya era hora de que mi aciaga fortuna se termine para siempre”. Luego, solicitar que expliquen qué es lo que Matías quiere expresar con el uso de la hipérbole.","B":"Pedir que lean este pasaje: “¿Qué necesidad tengo... a mis cuarenta... y con el problema que me acaba de caer encima?... Que la euforia no me nuble la mente”. Luego, solicitar que expliquen qué busca comunicar Matías con el uso de la metáfora.","C":"Pedir que lean este pasaje: “¡Gracias, Dios mío, por acordarte de este pobre pecador! […] ¿Pero qué digo? […] ¡Si ahora... a mis años... voy a volver a creer en todas esas cosas...!”. Luego, solicitar que expliquen qué se revela sobre Matías con el uso del contraste."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta: el contraste entre “¡Gracias, Dios mío…!” y “¿Pero qué digo? […] voy a volver a creer…” resume el movimiento de toda la sección y revela a un Matías dividido entre la fe momentánea y su escepticismo.","La A parece correcta porque la hipérbole sí existe (“interminables desgracias”, “para siempre”), pero solo expresa su euforia en un momento. No explica el giro que da sentido a la sección.","Pista: cuando piden el sentido global a partir de una figura, elige la figura que abarca el cambio central de la sección, no la que adorna una sola frase."],"aprende_mas":[{"q":"¿Qué es el contraste como recurso literario?","a":"Es poner juntas dos ideas, actitudes o emociones opuestas para que resalten. Aquí, Matías agradece a Dios y segundos después se burla de sí mismo por creer. Ese choque revela su contradicción interna."},{"q":"¿Cómo conectar una figura retórica con el sentido global?","a":"- **Identificar** la figura en el texto.\n- **Explicar** qué expresa en ese pasaje.\n- **Relacionar** esa idea con lo que pasa en toda la sección o la obra.\nSin el tercer paso, el análisis queda en lo local."},{"q":"¿Por qué el título “Descubrimiento de un pecador” ayuda?","a":"El título anuncia el sentido de la sección: un “pecador” (Matías robó) que, por un instante, se siente perdonado por Dios. El contraste entre su gratitud y su negación confirma ese sentido. Usar el título como pista es buena estrategia de aula."}],"duda":false},"2023-F1-56":{"n":56,"year":2023,"ctx":"2023-F1-c15","stem":"Un equipo de estudiantes elaboró un tríptico cuyo propósito es presentar los pasos para encontrar comunidades de hobbies (pasatiempos) a través de las redes sociales. Los integrantes del equipo solicitan al docente que revise la primera versión de su escrito para saber qué aspectos deben mejorar. A continuación, se presenta un fragmento de dicho texto:\n\n¡Sé parte de comunidades de hobbies!\n\nAprovechar las redes sociales para hacer conección y conversar con gente de todo el mundo, sobre todo, compartiendo nuestros hobbies. Para eso, las comunidades o grupos en las redes. Hablar de nuestros hobbies en internet es peligroso y no se debe hacer. ¿Qué pasos seguir para hayar comunidades?\n\n• En TikTok, entrar a “bandeja de entrada”. Luego, clic en “crear un DM” y en “crear\n\nun grupo de chat” con la gente que tenga nuestros mismos hobbies.\n\n• En Facebook, solo escribir la actividad de interés donde dice “buscar”. Luego, clic en\n\n“grupos” y en “ser miembro”.\n\n¿Qué se puede hacer en las comunidade
