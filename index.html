tudiante para evaluar una fuente?","a":"- **Autoría**: ¿quién lo escribe y qué sabe del tema?\n- **Procedencia**: ¿es una institución, revista o medio reconocido?\n- **Evidencias**: ¿presenta datos, ejemplos o referencias?\n- **Pertinencia**: ¿responde a lo que necesito para mi propósito?"},{"q":"¿Cómo se integra la información de fuentes sin copiar?","a":"Se combinan tres recursos: la cita textual (entre comillas y con autor), el parafraseo (decir la idea con palabras propias y mencionar la fuente) y la síntesis. Ejemplo de aula: el estudiante lee dos artículos sobre arte y salud emocional y escribe “Según la OMS, el arte reduce el estrés; esto se ve en mi colegio cuando…”, sumando su propia reflexión."}],"duda":false},"2024-F1-02":{"n":2,"year":2024,"ctx":"2024-F1-c1","stem":"Una estudiante le comenta al docente que escribirá un texto con el propósito de valorar la labor social de un artista dedicado a la fotografía callejera. Dicha estudiante busca presentar los eventos que suceden normalmente en la jornada del fotógrafo y, además, quiere usar imágenes o ilustraciones. Sin embargo, tiene dudas sobre qué género textual debe emplear. ¿Cuál de los siguientes géneros textuales es más adecuado para que la estudiante logre su propósito?","options":{"A":"Un cuento.","B":"Una noticia.","C":"Una crónica."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque la crónica narra hechos reales en orden temporal (los “eventos que suceden normalmente en la jornada del fotógrafo”), permite que el autor valore lo que cuenta y admite imágenes o ilustraciones.","La B parece correcta porque la noticia también trata hechos reales y usa fotos, pero falla porque informa un suceso puntual y reciente de forma objetiva; no sirve para recrear una jornada ni para valorar la labor de alguien.","Pista: lee el propósito con lupa. Hechos reales + secuencia de acciones + mirada personal o valorativa = crónica. Hecho actual, breve y objetivo = noticia. Hechos inventados = cuento."],"aprende_mas":[{"q":"¿Qué rasgos distinguen a una crónica de otros textos narrativos?","a":"- **Hechos reales**: no es ficción.\n- **Orden cronológico**: sigue el paso del tiempo (de ahí su nombre, “cronos”).\n- **Voz del autor**: describe ambientes y personas, y deja ver su valoración.\n- **Recursos literarios**: puede usar comparaciones o descripciones vivas."},{"q":"¿En qué se diferencian la noticia y la crónica?","a":"La noticia responde rápido qué, quién, cuándo, dónde y por qué, con lenguaje objetivo y estructura de pirámide invertida (lo más importante primero). La crónica se toma su tiempo: cuenta cómo pasaron las cosas, con detalles y una mirada personal. Ejemplo: “Inauguran mural en el distrito” es noticia; “Un día con el muralista del barrio” es crónica."},{"q":"¿Cómo ayudar a un estudiante a elegir el género adecuado?","a":"Pídele que responda tres preguntas antes de escribir: ¿qué quiero lograr con mi texto?, ¿los hechos son reales o inventados?, ¿quiero informar con neutralidad o mostrar mi mirada? Con esas respuestas, el género casi se elige solo. Esto es parte de la planificación del texto."}],"duda":false},"2024-F1-03":{"n":3,"year":2024,"ctx":"2024-F1-c1","stem":"Un estudiante ha elaborado un artículo de opinión sobre la contribución de los talleres de teatro al desarrollo de habilidades de socialización de los adolescentes. Como parte de la escritura de su artículo, el estudiante ha llevado a cabo diversas acciones. ¿Cuál de las siguientes acciones realizadas por el estudiante corresponde necesariamente a un proceso de textualización?","options":{"A":"El estudiante determinó si la información comunicada en su artículo de opinión se basó en las ideas de las fuentes que seleccionó.","B":"El estudiante desarrolló su artículo de opinión con oraciones separadas por punto seguido y las enlazó con recursos cohesivos.","C":"El estudiante decidió defender una postura específica en su artículo de opinión mediante una estrategia argumentativa."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque escribir oraciones, separarlas con punto seguido y enlazarlas con “recursos cohesivos” es poner el texto en palabras: eso es textualizar, el momento en que las ideas se convierten en texto escrito.","La C parece correcta porque la postura se expresa al escribir, pero falla porque “decidir” qué postura defender y qué estrategia usar es una decisión previa: pertenece a la planificación, no necesariamente a la textualización.","Pista: identifica el verbo de cada acción. Decidir, seleccionar, organizar ideas = planificar. Redactar, conectar, puntuar = textualizar. Verificar, comparar, corregir = revisar."],"aprende_mas":[{"q":"¿Cuáles son los procesos de producción escrita y qué ocurre en cada uno?","a":"- **Planificación**: se define propósito, destinatario, género, tema y se organizan las ideas.\n- **Textualización**: se redacta el borrador, cuidando cohesión, puntuación y léxico.\n- **Revisión**: se relee para mejorar el texto según el propósito y se reescribe.\nNo son pasos rígidos: el escritor va y vuelve entre ellos."},{"q":"¿Qué son los recursos cohesivos?","a":"Son las herramientas que unen las oraciones para que el texto no parezca una lista suelta. Por ejemplo: conectores (“por eso”, “sin embargo”), pronombres que evitan repetir (“los talleres… estos”), sinónimos y signos de puntuación. Gracias a ellos el lector sigue el hilo sin esfuerzo."},{"q":"¿Por qué la alternativa A no es textualización?","a":"Comprobar si lo escrito se basó en las fuentes es mirar el texto ya hecho y contrastarlo: eso es revisar. En el aula se nota cuando el estudiante tiene el borrador en la mano y se pregunta “¿esto es fiel a lo que leí?”."}],"duda":false},"2024-F1-04":{"n":4,"year":2024,"ctx":"2024-F1-c1","stem":"Una estudiante ha decidido escribir un ensayo sobre la valoración de las personas acerca de los grafitis y su capacidad expresiva. La estudiante ha escrito la primera versión de su texto y le pide al docente que la ayude a revisarlo. Este es un fragmento de dicho texto:\n\nLas personas tienen varias concepciones (una concepción es una idea generalmente previa sobre algo) cuando ven grafitis (“grafiti” es un término que viene del italiano, que es una lengua romance como el castellano). Además, muchas personas creen que los grafitis son solo dibujos en las paredes de las calles y que no tienen valor, y los rechazan, pero no es así, los grafitis son potentes. Además, muchas veces la gente los desaprueba sin considerar que tienen un poder comunicador enorme.\n\nHay que mencionar que los grafitis son obras de arte muy hermosas, pero la gente los rechaza. Los grafitis adornan las calles y, además, pueden expresar mensajes que hacen reflexionar a las personas. Los grafitis contribuyen a sensibilizarnos sobre problemas sociales o ambientales, que nos afectan a todos, pero la gente se opone a los grafitis. Aunque sean muy atractivos, muchas personas muestran un rechazo hacia los grafitis y no valoran lo que pueden transmitir.\n\nEl docente se da cuenta de que el texto de la estudiante presenta algunos problemas de escritura. ¿Cuál de los siguientes problemas debe priorizar en la retroalimentación del texto?","options":{"A":"La inclusión de información que se aleja del tema central del texto.","B":"La falta de variedad en el uso de conectores de adición.","C":"La repetición innecesaria de una idea."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque la idea “la gente rechaza los grafitis” aparece una y otra vez en ambos párrafos (“los rechazan”, “la desaprueba”, “la gente los rechaza”, “se opone”, “muestran un rechazo”). Esa repetición frena el avance del texto y afecta su coherencia.","La A parece correcta porque los paréntesis sobre “concepción” y el origen italiano de “grafiti” sí son digresiones, pero son breves y aparecen una sola vez; la repetición, en cambio, recorre todo el texto, por eso se prioriza.","Pista: “priorizar” significa elegir el problema que más daña el sentido global del texto. Primero lo que afecta la coherencia en todo el escrito, luego lo puntual, y al final lo de forma (como variar conectores)."],"aprende_mas":[{"q":"¿Qué es la progresión temática y por qué importa?","a":"Es la manera en que un texto avanza: cada oración retoma algo conocido y agrega información nueva. Si una idea se repite sin aportar nada, el texto da vueltas en el mismo sitio y el lector se cansa. Ejemplo: decir cinco veces “la gente rechaza los grafitis” no hace más fuerte el argumento."},{"q":"¿Qué criterio usar para priorizar en la retroalimentación escrita?","a":"- **Primero**: coherencia y propósito (¿se entiende?, ¿avanza?, ¿cumple su finalidad?).\n- **Después**: cohesión (conectores, referentes).\n- **Al final**: ortografía y aspectos formales.\nAsí no se abruma al estudiante con todo a la vez."},{"q":"¿Cómo ayudar al estudiante a detectar sus propias repeticiones?","a":"Pídele que subraye con un color cada oración que diga “la gente rechaza los grafitis” con otras palabras. Al ver el texto lleno de color, él mismo notará la redundancia. Luego puede preguntarse: “¿qué idea nueva quiero agregar en lugar de repetir?”."}],"duda":false},"2024-F1-05":{"n":5,"year":2024,"ctx":"2024-F1-c1","stem":"Un estudiante ha escrito un editorial cuyo propósito es argumentar sobre la influencia de la práctica de la pintura en el desarrollo infantil y le ha pedido al docente que lo ayude con la revisión. Él se da cuenta de que el estudiante utiliza términos como “cosa” y “hacer”, los cuales no ayudan a comunicar su mensaje con precisión. Por esta razón, el docente busca que el estudiante identifique este problema y trabaje en la mejora de su texto. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Leer el texto con el estudiante y señalar que las palabras como “cosa” o “hacer”, en el contexto en que han sido usadas, generan que sus ideas sean imprecisas. Luego, preguntar qué quiere comunicar con el uso de esas palabras. Después, determinar qué palabras podría cambiar para expresar su mensaje con precisión y, sobre esta base, reescribir juntos el texto.","B":"Pedir al estudiante que, en el texto, subraye términos como “hacer” o “cosa” que han sido utilizados en algunas de sus ideas. Luego, preguntar qué quieren decir dichos términos y solicitar que explique si contribuyen o no a comunicar su mensaje. Después, indicar que, considerando el sentido de sus ideas, determine en qué casos es necesario reemplazar esos términos.","C":"Dialogar con el estudiante sobre el hecho de usar un léxico preciso para lograr su propósito comunicativo. Luego, preguntar si en la idea de su texto: “Los niños hacen sus cosas con la pintura”, “expresan” puede reemplazar a “hacen”, y “deseos”, a “cosas”. Después, solicitar que cambie otros términos imprecisos de su texto para que comunique su mensaje con claridad."},"answer":"B","tema":"Evaluación y retroalimentación","explicacion":["La B es correcta porque el estudiante subraya los términos, explica qué quieren decir, evalúa “si contribuyen o no” a su mensaje y decide en qué casos reemplazarlos: es él quien identifica el problema y propone la mejora.","La A parece correcta porque también dialoga con el estudiante, pero falla porque el docente “señala” directamente que las palabras generan imprecisión y luego “reescriben juntos”: el estudiante no descubre el problema por sí mismo.","Pista: si el enunciado dice que el docente busca que el estudiante “identifique” el problema, elige la opción donde el estudiante analiza y decide. Descarta las que dan el diagnóstico o la respuesta (como la C, que ya ofrece “expresan” y “deseos”)."],"aprende_mas":[{"q":"¿Qué es la retroalimentación por descubrimiento o reflexión?","a":"Es cuando el docente, con preguntas, guía al estudiante para que él mismo encuentre qué está bien, qué falla y cómo mejorarlo. No le da la respuesta. Es el tipo de retroalimentación que más valora el CNEB porque desarrolla autonomía."},{"q":"¿Qué tipos de retroalimentación existen, de menos a más formativa?","a":"- **Incorrecta o vaga**: “Está mal” o “¡Muy bien!”.\n- **Elemental**: dice qué está bien o mal, sin más.\n- **Descriptiva**: explica qué mejorar y da sugerencias concretas.\n- **Por descubrimiento o reflexión**: el estudiante identifica el error y la mejora guiado por preguntas."},{"q":"¿Qué es el léxico preciso y cómo trabajarlo en clase?","a":"Es usar la palabra que dice exactamente lo que queremos, en lugar de comodines como “cosa”, “hacer” o “algo”. Una actividad útil: el estudiante busca en su texto esas palabras “comodín” y prueba, para cada una, dos o tres alternativas más específicas, eligiendo la que mejor encaja con su idea."}],"duda":false},"2024-F1-06":{"n":6,"year":2024,"ctx":"2024-F1-c2","stem":"La docente busca que los estudiantes deduzcan información implícita del poema. ¿Cuál de las siguientes preguntas es más adecuada para que logre su propósito?","options":{"A":"¿Qué opinan de que el autor haya culminado el poema planteando dos preguntas a sus lectores?","B":"Según el poema, ¿cómo terminó la discusión que tuvieron los gatos sobre quién debía dirigirlos?","C":"¿Cuál fue el problema que impidió que los gatos lograran enfrentarse al perro que los perseguía?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque el poema nunca dice “el problema fue…”: el lector debe deducir, a partir de la pelea por el mando y la división en “dos partidos”, que la desunión fue lo que impidió enfrentar al perro. Eso es inferir.","La B parece correcta porque también trata sobre la discusión de los gatos, pero falla porque el final está dicho literalmente en el texto (“se dividen… se arañan… acude el perro y los destroza”): es información explícita.","Pista: pregúntate si la respuesta se puede señalar con el dedo en el texto. Si sí, es explícita. Si hay que unir pistas para llegar a ella (causas, motivos, intenciones), es inferencial."],"aprende_mas":[{"q":"¿Qué es una inferencia en lectura?","a":"Es una conclusión que el lector construye uniendo pistas del texto con lo que ya sabe. El texto no lo dice, pero lo deja ver. Ejemplo: si un personaje “cerró la puerta de un golpe y no saludó”, inferimos que estaba molesto aunque el texto no use esa palabra."},{"q":"¿Qué tipos de inferencias se pueden pedir a los estudiantes?","a":"- **Causa-efecto**: ¿por qué pasó esto?\n- **Intención**: ¿qué quería lograr el personaje o el autor?\n- **Significado de palabras por contexto**: ¿qué quiere decir “abrigo” aquí?\n- **Tema o mensaje**: ¿de qué trata realmente el texto?"},{"q":"¿Por qué la alternativa A no promueve la inferencia?","a":"Porque pide una opinión sobre una decisión del autor (terminar con preguntas). Eso corresponde a la reflexión y evaluación del texto, un nivel distinto. Es una buena pregunta, pero no para el propósito de deducir información implícita."}],"duda":false},"2024-F1-07":{"n":7,"year":2024,"ctx":"2024-F1-c2","stem":"La docente busca que los estudiantes obtengan información explícita del texto. ¿Cuál de las siguientes preguntas es más adecuada para que logre su propósito?","options":{"A":"¿Cuál es la razón por la que los gatos eran perseguidos por el perro?","B":"¿Cuál de los gatos creen que es capaz de ser un mejor líder?","C":"¿Cuál es un indicio de nobleza para uno de los gatos?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque la respuesta está escrita tal cual en el poema: el gato blanco dice “A mí me toca por mi blancura, indicio de nobleza”. El estudiante solo tiene que ubicar el dato: es información explícita.","La A parece correcta porque pregunta por un dato del inicio del poema, pero falla porque el texto dice que el perro los perseguía, no por qué. La razón no aparece escrita, así que no es información explícita.","Pista: una pregunta literal tiene la respuesta “en la superficie” del texto. Si pide una razón que el texto no da (A) o una opinión personal (B, “¿cuál creen…?”), ya no es obtener información explícita."],"aprende_mas":[{"q":"¿Qué significa “obtener información del texto” en el CNEB?","a":"Es la primera capacidad de la competencia lectora: ubicar y seleccionar datos que están dichos de manera explícita (nombres, hechos, características, fechas). Es la base para luego inferir y reflexionar, pero por sí sola no basta para comprender un texto."},{"q":"¿Cuáles son las tres capacidades de la competencia “Lee diversos tipos de textos”?","a":"- **Obtiene información**: ubica lo que está escrito.\n- **Infiere e interpreta**: deduce lo implícito y construye el sentido global.\n- **Reflexiona y evalúa**: opina sobre el contenido, la forma y el contexto del texto."},{"q":"¿Una pregunta literal puede ser difícil?","a":"Sí. Si el dato está en un texto largo, mezclado con información parecida, o el estudiante debe distinguir entre varios datos similares, cuesta más ubicarlo. Por eso, en Secundaria, lo literal se trabaja en textos más complejos y no solo con preguntas obvias."}],"duda":false},"2024-F1-08":{"n":8,"year":2024,"ctx":"2024-F1-c2","stem":"La docente busca que los estudiantes construyan el sentido global del poema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para que logre dicho propósito?","options":{"A":"Explicar cuáles eran los grupos que se enfrentaban por el control político del territorio peruano antes de 1821. Luego, pedir que mencionen la correspondencia entre estos acontecimientos históricos y las acciones que realizan los personajes del poema. Finalmente, solicitar que compartan sus respuestas y discutan sobre ellas.","B":"Comentar que la mayoría de los temas literarios de la época de la emancipación del Perú se referían a problemas políticos y militares. Luego, mencionar quiénes fueron los principales personajes que participaron en aquella época. Finalmente, explicar a quiénes representan los gatos y a quiénes representa el perro.","C":"Mencionar que Melgar utilizó la poesía para transmitir sus reflexiones sobre la situación política en la época de la emancipación del Perú. Luego, indicarles cuál es la intención del poeta cuando les plantea preguntas a sus lectores. Finalmente, pedirles que discutan sobre el hecho de escribir poesía con fines políticos."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque el docente da el contexto histórico necesario (los grupos que se enfrentaban antes de 1821) y luego son los estudiantes quienes establecen la correspondencia con las acciones de los gatos y la discuten: construyen ellos el sentido global.","La B parece correcta porque también ofrece contexto de la emancipación, pero falla porque al final el docente “explica a quiénes representan los gatos y el perro”: entrega la interpretación hecha y los estudiantes no la construyen.","Pista: en preguntas de sentido global, busca la opción donde el estudiante relaciona, interpreta y discute. Si el docente explica el significado o desvía la conversación a otro tema (como la C, sobre escribir poesía política), descártala."],"aprende_mas":[{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea de conjunto que queda cuando entendemos de qué trata realmente el texto y qué quiere transmitir. En “Los gatos”, no es solo una historia de gatitos peleando: es un mensaje sobre la desunión de los peruanos en la lucha por la independencia. Se construye uniendo todas las partes del texto, no con un dato suelto."},{"q":"¿Por qué el contexto ayuda a construir el sentido global?","a":"Algunos textos, como las fábulas políticas, solo se entienden del todo si conocemos su época. Saber que Melgar vivió la lucha por la independencia permite descubrir que los gatos representan a los patriotas divididos y el perro, al poder colonial. El contexto es una herramienta; la interpretación la hace el estudiante."},{"q":"¿Qué rol cumple el docente en la construcción del sentido global?","a":"- **Da andamiaje**: ofrece información o preguntas que ayudan a pensar.\n- **No interpreta por el estudiante**: evita decir “esto significa…”.\n- **Promueve el diálogo**: pide que contrasten sus ideas con evidencias del texto.\nEjemplo: “¿Qué parte del poema te hace pensar que los gatos son los patriotas?”."}],"duda":false},"2024-F1-09":{"n":9,"year":2024,"ctx":"2024-F1-c3","stem":"Con el fin de contribuir al proceso de planificación de los textos, la docente busca recoger los saberes previos de los estudiantes acerca del aporte de que se escuchen activamente para trabajar en equipo. En este contexto, ella les pide que realicen comentarios sobre ello. ¿Qué estudiante da evidencias de una idea inadecuada sobre la escucha activa para el trabajo en equipo?","options":{"A":"Anaí dice: “En el diálogo que tengamos los equipos, quienes escuchan pueden hacer preguntas sobre lo que se está tratando para que comprueben si están entendiendo el tema o no”.","B":"Bartolomé dice: “En la conversación de los equipos, los que escuchan deben evitar realizar cualquier tipo de comentario para mostrar respeto a quien está hablando sobre el tema”.","C":"Casimiro dice: “En las discusiones de los equipos, las personas que escuchan podrían expresar mediante ciertos gestos que siguen el hilo del tema del cual se está conversando”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es la idea inadecuada (y por eso la respuesta) porque propone “evitar realizar cualquier tipo de comentario”: confunde escucha activa con silencio total, cuando escuchar activamente implica participar con preguntas, comentarios o señales de comprensión.","La A puede parecer inadecuada porque hacer preguntas se podría ver como interrumpir, pero en realidad es correcta: preguntar para comprobar si se está entendiendo es justamente una conducta de escucha activa.","Pista: en preguntas que piden la idea “inadecuada”, busca la opción con un absoluto (“cualquier tipo”, “siempre”, “nunca”) que limite la interacción. La escucha activa es participativa, no pasiva."],"aprende_mas":[{"q":"¿Qué es la escucha activa?","a":"Es escuchar con atención y demostrarlo, para comprender de verdad lo que el otro dice. No es solo quedarse callado: el oyente procesa, interpreta y responde. En un trabajo en equipo, permite construir ideas juntos en lugar de que cada uno hable por su lado."},{"q":"¿Qué conductas muestran que alguien escucha activamente?","a":"- **Recursos no verbales**: asentir, mirar a quien habla, postura atenta.\n- **Preguntas de aclaración**: “¿te refieres a…?”.\n- **Parafraseo**: “o sea, lo que propones es…”.\n- **Comentarios pertinentes**: aportar a partir de lo que el otro dijo, en el momento oportuno."},{"q":"¿Cómo se relaciona la escucha activa con la competencia oral del CNEB?","a":"La competencia “Se comunica oralmente en su lengua materna” incluye interactuar estratégicamente con distintos interlocutores. Eso supone alternar los roles de hablante y oyente, respetar turnos y responder a lo que dicen los demás. Escuchar bien es parte de comunicarse bien."}],"duda":false},"2024-F1-10":{"n":10,"year":2024,"ctx":"2024-F1-c3","stem":"Después de planificar su texto oral, un estudiante está practicando su exposición cuyo propósito es ofrecer las medidas que se pueden tomar en los hogares para prevenir accidentes durante un sismo. El estudiante ha grabado en audio su texto oral y se lo ha presentado a la docente. Este es un fragmento de su exposición:\n\n“Buenas tardes a toda la comunidad. Ante un sismo, las medidas que uno puede adoptar en casa son varias. La más importante es conservar la calma y evitar salir corriendo. También hay otras medidas que son igual de relevantes. Podemos aplicarlas tanto en la casa como en cualquier lugar donde nos encontremos. Recuerden que lo importante es mantener la calma. Muchas gracias”.\n\nLuego de escuchar el audio, la docente nota que el texto oral tiene vacíos de información que dificultan que el estudiante logre su propósito comunicativo. Por ello, busca ofrecerle una orientación para que identifique ese problema en su texto oral. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Hacer notar que, aunque anunció que existen varias medidas relevantes, no todas han sido expuestas en su texto oral. Después, indicar que explique por qué, además de mantener la calma y evitar correr para prevenir accidentes durante un sismo, sería necesario presentar el desarrollo de esas otras medidas en el texto oral.","B":"Pedir que mencione, según la información que ha recabado, qué medidas para prevenir accidentes durante un sismo quiere comunicar en su texto oral. A partir de ello, indicar que vuelva a escuchar su grabación y comente si considera que las ideas que ha expresado son suficientes para saber cuáles son esas medidas.","C":"Solicitar que evalúe si expresar todas las medidas orientadas a prevenir accidentes durante un sismo contribuiría al logro del propósito comunicativo de su texto oral. Sobre esta base, indicar que, en una siguiente práctica de su exposición, ofrezca información completa acerca de esas medidas de prevención."},"answer":"B","tema":"Evaluación y retroalimentación","explicacion":["La B es correcta porque primero el estudiante dice qué medidas quería comunicar y luego vuelve a escuchar su grabación para juzgar si sus ideas “son suficientes”: al contrastar lo que quería decir con lo que dijo, él mismo descubre el vacío de información.","La A parece correcta porque apunta al mismo problema (anunció varias medidas y no las desarrolló), pero falla porque la docente “hace notar” el error directamente: el estudiante no lo identifica, solo explica algo que ya le dijeron.","Pista: cuando el propósito es que el estudiante identifique el problema, gana la opción donde él compara, escucha o relee y saca su propia conclusión. La C también falla: le indica la solución (“ofrezca información completa”) sin que reconozca el vacío."],"aprende_mas":[{"q":"¿Qué son los vacíos de información en un texto oral?","a":"Son partes donde falta información necesaria para que el oyente entienda o para cumplir el propósito. En el ejemplo, el estudiante dice que “hay otras medidas igual de relevantes” pero nunca las menciona. El público se queda sin saber qué hacer, y el propósito de “ofrecer medidas” no se logra."},{"q":"¿Por qué grabarse es útil para mejorar la expresión oral?","a":"Porque el texto oral es efímero: se dice y desaparece. La grabación lo vuelve un objeto que se puede revisar, como un borrador escrito. Así el estudiante se escucha “desde afuera”, como lo haría su público, y detecta repeticiones, vacíos o muletillas."},{"q":"¿Cómo formular preguntas que lleven al estudiante a autoevaluarse?","a":"- **Compara intención y resultado**: “¿Qué querías comunicar? ¿Lo lograste?”.\n- **Ponlo en el lugar del público**: “Si fueras un padre de familia, ¿sabrías qué hacer en un sismo?”.\n- **Pide evidencia**: “¿En qué parte de tu grabación se escucha esa medida?”."}],"duda":false},"2024-F1-11":{"n":11,"year":2024,"ctx":"2024-F1-c3","stem":"Luego de terminar el esquema de ideas de su texto oral, una estudiante ha grabado en audio su exposición con la que invita a la comunidad educativa a formar brigadas para ayudar a prevenir y controlar situaciones de riesgo ante un sismo. Ella ha presentado el audio a la docente y a sus compañeros de equipo. Este es un fragmento de su exposición:\n\n“Buenos días. Mi equipo quiere invitar a formar brigadas que ayuden a tomar acciones durante un sismo. A mí me ha tocado empezar explicando qué es un brigadista. Eh… un brigadista es el encargado de ayudar a las personas cuando hay un temblor. Para ser brigadista, hay varios requisitos. En primer lugar, todos los brigadistas son voluntarios… O sea, por decisión propia, deciden integrar una brigada. O sea, voluntariamente, una persona puede ser parte de una brigada para ayudar a las personas en un sismo. No podemos obligar a nadie a ser brigadista. La persona misma tiene que estar dispuesta a ser parte de una brigada, porque es voluntaria”.\n\nDespués de escuchar el audio, la docente busca ofrecerle a la estudiante una retroalimentación que la ayude a mejorar su texto oral. Ella busca que la estudiante identifique que la repetición de ideas afecta su propósito comunicativo. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir que revise el esquema de ideas de su texto oral para que identifique los atributos que ha considerado esenciales para ser brigadista. Luego, indicar que realice una nueva grabación de su texto oral y desarrolle dichos atributos sin repetir ninguno de ellos.","B":"Pedir que, en su grabación, identifique las veces que ha mencionado la voluntad de una persona como una condición fundamental para integrar una brigada. Luego, indicar que la reiteración de esa información dificulta el desarrollo de ideas de su texto oral.","C":"Pedir que mencione cuál es el tema principal de su texto oral. Luego, indicar que vuelva a escuchar la grabación de su texto, y que explique qué ideas expuestas desarrollan distintos aspectos de dicho tema y qué ideas cree que no lo hacen."},"answer":"C","tema":"Evaluación y retroalimentación","explicacion":["La C es correcta porque primero ancla a la estudiante en el tema principal y luego le pide reescuchar su audio y distinguir qué ideas desarrollan aspectos distintos del tema y cuáles no. Así ella misma descubre que repite la idea de “voluntario”.","La B parece correcta porque apunta justo a la repetición, pero al final la docente le dice cuál es el problema (“la reiteración dificulta…”). Le entrega la conclusión hecha en lugar de que la estudiante la identifique.","Pista: si el enunciado dice “que la estudiante identifique”, busca la alternativa donde el estudiante reflexiona y descubre por sí mismo; descarta las que el docente explica o corrige por él."],"aprende_mas":[{"q":"¿Qué es la retroalimentación por descubrimiento o reflexión?","a":"Es cuando el docente no da la respuesta, sino que hace preguntas o propone tareas para que el estudiante encuentre su propio error. Por ejemplo, en vez de decir “repites mucho”, pregunta “¿qué idea nueva agrega esta oración?”. Es el tipo de retroalimentación que el Minedu valora más."},{"q":"¿Qué es la progresión temática en un texto oral?","a":"- **Tema**: de qué trata el texto (los brigadistas).\n- **Progresión**: cada idea suma un aspecto nuevo (requisitos, funciones, cómo inscribirse).\n- **Redundancia**: decir lo mismo con otras palabras; el mensaje no avanza y el público se distrae."},{"q":"¿Por qué grabarse en audio ayuda a mejorar la expresión oral?","a":"Porque permite escucharse “desde afuera”, como lo haría el público. El estudiante nota muletillas (“eh”, “o sea”) y repeticiones que no percibe mientras habla. Es una buena forma de autoevaluación antes de la exposición final."}],"duda":false},"2024-F1-12":{"n":12,"year":2024,"ctx":"2024-F1-c4","stem":"Como parte de la actividad de lectura, la docente solicita a los estudiantes que se organicen en equipos y deduzcan el tema central del texto. En este contexto, el integrante de uno de los equipos menciona:\n\n“Mi equipo ha podido reconocer que el tema más importante del texto es la lamentable muerte de Einstein”.\n\nAnte este comentario, la docente busca ofrecer una orientación a los estudiantes para que identifiquen su error en la deducción del tema central del texto. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"¿Cuál es la idea principal de cada uno de los párrafos del texto? ¿Alguna idea alude a la muerte de Einstein? ¿Es posible decir que los intentos para descubrir su genialidad es un aspecto esencial en el texto?","B":"¿Por qué sostienen que la muerte de Einstein es lamentable? ¿Qué información del texto los lleva a calificar de esa manera su fallecimiento? ¿Esta información se ubica en varios párrafos del texto?","C":"¿Qué hechos ocurrieron luego de la muerte de Einstein? ¿Cuál de esos hechos se desarrolla más en los párrafos del texto? ¿Se puede dejar de lado este hecho para comprender el texto?"},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque parte del propio error: pregunta qué hechos ocurrieron luego de la muerte y cuál se desarrolla más en los párrafos (los estudios del cerebro). La última pregunta les hace comprobar que ese hecho no se puede dejar de lado: es el tema central.","La A parece correcta porque pide la idea principal de cada párrafo, pero en la tercera pregunta la docente ya sugiere la respuesta (“los intentos para descubrir su genialidad”). Los estudiantes no deducen el tema: solo confirman lo que se les insinúa.","Pista: para corregir un tema mal deducido, la mejor orientación ayuda a ver qué información se desarrolla a lo largo del texto y qué es solo punto de partida o detalle."],"aprende_mas":[{"q":"¿Cómo se distingue el tema central de un dato inicial?","a":"El tema central es aquello de lo que trata la mayor parte del texto; un dato inicial suele ser solo el punto de partida. Aquí, la muerte de Einstein ocupa una línea; los estudios sobre su cerebro ocupan los tres párrafos. Pregunta clave: “¿de qué se habla en casi todo el texto?”."},{"q":"¿Qué estrategias ayudan a deducir el tema central?","a":"- **Sumillar párrafos**: anotar al margen de qué trata cada uno.\n- **Buscar lo que se repite**: el cerebro de Einstein aparece en todos los párrafos.\n- **Prueba de supresión**: si quito esa idea y el texto ya no se entiende, es central."},{"q":"¿Por qué no conviene dar la respuesta dentro de la pregunta orientadora?","a":"Porque el estudiante solo confirma lo que el docente insinúa y no aprende el procedimiento. Las preguntas deben funcionar como una escalera: cada una lo acerca, pero el último paso lo da él."}],"duda":false},"2024-F1-13":{"n":13,"year":2024,"ctx":"2024-F1-c4","stem":"Los estudiantes y la docente están dialogando sobre el siguiente fragmento ubicado en el primer párrafo del texto:\n\n“[…] así como no se podrían entender las actividades económicas que se realizan en una ciudad solo a través del estudio de sus edificios, era imposible evaluar el cerebro de Einstein solo por su forma”.\n\nLa docente solicita a los estudiantes que identifiquen la intención del autor al incluir ese fragmento en el párrafo. ¿Cuál de los siguientes estudiantes identifica dicha intención?","options":{"A":"Anabela dice: “Pienso que lo hace para demostrar que la neurología y la economía son parecidas en la forma en que abordan sus objetos de estudio”.","B":"Bruno dice: “Creo que lo hace para ilustrar que un experto podrá comprender integralmente el cerebro analizándolo cuando está en funcionamiento”.","C":"Cecilia dice: “Me parece que lo hace para mostrar que examinar el cerebro puede ser tan o más complejo que estudiar las actividades económicas que se realizan en una ciudad”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque el fragmento es una analogía: así como los edificios (la forma) no explican las actividades económicas (el funcionamiento) de una ciudad, la forma del cerebro no basta. Bruno capta que el autor ilustra que hay que estudiarlo funcionando.","La C parece correcta porque retoma la ciudad y la economía, pero convierte la analogía en una comparación de dificultad (“tan o más complejo”). El autor no compara qué es más difícil; contrasta forma con funcionamiento.","Pista: ante una analogía, empareja los elementos (edificios = forma; actividades = funcionamiento) y pregúntate qué idea quiere aclarar el autor con ese ejemplo."],"aprende_mas":[{"q":"¿Qué es una analogía y para qué la usa un autor?","a":"Es comparar dos situaciones distintas que funcionan de forma parecida, para explicar algo difícil con algo conocido. El autor no dice que la ciudad y el cerebro sean iguales; usa la ciudad como ejemplo para que el lector entienda la idea sobre el cerebro. Por eso la A falla: toma la comparación al pie de la letra."},{"q":"¿Qué significa identificar la intención del autor?","a":"Es inferir para qué el autor incluyó algo: informar, ilustrar, persuadir, contrastar. No está escrito; se deduce del contexto. Pregunta útil en clase: “¿qué perdería el párrafo si quitamos este fragmento?”."},{"q":"¿Cómo se desarma una analogía con los estudiantes?","a":"- **Paso 1**: subrayar los dos lados (ciudad / cerebro).\n- **Paso 2**: emparejar elementos (edificios ↔ forma; actividades ↔ funcionamiento).\n- **Paso 3**: formular la idea: “la forma sola no explica lo que algo hace”."}],"duda":false},"2024-F1-14":{"n":14,"year":2024,"ctx":"2024-F1-c4","stem":"Para profundizar en la comprensión del texto, la docente tiene como propósito que los estudiantes realicen una lectura crítica. ¿Cuál de los siguientes grupos de preguntas es más adecuado para ello?","options":{"A":"¿Qué información sobre el cerebro de Einstein les pareció más interesante? ¿Les gustaría indagar más sobre esa información?","B":"¿Cuál es la relevancia de los estudios acerca del cerebro de Einstein? ¿Esta relevancia justifica el robo del cerebro de dicho científico?","C":"¿A qué se dedica un especialista en neurología? ¿Por qué creen que Harvey, luego de extraer el cerebro de Einstein, se contactó con varios neurólogos?"},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque pide valorar la relevancia de los estudios y juzgar si eso justifica el robo del cerebro. Los estudiantes deben tomar postura y sustentarla, que es lo propio de la lectura crítica.","La C parece adecuada porque pregunta “¿por qué creen…?”, pero solo pide información general (qué hace un neurólogo) y una inferencia sobre la intención de Harvey. No hay evaluación ni postura frente al texto.","Pista: lectura crítica es opinar con fundamentos sobre el contenido, la forma o los valores del texto. Busca preguntas que pidan juzgar, justificar o valorar."],"aprende_mas":[{"q":"¿Cuáles son los niveles de comprensión lectora?","a":"- **Literal**: lo que el texto dice explícitamente (¿cuándo murió Einstein?).\n- **Inferencial**: lo que se deduce (¿por qué Harvey contactó a neurólogos?).\n- **Crítico**: lo que el lector valora o juzga (¿estuvo bien sacar el cerebro sin permiso?)."},{"q":"¿Por qué la A no es lectura crítica si pide una opinión?","a":"Porque “¿qué te pareció más interesante?” recoge un gusto personal, no un juicio argumentado. La lectura crítica exige evaluar algo del texto con razones: su validez, su ética, su intención. Gusto no es lo mismo que juicio."},{"q":"¿En qué parte del CNEB se ubica la lectura crítica?","a":"En la competencia “Lee diversos tipos de textos escritos en lengua materna”, capacidad “Reflexiona y evalúa la forma, el contenido y contexto del texto”. En secundaria se espera que el estudiante opine sobre ideas, hechos o posturas del texto y lo sustente."}],"duda":false},"2024-F1-15":{"n":15,"year":2024,"ctx":"2024-F1-c5","stem":"Un equipo de estudiantes está planificando el texto que escribirá. Si bien los estudiantes han establecido que su propósito comunicativo será promover el reúso de materiales, aún no tienen claro qué género emplear. Por este motivo, solicitan al docente que los ayude a seleccionar un género que contribuya al logro de su propósito. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Proponer a los estudiantes que revisen textos de diversos géneros, como crónicas, columnas de opinión, entre otros. Luego, describir sus características textuales, y mencionar qué propósitos podrían ajustarse a dichos géneros. Después, indicar que elijan el género textual que les permitirá promover el reúso de materiales.","B":"Preguntar a los estudiantes si, según su propósito y sus destinatarios, saben qué quieren comunicar acerca del reúso de materiales. Luego, pedir que indaguen sobre qué géneros permiten, por ejemplo, narrar, convencer sobre un tema o explicarlo. Después, indicar que expresen cuál de esos géneros es pertinente para lograr su propósito.","C":"Pedir a los estudiantes que expliquen por qué decidieron que su propósito sea promover el reúso de materiales. Luego, preguntar si consideran conveniente incluir un mensaje a los lectores para resaltar los beneficios del reúso de materiales. Después, indicar qué géneros tienen esta característica para que decidan cuál es el que pueden usar."},"answer":"B","tema":"Escritura y revisión de textos","explicacion":["La B es correcta porque parte de la situación comunicativa (qué quieren comunicar, según propósito y destinatarios), luego los estudiantes indagan qué géneros sirven para narrar, convencer o explicar, y finalmente ellos deciden cuál es pertinente.","La A parece correcta porque revisa géneros variados, pero empieza por los textos y no por lo que el equipo quiere comunicar a sus lectores. La elección queda desligada de su propósito y destinatarios concretos.","Pista: al planificar la escritura, el orden es propósito y destinatario primero, género después. Prefiere la alternativa donde los estudiantes razonan y toman la decisión."],"aprende_mas":[{"q":"¿Qué decide el estudiante al planificar un texto?","a":"- **Propósito**: para qué escribo (promover el reúso).\n- **Destinatario**: para quién (los vecinos que leen la revista municipal).\n- **Género**: qué tipo de texto sirve mejor (afiche, columna, cuento).\n- **Registro**: formal o informal según el público."},{"q":"¿Cómo se relaciona el género con la intención comunicativa?","a":"- **Narrar**: cuento, crónica, anécdota.\n- **Convencer**: columna de opinión, afiche, carta.\n- **Explicar o informar**: artículo informativo, infografía."},{"q":"¿Por qué el docente no debe elegir el género por los estudiantes?","a":"Porque escribir bien implica adecuar el texto a la situación comunicativa, y esa decisión es del escritor. Si el docente decide, el estudiante solo ejecuta. Por eso la C falla: el docente termina indicando los géneros."}],"duda":false},"2024-F1-16":{"n":16,"year":2024,"ctx":"2024-F1-c5","stem":"Los integrantes de un equipo quieren elaborar un texto narrativo literario para fomentar el uso responsable de la electricidad. En ese contexto, ellos están dialogando sobre la función del personaje protagonista en los cuentos. Del diálogo que sostuvieron, se han extraído tres comentarios. ¿Cuál de los siguientes comentarios evidencia una concepción apropiada acerca de la función del personaje protagonista en un cuento?","options":{"A":"“Yo creo que el protagonista debe mantener su forma de actuar a lo largo de la historia. Dado que es el personaje principal, su rol ayuda a que la historia sea predecible”.","B":"“Yo creo que el protagonista debe ser el personaje en el que recae la historia del cuento. Su rol es que las acciones que realice le vayan dando forma a la trama”.","C":"“Yo creo que el protagonista debe conseguir lo que se propone. O sea, su rol como personaje es mostrar que cumple sus objetivos en la historia”."},"answer":"B","tema":"Literatura","explicacion":["La B es correcta porque define al protagonista como el personaje en el que recae la historia y cuyas acciones van dando forma a la trama. Esa es su función: mover el conflicto y el desarrollo del relato.","La C parece correcta porque muchos protagonistas logran sus metas, pero no es obligatorio: pueden fracasar, cambiar de objetivo o aprender algo distinto. Su función no depende de que “cumpla sus objetivos”.","Pista: desconfía de las alternativas con un “debe” rígido (siempre igual, siempre gana). La función del protagonista se define por su relación con la trama, no por un resultado fijo."],"aprende_mas":[{"q":"¿Qué diferencia a un personaje principal de uno secundario?","a":"El protagonista concentra la historia: el conflicto gira en torno a él. Los secundarios lo acompañan, lo ayudan o le ponen obstáculos. Si quitas al protagonista, el cuento se cae; si quitas a un secundario, la historia sigue."},{"q":"¿Qué son los personajes planos y redondos?","a":"- **Plano**: no cambia, actúa siempre igual (el villano que solo es malo).\n- **Redondo**: evoluciona, tiene matices y puede sorprender.\nPor eso la A falla: un protagonista puede cambiar, y muchas veces lo hace."},{"q":"¿Qué es la trama de un cuento?","a":"Es la secuencia de acciones organizada en inicio, nudo y desenlace, y las decisiones del protagonista la empujan. Ejemplo: un niño deja todo encendido (inicio), provoca un apagón en su barrio (nudo) y aprende a ahorrar luz (desenlace)."}],"duda":false},"2024-F1-17":{"n":17,"year":2024,"ctx":"2024-F1-c6","stem":"La docente nota que varios estudiantes tienen problemas para interpretar el poema. Por esta razón, ella busca modelar el proceso de lectura para favorecer que los estudiantes realicen una primera exploración sobre el sentido global del texto poético. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que recaben información biográfica sobre la autora. Luego, solicitar que expliquen si esa información los puede ayudar o no a interpretar el sentido del poema.","B":"Solicitar a los estudiantes que, en pares, lean todo el poema y anoten las interrogantes que les surgen. Luego, proponer que compartan esas interrogantes para responderlas en plenaria.","C":"Leer con los estudiantes los ocho primeros versos del poema en voz alta. Luego, expresar las dudas que podrían ir apareciendo e indicar qué pasajes del poema servirían para contestarlas."},"answer":"C","tema":"Lectura: sentido global e inferencias","explicacion":["La C es correcta porque la docente modela: lee con los estudiantes en voz alta, expresa las dudas que van surgiendo y muestra qué pasajes ayudan a responderlas. Hace visible su forma de pensar como lectora.","La B parece correcta porque los estudiantes formulan preguntas y las comparten, pero trabajan en pares sin ver cómo se lee el poema. Si ya tienen problemas para interpretar, primero necesitan observar el proceso; además, ahí la docente no modela.","Pista: “modelar” significa que el docente hace la tarea delante de los estudiantes pensando en voz alta. Si en la alternativa los estudiantes trabajan solos desde el inicio, no hay modelado."],"aprende_mas":[{"q":"¿Qué es el modelado o pensamiento en voz alta?","a":"Es cuando el docente lee y dice en voz alta lo que piensa: “Aquí no sé quiénes cruzaron la quebrada… sigo leyendo… ah, habla de los abuelos”. Así los estudiantes ven una estrategia que normalmente es invisible."},{"q":"¿Qué es la liberación gradual de la responsabilidad?","a":"- **Yo hago**: el docente modela.\n- **Hacemos juntos**: práctica guiada con toda la clase.\n- **Ustedes hacen**: trabajo en pares o equipos.\n- **Tú haces solo**: lectura autónoma.\nLa B salta directo al tercer paso."},{"q":"¿Por qué la biografía de la autora no es el primer paso?","a":"Porque la información externa puede ayudar después, pero no enseña a leer el poema. Si los estudiantes no logran interpretar los versos, primero hay que trabajar con el texto mismo. El contexto del autor complementa la lectura; no la reemplaza."}],"duda":false},"2024-F1-18":{"n":18,"year":2024,"ctx":"2024-F1-c6","stem":"La docente pide a los estudiantes que comenten algún aspecto del poema que les haya llamado la atención. Tres estudiantes decidieron compartir sus comentarios con el resto de la clase. ¿Qué estudiante ofrece un comentario que se ajusta más a una interpretación del sentido global del poema?","options":{"A":"Avelino dice: “Como se habla de los shiringales y el huambé, podemos decir que el poema se ambienta en la selva”.","B":"Boris dice: “El poema dice que nuestros antepasados amazónicos han logrado dejar una herencia cultural que sobrevive hasta hoy”.","C":"Camila dice: “En el poema, hay varias partes que nos hacen pensar en los momentos difíciles que pasaron las personas de la Amazonía”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque integra todo el poema: los abuelos “siembran porvenires”, la voz recita “para no olvidar” y al final “hemos regresado intactos”. La idea de una herencia que sobrevive al dolor recorre el texto completo.","La C parece correcta porque el poema sí alude al sufrimiento (látigos, sable, shiringales), pero eso corresponde sobre todo a una parte. Omite el regreso y la continuidad del cierre, así que es una lectura parcial.","Pista: el sentido global integra inicio, desarrollo y cierre. Si una interpretación solo explica una estrofa o un dato del ambiente (como la A), es parcial."],"aprende_mas":[{"q":"¿Qué es el sentido global de un poema?","a":"Es el mensaje que surge al leer el poema completo y relacionar sus partes. No es el escenario (“la selva”) ni una imagen aislada. Pregunta útil: “¿qué nos dice el poema en conjunto?”."},{"q":"¿Cómo distinguir una interpretación global de una parcial?","a":"- **Parcial**: explica bien un fragmento (el dolor de la época del caucho).\n- **Global**: conecta todas las partes (memoria del dolor, resistencia y herencia).\n- **Prueba**: ¿la interpretación explica también los últimos versos? Si no, es parcial."},{"q":"¿Qué contexto ayuda a entender los “shiringales”?","a":"Los shiringales eran zonas de extracción de caucho en la Amazonía, entre fines del siglo XIX e inicios del XX. Allí muchos pueblos indígenas fueron explotados y castigados con violencia. El poema recuerda esa época, pero afirma que el pueblo sobrevivió."}],"duda":false},"2024-F1-19":{"n":19,"year":2024,"ctx":"2024-F1-c6","stem":"En otro momento de la actividad de lectura, la docente busca que los estudiantes identifiquen los recursos literarios que contribuyen a la construcción de interpretaciones del sentido global del poema. ¿Cuál de las siguientes preguntas es más adecuada para ello?","options":{"A":"¿Con qué intención se usan palabras en primera persona, como “nos” o “nuestros”?","B":"¿Qué quiere decir la voz poética con “[...] rayar el sol / sobre el planeta”?","C":"¿A qué se refiere la expresión “espalda devorada”?"},"answer":"A","tema":"Literatura","explicacion":["La A es correcta porque la primera persona plural (“nos”, “nuestros”) atraviesa todo el poema y construye una voz colectiva: un pueblo que recuerda y resiste. Ese recurso es clave para interpretar el sentido global.","La C parece adecuada porque “espalda devorada” es una imagen poderosa, pero preguntar a qué se refiere solo interpreta una expresión aislada. Aporta al significado de un verso, no a un recurso que organiza todo el poema.","Pista: si piden recursos que contribuyan al sentido global, elige la pregunta que mira algo presente en todo el texto (voz poética, repeticiones, estructura), no una sola metáfora."],"aprende_mas":[{"q":"¿Qué es la voz poética?","a":"Es quien “habla” en el poema; no es necesariamente la autora. Puede ser un “yo” individual o un “nosotros” colectivo. Aquí la voz alterna “habito” y “nos”: un yo que habla en nombre de su pueblo."},{"q":"¿Qué recursos literarios aportan al sentido global?","a":"- **Voz poética y persona gramatical**: quién habla y en nombre de quién.\n- **Repeticiones (anáfora)**: “Y habito desde siempre” refuerza la permanencia.\n- **Campos semánticos**: dolor (látigos, sable) frente a vida (siembran, frutos)."},{"q":"¿Cuál es la diferencia entre una pregunta local y una global?","a":"La local apunta a una palabra o verso (“¿qué significa espalda devorada?”). La global pide relacionar partes o reconocer algo que recorre todo el texto. Ambas son útiles, pero solo la global construye el sentido completo."}],"duda":false},"2024-F1-20":{"n":20,"year":2024,"ctx":"2024-F1-c6","stem":"La docente propone varias preguntas a los estudiantes. ¿Cuál de las siguientes preguntas es menos adecuada para que construyan interpretaciones sobre el sentido global del poema?","options":{"A":"¿Qué pasajes del poema dan cuenta de las sensaciones que experimenta la voz poética?","B":"¿Qué figura retórica utiliza la voz poética en la expresión “historias de látigos”?","C":"¿Qué paisaje busca representar la voz poética en los versos del poema?"},"answer":"B","tema":"Literatura","explicacion":["La B es la clave porque es la menos adecuada: pedir el nombre de la figura retórica en “historias de látigos” es una tarea de identificación técnica sobre una expresión aislada. Nombrar el recurso no lleva a interpretar el poema completo.","La C podría parecer la menos adecuada porque “paisaje” suena a simple descripción, pero pregunta qué busca representar la voz en los versos del poema: obliga a recorrer todo el texto e interpretar el territorio como espacio de memoria.","Pista: en preguntas de “menos adecuada”, busca la que se queda en lo formal o en un fragmento. Clasificar recursos no es interpretar; la pregunta útil relaciona el recurso con el sentido."],"aprende_mas":[{"q":"¿Está mal enseñar figuras retóricas?","a":"No. Lo que prioriza el CNEB es que el estudiante explique qué efecto tiene la figura en el sentido del texto, no solo que la nombre. Mejor preguntar: “¿Qué sugiere la expresión ‘historias de látigos’ sobre el pasado de este pueblo?”."},{"q":"¿Cómo transformar una pregunta formal en una interpretativa?","a":"- **Formal**: “¿Qué figura es ‘espalda devorada’?”.\n- **Interpretativa**: “¿Qué sensación transmite y cómo se relaciona con el resto del poema?”.\n- **Clave**: pasar de “qué es” a “para qué está”."},{"q":"¿Qué hace que una pregunta construya sentido global?","a":"- **Recorre el texto completo**: “en los versos del poema”, no en uno solo.\n- **Pide relacionar**: sensaciones, imágenes o ideas entre sí.\n- **Admite interpretación sustentada**: se responde con pasajes, no con un término técnico."}],"duda":false},"2024-F1-21":{"n":21,"year":2024,"ctx":"2024-F1-c7","stem":"Un equipo de estudiantes expone su texto oral ante el resto de la clase. Dicho texto busca explicar la labor de la activista ambiental Nemonte Nenquimo. Esta es la transcripción de la intervención de una de las integrantes del equipo:\n\n“Nemonte es una activista que pertenece a la nación huaorani de Ecuador. Ella, mediante sus acciones, nos demuestra que es posible contribuir a sensibilizar a las personas sobre el cuidado del ambiente. Eh… por ejemplo, cualquier persona, desde el lugar en que se encuentre, puede ayudar en la defensa de los bosques amazónicos, puede salvarlos de la depredación. El activismo de Nemonte nos moviliza como jóvenes que somos, porque ella, en su país, se enfrentó a grandes empresas extractoras de petróleo y pudo vencerlas. Logró que no continúen operando en el territorio de su comunidad. Eh… estas empresas, al extraer el petróleo, causaban contaminación”.\n\nLuego de escuchar la práctica, los estudiantes ofrecen comentarios sobre la exposición. ¿Cuál de los siguientes comentarios se centra en la deducción de información del texto oral?","options":{"A":"“Nemonte y su activismo nos hacen notar la falta de regularización sobre aquellas empresas que depredan los bosques amazónicos”.","B":"“Nemonte ha realizado acciones que necesitamos imitar con urgencia en nuestro país para evitar la depredación de los bosques amazónicos”.","C":"“Nemonte tendría que haber recibido algún reconocimiento en su país: no debe ser sencillo luchar contra los que depredan los bosques amazónicos”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta porque saca una idea que no está dicha: si Nemonte tuvo que enfrentarse ella misma a las petroleras para frenarlas, se deduce que faltaba control o normas sobre esas empresas.","La C parece correcta porque dice «no debe ser sencillo», pero en el fondo es una valoración personal (merecía un reconocimiento). No deduce información del texto oral: lo juzga.","Pista: deducir es completar lo que el texto no dice pero permite concluir. Si el comentario dice «tendría que», «necesitamos» o «debería» (B y C), suele ser opinión o propuesta, no deducción."],"aprende_mas":[{"q":"¿Qué diferencia hay entre inferir y opinar sobre un texto?","a":"- **Inferir**: obtener información implícita a partir de pistas del texto; se puede sustentar señalando esas pistas.\n- **Opinar o valorar**: emitir un juicio propio (está bien, está mal, debería). Va más allá del texto.\n- **Ejemplo**: «Faltaban controles» es inferencia; «Deberían premiarla» es opinión."},{"q":"¿Qué capacidad del CNEB trabaja la deducción en textos orales?","a":"Es la capacidad «Infiere e interpreta información del texto oral», de la competencia «Se comunica oralmente en su lengua materna». Incluye deducir causas, conclusiones, el tema y el propósito de lo que se escucha."},{"q":"¿Cómo practicar la inferencia oral en el aula?","a":"Después de una exposición, pregunta «¿Qué podemos concluir aunque no lo hayan dicho?» y luego «¿Qué parte de lo que escuchaste te permite decirlo?». La segunda pregunta obliga a sustentar con pistas y evita que respondan con opiniones."}],"duda":false},"2024-F1-22":{"n":22,"year":2024,"ctx":"2024-F1-c7","stem":"Un equipo de estudiantes está practicando su texto oral que tiene como propósito revalorar el papel activo de María Parado de Bellido en la independencia peruana. Un integrante del equipo ha presentado su intervención y el resto de sus compañeros de clase le ofrecen diversos comentarios. ¿Cuál de los siguientes comentarios evidencia una reflexión sobre los aspectos formales del texto oral?","options":{"A":"“Creo que las dudas que te formulaste a ti mismo acerca de la vida de María Parado de Bellido, en varios momentos de la exposición, despertaron mi interés por querer saber sobre ella”.","B":"“Considero que las cualidades sobre el carácter de María Parado de Bellido que elegiste describir se quedan cortas para expresar el valor que le podemos atribuir a sus acciones”.","C":"“Pienso que las acciones de María Parado de Bellido representan ejemplos que se pueden seguir en cualquier época, debido a que ella es un símbolo de valentía y libertad”."},"answer":"A","tema":"Comunicación oral","explicacion":["La A es correcta porque comenta un recurso de forma: las preguntas que el expositor se hacía a sí mismo (preguntas retóricas) y el efecto que causaron en el público, que fue despertar interés.","La B parece correcta porque habla de lo que el expositor «eligió describir», pero se centra en el contenido: si las cualidades seleccionadas bastan para valorar a la heroína. Evalúa qué dijo, no cómo lo dijo.","Pista: «aspectos formales» del texto oral son los recursos verbales, paraverbales y no verbales, la estructura y las estrategias para captar al público. Si el comentario trata de ideas o valores del personaje (B, C), es contenido."],"aprende_mas":[{"q":"¿Qué cuenta como «aspecto formal» en un texto oral?","a":"- **Recursos verbales**: preguntas retóricas, ejemplos, conectores, vocabulario.\n- **Recursos paraverbales**: volumen, entonación, pausas, ritmo.\n- **Recursos no verbales**: gestos, mirada, postura.\n- **Organización**: cómo inicia, desarrolla y cierra la exposición."},{"q":"¿Qué es una pregunta retórica y para qué sirve al exponer?","a":"Es una pregunta que el hablante se hace sin esperar que el público responda; luego la contesta él mismo. Sirve para captar la atención, crear expectativa y ordenar el tema. Ejemplo: «¿Por qué una mujer arriesgaría su vida por la independencia? Veamos…»."},{"q":"¿Cómo distinguir reflexión sobre la forma y sobre el contenido?","a":"- **Forma**: «¿Cómo lo dijo y qué efecto causó?».\n- **Contenido**: «¿Qué dijo? ¿Es válido? ¿Estoy de acuerdo?».\n- **Ojo**: ambas son parte de la capacidad «Reflexiona y evalúa la forma, el contenido y contexto del texto oral», pero el enunciado suele pedir solo una."}],"duda":false},"2024-F1-23":{"n":23,"year":2024,"ctx":"2024-F1-c7","stem":"Un equipo está llevando a cabo la práctica de su texto oral acerca de Malala Yousafzai, activa defensora del derecho a la educación de las niñas. A continuación, se presenta la transcripción del cierre presentado por uno de los integrantes de este equipo:\n\n“En resumen… este… Malala, a los 14 años, tuvo la valentía y el coraje de ser la defensora del derecho a educarse de las niñas de su país y de enfrentarse a quienes prohibían que las mujeres reciban educación. Eh… y todos tenemos ese derecho. Como decía, ella se opuso a esa prohibición y, por ello, atentaron contra su vida. Pero ella sobrevivió y pudo recuperarse satisfactoriamente. En el año… eh… 2014, recibió el Premio Nobel de la Paz por su activismo. De otro lado, Malala también ha escrito un libro sobre su vida y ahora trabaja de la mano con instituciones defensoras de los derechos humanos para lograr que cada vez más mujeres puedan ejercer su derecho a la educación. Gracias”.\n\nAl terminar de escuchar el texto oral, la docente busca que los estudiantes reflexionen sobre el contenido del cierre presentado. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir a los estudiantes que indiquen por qué Malala defiende el derecho a la educación. Luego, comentar que Malala logró que instituciones defensoras de los derechos humanos velen por el cumplimiento del derecho a la educación de las niñas.","B":"Pedir a los estudiantes que busquen y seleccionen otras fuentes sobre el activismo de Malala, además de la información que se ha expuesto en el texto oral. Luego, solicitar que escriban un texto para describir su activa participación ciudadana.","C":"Pedir a los estudiantes que mencionen cuál de los hechos de la vida de Malala creen que puede haber generado mayor repercusión internacional. Luego, proponer que intercambien comentarios sobre los efectos en la sociedad del hecho mencionado."},"answer":"C","tema":"Comunicación oral","explicacion":["La C es correcta porque pide a los estudiantes juzgar los hechos del cierre (cuál tuvo mayor repercusión internacional) y luego dialogar sobre sus efectos en la sociedad: eso es reflexionar y evaluar el contenido escuchado.","La A parece correcta porque parte del contenido, pero pregunta algo fácil de recuperar y luego la docente añade un dato que el cierre no dice (que Malala «logró» que las instituciones velen). La docente concluye por ellos.","Pista: reflexionar sobre el contenido es opinar con sustento sobre lo que se dijo (importancia, efectos, validez). Descarta acciones que se alejan del texto escuchado, como buscar otras fuentes y escribir otro texto (B)."],"aprende_mas":[{"q":"¿Qué niveles de comprensión hay al escuchar un texto oral?","a":"- **Literal**: recuperar lo que se dijo («¿En qué año ganó el Nobel?»).\n- **Inferencial**: deducir lo implícito («¿Por qué atentaron contra ella?»).\n- **Crítico**: evaluar y opinar con sustento («¿Qué hecho fue más importante y por qué?»)."},{"q":"¿Por qué la B no sirve si buscar fuentes es buena práctica?","a":"Porque cambia el foco: pasa a investigar y a escribir, que son otras competencias. El enunciado pide reflexionar sobre el contenido del cierre que acaban de escuchar. Una acción puede ser valiosa y aun así no responder al propósito que plantea la pregunta."},{"q":"¿Qué rol cumple la docente al promover la reflexión?","a":"Es mediadora: hace preguntas y abre el diálogo, no da la conclusión. Si en una alternativa la docente «comenta», «explica» o «indica» la respuesta, el estudiante deja de pensar. Ejemplo: en vez de decir «esto fue lo más importante», pregunta «¿qué fue lo más importante para ustedes y por qué?»."}],"duda":false},"2024-F1-24":{"n":24,"year":2024,"ctx":"2024-F1-c7","stem":"Los integrantes de uno de los equipos practican su texto oral que busca destacar el trabajo de la cantante peruana Renata Flores en la revalorización de la lengua quechua. A continuación, se muestra la transcripción de un fragmento de la exposición que uno de los miembros de ese equipo presentó en clase:\n\n“Compañeros, este… Renata Flores tiene 21 años. Puede comunicarse tanto en castellano como en quechua. Varios de nosotros también hablamos quechua, aunque algunos compañeros ya lo están olvidando. Renata… este… se propone que la gente aprenda quechua. En sus presentaciones, puede notarse su intención de revalorizar este idioma, mostrar que es parte de nuestra identidad. Ella siempre dice que no solo se puede usar para conversar con nuestras familias, sino también para informarnos, divertirnos y expresar lo que sentimos. Por el trabajo que ella hace… eh… de cantar rap en quechua, muchas personas se han interesado en esa lengua y muchas otras la quieren aprender”.\n\nLuego de escuchar la exposición, tres estudiantes ofrecen sus comentarios acerca del texto oral. ¿Cuál de los siguientes comentarios expresa una conclusión que se desprende del fragmento?","options":{"A":"“Yo aprendí trabalenguas en quechua, por lo que comparto la idea de que podemos divertirnos usando ese idioma”.","B":"“El quechua puede ser reivindicado gracias al trabajo que realizan artistas que han aprendido castellano y quechua”.","C":"“Es cierto que muchas personas hemos aprendido quechua, pese a que nos estemos olvidando de usarlo en la vida diaria”."},"answer":"B","tema":"Comunicación oral","explicacion":["La B es correcta porque generaliza a partir del caso de Renata: si una artista bilingüe logra que muchas personas se interesen en el quechua, se concluye que el trabajo de artistas así puede reivindicar esa lengua.","La C parece correcta porque retoma una idea del fragmento, pero la deforma: el expositor dijo que varios hablan quechua y algunos lo olvidan, no que «muchas personas hemos aprendido». Además, es un detalle, no una conclusión.","Pista: una conclusión recoge hacia dónde apunta todo el fragmento (su idea central). Descarta comentarios basados en la experiencia personal del oyente (A) o que solo repiten un detalle."],"aprende_mas":[{"q":"¿Qué es una conclusión que «se desprende» del texto?","a":"Es una idea que no aparece dicha tal cual, pero que se obtiene al relacionar varias partes del texto. Debe poder sustentarse con lo que se escuchó. Si necesitas datos de tu vida o de fuera del texto para llegar a ella, no se desprende del fragmento."},{"q":"¿Cómo detectar una alternativa que deforma el texto?","a":"- **Cambia cantidades**: «varios» pasa a «muchos».\n- **Cambia sujetos**: «algunos compañeros» pasa a «nosotros».\n- **Cambia el sentido**: lo posible pasa a seguro.\n- **Consejo**: compara palabra por palabra con el texto antes de elegir."},{"q":"¿Por qué la experiencia personal no cuenta como conclusión?","a":"Porque relaciona el texto con la vida del oyente, no con lo que el texto dice. Sirve para opinar o valorar, pero no para concluir. Ejemplo: «yo aprendí trabalenguas» habla del estudiante, no de Renata ni del quechua en el fragmento."}],"duda":false},"2024-F1-25":{"n":25,"year":2024,"ctx":"2024-F1-c8","stem":"Como parte de la planificación, un equipo ha recabado información diversa sobre Junicha Wasi, innovación que busca crear modelos de viviendas térmicas en zonas en las que las heladas afectan seriamente a las comunidades. Sin embargo, los integrantes del equipo tienen dificultades para organizar dicha información. Por ello, le piden a la docente que los oriente en la elaboración de un esquema de escritura. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Pedir que, a partir de la información recopilada, mencionen los beneficios de la innovación Junicha Wasi. Luego, preguntar qué aspectos de la vida de las personas mejoran gracias a estos beneficios. Después, junto con el equipo, elaborar un esquema para organizar la información que recabaron según los tipos de beneficios que ofrece la innovación.","B":"Pedir que mencionen qué información han recopilado sobre Junicha Wasi. Luego, comentar que realizar el esquema de escritura los ayudará a organizar sus ideas antes de escribir sobre la influencia que tiene la innovación en la mejora de la calidad de vida de las personas. Después, indicar los pasos para elaborar un esquema con esa información.","C":"Pedir que dialoguen sobre la información que los ayuda a explicar por qué la innovación Junicha Wasi mejora la vida de las personas. Luego, solicitar que establezcan una jerarquía a partir de dicha información. Después, ofrecer varios tipos de esquemas, indicar que elijan el que más les guste y sugerir las ideas que pueden incluir en él."},"answer":"A","tema":"Escritura y revisión de textos","explicacion":["La A es correcta porque parte de la información del propio equipo (beneficios → aspectos de la vida que mejoran) y construye con ellos un esquema por tipos de beneficios, que responde al propósito: explicar por qué la innovación mejora la calidad de vida.","La C parece correcta porque pide dialogar y jerarquizar, pero luego deja elegir el esquema «que más les guste» y la docente sugiere las ideas. El criterio debe ser el propósito, no el gusto, y las ideas deben salir del equipo.","Pista: la mejor orientación para planificar da un criterio claro para organizar la información (ligado al propósito) y lo trabaja junto con los estudiantes. Descarta la que solo explica pasos de forma expositiva (B)."],"aprende_mas":[{"q":"¿Qué es un esquema de escritura o plan de texto?","a":"Es un borrador de la estructura antes de redactar: qué ideas irán, en qué orden y cómo se relacionan. Puede ser un cuadro, un mapa o una lista jerarquizada. Ejemplo: Beneficio térmico → menos enfermedades respiratorias; beneficio económico → ahorro en abrigo y calefacción."},{"q":"¿Qué decide el estudiante al planificar su texto, según el CNEB?","a":"- **Propósito**: para qué escribe (explicar, convencer, narrar).\n- **Destinatario**: quién leerá (la comunidad escolar, en el periódico mural).\n- **Tipo de texto y registro**: tríptico, folleto; formal o informal.\n- **Ideas y fuentes**: qué información usará y cómo la organizará."},{"q":"¿Por qué «elaborar junto con el equipo» es mejor que «indicar los pasos»?","a":"Porque el estudiante aprende el procedimiento haciéndolo, con apoyo de la docente (andamiaje). Si la docente solo explica los pasos, el equipo sigue sin saber cómo agrupar su información. En el examen, prefiere alternativas donde el estudiante piensa y la docente acompaña."}],"duda":false},"2024-F1-26":{"n":26,"year":2024,"ctx":"2024-F1-c8","stem":"Un equipo elaboró un folleto para describir el funcionamiento de la innovación Qanwan Qashani, dispositivo creado para ayudar a las personas que presentan discapacidad visual a trasladarse con mayor facilidad. Durante la revisión, la docente nota que algunas ideas se alejan del propósito de su folleto. Por ello, busca ayudar a los estudiantes a que, por sí mismos, se den cuenta de este problema. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"Entregar una lista de cotejo sobre los aspectos que debe cumplir su folleto, como el propósito comunicativo, la adecuación del texto al público y el uso pertinente de imágenes. Luego, revisar el texto usando dicha lista y señalar lo que deben mejorar.","B":"Mencionar que el propósito de su folleto es describir el funcionamiento del dispositivo que ayuda a las personas que presentan discapacidad visual a trasladarse. Luego, indicar las partes del texto que contribuyen a este propósito y las que no lo hacen.","C":"Pedir que mencionen cuál es el propósito de su folleto, y que subrayen las ideas que consideran esenciales para lograr dicho propósito y expliquen por qué. Luego, solicitar que comenten por qué decidieron no subrayar algunas ideas."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque los propios estudiantes recuerdan el propósito, subrayan las ideas esenciales, explican por qué y justifican lo que no subrayaron. Así descubren, sin que se lo digan, qué ideas se alejan del propósito.","La A parece correcta porque usa una lista de cotejo, pero quien revisa y «señala lo que deben mejorar» es la docente. Además, la lista abarca muchos aspectos (público, imágenes) y diluye el problema concreto: ideas fuera del propósito.","Pista: cuando el enunciado dice «por sí mismos», busca la alternativa donde el estudiante identifica, explica y justifica. Si la docente dice el propósito o marca los errores (A y B), no hay autonomía."],"aprende_mas":[{"q":"¿Qué significa revisar un texto según el CNEB?","a":"Es la capacidad «Reflexiona y evalúa la forma, el contenido y contexto del texto escrito». El estudiante relee su texto para comprobar si cumple su propósito, si las ideas son coherentes y si el lenguaje es adecuado, y decide qué mejorar."},{"q":"¿Qué es la metacognición en la revisión de textos?","a":"Es pensar sobre el propio texto y las propias decisiones. Preguntas que la activan: «¿Para qué escribimos esto?», «¿Esta idea ayuda a ese propósito?», «¿Por qué la dejaron fuera?». Cuando el estudiante explica sus decisiones, aprende a revisar solo la próxima vez."},{"q":"¿Entonces la lista de cotejo está mal?","a":"No. Es un buen instrumento si el estudiante la usa para autoevaluarse o para evaluar a un compañero. El problema en la A es quién la aplica: la docente revisa y señala. Pista de examen: el mismo instrumento puede ser correcto o incorrecto según quién hace el trabajo de pensar."}],"duda":false},"2024-F1-27":{"n":27,"year":2024,"ctx":"2024-F1-c8","stem":"Otro equipo ha recabado información sobre el proyecto Rompemuelles-bomba, innovación que busca suministrar agua potable a las familias de zonas altoandinas. Los integrantes del equipo han elaborado la primera versión de su tríptico, que busca explicar el funcionamiento de dicho proyecto. Esta es una parte del texto que han escrito:\n\nLos Rompemuelles-bomba son una innovacion que coordina la ingeniera Sandra Vergara y, con la innovacion, se busca mejorar la calidad de vida de las personas. Se han instalado Rompemuelles-bomba en varios lugares. Consta de varias partes. Tiene un funcionamiento interesante. Por un lado, las familias de zonas de altura tienen un mejor suministro de agua. Aun asi, el uso de esta innovacion debe expandirse a más regiones de altura.\n\nLa docente busca que los estudiantes mejoren diversos aspectos de su escrito, por lo que les realiza algunas preguntas. ¿Cuál de los siguientes grupos de preguntas es adecuado para que identifiquen el principal problema de escritura de su texto?","options":{"A":"¿Creen que las palabras de su texto han sido escritas según las reglas ortográficas de tildación general? ¿Qué palabras agudas de su escrito requieren llevar tilde de forma obligatoria?","B":"¿Creen que es necesario realizar una modificación en los conectores utilizados en el texto? ¿Qué otros conectores pueden emplear para evidenciar de modo más preciso la relación lógica entre sus ideas?","C":"¿Creen que las ideas incluidas ayudan al lector a comprender el funcionamiento de la innovación? ¿Qué ideas deben incluirse en el texto para entender por qué esta innovación mejora el suministro de agua?"},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque apunta al problema principal: el texto no explica el funcionamiento (dice «consta de varias partes» y «tiene un funcionamiento interesante» sin decir cuáles ni cómo). Faltan ideas para cumplir el propósito.","La B parece correcta porque hay conectores mal usados («Por un lado» sin «por otro», «Aun así»), pero es un problema secundario. Aunque se corrijan, el texto seguiría sin explicar cómo funciona el Rompemuelles-bomba.","Pista: cuando preguntan por el «principal problema», piensa primero en el propósito. Un problema de contenido o coherencia pesa más que las tildes (A) o los conectores (B); esos se revisan después."],"aprende_mas":[{"q":"¿Qué es el desarrollo de ideas en un texto?","a":"Es ampliar cada idea con información suficiente: explicaciones, datos, ejemplos o pasos. Una oración como «tiene un funcionamiento interesante» anuncia algo, pero no lo desarrolla. En un texto explicativo, el lector debe terminar sabiendo cómo y por qué funciona algo."},{"q":"¿En qué orden conviene revisar un borrador?","a":"- **Primero, propósito y contenido**: ¿se entiende lo que quiero explicar?\n- **Luego, organización**: orden de ideas, párrafos, conectores.\n- **Al final, superficie**: ortografía, tildes, puntuación.\n- **Por qué**: no tiene sentido pulir tildes de párrafos que luego se van a reescribir."},{"q":"¿Qué es la coherencia textual?","a":"Es que todas las ideas giren en torno a un tema y propósito, sin vacíos ni contradicciones. Un texto puede tener buena ortografía y aun así ser incoherente si le faltan ideas clave o mezcla temas que no se conectan."}],"duda":false},"2024-F1-28":{"n":28,"year":2024,"ctx":"2024-F1-c9","stem":"Como parte de la actividad, el docente pide a los estudiantes que comenten los aspectos del texto que llamaron su atención. ¿Cuál de los siguientes comentarios evidencia una deducción de información del texto?","options":{"A":"“En las investigaciones sobre el ADN de los perros, los expertos con participación más relevante fueron los biólogos”.","B":"“Ciertos animales, como sucede con los lobos, pueden aprovechar en menor medida los nutrientes que tienen los carbohidratos”.","C":"“Los cambios en la alimentación de los ancestros de los perros nos ayudan a conocer el momento en que los seres humanos lograron domesticarlos”."},"answer":"B","tema":"Lectura: sentido global e inferencias","explicacion":["La B es correcta porque deduce algo que el texto no dice directamente: si el perro tiene muchos más genes para digerir el almidón y aprovecha mejor los carbohidratos que el lobo, entonces el lobo los aprovecha en menor medida.","La C parece correcta porque menciona la alimentación, idea central del texto, pero afirma algo que el texto no sostiene: el estudio explica cómo empezó la domesticación (por la comida de los agricultores), no precisa el momento.","Pista: una deducción válida se apoya en relaciones del texto (contraste, causa-efecto). Descarta las que añaden juicios sin sustento (A: «los biólogos fueron los más relevantes») o exageran lo que el texto afirma (C)."],"aprende_mas":[{"q":"¿Qué tipos de inferencias se piden en lectura?","a":"- **Causa-efecto**: por qué ocurre algo.\n- **Por contraste**: si A tiene más que B, B tiene menos que A.\n- **De significado**: qué quiere decir una palabra o frase en contexto.\n- **Globales**: tema, idea principal y propósito del texto."},{"q":"¿Qué es el sentido global de un texto?","a":"Es la idea general que resulta de leer todo el texto, no un párrafo suelto. Aquí sería: la domesticación del perro está ligada a su capacidad de digerir los alimentos de los primeros agricultores. Para hallarlo, pregúntate «¿de qué trata y qué dice sobre eso?»."},{"q":"¿Cómo evitar elegir una inferencia que «se pasa» del texto?","a":"Busca la frase del texto que la sostiene. Si no la encuentras, o la alternativa usa palabras más fuertes que el texto («el momento», «los más relevantes»), es una sobreinterpretación. La buena inferencia es prudente y se puede verificar."}],"duda":false},"2024-F1-29":{"n":29,"year":2024,"ctx":"2024-F1-c9","stem":"El docente tiene como propósito que los estudiantes reflexionen sobre los aspectos formales del texto. ¿Cuál de las siguientes acciones pedagógicas es adecuada para el logro de dicho propósito?","options":{"A":"Pedir a los estudiantes que mencionen con qué finalidad el texto empieza planteando una pregunta.","B":"Pedir a los estudiantes que propongan un nuevo título tomando en cuenta la información que ofrece el texto.","C":"Pedir a los estudiantes que subrayen las ideas del texto que muestran la influencia de las personas en la domesticación de animales."},"answer":"A","tema":"Lectura: sentido global e inferencias","explicacion":["La A es correcta porque pregunta para qué el texto empieza con una pregunta: es reflexionar sobre una estrategia de forma (cómo está construido el inicio) y su efecto en el lector, que es despertar curiosidad y plantear el tema.","La B parece co
