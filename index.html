:root{
  /* tokens Día */
  --fondo:#F4F6FB; --superficie:#FFFFFF; --linea:#D9DEEA; --tinta:#1E2230; --tinta-suave:#5A6075; --tinta-apagada:#9AA0B2;
  --cobalto:#2D4BB5; --cobalto-hondo:#1F3585; --cobalto-claro:#E3E9FB; --sobre-cobalto:#FFFFFF;
  --corbatin:#D3262F; --corbatin-hondo:#9E1A22; --corbatin-claro:#FCE4E5; --corbatin-texto:#B11E27; --sobre-corbatin:#FFFFFF;
  --ojo:#357A27; --ojo-hondo:#245A1A; --ojo-claro:#E2F2DC; --ojo-texto:#2F6E22; --sobre-ojo:#FFFFFF;
  --ambar:#F2B33D; --ambar-claro:#FFF3D6; --ambar-texto:#7A5A10;
  --relieve-cobalto:0 4px 0 #1F3585; --relieve-neutro:0 3px 0 #D9DEEA; --relieve-ojo:0 4px 0 #245A1A; --relieve-corbatin:0 4px 0 #9E1A22;
  --font-display:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;
  --font-texto:Lexend,system-ui,-apple-system,"Segoe UI",sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;
  --radius-sm:10px;--radius-md:16px;--radius-lg:24px;--radius-full:9999px;
  /* alias usados por el código de la app */
  --bg:var(--fondo); --surface:var(--fondo); --surface-2:var(--superficie); --ink:var(--tinta); --muted:var(--tinta-suave); --line:var(--linea);
  --accent:var(--cobalto); --accent-soft:var(--cobalto-claro); --navy:var(--cobalto); --on-navy:var(--sobre-cobalto);
  --ok:var(--ojo); --ok-bg:var(--ojo-claro); --ok-line:var(--ojo); --bad:var(--corbatin); --bad-bg:var(--corbatin-claro); --bad-line:var(--corbatin);
  --warn:var(--ambar-texto); --warn-bg:var(--ambar-claro);
}

  --fondo:#141826; --superficie:#1E2335; --linea:#33394F; --tinta:#EEF0F7; --tinta-suave:#A9AFC4; --tinta-apagada:#5C627A;
  --cobalto:#8FA6F2; --cobalto-hondo:#6C84D6; --cobalto-claro:#252E55; --sobre-cobalto:#141826;
  --corbatin:#FF7A7F; --corbatin-hondo:#D9575C; --corbatin-claro:#4A1B20; --corbatin-texto:#FF9EA2; --sobre-corbatin:#141826;
  --ojo:#8CD47A; --ojo-hondo:#68AE58; --ojo-claro:#1F3A1A; --ojo-texto:#A6E296; --sobre-ojo:#141826;
  --ambar:#F2B33D; --ambar-claro:#3A2E10; --ambar-texto:#F2C76A;
  --relieve-cobalto:0 4px 0 #6C84D6; --relieve-neutro:0 3px 0 #33394F; --relieve-ojo:0 4px 0 #68AE58; --relieve-corbatin:0 4px 0 #D9575C;
  color-scheme:dark }}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--fondo);color:var(--tinta);font-family:var(--font-texto);font-size:18px;line-height:28px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--ambar);outline-offset:3px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{border-right:2px solid var(--linea);background:var(--superficie);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{padding:4px 8px 18px;display:flex;align-items:center;gap:10px}
.brand img{width:64px;height:64px;flex:none;display:block}
.brand .wm{display:flex;flex-direction:column;font-family:var(--font-display);font-weight:700;line-height:1}
.brand .wm span{font-size:15px;color:var(--tinta)}
.brand .wm b{font-size:32px;color:var(--cobalto);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:2px solid transparent;padding:10px 12px;border-radius:var(--radius-md);text-align:left;font-family:var(--font-display);font-size:18px;font-weight:500;color:var(--tinta-suave)}
.nav button svg{width:24px;height:24px;flex:none}
.nav button:hover{color:var(--tinta)}
.nav button[aria-current="true"]{color:var(--cobalto);border-color:var(--cobalto);background:var(--cobalto-claro)}
.nav .count{margin-left:auto;font-family:var(--font-texto);font-size:13px;line-height:20px;background:var(--corbatin-claro);color:var(--corbatin-texto);padding:0 9px;border-radius:var(--radius-full);font-weight:600}

-17","2023-F1-18","2023-F1-19","2023-F1-20","2023-F1-21","2023-F1-22","2023-F1-23","2023-F1-24","2023-F1-25","2023-F1-26","2023-F1-27","2023-F1-28","2023-F1-29","2023-F1-30","2023-F1-31","2023-F1-32","2023-F1-33","2023-F1-34","2023-F1-35","2023-F1-36","2023-F1-37","2023-F1-38","2023-F1-39","2023-F1-40","2023-F1-41","2023-F1-42","2023-F1-43","2023-F1-44","2023-F1-45","2023-F1-46","2023-F1-47","2023-F1-48","2023-F1-49","2023-F1-50","2023-F1-51","2023-F1-52","2023-F1-53","2023-F1-54","2023-F1-55","2023-F1-56","2023-F1-57","2023-F1-58","2023-F1-59","2023-F1-60"]}],"contexts":{"2025-F1-c1":{"intro":"Lea la siguiente situación y responda las preguntas 4 y 5.","text":"Los estudiantes de tercer grado están participando en un taller de escritura de cuentos. El propósito del taller es que los estudiantes, de forma individual y con orientación del docente, escriban diversos tipos de cuentos creados por ellos mismos."},"2025-F1-c2":{"intro":"Lea la siguiente situación y responda las preguntas 6, 7 y 8.","text":"Los estudiantes de tercer grado le comentan a la docente que, en la clase de Ciencia y Tecnología, supieron que las científicas peruanas registradas en el Registro Nacional Científico, Tecnológico y de Innovación Tecnológica (Renacyt) son el 30 % del total, y el resto son científicos varones. En este contexto, la docente les propone escribir semblanzas sobre algunas de las científicas para visibilizar el trabajo que ellas realizan. Los estudiantes publicarán estas semblanzas en el periódico mural de la IE."},"2025-F1-c3":{"intro":"Lea la siguiente situación y responda las preguntas 9 y 10.","text":"A pedido de los estudiantes de cuarto y quinto grado, el Área de Tutoría de una IE está ofreciendo charlas de orientación vocacional. Estas charlas brindan información acerca de las diversas carreras técnicas y profesionales que los estudiantes pueden elegir al término de sus estudios secundarios, o las posibles trayectorias que pueden seguir."},"2025-F1-c4":{"intro":"Lea la siguiente situación y responda las preguntas 14 y 15.","text":"En una IE, se está realizando una campaña para fomentar hábitos saludables en los estudiantes. Como parte de la campaña, la docente va a proyectar un video para los estudiantes de tercer grado, en el que una neuróloga ofrece una charla sobre los beneficios de que niños, niñas y adolescentes duerman una cantidad apropiada de horas. La docente ha indicado a los estudiantes que, al finalizar el video, realizará algunas preguntas para dialogar sobre la información que han escuchado."},"2025-F1-c5":{"intro":"Lea la siguiente situación y responda las preguntas 16, 17 y 18.","text":"Los estudiantes de quinto grado de una IE han sido invitados a una estación de radio de la localidad para conversar sobre diversos temas relacionados con el proceso histórico de la emancipación de las mujeres. Dichos estudiantes van a participar en una mesa redonda que tratará acerca de los factores que influyeron en ese proceso histórico. Como parte de su preparación, los estudiantes leerán algunos textos propuestos por el docente. A continuación, se presenta uno de estos textos:\n\nA finales del siglo diecinueve, las mujeres se convirtieron en las usuarias más entusiastas de las bicicletas. Por ejemplo, en 1895, Susan Brownell, feminista estadounidense, afirmaba lo siguiente: “La bicicleta ha hecho más por la emancipación de la mujer que ninguna otra cosa en el mundo. Le da independencia desde el momento en que se sienta en ella”.\n\nSin embargo, no todas las mujeres opinaban lo mismo: “Antes pensaba que lo peor que podía hacer una mujer era fumar, pero he cambiado de idea. Lo peor que he visto en mi vida es una mujer montando bicicleta”. Así se manifestaba una corresponsal del diario Chicago Tribune en una columna de opinión publicada el 25 de julio de 1891. Las pioneras de la bicicleta, para bien o para mal, estaban empezando a causar una impresión abrumadora.\n\nSi bien el solo hecho de montar bicicletas con pesados vestidos y apretados corsés resultaba incómodo para las mujeres, este se constituía como el menor de sus obstáculos. Las mujeres de aquella época enfrentaban problemas de mayor magnitud. En el siglo diecinueve, la sociedad imponía reglas al comportamiento femenino, y la mujer que montaba bicicleta era considerada una transgresora de dichas reglas, por lo que se convertía en una persona de “dudosa” moral. Por si fuera poco, los médicos de la época opinaban que el ciclismo era una actividad perjudicial para el organismo y la salud femeninos, ya que, según ellos, la exposición al frío y a la humedad de las calles y, sobre todo, los asientos de las bicicletas podían generarles enfermedades. Peor aún, muchas mujeres que se movilizaban en bicicleta eran atacadas a pedradas.\n\nCon el tiempo, conforme se avanzaba en la emancipación femenina, aumentaban las mujeres ciclistas. Así pues, mientras para los hombres, la bicicleta era un nuevo juguete, para las mujeres, era un trampolín que las llevaba a otro mundo. La imagen de la mujer en bicicleta fue dejando de ser extraña. Ejemplos como la vuelta al mundo en bicicleta de Annie Londonderry en 1895 causaron sorpresa y admiración en muchas personas. Surgieron clubes femeninos que hacían ver el uso de la bicicleta como una actividad recreativa y saludable, y ofrecían la oportunidad a las mujeres de viajar en bicicleta acompañadas por sus pares. La publicidad comenzó a presentar el ciclismo de las mujeres como una actividad respetable. Los médicos empezaron a recomendar el uso de la bicicleta para fortalecer las articulaciones y mejorar el sistema cardiovascular. El periodismo veía en la ciclista a la “nueva mujer”, una mujer moderna que rompía con las convenciones sociales, que trabajaba fuera de casa o era políticamente activa, con lo que se alejaba del rol tradicional de “esposa” y “madre”. En diversos ámbitos, la mujer empezó a ser vista igual que el hombre, y la bicicleta contribuyó a reafirmarse en ese sentido.\n\nLas mujeres conquistaban nuevos terrenos que antes estaban destinados exclusivamente para los hombres.\n\nAdaptado de Ainhoa Campos Posada. (2023). Artículo publicado en el portal National Geographic\n\nEspaña. Recuperado el 25 de febrero de 2023 de https://n9.cl/2hn65"},"2025-F1-c6":{"intro":"Lea la siguiente situación y responda las preguntas 19 y 20.","text":"En una IE, se va a realizar un proyecto para dar a conocer las características físicas, únicas o curiosas, de diferentes animales que habitan en la región. Como parte de su participación en el proyecto, los estudiantes de segundo grado realizarán exposiciones que se llevarán a cabo en las aulas de otros grados de secundaria. En este contexto, con orientación del docente y organizados en equipos, los estudiantes están preparando sus textos orales."},"2025-F1-c7":{"intro":"Lea la siguiente situación y responda las preguntas 21, 22 y 23.","text":"En el marco de un taller de lectura literaria, la docente les propone a sus estudiantes de cuarto grado leer textos de tradición amazónica, como el que se presenta a continuación:\n\nY habito desde siempre ¿Quiénes han cruzado la quebrada antes\n\nque nosotros?\n\n¿Quiénes han poblado días y columnas\n\nde hastío?\n\nNos han abierto el camino para llegar\n\ndescansados\n\ny nos han dejado un cementerio de voces\n\nque vagan bajo los puentes.\n\nY habito desde siempre soles despedazados, largos infortunios antes de rayar el sol sobre el planeta y sé que nuestros abuelos han sembrado y siembran porvenires y los astros que me conducen acostumbran\n\na decir atisbo,\n\natisbo los años para que los muertos descansen en paz.\n\nAsí recito para no olvidar historias de látigos y libras inglesas aventadas desde los\n\nshiringales.\n\nEntonces recuerdo el dolor de una espalda\n\ndevorada\n\ny el filo del sable que cortó el miedo. Era el tiempo en que el viento decía la palabra salida, así volaron sombreros de huambé desde las embarcaciones.\n\nPero hemos regresado intactos, dolientes cuerpos insospechados, sabias manos que siembran frutos al recrear\n\nlos caminos.\n\nTomado de Ana Varela Tafur. (1992). Lo que no veo en visiones."},"2025-F1-c8":{"intro":"Lea la siguiente situación y responda las preguntas 24, 25, 26, 27 y 28.","text":"En una IE, los estudiantes de primer grado participan en un proyecto que busca proponer medidas de prevención frente al acoso escolar (bullying). Entre las actividades involucradas en el proyecto, dichos estudiantes, organizados en equipos y orientados por el docente, van a escribir textos de diversos géneros para publicarlos en los paneles de la institución."},"2025-F1-c9":{"intro":"Lea la siguiente situación y responda las preguntas 29, 30, 31 y 32.","text":"En el marco de un taller de lectura literaria, una docente propone a sus estudiantes de quinto grado leer relatos breves. A continuación, se presenta uno de los textos que están leyendo:\n\nLos dos juristas\n\nÉrase una vez un gran jurisconsulto que, habiendo oído grandes elogios de otro de su mismo oficio que vivía en distinta ciudad, se puso en camino para ir a verlo y comprobar si aquella fama de que gozaba era o no justificada. Apenas se apeó del caballo, sin siquiera mudarse las botas de montar, se presentó en casa del famoso colega. —Yo, señor mío, vengo a discutir el derecho, que tengo por cierto, de que me pertenecen todos los muebles que vuestra señoría tiene en esta casa.\n\nA lo cual el otro, sin vacilar un instante y aunque recordaba perfectamente que su buen dinero le había costado mandarlos a hacer, repuso:\n\n—¡Oh, señor, por favor! Vea si no habrá medio de venir a un arreglo antes que meternos en un litigio, que yo, por mi parte, no sería difícil de contentar.\n\n—¡Basta! —concluyó el forastero—. Ya no necesito más para convencerme de cuán merecida es la gran fama que de sabio tiene vuestra señoría.\n\nAdaptado de Lorenzo Magalotti. (s.f.). “Los dos juristas”."},"2025-F1-c10":{"intro":"Lea la siguiente situación y responda las preguntas 33, 34, 35 y 36.","text":"En una sesión de aprendizaje, el docente presenta a los estudiantes de primer grado un afiche en el que se alude a un estereotipo, según el cual los hombres son menos sensibles que las mujeres. Durante el intercambio de ideas sobre el afiche, los estudiantes llegan a la conclusión de que ese estereotipo puede perjudicar el desarrollo emocional de niños, niñas y adolescentes. En este contexto, los estudiantes han decidido elaborar textos con el propósito de explicar por qué los estereotipos son perjudiciales y qué medidas existen para enfrentarlos. Ellos publicarán los textos en los paneles de la IE."},"2025-F1-c11":{"intro":"Lea la siguiente situación y responda las preguntas 37 y 38.","text":"Los estudiantes de segundo grado, orientados por el docente de Ciencias Sociales y el de Comunicación, están desarrollando un proyecto cuyo propósito es conocer la influencia de los seres humanos en el proceso de domesticación de los animales. En este contexto, los estudiantes comparten diversos textos, como el que se presenta a continuación:\n\n¿En qué momento se domesticaron los perros? Es una duda recurrente que buscaría explicar por qué estos animales, desde hace tantos miles de años, son conocidos como el “mejor amigo del hombre”. Lo que sabemos hoy es que el perro es un descendiente del lobo; sin embargo, se desconoce cómo y cuándo fue que empezó esa relación de amistad. Un nuevo estudio comparativo de genes caninos sostiene que el “secreto” está en la alimentación que tuvieron los ancestros de los perros.\n\nUn equipo de investigadores (compuesto por especialistas en genética, medicina, ecofisiología, biología, bioquímica y microbiología) de la Universidad de Uppsala en Suecia, la Universidad de Hedmark en Noruega y el Instituto Tecnológico de Massachusetts en Estados Unidos, entre otros, examinaron el ADN de más de 50 perros de diferentes razas y lo compararon con la información genética de 12 lobos provenientes de diversos lugares alrededor del mundo. Las diferencias más relevantes se encontraron en los genes pertenecientes al desarrollo cerebral y a la metabolización del almidón.\n\nEn contraste con el lobo, el can tiene muchos más genes que codifican las enzimas necesarias para digerir el almidón. El perro puede hacer mejor uso de los nutrientes de ciertos carbohidratos. Por esta razón, se asume que los cambios que ha provocado esta dieta a base de carbohidratos son responsables de la personalidad dócil y energética del perro.\n\nLos hallazgos de la investigación sustentan la teoría de que el proceso de domesticación se originó a partir de aquellos lobos capaces de digerir los alimentos producidos por los primeros agricultores. La comida de los asentamientos primerizos de nuestros ancestros representó una nueva fuente de alimentación que, con el paso del tiempo, provocó que, primero, el lobo y, después, el perro vivieran permanentemente cerca del hombre. En otras palabras, el proceso de evolución del perro está íntimamente ligado al consumo de alimentos de los antiguos seres humanos.\n\nAdaptado de National Geographic España. (2018). “¿Cómo se domesticaron los perros?”. Recuperado el\n\n15 de febrero de 2023 de https://n9.clmg70n"},"2025-F1-c12":{"intro":"Lea la siguiente situación y responda las preguntas 39 y 40.","text":"Con motivo del aniversario de la fundación de la localidad, se realizará un campeonato deportivo interescolar en el que competirán estudiantes de secundaria. Una IE está organizando su participación en el campeonato y los estudiantes de este nivel han notado que los de primaria, que serán espectadores del evento, desconocen las reglas de algunos de los deportes en los que se competirá. Por esta razón, en equipos y con orientación de la docente, los estudiantes de secundaria prepararán exposiciones dirigidas a los niños y niñas de primer y segundo grado de primaria con el propósito de explicar las reglas de dichos deportes."},"2025-F1-c13":{"intro":"Lea la siguiente situación y responda las preguntas 41 y 42.","text":"En un taller de lectura literaria, el docente y los estudiantes de tercer grado leen juntos diversos mitos y leyendas de pueblos andinos del Perú. A continuación, se presenta uno de esos textos:\n\nLos venados\n\nAntiguamente, sucedía que los venados comían carne humana.\n\nDespués, cuando los venados ya eran muchos, (un día) mientras bailaban una cachua cantando: “¿Cómo haremos para comer hombres?”.\n\nUn venadito se equivocó y dijo: “¿Cómo harán los hombres para comernos?”. Al oír estas palabras, los venados se dispersaron.\n\nA partir de entonces, los venados habían de ser alimento para los hombres.\n\nAdaptado de Ricardo González Vigil (comp.). (2021). El microrrelato peruano. Antología general."},"2025-F1-c14":{"intro":"Lea la siguiente situación y responda las preguntas 43, 44, 45 y 46.","text":"En una IE, se vienen realizando ponencias sobre los logros y las expectativas de las mujeres en el campo de las ciencias. En este contexto, los estudiantes de quinto grado están recibiendo una charla de una ingeniera civil. La docente, con la autorización de la ingeniera, ha grabado la presentación en audio."},"2025-F1-c15":{"intro":"Lea la siguiente situación y responda las preguntas 47, 48, 49, 50 y 51.","text":"En un taller de lectura literaria, la docente les ha propuesto a los estudiantes de quinto grado leer poemas de escritoras mujeres que ganaron el Premio Nobel de Literatura. En este contexto, los estudiantes leen algunos poemas de Wisława Szymborska. A continuación, se muestra uno de los textos que están leyendo:\n\nDespedida de un paisaje\n\nNo le reprocho a la primaveraRespeto su derecho que llegue de nuevo.a reír, a susurrar No me quejo de que cumplay a quedarse felices en silencio. como todos los años\n\nSupongo incluso\n\ncon sus obligaciones.\n\nque los une el amor\n\nComprendo que mi tristezay que él la abraza a ella no frenará la hierba.con brazos llenos de vida. Si los tallos vacilan\n\nAlgo nuevo, como un trino,\n\nserá solo por el viento.\n\ncomienza a gorgotear entre los juncos.\n\nNo me causa dolorDe veras les deseo que los bosques de alisosque lo oigan.\n\nrecuperen su murmullo.\n\nNo exijo ningún cambio\n\nMe doy por enteradade las olas a la orilla, de que, como si vivieras,ligeras o perezosas, la orilla de cierto lagopero no obedientes.\n\nes tan bella como era.\n\nNada le pido\n\nNo le guardo rencora las aguas junto al bosque, a la vista por la vistaa veces esmeralda, de una bahía deslumbrante.a veces zafiro,\n\na veces negras.\n\nPuedo incluso imaginarme que otros, no nosotros,Una cosa no acepto.\n\nestán sentados ahora mismoVolver a ese lugar.\n\nsobre el abedul derribado.Renuncio al privilegio\n\nde la presencia.\n\nTe he sobrevivido suficiente como para recordar desde lejos.\n\nTomado de Wisława Szymborska. (1997). El gran número. Fin y principio y otros poemas."},"2025-F1-c16":{"intro":"Lea la siguiente situación y responda las preguntas 52, 53 y 54.","text":"En una IE, se está realizando un proyecto cuyo objetivo es contribuir a la sensibilización para conservar el patrimonio cultural de la localidad. En este contexto, los estudiantes de segundo grado, organizados en equipos y orientados por la docente, van a elaborar videos en los que, de forma oral, ofrecerán información sobre el estado en que se encuentran diversos bienes y sitios culturales, y los desafíos que supone su conservación. Estos videos serán publicados en las redes sociales de la escuela."},"2025-F1-c17":{"intro":"Lea la siguiente situación y responda las preguntas 55 y 56.","text":"Los estudiantes de tercer grado están leyendo una antología de cuentos cortos, que ha sido elaborada por escolares de diversos colegios latinoamericanos. A continuación, se presenta un cuento escrito por una de las estudiantes de dichos colegios:\n\nCierta vez, una abeja se encontró con un enorme dragón. Entonces, pensó: “¡Cómo quisiera convertirme en dragón para que todos me respeten y me tengan miedo!”. Siguió volando y se encontró con un gato tan blanco como la nieve. Entonces, dijo: “¡Quisiera ser tan bella y elegante como un gato!”. Continuó su camino y vio una mariposa; entonces, pensó: “¡Quisiera tener unas alas como un ángel y verme como ella!”. Continuó su camino, triste por ser solo una abeja. Después de un rato, se topó con un hada, que, al ver el rostro de la abeja, le preguntó qué le pasaba. Luego de escuchar la respuesta de la abeja y de saber dónde se había cruzado con los otros animales, el hada fue a buscarlos. Tomó el camino recorrido por la abeja. Al poco tiempo, se encontró al dragón, inmenso; al gato, de una belleza y elegancia espectaculares; y a la mariposa, que, con sus alas, parecía un ser celestial. Después de admirarlos, volvió con la abeja y le concedió todo lo deseado. La abeja se volvió grande como un dragón, con la elegancia de un gato y unas hermosas alas de color azul cielo. La abeja se miró a sí misma con asombro y le preguntó al hada en qué la había convertido. El hada le respondió que ahora era un alebrije.\n\nAdaptado de Gisel Mendoza Pérez. (2018). Esc. Sec. Federal N.° 7 Francisco Nacozari de Torreón.\n\nRecuperado el 14 de noviembre de 2023 de https://n9.cl/cm0y9"},"2025-F1-c18":{"intro":"Lea la siguiente situación y responda las preguntas 58, 59 y 60.","text":"En el marco de un proyecto sobre el uso responsable de las redes sociales, los estudiantes de segundo grado van a escribir textos sobre la manera de aprovechar las redes para realizar actividades extracurriculares. En este contexto, el docente los orienta para que, en equipos, elaboren trípticos dirigidos a los estudiantes de otros grados."},"2024-F1-c1":{"intro":"Lea la siguiente situación y responda las preguntas 1, 2, 3, 4 y 5.","text":"Los estudiantes de cuarto grado, con orientación del docente, están participando en un proyecto en el que escribirán textos de diversos tipos para explicar los aportes del arte en la vida de las personas. Dichos textos serán publicados en el periódico mural de la IE."},"2024-F1-c2":{"intro":"Lea la siguiente situación y responda las preguntas 6, 7 y 8.","text":"En una IE, se están realizando diversas actividades por Fiestas Patrias. En ese contexto, la docente les propone a sus estudiantes leer textos literarios de escritores que vivieron en la época de la emancipación. A continuación, se presenta uno de los poemas que están leyendo:\n\nLos gatos\n\nUna gata parió varios gatitos, uno blanco, uno negro, otro manchado; luego que ellos quedaron huerfanitos los perseguía un perro endemoniado; y para dar el golpe a su enemigo no había más remedio que juntarse, y que la dulce unión fuese su abrigo.\n\nVan pues a reunirse, y al tratarse sobre quién de ellos deba ser cabeza, maullando el blanco dijo: “A mí me toca por mi blancura, indicio de nobleza”. El negro contestó: “Calla la boca; el más diestro y valiente mandar debe”.\n\n“Malo”, dijo el manchado, “si esto dura temo que todo el Diablo se lo lleve. Unión y mande el digno”. “Esto es locura”, gritó el blanco; y el negro le replica. Se dividen por fin en dos partidos; la ira y la turbación se multiplican, se arañan, gritan, y a sus alaridos acude el perro y los destroza.\n\nSi a los gatos al fin nos parecemos, paisanos, ¿esperamos otra cosa?\n\n¿Tendremos libertad? Ya lo veremos…\n\nAdaptado de Mariano Melgar. (2012). Poesías completas."},"2024-F1-c3":{"intro":"Lea la siguiente situación y responda las preguntas 9, 10 y 11.","text":"Los estudiantes de primer grado, organizados en equipos y orientados por la docente, van a participar en una asamblea en la IE para ofrecer medidas de prevención ante los sismos. Para participar en dicha asamblea, elaborarán textos orales dirigidos a la comunidad educativa."},"2024-F1-c4":{"intro":"Lea la siguiente situación y responda las preguntas 12, 13 y 14.","text":"Los estudiantes de segundo grado, orientados por la docente, están realizando una indagación sobre los científicos más representativos del siglo veinte. En este contexto, están leyendo textos seleccionados por ellos mismos. A continuación, se presenta uno de estos textos:\n\nLuego de que Albert Einstein falleciera el 18 de abril de 1955, su familia, a pedido del físico, procedió con la cremación del cuerpo para esparcir las cenizas en el río Delaware. No obstante, hubo una parte de Einstein que no atravesó el mismo proceso de incineración. En secreto y sin consentimiento de la familia, Thomas Harvey, el patólogo encargado de la autopsia, extrajo el cerebro del cuerpo antes de que sea cremado. Harvey tenía la intención de analizar y descubrir la clave de la inigualable inteligencia de Einstein. Para ello, cortó el cerebro en láminas y las guardó en distintos frascos con formol. Luego, se contactó con varios neurólogos y se las ofreció para que puedan estudiarlas, pero nadie accedió. Entre otras razones, estos científicos consideraban que, así como no se podrían entender las actividades económicas que se realizan en una ciudad solo a través del estudio de sus edificios, era imposible evaluar el cerebro de Einstein solo por su forma.\n\nSin embargo, los intentos por estudiar el cerebro del físico estarían lejos de terminar. En 1985, treinta años después de la muerte de Einstein, la neuróloga Marian Diamond publicaría lo que se constituye como la primera investigación sobre el cerebro del genio alemán. Ella se puso en contacto con Harvey y le pidió que le enviara fragmentos del cerebro para analizarlos. Su estudio, publicado ese mismo año, determinó que el cerebro de Einstein tenía una mayor cantidad de células gliales, que son las encargadas de dar soporte a las neuronas e influyen en su maduración. En 1999, por otro lado, en la revista The Lancet, Harvey y sus colaboradores, basándose en fotografías tomadas durante la autopsia, publicaron un artículo titulado “El excepcional cerebro de Albert Einstein”. Harvey y su equipo concluyeron que los lóbulos parietales de Einstein presentaban una morfología atípica. En 2012, además, estos resultados fueron respaldados por los estudios de neurólogos de la Universidad de Florida.\n\nSi bien estas y otras investigaciones dan cuenta de las particularidades del cerebro de Einstein, Terence Hines, psicólogo de la Universidad de Pace, sostuvo, en 2014, que sería necesario llevar a cabo comparaciones con otros cerebros para concluir si el nobel de Física tenía una característica cerebral inusual en la que radicara su inteligencia.\n\nAdaptado de Diego Cioccio. (2021). Artículo publicado en el portal del diario La Nación. Recuperado el 21 de julio de 2023 de\n\nhttps://n9.cl/7u15e"},"2024-F1-c5":{"intro":"Lea la siguiente situación y responda las preguntas 15 y 16.","text":"Los estudiantes de primer grado, en equipos y con la orientación del docente, participarán en la elaboración de una revista que será publicada por la municipalidad de la localidad. Por ello, producirán textos, literarios y no literarios, referidos al uso responsable de recursos energéticos, así como al reúso y reciclaje de materiales desechables."},"2024-F1-c6":{"intro":"Lea la siguiente situación y responda las preguntas 17, 18, 19 y 20.","text":"En el marco de un taller de lectura literaria, la docente les propone a sus estudiantes de cuarto grado leer textos de tradición amazónica, como el que se presenta a continuación:\n\nY habito desde siempre ¿Quiénes han cruzado la quebrada antes que nosotros? ¿Quiénes han poblado días y columnas de hastío? Nos han abierto el camino para llegar descansados y nos han dejado un cementerio de voces que vagan bajo los puentes. Y habito desde siempre soles despedazados, largos infortunios antes de rayar el sol sobre el planeta y sé que nuestros abuelos han sembrado y siembran porvenires y los astros que me conducen acostumbran a decir atisbo, atisbo los años para que los muertos descansen en paz.\n\nAsí recito para no olvidar historias de látigos y libras inglesas aventadas desde los shiringales. Entonces recuerdo el dolor de una espalda devorada y el filo del sable que cortó el miedo. Era el tiempo en que el viento decía la palabra salida, así volaron sombreros de huambé desde las embarcaciones.\n\nPero hemos regresado intactos, dolientes cuerpos insospechados, sabias manos que siembran frutos al recrear los caminos.\n\nTomado de Ana Varela Tafur. (1992). Lo que no veo en visiones."},"2024-F1-c7":{"intro":"Lea la siguiente situación y responda las preguntas 21, 22, 23 y 24.","text":"En una IE, se está realizando un proyecto cuyo propósito es dar a conocer diversos casos representativos de liderazgo femenino. En este contexto, los estudiantes de cuarto grado, en equipos y orientados por la docente, presentarán algunos de estos casos en una mesa redonda que se llevará a cabo en el aula.\n\nComo parte de la preparación para la mesa redonda, los equipos están practicando sus textos orales en plenaria."},"2024-F1-c8":{"intro":"Lea la siguiente situación y responda las preguntas 25, 26 y 27.","text":"En el marco de un proyecto conjunto entre las áreas de Ciencia y Tecnología, y de Comunicación, los estudiantes de tercer grado están investigando sobre las innovaciones científicas y tecnológicas realizadas recientemente en el Perú. Organizados en equipos y orientados por la docente, los estudiantes elaborarán diversos textos con el propósito de explicar por qué estas innovaciones mejoran la calidad de vida de las personas. Dichos textos serán publicados en el periódico mural de la IE."},"2024-F1-c9":{"intro":"Lea la siguiente situación y responda las preguntas 28, 29 y 30.","text":"Los estudiantes de segundo grado, orientados por el docente de Ciencias Sociales y el de Comunicación, están desarrollando un proyecto cuyo propósito es conocer la influencia de los seres humanos en el proceso de domesticación de los animales. En este contexto, los estudiantes comparten diversos textos, como el que se presenta a continuación:\n\n¿En qué momento se domesticaron los perros? Es una duda recurrente que buscaría explicar por qué estos animales, desde hace tantos miles de años, son conocidos como el “mejor amigo del hombre”. Lo que sabemos hoy es que el perro es un descendiente del lobo; sin embargo, se desconoce cómo y cuándo fue que empezó esa relación de amistad. Un nuevo estudio comparativo de genes caninos sostiene que el “secreto” está en la alimentación que tuvieron los ancestros de los perros.\n\nUn equipo de investigadores (compuesto por especialistas en genética, medicina, ecofisiología, biología, bioquímica y microbiología) de la Universidad de Uppsala en Suecia, la Universidad de Hedmark en Noruega y el Instituto Tecnológico de Massachusetts en Estados Unidos, entre otros, examinaron el ADN de más de 50 perros de diferentes razas y lo compararon con la información genética de 12 lobos provenientes de diversos lugares alrededor del mundo. Las diferencias más relevantes se encontraron en los genes pertenecientes al desarrollo cerebral y a la metabolización del almidón.\n\nEn contraste con el lobo, el can tiene muchos más genes que codifican las enzimas necesarias para digerir el almidón. El perro puede hacer mejor uso de los nutrientes de ciertos carbohidratos. Por esta razón, se asume que los cambios que ha provocado esta dieta a base de carbohidratos son responsables de la personalidad dócil y energética del perro. Los hallazgos de la investigación sustentan la teoría de que el proceso de domesticación se originó a partir de aquellos lobos capaces de digerir los alimentos producidos por los primeros agricultores. La comida de los asentamientos primerizos de nuestros ancestros representó una nueva fuente de alimentación que, con el paso del tiempo, provocó que, primero, el lobo y, después, el perro vivieran permanentemente cerca del hombre. En otras palabras, el proceso de evolución del perro está íntimamente ligado al consumo de alimentos de los antiguos seres humanos.\n\nAdaptado de “¿Cómo se domesticaron los perros?”. (2018). Artículo publicado en el portal National Geographic España.\n\nRecuperado el 15 de febrero de 2023 de https://n9.clmg70n"},"2024-F1-c10":{"intro":"Lea la siguiente situación y responda las preguntas 31 y 32.","text":"Una IE está organizando una campaña para sensibilizar a la comunidad educativa sobre los problemas ambientales que afectan a la localidad. En este contexto, los estudiantes de segundo grado, en equipos y orientados por la docente, van a escribir textos para ofrecer medidas que contribuyan a enfrentar dichos problemas. Estos textos serán publicados en las redes sociales de la IE."},"2024-F1-c11":{"intro":"Lea la siguiente situación y responda las preguntas 33, 34, 35 y 36.","text":"En una IE, se está realizando un proyecto que tiene como propósito difundir información sobre las mujeres que han contribuido al desarrollo de las ciencias naturales. En este contexto, los estudiantes de tercer grado, acompañados por el docente, están leyendo textos seleccionados por ellos mismos. A continuación, se presenta uno de estos textos:\n\nJane Goodall nació en 1934 en un pueblo acogedor ubicado al sur de Inglaterra, donde creció rodeada de animales. Allí, desde corta edad, debido a su inagotable curiosidad por conocer más sobre los animales, vivió soñando con viajar a África. Por fin, a los 23 años, hizo realidad su sueño y viajó a Kenia, donde conoció al antropólogo Louis Leakey. Durante sus conversaciones, Jane demostraba vastos conocimientos sobre historia natural y gran interés por la ciencia. Por esta razón, Leakey la invitó a participar en una investigación en Gombe (Tanzania), que consistía en estudiar el comportamiento de los chimpancés de ese lugar. Luego de una larga planificación para el viaje, en 1960, acompañada de su madre, Jane instaló su tienda en la selva y comenzó su proyecto de investigación, que estaba previsto para durar seis meses. Sin embargo, tras más de seis décadas de trabajo sostenido, Jane Goodall y el instituto que lleva su nombre aún continúan profundizando en los estudios sobre la vida de los chimpancés.\n\nLos resultados de sus investigaciones de campo sobre los primates revolucionaron la comunidad científica. Durante sus observaciones, Jane descubrió que los chimpancés eran capaces de elaborar herramientas, y usarlas para obtener alimento, beber y, ocasionalmente, agredir. Este fue uno de sus varios aportes pioneros a la primatología, que puso en entredicho los conocimientos de la época acerca de los chimpancés. Los hallazgos de sus estudios son conocidos en el mundo entero, debido a los documentales que se elaboraron sobre su trabajo y que fueron transmitidos por canales televisivos para el público general. Su perseverancia, intuición, empatía e imprescindible capacidad de observación le permitieron profundizar en el mundo de los chimpancés para revelar su conducta instrumental, estructura social, caza, guerra entre grupos, altruismo, dominancia, canibalismo, crianza y adopción.\n\nJane Goodall es doctora en etología por la Universidad de Cambridge y doctora honoris causa por más de 45 universidades. Ha sido distinguida con más de 100 premios en todo el mundo. Ha escrito más de 26 libros, innumerables artículos científicos, y existen más de 20 producciones sobre ella para cine y televisión. Su trabajo ha sido fundamental no solo para difundir conocimientos sobre los chimpancés y otras especies, sino también para afianzar su protección y la de sus ecosistemas.\n\nLos aportes de Jane Goodall son tan relevantes que, actualmente, es considerada una de las mujeres de mayor impacto en el siglo veinte. Además, es una notable e importante activista del siglo veintiuno.\n\nAdaptado de “Biografía”. (s. f.). Artículo publicado en el portal Instituto Jane Goodall España. Recuperado el\n\n27 de marzo de 2023 de https://n9.cl/hxx3r"},"2024-F1-c12":{"intro":"Lea la siguiente situación y responda las preguntas 37, 38 y 39.","text":"Los estudiantes de segundo grado han notado que los pocos espacios públicos que hay en la comunidad están abandonados. Por ello, orientados por el docente, van a escribir cartas a la municipalidad para solicitar la recuperación de estos espacios."},"2024-F1-c13":{"intro":"Lea la siguiente situación y responda las preguntas 40, 41 y 42.","text":"Los estudiantes de tercer grado de una IE están trabajando en un proyecto cuyo objetivo es difundir información del código peruano que norma los derechos de los niños, niñas y adolescentes. Como parte del proyecto, en dicha institución, se realizará una mesa redonda en la que los estudiantes participarán como ponentes."},"2024-F1-c14":{"intro":"Lea la siguiente situación y responda las preguntas 43 y 44.","text":"Una IE, en coordinación con el municipio de la localidad, está realizando una campaña para elaborar estrategias orientadas a mejorar el manejo de residuos sólidos de la localidad. En este contexto, los estudiantes de cuarto grado, organizados en equipos y acompañados por la docente, van a elaborar diferentes tipos de textos para compartirlos con la comunidad mediante los paneles de la escuela."},"2024-F1-c15":{"intro":"Lea la siguiente situación y responda las preguntas 45, 46, 47, 48 y 49.","text":"Como parte de un taller de lectura literaria, el docente propone a los estudiantes de quinto grado leer textos poéticos. En este contexto, dichos estudiantes están leyendo dos poemas de Juana de Ibarborou, poeta uruguaya de inicios del siglo veinte.\n\nVida aldeanaRaíz salvaje Iremos por los campos, de la mano,Me ha quedado clavada en los ojos A través de los bosques y los trigos,La visión de ese carro de trigo, Entre rebaños cándidos y amigos,Que cruzó rechinante y pesado, Sobre la verde placidez del llano,Sembrando de espigas el recto camino. Para comer el fruto dulce y sano¡No pretendas, ahora, que ría!\n\nDe las rústicas vides y los higos¡Tú no sabes en qué hondos recuerdos Que coronan las tunas. Como amigos Estoy abstraída!\n\nPartiremos el pan, la leche, el grano.\n\nDesde el fondo del alma me sube\n\nY en las mágicas noches estrelladas,Un sabor de pitanga a los labios. Bajo la calma azul, entrelazadasTiene aún mi epidermis morena Las manos, y los labios temblorosos,No sé qué fragancias de trigo emparvado.\n\n¡Ay, quisiera llevarte conmigo\n\nRenovaremos nuestro muerto idilio,\n\nA dormir una noche en el campo\n\nY será como un verso de Virgilio\n\nY en tus brazos pasar hasta el día\n\nVivido ante los astros luminosos.\n\nBajo el techo alocado de un árbol! Soy la misma muchacha salvaje Que hace años trajiste a tu lado.\n\nTomado de Las lenguas de diamante. (1919).Tomado de Raíz salvaje. (1922)."},"2024-F1-c16":{"intro":"Lea la siguiente situación y responda las preguntas 50, 51, 52 y 53.","text":"En una IE, se está realizando una campaña para ayudar a un albergue local de perros y gatos. En este contexto, los estudiantes de tercer grado, orientados por la docente y organizados en equipos, van a elaborar exposiciones orales con el propósito de solicitar donaciones dentro de la escuela."},"2024-F1-c17":{"intro":"Lea la siguiente situación y responda las preguntas 54, 55, 56, 57, 58, 59 y 60.","text":"Los estudiantes de segundo grado están leyendo diversos textos sobre los fósiles hallados en el Perú. En este contexto, uno de los estudiantes comparte con el resto de la clase el siguiente texto:\n\nPresentan en Perú los restos de una ballena prehistórica\n\nUn grupo de paleontólogos ha presentado, en marzo de 2022, los restos de un Basilosaurus, una “ballena ¿Sabías que…?\n\nprimitiva” que habitaba los mares hace 36 millones de años. Estos restos fueron hallados a finales de 2021 en el El Basilosaurus no es el único desierto peruano de Ocucaje (en Ica). Mario Urbina, quien antepasado de las ballenas actuales. presidió el equipo que descubrió los restos, señaló haber Existió también el Peregocetus encontrado un cráneo de 1,35 metros en estado completo pacificus, conocido como “Ballena de conservación, perteneciente a una ballena arcaica. viajera del Pacífico”, pues su linaje “Este hallazgo es muy importante porque son pocos habría cruzado barreras oceánicas los especímenes similares descubiertos en el mundo”, desde Asia o África hasta las costas destacó Urbina. Además, el experto indicó que diversas del Pacífico.\n\ncriaturas habrían llegado a aquel desierto a reproducirse porque estaba protegido de las corrientes del mar abierto.\n\nEl “Depredador de Ocucaje”, como fue bautizado el\n\n¿Sabías que…?Basilosaurus por Urbina y su equipo, tenía unos 17 metros\n\nde longitud y poseía una poderosa dentadura con la que\n\nMario Urbina también participó en elpodría haber devorado otras especies de menor tamaño descubrimiento del fósil del(de las que provienen los actuales atunes, tiburones y Peregocetus pacificus, encontrado ensardinas).\n\nlas rocas de Yumaque de la cuenca de Pisco, en una zona desértica frente aRodolfo Salas-Gismondi, encargado del Departamento la playa Media Luna (en Ocucaje).de Paleontología de Vertebrados del Museo de Historia Estas ballenas tenían cuatro patas yNatural (en Lima), lugar donde se expone el fósil, explicó vivieron hace aproximadamente que el Basilosaurus “[…] era uno de los más grandes 42 millones de años.depredadores de su época y es un hallazgo extraordinario\n\ndebido a su excelente estado de conservación”. SalasGismondi afirmó, además, que ese animal se diferencia\n\nde otras especies por el gran desarrollo de su dentadura y su tamaño, y sostuvo que, por esa razón, el Basilosaurus podría haberse ubicado en la cima de la cadena alimenticia.\n\nLos primeros cetáceos evolucionaron a partir de animales terrestres hace unos 55 millones de años. “En esa época, el mar del Perú era cálido, no era frío como en la actualidad […] Y debido a las características del Basilosaurus, pensamos que es una especie de cetáceo no conocida antes por la ciencia […] Gracias a este tipo de fósiles, podemos reconstruir la historia del mar peruano”, añadió Salas-Gismondi.\n\nEl paleontólogo mencionó que el descubrimiento del fósil del Basilosaurus supone un hito para el trabajo paleontológico nacional e impulsa a continuar con la investigación de los registros de 42 millones de años de evolución y de especies marinas del mar peruano.\n\nAdaptado de “Presentan en Perú los restos de una ballena prehistórica”. (2022). Artículo publicado en el portal de Deutsche\n\nWelle. Recuperado el 10 de noviembre de 2022 de https://n9.cl/5f2o8"},"2023-F1-c1":{"intro":"Lea la siguiente situación y responda las preguntas 3, 4, 5, 6, 7 y 8.","text":"En un taller de lectura literaria, el docente propone a los estudiantes de cuarto grado leer leyendas peruanas. A continuación, se presenta uno de los textos que están leyendo:\n\nEl árbol llamado lupuna, uno de los más hermosos de la selva amazónica, “tiene madre”. Los habitantes de la selva dicen así del árbol al que creen poseído por un espíritu o habitado por un ser viviente. Disfrutan de tal privilegio los árboles bellos o raros.\n\nLa lupuna se caracteriza por ser uno de los más altos del bosque amazónico. Tiene un ramaje gallardo y su tallo, de color gris plomizo, está guarnecido, en la parte inferior, de unas bellas hojas triangulares que resaltan la hermosura del árbol. La lupuna despierta interés a primera vista y, en conjunto, al contemplarla, produce una sensación de extraña belleza. Como “tiene madre”, los cocamas no cortan la lupuna. Las hachas y machetes de la tala abatirán otros árboles del bosque para levantar aldeas o para limpiar campos de siembra de yuca y plátanos, o para abrir caminos. Pero la lupuna siempre quedará señoreando. Así no haya roza, sobresaldrá en el bosque por su altura y particular conformación.\n\nPara los cocamas, la “madre” de la lupuna, el ser que habita dicho árbol, es una mujer blanca, rubia y singularmente bella. En las noches de luna, ella sube por el corazón del árbol hasta lo alto de la copa, sale a dejarse iluminar por la luz esplendente y canta. Sobre el océano vegetal que forman las copas de los árboles, la hermosa derrama su canto claro y dulce, distinguidamente melodioso, y llena la solemne amplitud de la selva. Los hombres y los animales que deseen escuchar su voz quedan como hechizados. El mismo bosque puede aquietar sus ramas para oírla.\n\nLos viejos cocamas previenen a los mozos contra el embrujo de tal voz. Quien la escuche no debe ir hacia la mujer que la entona, pues no regresará nunca. Algunos dicen que uno puede morir esperando alcanzar a la hermosa, y otros, que ella los convierte en árbol. Ningún joven cocama que siguió a la voz fascinante, soñando con ganar a la bella, regresó jamás.\n\nEs aquella mujer, que sale de la lupuna, la sirena del bosque. Lo mejor que se puede hacer es escuchar con recogimiento, en alguna noche de luna, su hermoso canto próximo y distante.\n\nAdaptado de Alegría, Ciro. (1968). “La sirena del bosque”."},"2023-F1-c2":{"intro":"Lea la siguiente situación y responda las preguntas 9, 10 y 11.","text":"Los estudiantes de primer grado, orientados por la docente, van a elaborar anécdotas orales sobre los paseos y viajes que han realizado con sus familias o con la IE. Estas anécdotas serán presentadas en el aula."},"2023-F1-c3":{"intro":"Lea la siguiente situación y responda las preguntas 13, 14, 15, 16, 17 y 18.","text":"Los estudiantes de quinto grado de una IE han sido invitados a una estación de radio de la localidad para conversar sobre diversos temas relacionados con el proceso histórico de la emancipación de las mujeres. Dichos estudiantes van a participar en una mesa redonda que tratará acerca de los factores que influyeron en ese proceso histórico.\n\nComo parte de su preparación, los estudiantes leerán algunos textos propuestos por el docente. A continuación, se presenta uno de estos textos:\n\nA finales del siglo diecinueve, las mujeres se convirtieron en las usuarias más entusiastas de las bicicletas. Por ejemplo, en 1895, Susan Brownell, feminista estadounidense, afirmaba lo siguiente: “La bicicleta ha hecho más por la emancipación de la mujer que ninguna otra cosa en el mundo. Le da independencia desde el momento en que se sienta en ella”.\n\nSin embargo, no todas las mujeres opinaban lo mismo: “Antes pensaba que lo peor que podía hacer una mujer era fumar, pero he cambiado de idea. Lo peor que he visto en mi vida es una mujer montando bicicleta”. Así se manifestaba una corresponsal del diario Chicago Tribune en una columna de opinión publicada el 25 de julio de 1891. Las pioneras de la bicicleta, para bien o para mal, estaban empezando a causar una impresión abrumadora.\n\nSi bien el solo hecho de montar bicicletas con pesados vestidos y apretados corsés resultaba incómodo para las mujeres, este se constituía como el menor de sus obstáculos. Las mujeres de aquella época enfrentaban problemas de mayor magnitud. En el siglo diecinueve, la sociedad imponía reglas al comportamiento femenino, y la mujer que montaba bicicleta era considerada una transgresora de dichas reglas, por lo que se convertía en una persona de “dudosa” moral. Por si fuera poco, los médicos de la época opinaban que el ciclismo era una actividad perjudicial para el organismo y la salud femeninos, ya que, según ellos, la exposición al frío y a la humedad de las calles y, sobre todo, los asientos de las bicicletas podían generarles enfermedades. Peor aún, muchas mujeres que se movilizaban en bicicleta eran atacadas a pedradas.\n\nCon el tiempo, conforme se avanzaba en la emancipación femenina, aumentaban las mujeres ciclistas. Así pues, mientras para los hombres, la bicicleta era un nuevo juguete, para las mujeres, era un trampolín que las llevaba a otro mundo. La imagen de la mujer en bicicleta fue dejando de ser extraña. Ejemplos como la vuelta al mundo en bicicleta de Annie Londonderry en 1895 causaron sorpresa y admiración en muchas personas. Surgieron clubes femeninos que hacían ver el uso de la bicicleta como una actividad recreativa y saludable, y ofrecían la oportunidad a las mujeres de viajar en bicicleta acompañadas por sus pares. La publicidad comenzó a presentar el ciclismo de las mujeres como una actividad respetable. Los médicos empezaron a recomendar el uso de la bicicleta para fortalecer las articulaciones y mejorar el sistema cardiovascular. El periodismo veía en la ciclista a la “nueva mujer”, una mujer moderna que rompía con las convenciones sociales, que trabajaba fuera de casa o era políticamente activa, con lo que se alejaba del rol tradicional de “esposa” y “madre”. En diversos ámbitos, la mujer empezó a ser vista igual que el hombre, y la bicicleta contribuyó a reafirmarse en ese sentido.\n\nLas mujeres conquistaban nuevos terrenos que antes estaban destinados exclusivamente para los hombres.\n\nAdaptado de Campos Posada, Ainhoa. (2023). Artículo publicado en el portal de National Geographic España.\n\nRecuperado el 25 de febrero de 2023 de https://n9.cl/2hn65"},"2023-F1-c4":{"intro":"Lea la siguiente situación y responda las preguntas 19 y 20.","text":"Los estudiantes de primer grado, organizados en equipos, van a participar en la Feria de Ciencias de la IE. Ellos van a exponer sobre el uso que se les da a las plantas medicinales en la comunidad."},"2023-F1-c5":{"intro":"Lea la siguiente situación y responda las preguntas 21 y 22.Lea la siguiente situación y responda las preguntas 19 y 20.","text":"Los estudiantes de quinto grado van a seleccionar poemas para transcribirlos en la fachada de la IE y compartirlos con la comunidad educativa. Por este motivo, la docente ha llevado al aula diversos libros de poemas para leerlos con los estudiantes y elegir juntos los que transcribirán. A continuación, se presentan dos de los poemas seleccionados por una estudiante:\n\nA la realidad\n\ny te rendimos diosa el gran homenaje el mayor asombro\n\nel bostezo\n\nTomado de Varela, Blanca. (2016). Poesía reunida 1949-2000.\n\nLunario musical\n\nSe han volcado las fuentes de la luna\n\ni mi cuarto es un lago de aromas\n\nBeethoven\n\nen la penumbra se alborota la melena\n\nEl silencio se moja la nuca bajo una ducha de estrellas\n\nEn mi boca-cilindro musical\n\njuega como un confite el plenilunio\n\nTomado de Peralta, Alejandro. (2006). Ande."},"2023-F1-c6":{"intro":"Lea la siguiente situación y responda las preguntas 23, 24, 25, 26 y 27.","text":"La Regiduría de derechos del niño, niña y adolescente del Municipio Escolar realizará una asamblea estudiantil para elegir propuestas viables de acciones solidarias en beneficio de la localidad. En este contexto, los estudiantes de tercer grado, en equipos, le solicitan al docente que los oriente en la elaboración de las propuestas que presentarán en la asamblea."},"2023-F1-c7":{"intro":"Lea la siguiente situación y responda las preguntas 28 y 29.","text":"En el marco de una campaña nutricional de la localidad, los estudiantes de cuarto grado conversan sobre los productos transgénicos. Algunos se encuentran a favor de su consumo; otros, en contra. Algunos estudiantes aún no han definido su postura. En ese contexto, el docente les propone que se organicen en equipos y escriban ensayos en los que sustenten sus posturas sobre el consumo de dichos productos."},"2023-F1-c8":{"intro":"Lea la siguiente situación y responda las preguntas 30 y 31.","text":"En el taller de lectura y escritura literaria, los estudiantes de tercer grado, acompañados por la docente, están leyendo fábulas contemporáneas. A continuación, se presenta una de estas fábulas:\n\nEl hombre que aprendió a ladrar\n\nLo cierto es que fueron años de duro aprendizaje, con momentos en los que estuvo a punto de abandonar. Pero, al fin, triunfó la perseverancia y Raimundo aprendió a ladrar. No a imitar ladridos, como suelen hacer algunos, sino verdaderamente a ladrar. ¿Qué lo había impulsado a hacer eso? Ante sus amigos, se castigaba con humor y respondía: “La verdad es que ladro para no llorar”. Sin embargo, la razón más importante era el desinteresado y franciscano amor hacia sus hermanos perros. Amor es comunicación. ¿Cómo amar, entonces, sin comunicarse?\n\nRaimundo sintió una gran alegría el día que Leo, su hermano perro, comprendió por fin su ladrido y (algo más extraordinario aún) que él también comprendió el ladrido de Leo. A partir de ese día, Raimundo y Leo se tendían en el prado y dialogaban sobre los problemas que tenían en común. A pesar de que creía conocer muy bien a sus hermanos perros, Raimundo nunca imaginó que Leo tuviera una visión del mundo tan aguda, como la de un sabio.\n\nEn uno de esos diálogos, con amistosos ladridos, Raimundo se animó a preguntarle: “Dime, Leo, con toda franqueza, ¿qué opinas de mi forma de ladrar?”. La respuesta de Leo fue bastante breve y sincera: “Yo diría que lo haces bastante bien, pero tienes que mejorar y tratar de desaparecer, poco a poco, tu acento humano”.\n\nAdaptado de Benedetti, Mario. (1989). Despistes y franquezas."},"2023-F1-c9":{"intro":"Lea la siguiente situación y responda las preguntas 32, 33 y 34.","text":"Los estudiantes de cuarto grado están interesados en promover prácticas que contribuyan a mantener limpia la IE. Entre las actividades que realizarán, los estudiantes, en equipos, escribirán textos de diversos tipos dirigidos a sus compañeros y a los docentes para publicarlos en el periódico mural. Por ello, le piden a la docente que los oriente en la escritura de estos textos."},"2023-F1-c10":{"intro":"Lea la siguiente situación y responda las preguntas 35, 36, 37, 38 y 39.","text":"En el marco de un taller de lectura literaria, la docente y los estudiantes de primer grado están leyendo relatos breves. A continuación, se presenta uno de estos textos:\n\nLa secta del loto blanco\n\nHabía una vez un hombre que pertenecía a una secta. Muchos, deseosos de dominar las artes tenebrosas, lo tomaban por maestro.\n\nUn día, el maestro quiso salir. Entonces, colocó en el vestíbulo un tazón cubierto con una tapa y ordenó a los discípulos que lo cuidaran. Les dijo que no descubrieran el tazón ni vieran lo que había adentro. Apenas se alejó, los discípulos levantaron la tapa y vieron que en el tazón había agua pura y, en el agua, un barquito de paja, con mástiles y velamen. Sorprendidos, lo empujaron con el dedo. El barco se volcó. De prisa, lo enderezaron y volvieron a tapar el tazón.\n\nEl maestro apareció inmediatamente y les dijo:\n\n–¿Por qué me han desobedecido?\n\nLos discípulos se pusieron de pie y lo negaron. El maestro declaró:\n\n–Mi nave ha zozobrado en el confín del mar Amarillo. ¿Cómo se atreven a engañarme?\n\nUna tarde, encendió en un rincón del patio una pequeña vela. Les ordenó que la cuidaran del viento. Había pasado la segunda vigilia y el maestro no había vuelto. Cansados y soñolientos, los discípulos se acostaron y se durmieron. Al otro día, la vela estaba apagada. Los discípulos la encendieron de nuevo.\n\nEl maestro apareció inmediatamente y les dijo:\n\n–¿Por qué me han desobedecido?\n\nLos discípulos lo negaron:\n\n–De veras, no hemos dormido. ¿Cómo iba a apagarse la luz?\n\nEl maestro les dijo:\n\n–Quince leguas erré en la oscuridad de los desiertos tibetanos y ahora quieren engañarme. Esto sorprendió a los discípulos.\n\nAdaptado de Wilheim, Richard. (1924). “La secta del loto blanco”."},"2023-F1-c11":{"intro":"Lea la siguiente situación y responda las preguntas 40, 41 y 42.","text":"Los estudiantes de primer grado, orientados por la docente, van a escribir un recetario de platos preparados con ingredientes nutritivos para compartirlo con sus compañeros de otros grados."},"2023-F1-c12":{"intro":"Lea la siguiente situación y responda las preguntas 43 y 44.","text":"En el marco de un taller de lectura literaria, una docente propone a sus estudiantes de cuarto grado leer un texto relacionado con los morochucos, personajes representativos de los Andes peruanos. A continuación, se presenta el poema que están leyendo:\n\nLos morochucos\n\nCascos duros de piedra, erizados pellejos serranos, pulmones de distancia y de altura bebedores de vientos y cielos.\n\nOteadores de invisibles caminos, incansables y humildes comedores de ichu que abrevan en el fango y ruedan como galgas hacia abajo para volar como cóndores a las cumbres.\n\nCual el corcel del llanero y del gaucho vienen de la Conquista, pero anidando en los Andes se han hecho indios.\n\nIncansables, tenaces y fuertes, invencibles donde el aire en la altura se afila.\n\nAdaptado de Bustamante y Ballivián, Enrique. (1930). Junín."},"2023-F1-c13":{"intro":"Lea la siguiente situación y responda las preguntas 45, 46, 47, 48, 49 y 50.","text":"En una IE, se está realizando un proyecto cuyo objetivo es contribuir a la sensibilización para conservar el patrimonio cultural de la localidad. En este contexto, los estudiantes de segundo grado, organizados en equipos y orientados por la docente, van a elaborar videos en los que, de forma oral, ofrecerán información sobre el estado en que se encuentran diversos bienes y sitios culturales, y los desafíos que supone su conservación. Estos videos serán publicados en las redes sociales de la escuela."},"2023-F1-c14":{"intro":"Lea la siguiente situación y responda las preguntas 51, 52, 53, 54 y 55.","text":"En el marco de un taller de lectura literaria, la docente les propone a los estudiantes de quinto grado leer un monólogo perteneciente a un texto teatral contemporáneo. Este es un pasaje de los textos que están leyendo:\n\nLas calles del barrio periférico están tan desiertas como cada noche. Ni siquiera la Policía se atreve a rondar por esta zona de la ciudad. Matías Orozco camina solitario de vuelta del trabajo. Lleva la cabeza gacha, arrastra con desgana la vieja bolsa de plástico de su almuerzo. Acaba de ser despedido: lo han acusado de desfalco. Lo malo es que tienen razón. En un descuido, abrió la caja fuerte y apañó lo que le cupo en el puño, aunque eso apenas habría bastado para tapar una minúscula porción de sus deudas. Está despedido y, a los cuarenta años, las esperanzas de encontrar trabajo son escasas. Por eso, esta noche no le importa nada y camina cabizbajo. De repente, algo brilla en el suelo. Se queda paralizado.\n\nDescubrimiento de un pecador MATÍAS: ¡Diablos!... ¡Una moneda! (La mira con deleite, confirmando su hallazgo) Una moneda nuevecita... redondita... resplandeciente. ¡Una de verdad! (La besa) Ya sabía yo que la mala pata no podía durar siempre. ¡Ay, Dios mío! Mi racha de interminables desgracias se acabó: ya era hora de que mi aciaga fortuna se termine para siempre. Esto no puede ser más que un buen augurio, una señal de los cielos. (Baila y salta contento) ¡Y mira que soy descreído! Pero se ve que Dios no abandona a sus ovejas descarriadas... Dios aprieta, pero no ahoga... (Clamando a los cielos) ¡Gracias, Dios mío, por acordarte de este pobre pecador! (Se detiene desconcertado) ¿Pero qué digo? ¡Seré tonto...! ¡Si ahora... a mis años... voy a volver a creer en todas esas cosas...! ¿Qué necesidad tengo... a mis cuarenta... y con el problema que me acaba de caer encima?... Que la euforia no me nuble la mente... Es una casualidad: una pura y simple casualidad.\n\nSoberbia MATÍAS: (Exaltado) ¡Ya verás!... Tú y yo vamos a ser grandes amigos. No pienses que van a romper esta amistad así como así. Seguro que intentan separarnos... ¡mequetrefes!... como acaban de hacerlo con tus compañeras... Pero tú, ¡ni caso!... que yo me ocupo de todo. (Sombrío) Sí... hace tan solo unas horas... tenía a un montón de monedas aquí... en el puño... todas igualitas... bien apretadas para que no pasasen frío... ¡Total, unas monedas nada más!... ¡Maldición!... Necesitaba pagar mis deudas... ¡La vida es dura!... (Con orgullo herido) A nadie le regalan nada. ¡Hay que entenderlo!... Así que yo las tomé de la caja... (Furioso) A quién se le ocurre... tratarme así... echarme a la calle como un perro... ¡A mí!... ¡Si a ellos les sobran!... ¡Ya verán! Algún día... Algún día se van a enterar... Pese a todo, aún no he perdido las esperanzas. (Emocionado) Siempre he sabido que no soy del montón... Yo sé que se vislumbra un buen empleo en mi carrera... Algún día todavía puedo ser exitoso como ellos… Lo que pasa es que aún no ha llegado mi momento.\n\nAdaptado de Bueno, Antonia. (2006). Todo por un euro."},"2023-F1-c15":{"intro":"Lea la siguiente situación y responda las preguntas 56, 57 y 58.","text":"En el marco de un proyecto sobre el uso responsable de las redes sociales, los estudiantes de segundo grado van a escribir textos sobre la manera de aprovechar las redes para realizar actividades extracurriculares. En este contexto, el docente los orienta para que, en equipos, elaboren trípticos dirigidos a los estudiantes de otros grados."},"2023-F1-c16":{"intro":"Lea la siguiente situación y responda las preguntas 59 y 60.","text":"En el marco de un proyecto sobre bioética, los estudiantes de quinto grado, organizados en equipos, van a debatir sobre la experimentación con animales para la medicina humana."}},"questions":{"2025-F1-01":{"n":1,"year":2025,"stem":"En una IE, se está realizando una reunión colegiada sobre los documentos de gestión pedagógica. En este contexto, los docentes están compartiendo sus ideas sobre una gestión escolar que considere los valores del enfoque inclusivo. ¿Cuál de los siguientes comentarios de los docentes se alinea a dichos valores?","options":{"A":"“La escuela debe contribuir a que los estudiantes con discapacidad puedan tener desempeños como los de sus compañeros que no tienen esa condición”.","B":"“La escuela debe favorecer que los estudiantes con discapacidad cuenten con las mismas posibilidades de aprender que cualquier otro estudiante”.","C":"“La escuela debe promover que los estudiantes con discapacidad reciban tanto un tratamiento especializado como una atención pedagógica”."},"answer":"B","tema":"Inclusión y DUA","explicacion":["La B es correcta porque busca que los estudiantes con discapacidad tengan «las mismas posibilidades de aprender» que cualquier otro. Eso es equidad y derecho a una educación de calidad, valores centrales del enfoque inclusivo.","La A parece correcta, pero pone como meta que rindan «como los de sus compañeros que no tienen esa condición». Toma a quienes no tienen discapacidad como modelo y no respeta el ritmo ni el potencial de cada uno.","Regla: desconfía de opciones que comparan con un estándar «normal» o que hablan de tratamiento especializado (como la C, enfoque clínico). La opción inclusiva habla de oportunidades, equidad y quitar barreras para todos."],"aprende_mas":[{"q":"¿Qué dice el CNEB sobre el enfoque inclusivo o de atención a la diversidad?","a":"Que todos los estudiantes tienen derecho a oportunidades educativas de igual calidad y a lograr aprendizajes de igual calidad, sin importar sus diferencias. No se trata de que todos sean iguales, sino de que nadie quede excluido. La escuela se adapta al estudiante, no al revés."},{"q":"¿Cuáles son los valores del enfoque inclusivo según el CNEB?","a":"- **Respeto por las diferencias**: reconocer el valor de cada persona por encima de cualquier condición.\n- **Equidad en la enseñanza**: dar a cada quien lo que necesita para aprender (más apoyo a quien más lo requiere).\n- **Confianza en la persona**: creer que todos pueden aprender y mejorar."},{"q":"¿Qué diferencia hay entre integración e inclusión?","a":"- **Integración**: el estudiante con discapacidad entra al aula, pero es él quien debe adaptarse a lo que ya existe.\n- **Inclusión**: la escuela cambia sus prácticas, materiales y espacios para que todos participen y aprendan.\nEjemplo: integrar es sentarlo adelante; incluir es ajustar la actividad para que participe como los demás."}],"duda":false},"2025-F1-02":{"n":2,"year":2025,"stem":"Durante una reunión sobre la implementación del diseño universal para el aprendizaje (DUA), el docente a cargo ofrece algunas sugerencias sobre los recursos que se pueden utilizar para acompañar a los estudiantes en el aula. A continuación, se presenta una de esas sugerencias:\n\n“Cuando diseñemos una sesión de aprendizaje, es necesario que los recursos que utilicemos respondan a las características de nuestros estudiantes. De esta manera, podemos ofrecer textos, gráficos o materiales audiovisuales para que ellos puedan aprender sin sentirse limitados por los recursos que usemos”.\n\n¿Cuál de los siguientes principios del DUA se evidencia en la sugerencia anterior?","options":{"A":"Proporcionar múltiples formas de compromiso.","B":"Proporcionar múltiples formas de representación.","C":"Proporcionar múltiples formas de acción y expresión."},"answer":"B","tema":"Inclusión y DUA","explicacion":["La B es correcta: ofrecer «textos, gráficos o materiales audiovisuales» es presentar la información en varios formatos para que todos puedan percibirla y comprenderla. Eso es el principio de múltiples formas de representación.","La C parece correcta porque también habla de variedad, pero acción y expresión se refiere a cómo el estudiante demuestra lo que aprendió (escribir, exponer, dibujar), no a los recursos con los que recibe la información.","Pista rápida: si la variedad está en lo que el docente presenta, es representación; si está en lo que el estudiante produce, es acción y expresión; si está en motivar y sostener el interés, es compromiso."],"aprende_mas":[{"q":"¿Qué es el Diseño Universal para el Aprendizaje (DUA)?","a":"Es una forma de planificar pensando desde el inicio en la diversidad del aula, en lugar de hacer ajustes después para unos pocos. Busca eliminar barreras en materiales, actividades y evaluaciones. Lo que es necesario para algunos termina siendo útil para todos."},{"q":"¿Cuáles son los tres principios del DUA?","a":"- **Compromiso** (el porqué): motivar y mantener el interés; por ejemplo, dejar elegir el tema.\n- **Representación** (el qué): presentar la información en varios formatos, como texto, imagen o audio.\n- **Acción y expresión** (el cómo): permitir mostrar lo aprendido de distintas formas, como escribir, exponer o grabar un audio."},{"q":"¿Cómo se ve la representación en una clase de Comunicación?","a":"Si van a leer un cuento, el docente puede entregarlo impreso, proyectarlo con imágenes y también leerlo en voz alta o compartir un audio. Además, puede dar un glosario de palabras difíciles. Cada estudiante accede al mismo contenido por la vía que mejor le funciona."}],"duda":false},"2025-F1-03":{"n":3,"year":2025,"stem":"En una IE de EBR, se realiza una charla sobre la atención a las personas en condición de discapacidad. Dado que en la escuela hay estudiantes que presentan discapacidades físicas, el docente facilitador sugiere realizar algunas adaptaciones en el patio de la IE. A continuación, se presenta una de las propuestas de adaptación compartida por el docente facilitador:\n\n“Para que los estudiantes con discapacidad física puedan disfrutar de los juegos en el patio, es necesario dar un mantenimiento periódico a las rampas. Además, es esencial que los juegos que tienen asientos puedan contar con suficientes elementos de seguridad. Así también, sería oportuno acondicionar en el patio algunas zonas de descanso”.\n\nTres docentes comparten sus ideas sobre la propuesta. ¿Cuál de los siguientes comentarios de los docentes se alinea al enfoque inclusivo?","options":{"A":"“Considero que, con la propuesta, se está priorizando el cuidado de los estudiantes que tienen discapacidad física. Al implementarla, estaremos ayudando a prevenir accidentes en el patio mientras dichos estudiantes disfrutan de los juegos”.","B":"“Creo que la propuesta favorecerá la integración de los estudiantes. Me refiero a que será más fácil que aquellos que tienen discapacidad física reciban apoyo de sus compañeros para movilizarse en el patio, de modo que todos disfruten de los juegos”.","C":"“Me parece que la propuesta tiene como finalidad crear condiciones favorables para los estudiantes que tienen discapacidad física. Esto ayudará a que dichos estudiantes, así como sus compañeros, puedan disfrutar libremente del patio y de los juegos”."},"answer":"C","tema":"Inclusión y DUA","explicacion":["La C es correcta porque ve la propuesta como «crear condiciones favorables» para que los estudiantes con discapacidad física y sus compañeros disfruten «libremente» del patio. Es quitar barreras para que todos participen con autonomía.","La B parece correcta porque usa la palabra «integración», pero supone que los estudiantes con discapacidad dependerán del «apoyo de sus compañeros para movilizarse». La inclusión busca autonomía, no dependencia.","Regla: la opción inclusiva elimina barreras del entorno y promueve la participación autónoma de todos. Descarta las que ven al estudiante solo como alguien a proteger (como la A) o a quien otros deben ayudar."],"aprende_mas":[{"q":"¿Qué son las barreras para el aprendizaje y la participación?","a":"Son obstáculos del entorno, no del estudiante, que le impiden aprender o participar. Pueden ser físicas (escaleras sin rampa), pedagógicas (solo texto escrito) o actitudinales (pensar que «no va a poder»). La escuela inclusiva las identifica y las quita."},{"q":"¿Por qué proteger no es lo mismo que incluir?","a":"Si solo se piensa en evitar riesgos, el estudiante queda como alguien frágil que necesita vigilancia. El enfoque inclusivo lo ve como sujeto de derechos que puede decidir y participar. La seguridad importa, pero es un medio para que participe, no el fin."},{"q":"¿Qué es la accesibilidad en la escuela?","a":"Es que cualquier persona pueda usar espacios, materiales y servicios sin depender de otros. Ejemplo: una rampa en buen estado permite que un estudiante en silla de ruedas llegue solo al patio. Sin ella, siempre necesitará que alguien lo lleve."}],"duda":false},"2025-F1-04":{"n":4,"year":2025,"ctx":"2025-F1-c1","stem":"Como parte de las actividades del taller, el docente ayuda a los estudiantes a identificar las secuencias narrativas literarias en cuentos diversos. Luego de dialogar sobre las características de dichas secuencias, varios estudiantes le comentan al docente que quieren escribir sus cuentos empezando por el nudo de la historia. ¿Cuál de las siguientes secuencias narrativas es más adecuada para que dichos estudiantes logren su objetivo?","options":{"A":"Una secuencia narrativa circular, en la que primero se narra un hecho específico y, después, la historia se va desarrollando hasta regresar al mismo hecho con que se inició.","B":"Una secuencia narrativa in media res, en la que se inicia narrando el momento de mayor tensión y, seguidamente, se relatan los eventos anteriores y posteriores a él.","C":"Una secuencia narrativa retrospectiva, en la que se empieza contando la parte culminante de la historia y, luego, se va narrando todo desde el comienzo."},"answer":"B","tema":"Literatura","explicacion":["La B es correcta porque la secuencia in media res «inicia narrando el momento de mayor tensión», es decir, el nudo, y luego cuenta lo anterior y lo posterior. Es justo lo que quieren los estudiantes: empezar por el nudo.","La C parece correcta porque también altera el orden, pero la secuencia retrospectiva empieza por el final de la historia y luego vuelve al comienzo para contar todo en orden. No arranca en el nudo.","Para recordarlo: in media res significa «en medio de las cosas». Si empieza en pleno conflicto, es in media res; si empieza por el final, es retrospectiva; si termina donde empezó, es circular."],"aprende_mas":[{"q":"¿Cuáles son las partes de una narración tradicional?","a":"- **Inicio**: presenta personajes, lugar y situación.\n- **Nudo**: aparece el conflicto y la tensión crece.\n- **Desenlace**: el conflicto se resuelve.\nEn una secuencia lineal se cuentan en ese orden."},{"q":"¿Qué tipos de secuencia narrativa debo conocer?","a":"- **Lineal**: inicio, nudo y desenlace en orden.\n- **In media res**: empieza en el nudo y luego cuenta lo anterior y lo posterior.\n- **Retrospectiva**: empieza por el final y luego vuelve al comienzo.\n- **Circular**: termina en el mismo hecho con el que empezó."},{"q":"¿Para qué sirve empezar un cuento in media res?","a":"Engancha al lector desde la primera línea porque lo pone en plena acción. Por ejemplo: «La puerta se cerró de golpe y Ana supo que estaba atrapada». Después el autor explica cómo llegó Ana ahí y qué pasó luego."}],"duda":false},"2025-F1-05":{"n":5,"year":2025,"ctx":"2025-F1-c1","stem":"Algunos estudiantes han manifestado que tienen dudas sobre escribir sus cuentos con un narrador en tercera persona omnisciente, o con uno en primera persona protagonista. En este contexto, en una siguiente sesión del taller, el docente va a ofrecerles una orientación para que identifiquen qué sentido le atribuye a una historia emplear uno u otro tipo de narrador. ¿Cuál de las siguientes acciones pedagógicas es menos adecuada para ello?","options":{"A":"El docente ofrece a los estudiantes un cuento corto con un narrador en primera persona protagonista y les pide que lo lean. Luego, haciendo uso de la pizarra, reescribe dicho cuento con un narrador en tercera persona omnisciente. Después, en plenaria, solicita que comenten las similitudes y diferencias entre la historia original y aquella que fue reescrita en la pizarra.","B":"El docente ofrece a los estudiantes un cuento escrito con un narrador en tercera persona omnisciente y otro con un narrador en primera persona protagonista. Luego, les pide que indiquen qué se puede saber sobre lo que piensan los personajes a partir de cada tipo de narrador. Después, solicita que, en un cuadro, presenten las particularidades de cada cuento en función del narrador utilizado.","C":"El docente ofrece a los estudiantes las características del narrador en tercera persona omnisciente y del narrador en primera persona protagonista. Luego, les comparte dos cuentos para que reconozcan cuál de los tipos de narradores mencionados se ha usado en esos textos. Después, propone que reescriban la historia de cada cuento cambiando el tipo de narrador usado originalmente."},"answer":"C","tema":"Literatura","explicacion":["La C es la menos adecuada: el docente da las características en abstracto y pide reconocer el narrador y reescribir. Los estudiantes clasifican, pero no reflexionan sobre qué sentido le da cada narrador a la historia, que era el propósito.","La A puede parecer la menos adecuada porque es el docente quien reescribe el cuento, pero luego pide comparar en plenaria ambas versiones. Esa comparación sí lleva a notar el efecto de cambiar el narrador.","En preguntas de «menos adecuada», dos opciones sí logran el propósito y una no. Busca la que se queda en identificar o clasificar sin llegar a lo que pide el enunciado: aquí, el sentido del narrador."],"aprende_mas":[{"q":"¿Qué diferencia hay entre narrador omnisciente y protagonista?","a":"- **Tercera persona omnisciente**: lo sabe todo, incluso lo que piensan y sienten todos los personajes.\n- **Primera persona protagonista**: el personaje principal cuenta su propia historia; solo sabe lo que él vive y piensa.\nEjemplo: «Pedro tenía miedo, pero María no lo notaba» frente a «Yo tenía miedo y no sabía qué pensaba María»."},{"q":"¿Qué es el sentido que el narrador le da a una historia?","a":"Es el efecto que produce en el lector esa elección. Un narrador protagonista genera cercanía e intimidad, pero solo muestra su versión. Un omnisciente da una visión amplia y deja conocer por dentro a todos los personajes."},{"q":"¿Por qué es mejor que descubran las características en vez de recibirlas?","a":"Porque construyen el conocimiento al comparar textos reales, como promueve el enfoque comunicativo. Si solo reciben una definición, tienden a memorizarla. Si comparan dos cuentos y notan las diferencias, entienden para qué sirve cada narrador al escribir el suyo."}],"duda":false},"2025-F1-06":{"n":6,"year":2025,"ctx":"2025-F1-c2","stem":"Como parte de la planificación, la docente busca que todos los estudiantes tengan claridad sobre el tipo de información que se ofrece en una semblanza. ¿Cuál de las siguientes acciones pedagógicas es más adecuada para ello?","options":{"A":"La docente pide a los estudiantes que dialoguen sobre alguna deportista peruana con reconocimiento nacional e internacional. Luego, ofrece información acerca de su vida, formación profesional y logros deportivos. Después, la docente dialoga con los estudiantes sobre dicha información, y les comenta que las semblanzas que escriban deberían abordar, también, los logros y formación profesional de las científicas peruanas.","B":"La docente pregunta a los estudiantes qué es una semblanza y con qué propósito suele escribirse, mientras registra las respuestas en la pizarra. Luego, expresa que este género suele servir para ofrecer información biográfica de una persona y para destacar los aspectos profesionales de su vida. Después, la docente solicita a los estudiantes que indiquen qué aspectos específicos de las científicas creen que pueden incluir en sus textos.","C":"La docente propone a los estudiantes leer una semblanza de una persona destacada por su trabajo científico. Luego, conversa con ellos sobre la información expuesta en ese texto; en particular, sobre los aspectos biográficos, su formación científica y aportes principales de esa persona a su campo de investigación. Después, la docente pide que dialoguen sobre la información de las científicas que consideran que podrían abordar en sus semblanzas."},"answer":"C","tema":"Escritura y revisión de textos","explicacion":["La C es correcta porque los estudiantes leen una semblanza real y conversan sobre su información concreta: aspectos biográficos, formación científica y aportes. Analizar un texto modelo del mismo género muestra con claridad qué información incluir.","La B parece correcta porque explica qué es una semblanza, pero se queda en una definición general dada por la docente. Sin ver un texto real, no todos tendrán claro qué información concreta ofrece el género.","Regla: para entender las características de un género que van a escribir, lo mejor suele ser leer y analizar un texto modelo de ese género. Desconfía de opciones que solo definen o que usan o
